<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Terrain Flyover</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';

      // ─── Terrain Parameters ──────────────────────────────
      const ROWS = 48;
      const COLS = 64;
      const SPEED = 8;
      const FOV = 280;
      const CAMERA_Y = 65;
      const NEAR_Z = 1.5;
      const FAR_Z = 45;
      const SPAN = 50;

      let zOffset = 0;

      // ─── Stars ─────────────────────────────────────────────
      const stars = [];
      for (let i = 0; i < 120; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random() * 0.35,
          r: 0.4 + Math.random() * 1,
          b: 0.2 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2,
          rate: 0.8 + Math.random() * 2,
        });
      }

      // ─── Height Function ───────────────────────────────────
      function terrain(x, z) {
        return Math.sin(x * 0.06 + z * 0.04) * 45
             + Math.cos(x * 0.12 - z * 0.08) * 28
             + Math.sin(x * 0.25 + z * 0.18) * 15
             + Math.cos(x * 0.5 + z * 0.4) * 8;
      }

      // ─── Draw ──────────────────────────────────────────────
      function draw(ctx, { time, dt, width: w, height: h }) {
        zOffset += SPEED * dt;
        const t = time * 0.001;

        const cx = w / 2;
        const horizon = h * 0.28;

        // Clear
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        // Sky gradient
        const sky = ctx.createLinearGradient(0, 0, 0, horizon + 40);
        sky.addColorStop(0, '#020206');
        sky.addColorStop(1, '#06060e');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, horizon + 40);

        // Stars
        for (const s of stars) {
          const alpha = s.b * (0.5 + 0.5 * Math.sin(t * s.rate + s.phase));
          ctx.fillStyle = `rgba(180, 200, 240, ${alpha})`;
          ctx.beginPath();
          ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Build projected grid points
        const pts = [];
        for (let r = 0; r <= ROWS; r++) {
          const row = [];
          const viewZ = NEAR_Z + (r / ROWS) * (FAR_Z - NEAR_Z);
          const worldZ = viewZ + zOffset;
          const scale = FOV / viewZ;

          for (let c = 0; c <= COLS; c++) {
            const worldX = ((c / COLS) - 0.5) * SPAN;
            const wy = terrain(worldX, worldZ);
            row.push({
              x: cx + worldX * scale,
              y: horizon + (CAMERA_Y - wy) * scale * 0.35,
              h: wy,
            });
          }
          pts.push(row);
        }

        // Draw filled quads from back to front (painter's algorithm)
        for (let r = ROWS; r >= 1; r--) {
          const far = pts[r];
          const near = pts[r - 1];
          const depth = 1 - ((r - 1) / ROWS) * 0.8;

          for (let c = 0; c < COLS; c++) {
            const p0 = far[c];
            const p1 = far[c + 1];
            const p2 = near[c + 1];
            const p3 = near[c];

            // Height-based brightness + checkerboard for edge contrast
            const avgH = (p0.h + p1.h + p2.h + p3.h) * 0.25;
            const norm = (avgH + 100) / 200;
            const grid = ((r + c) & 1) * 0.07;
            const val = Math.max(0.04, Math.min(1, (norm + grid) * depth));

            const br = val * 120 | 0;
            const bg = val * 155 | 0;
            const bb = val * 210 | 0;

            ctx.fillStyle = `rgb(${br},${bg},${bb})`;
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.closePath();
            ctx.fill();
          }
        }

        // Bottom fog
        const fog = ctx.createLinearGradient(0, h * 0.8, 0, h);
        fog.addColorStop(0, 'rgba(0, 0, 0, 0)');
        fog.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
        ctx.fillStyle = fog;
        ctx.fillRect(0, 0, w, h);
      }

      // ─── App ───────────────────────────────────────────────
      createApp({
        asciiConfig: {
          fontSize: 10,
          colorScheme: 'acid',
          background: '#000',
          sourceOpacity: 0,
          edgeDetect: true,
          edgeCharset: 'box-light',
          edgeThreshold: 0.12,
          crtEnabled: true,
          crtScanlines: 0.3,
          crtGlow: 0.5,
          crtDistortion: 0.15,
          crtFlicker: 0.04,
        },
        draw,
      });
    </script>
  </body>
</html>
