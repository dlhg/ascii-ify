<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Eclipse</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, smoothstep } from './utils.js';

      // ─── Eclipse State ──────────────────────────────────
      const CYCLE_DURATION = 30; // seconds for full moon transit
      let eclipseTime = 0;

      // ─── Stars ──────────────────────────────────────────
      const NUM_STARS = 150;
      const stars = [];
      function initStars(w, h) {
        stars.length = 0;
        for (let i = 0; i < NUM_STARS; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 0.3 + Math.random() * 1.2,
            brightness: 0.2 + Math.random() * 0.6,
            twinkleSpeed: 0.5 + Math.random() * 3,
            phase: Math.random() * Math.PI * 2,
          });
        }
      }

      // ─── Draw Sun Scene ─────────────────────────────────
      function drawSunScene(ctx, t, w, h) {
        const cx = w / 2;
        const cy = h / 2;
        const sunR = Math.min(w, h) * 0.18;

        // Deep space background
        ctx.fillStyle = '#02010a';
        ctx.fillRect(0, 0, w, h);

        // Background stars — brighter during eclipse
        const moonProgress = (eclipseTime % CYCLE_DURATION) / CYCLE_DURATION;
        const moonX = lerp(-sunR * 3, w + sunR * 3, moonProgress);
        const moonDist = Math.sqrt((moonX - cx) ** 2 + ((cy - h * 0.02) - cy) ** 2);
        const eclipseAmount = 1 - smoothstep(0, sunR * 2.5, moonDist);
        const starBrightness = 0.15 + eclipseAmount * 0.7;

        for (const s of stars) {
          const twinkle = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.phase);
          const alpha = s.brightness * twinkle * starBrightness;
          ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Corona tendrils — extend beyond sun disk
        const NUM_TENDRILS = 14;
        for (let i = 0; i < NUM_TENDRILS; i++) {
          const baseAngle = (i / NUM_TENDRILS) * Math.PI * 2;
          const wobble = Math.sin(t * 0.8 + i * 2.3) * 0.15;
          const angle = baseAngle + wobble;
          const length = sunR * (1.5 + 0.8 * Math.sin(t * 0.5 + i * 1.7));
          const width = sunR * (0.08 + 0.04 * Math.sin(t * 1.2 + i));

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);

          const grad = ctx.createLinearGradient(sunR * 0.7, 0, length, 0);
          grad.addColorStop(0, `rgba(255, 200, 100, 0.4)`);
          grad.addColorStop(0.3, `rgba(255, 150, 80, 0.2)`);
          grad.addColorStop(0.7, `rgba(200, 100, 150, 0.08)`);
          grad.addColorStop(1, `rgba(150, 80, 180, 0)`);
          ctx.fillStyle = grad;

          ctx.beginPath();
          ctx.moveTo(sunR * 0.7, -width);
          ctx.quadraticCurveTo(length * 0.6, -width * 1.5, length, 0);
          ctx.quadraticCurveTo(length * 0.6, width * 1.5, sunR * 0.7, width);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Solar flare arcs
        for (let i = 0; i < 5; i++) {
          const baseAngle = (i / 5) * Math.PI * 2 + t * 0.1;
          const pulse = 0.5 + 0.5 * Math.sin(t * 0.7 + i * 1.3);
          const arcR = sunR * (0.15 + 0.12 * pulse);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(baseAngle);

          const grad = ctx.createRadialGradient(sunR, 0, 0, sunR, 0, arcR);
          grad.addColorStop(0, `rgba(255, 180, 60, ${0.5 * pulse})`);
          grad.addColorStop(0.5, `rgba(255, 120, 40, ${0.25 * pulse})`);
          grad.addColorStop(1, 'rgba(255, 80, 30, 0)');
          ctx.fillStyle = grad;

          ctx.beginPath();
          ctx.arc(sunR, 0, arcR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Outer glow
        const outerGlow = ctx.createRadialGradient(cx, cy, sunR * 0.5, cx, cy, sunR * 3);
        outerGlow.addColorStop(0, 'rgba(255, 220, 150, 0.3)');
        outerGlow.addColorStop(0.3, 'rgba(255, 160, 80, 0.12)');
        outerGlow.addColorStop(0.6, 'rgba(200, 100, 120, 0.04)');
        outerGlow.addColorStop(1, 'rgba(100, 50, 100, 0)');
        ctx.fillStyle = outerGlow;
        ctx.fillRect(0, 0, w, h);

        // Sun disk with surface granulation
        const diskGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR);
        diskGrad.addColorStop(0, 'rgba(255, 255, 240, 0.95)');
        diskGrad.addColorStop(0.3, 'rgba(255, 240, 180, 0.9)');
        diskGrad.addColorStop(0.7, 'rgba(255, 200, 100, 0.85)');
        diskGrad.addColorStop(0.9, 'rgba(255, 150, 60, 0.7)');
        diskGrad.addColorStop(1, 'rgba(255, 100, 30, 0.3)');
        ctx.fillStyle = diskGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, sunR, 0, Math.PI * 2);
        ctx.fill();

        // Surface granulation (bright spots)
        for (let i = 0; i < 30; i++) {
          const angle = i * 2.399 + t * 0.05;
          const dist = (i * 0.618 % 1) * sunR * 0.85;
          const sx = cx + Math.cos(angle) * dist;
          const sy = cy + Math.sin(angle) * dist;
          const pulse = 0.3 + 0.7 * Math.sin(t * 2 + i * 3.7);
          const r = 3 + pulse * 5;

          ctx.fillStyle = `rgba(255, 255, 230, ${0.15 * pulse})`;
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Pulsing core
        const corePulse = 0.85 + 0.15 * Math.sin(t * 1.5);
        const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR * 0.4 * corePulse);
        coreGrad.addColorStop(0, `rgba(255, 255, 255, ${0.6 * corePulse})`);
        coreGrad.addColorStop(1, 'rgba(255, 250, 220, 0)');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, sunR * 0.4 * corePulse, 0, Math.PI * 2);
        ctx.fill();
      }

      // ─── Draw Moon Mask ─────────────────────────────────
      function drawMoonMask(ctx, t, w, h) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2;
        const cy = h / 2;
        const sunR = Math.min(w, h) * 0.18;
        const moonR = sunR * 0.95; // slightly smaller for corona ring

        // Moon traverses in a gentle arc
        const progress = (eclipseTime % CYCLE_DURATION) / CYCLE_DURATION;
        const moonX = lerp(-moonR * 3, w + moonR * 3, progress);
        const moonY = cy - h * 0.02 - Math.sin(progress * Math.PI) * h * 0.05;

        // White circle = moon shape
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        ctx.fill();

        // Soft edge for smoother transition
        const edgeGrad = ctx.createRadialGradient(moonX, moonY, moonR * 0.9, moonX, moonY, moonR * 1.1);
        edgeGrad.addColorStop(0, '#ffffff');
        edgeGrad.addColorStop(1, '#000000');
        ctx.fillStyle = edgeGrad;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonR * 1.1, 0, Math.PI * 2);
        ctx.fill();
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: { background: '#02010a', sourceOpacity: 0 },
        layers: [
          // Layer 1: Sun / fire — masked inverted (carved by moon)
          {
            fontSize: 8,
            charset: 'density',
            colorScheme: 'fire',
            opacity: 1,
          },
          // Layer 2: Corona — masked normal (revealed by moon)
          {
            fontSize: 5,
            charset: 'braille',
            colorScheme: 'vapor',
            blendMode: 'add',
            opacity: 0.8,
          },
          // Layer 3: Star background — always visible
          {
            fontSize: 18,
            charset: 'minimal',
            colorScheme: 'mono',
            pattern: 'plasma',
            patternMix: 0.5,
            blendMode: 'replace',
            opacity: 0.12,
          },
          // Layer 4: Moon mask — invisible
          {
            fontSize: 4,
            charset: 'blocks',
            colorScheme: 'mono',
            opacity: 0,
          },
        ],
        draw(ctx, { time, dt, width: w, height: h }) {
          eclipseTime += dt;
          drawSunScene(ctx, time / 1000, w, h);
        },
        onResize(ctx, w, h) {
          initStars(w, h);
        },
      });

      // ─── Mask Setup ─────────────────────────────────────
      const maskCanvas = document.createElement('canvas');
      const maskCtx = maskCanvas.getContext('2d');

      function resizeMask() {
        maskCanvas.width = app.canvas.width;
        maskCanvas.height = app.canvas.height;
      }
      resizeMask();
      window.addEventListener('resize', resizeMask);

      const layers = app.ascii.layers;
      layers[0].set('visible', false);
      layers[4].set('source', maskCanvas);

      // Sun carved by moon (inverted mask)
      layers[1].set('maskLayer', layers[4].id);
      layers[1].set('invertMask', true);

      // Corona revealed by moon (normal mask)
      layers[2].set('maskLayer', layers[4].id);

      app.ascii.on('render', () => {
        const t = performance.now() / 1000;
        drawMoonMask(maskCtx, t, maskCanvas.width, maskCanvas.height);
      });
    </script>
  </body>
</html>
