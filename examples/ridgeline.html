<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify - 3D Ridgeline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #060403; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, smoothstep, clamp } from './utils.js';

      // ── Ridged value noise terrain ──────────────────────────────
      function hash2(ix, iy) {
        let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }

      function valueNoise(x, y) {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = smoothstep(0, 1, x - ix);
        const fy = smoothstep(0, 1, y - iy);
        const a = hash2(ix, iy), b = hash2(ix + 1, iy);
        const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
        return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
      }

      function ridged(x, y) {
        let amp = 0.55, freq = 1, sum = 0;
        for (let o = 0; o < 4; o++) {
          const n = valueNoise(x * freq, y * freq);
          sum += (1 - Math.abs(2 * n - 1)) * amp;
          amp *= 0.5;
          freq *= 2.1;
        }
        return sum; // ~0..1, sharp crests
      }

      // Quantized gray palette so we build fillStyle strings once
      const SHADES = 48;
      const GRAYS = Array.from({ length: SHADES }, (_, i) => {
        const v = Math.round((i / (SHADES - 1)) * 255);
        return `rgb(${v},${v},${v})`;
      });

      const CELL = 12; // coarse source blocks, finer than the ASCII grid

      function draw(ctx, { time, width: w, height: h }) {
        const t = time * 0.001;
        const scale = 0.0021;
        const flyY = t * 0.16;   // forward flight
        const driftX = Math.sin(t * 0.05) * 0.6; // lazy banked weave

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        for (let y = 0; y < h; y += CELL) {
          // valley haze: far rows (top of screen) sink and dim slightly
          const rowFade = 0.55 + 0.45 * (y / h);
          for (let x = 0; x < w; x += CELL) {
            let e = ridged(x * scale + driftX, y * scale + flyY);
            e = Math.pow(clamp(e, 0, 1), 1.9); // deepen valleys, keep crests hot
            const idx = Math.min(SHADES - 1, (e * rowFade * SHADES) | 0);
            if (idx === 0) continue;
            ctx.fillStyle = GRAYS[idx];
            ctx.fillRect(x, y, CELL, CELL);
          }
        }
      }

      const app = createApp({
        asciiConfig: {
          fontSize: 11,
          density: 1.15,
          charset: 'density',
          colorScheme: 'fire',
          background: '#060403',
          sourceOpacity: 0,
          renderMode: '3d',
          depthScale: 300,
          perspective: 480,
          rotationX: -0.92,
          rotationY: 0,
          rotationZ: 0,
          cameraZ: 760,
          depthOpacity: 0.3,
          fade: 0.12,
          automations: {
            // slow breathing of the relief height + a gentle orbital sway
            depthScale: { type: 'sine', min: 240, max: 340, rate: 0.045 },
            rotationY: { type: 'sine', amount: 0.14, rate: 0.03 },
            cameraZ: { type: 'noise', min: 680, max: 840, rate: 0.06 },
          },
        },
        draw,
      });

      // mouse steers the camera around the automated drift
      document.addEventListener('mousemove', (e) => {
        const nx = e.clientX / window.innerWidth - 0.5;
        const ny = e.clientY / window.innerHeight - 0.5;
        app.ascii.set({
          rotationY: nx * 0.5,
          rotationX: -0.92 - ny * 0.3,
        });
      });
    </script>
  </body>
</html>
