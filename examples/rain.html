<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Rain</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, clamp, smoothstep, dist } from './utils.js';

      // ─── Constants ──────────────────────────────────────
      const GROUND_Y_RATIO = 0.85;
      const MAX_UMBRELLAS = 3;
      const UMBRELLA_RADIUS = 60;
      const SPLASH_GRAVITY = 400;
      const SPLASH_DRAG = 0.98;
      const WIND_BASE = 30;

      // ─── State ──────────────────────────────────────────
      const rainFar = [];
      const rainMid = [];
      const rainNear = [];
      const splashes = [];
      const puddles = [];
      const umbrellas = [];
      const clouds = [];

      let lightningTimer = 5 + Math.random() * 10;
      let lightningAlpha = 0;
      let lightningBolts = [];

      let windOffset = 0;
      let windStrength = 0;
      let windTarget = 0;
      let windChangeTimer = 3;

      let groundY = 0;

      // ─── Rain Generation ────────────────────────────────
      function generateRain(arr, count, layer) {
        arr.length = 0;
        const w = app.width;
        const h = app.height;
        for (let i = 0; i < count; i++) {
          arr.push(createDrop(w, h, layer, true));
        }
      }

      function createDrop(w, h, layer, randomY) {
        const configs = {
          far:  { speed: [120, 200], length: [6, 12],  opacity: [0.12, 0.25], width: 0.5 },
          mid:  { speed: [220, 360], length: [12, 22], opacity: [0.2, 0.4],   width: 0.8 },
          near: { speed: [380, 550], length: [18, 35], opacity: [0.35, 0.65], width: 1.2 },
        };
        const cfg = configs[layer];
        const speed = cfg.speed[0] + Math.random() * (cfg.speed[1] - cfg.speed[0]);
        const length = cfg.length[0] + Math.random() * (cfg.length[1] - cfg.length[0]);
        const opacity = cfg.opacity[0] + Math.random() * (cfg.opacity[1] - cfg.opacity[0]);

        return {
          x: Math.random() * (w + 200) - 100,
          y: randomY ? Math.random() * h : -length - Math.random() * 80,
          speed,
          length,
          opacity,
          width: cfg.width,
          layer,
          windFactor: layer === 'far' ? 0.3 : layer === 'mid' ? 0.6 : 1.0,
        };
      }

      function regenerateRain(w, h) {
        const area = w * h;
        generateRain(rainFar,  Math.floor(area / 800),  'far');
        generateRain(rainMid,  Math.floor(area / 400),  'mid');
        generateRain(rainNear, Math.floor(area / 200),  'near');

        // Regenerate puddles
        puddles.length = 0;
        const puddleCount = Math.floor(w / 80);
        for (let i = 0; i < puddleCount; i++) {
          puddles.push({
            x: Math.random() * w,
            width: 30 + Math.random() * 80,
            shimmerPhase: Math.random() * Math.PI * 2,
            shimmerSpeed: 1.5 + Math.random() * 3,
          });
        }

        // Regenerate clouds
        clouds.length = 0;
        const cloudCount = 5 + Math.floor(w / 300);
        for (let i = 0; i < cloudCount; i++) {
          clouds.push({
            x: Math.random() * w,
            y: 20 + Math.random() * h * 0.18,
            rx: 80 + Math.random() * 160,
            ry: 20 + Math.random() * 30,
            speed: 3 + Math.random() * 8,
            opacity: 0.04 + Math.random() * 0.06,
          });
        }

        groundY = h * GROUND_Y_RATIO;
      }

      // ─── Splash System ──────────────────────────────────
      function spawnSplash(x, y, intensity) {
        const count = 2 + Math.floor(Math.random() * 3 * intensity);
        for (let i = 0; i < count; i++) {
          const angle = -Math.PI * 0.15 - Math.random() * Math.PI * 0.7;
          const speed = 40 + Math.random() * 80 * intensity;
          splashes.push({
            x,
            y,
            vx: Math.cos(angle) * speed + windStrength * 0.3,
            vy: Math.sin(angle) * speed,
            life: 0.3 + Math.random() * 0.2,
            maxLife: 0.5,
            size: 1 + Math.random() * 1.5 * intensity,
            brightness: 0.4 + Math.random() * 0.4,
          });
        }
      }

      // ─── Umbrella Collision ─────────────────────────────
      function checkUmbrellaCollision(drop) {
        for (const umb of umbrellas) {
          const dx = drop.x - umb.x;
          const dy = drop.y - umb.y;
          // Umbrella is an arc: check if drop is within the arc region
          const distX = Math.abs(dx);
          if (distX < UMBRELLA_RADIUS && dy >= -8 && dy <= 12) {
            // Calculate the arc height at this x position
            const normalizedX = distX / UMBRELLA_RADIUS;
            const arcY = -Math.sqrt(1 - normalizedX * normalizedX) * 18;
            if (dy >= arcY + umb.y - drop.y + 5) {
              return umb;
            }
          }
        }
        return null;
      }

      // ─── Lightning System ───────────────────────────────
      function generateBolt(startX, startY, endY, spread) {
        const segments = [];
        let x = startX;
        let y = startY;
        const stepY = (endY - startY) / 12;

        for (let i = 0; i < 12; i++) {
          const nx = x + (Math.random() - 0.5) * spread;
          const ny = y + stepY + (Math.random() - 0.5) * Math.abs(stepY) * 0.3;
          segments.push({ x1: x, y1: y, x2: nx, y2: ny });

          // Branch with 25% chance
          if (Math.random() < 0.25 && i > 2 && i < 10) {
            const branchLen = 3 + Math.floor(Math.random() * 4);
            let bx = nx, by = ny;
            const dir = Math.random() < 0.5 ? -1 : 1;
            for (let j = 0; j < branchLen; j++) {
              const bnx = bx + dir * (10 + Math.random() * 20);
              const bny = by + stepY * 0.5 + Math.random() * 10;
              segments.push({ x1: bx, y1: by, x2: bnx, y2: bny, branch: true });
              bx = bnx;
              by = bny;
            }
          }

          x = nx;
          y = ny;
        }
        return segments;
      }

      function triggerLightning(w, h) {
        lightningAlpha = 1;
        lightningBolts = [];

        // 1-2 bolts
        const boltCount = 1 + (Math.random() < 0.3 ? 1 : 0);
        for (let i = 0; i < boltCount; i++) {
          const startX = w * 0.1 + Math.random() * w * 0.8;
          lightningBolts.push(generateBolt(startX, 0, groundY * 0.7, 60 + Math.random() * 40));
        }
      }

      // ─── Update Rain ────────────────────────────────────
      function updateRainLayer(arr, dt, w, h, layer) {
        const wind = windStrength;
        for (let i = 0; i < arr.length; i++) {
          const drop = arr[i];
          drop.y += drop.speed * dt;
          drop.x += wind * drop.windFactor * dt;

          // Check umbrella collision
          let hitUmbrella = false;
          for (const umb of umbrellas) {
            const dx = drop.x - umb.x;
            const absDx = Math.abs(dx);
            if (absDx < UMBRELLA_RADIUS) {
              // Arc surface: y offset from umbrella center
              const normalizedX = absDx / UMBRELLA_RADIUS;
              const arcSurface = umb.y - Math.sqrt(Math.max(0, 1 - normalizedX * normalizedX)) * 18;
              if (drop.y >= arcSurface && drop.y <= umb.y + 5) {
                // Deflect: splash off the umbrella edge
                const deflectDir = dx > 0 ? 1 : -1;
                spawnSplash(drop.x, arcSurface, 0.5);
                // Reset drop
                drop.x = Math.random() * (w + 200) - 100;
                drop.y = -drop.length - Math.random() * 80;
                hitUmbrella = true;
                break;
              }
            }
          }

          if (!hitUmbrella && drop.y > groundY) {
            // Splash on ground
            if (layer !== 'far' && Math.random() < 0.4) {
              const intensity = layer === 'near' ? 1 : 0.5;
              spawnSplash(drop.x, groundY, intensity);
            }
            // Reset to top
            drop.x = Math.random() * (w + 200) - 100;
            drop.y = -drop.length - Math.random() * 80;
          }

          // Wrap horizontally
          if (drop.x > w + 100) drop.x -= w + 200;
          if (drop.x < -100) drop.x += w + 200;
        }
      }

      // ─── Drawing Functions ──────────────────────────────
      function drawSkyGradient(ctx, w, h) {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0,    'rgb(6, 6, 18)');
        grad.addColorStop(0.3,  'rgb(10, 12, 28)');
        grad.addColorStop(0.6,  'rgb(14, 16, 32)');
        grad.addColorStop(0.85, 'rgb(18, 20, 36)');
        grad.addColorStop(1,    'rgb(12, 14, 26)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      function drawClouds(ctx, w, h, dt) {
        for (const cloud of clouds) {
          cloud.x += cloud.speed * dt;
          if (cloud.x - cloud.rx > w) {
            cloud.x = -cloud.rx;
            cloud.y = 20 + Math.random() * h * 0.18;
          }
          ctx.fillStyle = `rgba(30, 35, 50, ${cloud.opacity})`;
          ctx.beginPath();
          ctx.ellipse(cloud.x, cloud.y, cloud.rx, cloud.ry, 0, 0, Math.PI * 2);
          ctx.fill();
          // Secondary blob for volume
          ctx.beginPath();
          ctx.ellipse(cloud.x + cloud.rx * 0.3, cloud.y - cloud.ry * 0.2,
                      cloud.rx * 0.7, cloud.ry * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawRainLayer(ctx, arr, lightningBoost) {
        for (const drop of arr) {
          const alpha = drop.opacity + lightningBoost * 0.3;
          const windAngle = Math.atan2(drop.speed, windStrength * drop.windFactor);
          const endX = drop.x + (windStrength * drop.windFactor / drop.speed) * drop.length;

          // Rain color: subtle blue-white tint
          const r = 140 + Math.floor(lightningBoost * 115);
          const g = 160 + Math.floor(lightningBoost * 95);
          const b = 200 + Math.floor(lightningBoost * 55);
          ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${clamp(alpha, 0, 1)})`;
          ctx.lineWidth = drop.width;
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(endX, drop.y + drop.length);
          ctx.stroke();
        }
      }

      function drawGround(ctx, w, h, time) {
        // Ground fill
        const groundGrad = ctx.createLinearGradient(0, groundY, 0, h);
        groundGrad.addColorStop(0, 'rgb(16, 18, 28)');
        groundGrad.addColorStop(0.3, 'rgb(12, 14, 22)');
        groundGrad.addColorStop(1, 'rgb(8, 10, 16)');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, groundY, w, h - groundY);

        // Ground line
        ctx.strokeStyle = 'rgba(40, 50, 70, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(w, groundY);
        ctx.stroke();
      }

      function drawPuddles(ctx, w, time, lightningBoost) {
        for (const puddle of puddles) {
          const shimmer = 0.5 + 0.5 * Math.sin(time * puddle.shimmerSpeed + puddle.shimmerPhase);
          const alpha = (0.04 + shimmer * 0.06 + lightningBoost * 0.15);
          const grad = ctx.createRadialGradient(
            puddle.x, groundY + 3, 0,
            puddle.x, groundY + 3, puddle.width * 0.5,
          );
          grad.addColorStop(0, `rgba(60, 80, 120, ${alpha})`);
          grad.addColorStop(0.6, `rgba(40, 55, 85, ${alpha * 0.5})`);
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.fillRect(puddle.x - puddle.width * 0.5, groundY, puddle.width, 8);

          // Ripple rings in puddles
          const rippleAlpha = shimmer * 0.08 + lightningBoost * 0.1;
          ctx.strokeStyle = `rgba(80, 100, 140, ${rippleAlpha})`;
          ctx.lineWidth = 0.5;
          const rippleRadius = 3 + shimmer * 5;
          ctx.beginPath();
          ctx.ellipse(puddle.x + Math.sin(time * 2.3 + puddle.shimmerPhase) * 10,
                      groundY + 3, rippleRadius, rippleRadius * 0.3, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawSplashes(ctx, dt) {
        let len = splashes.length;
        for (let i = len - 1; i >= 0; i--) {
          const s = splashes[i];
          s.vy += SPLASH_GRAVITY * dt;
          s.vx *= SPLASH_DRAG;
          s.vy *= SPLASH_DRAG;
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.life -= dt;

          if (s.life <= 0 || s.y > groundY + 10) {
            splashes[i] = splashes[len - 1];
            len--;
            continue;
          }

          const alpha = (s.life / s.maxLife) * s.brightness;
          ctx.fillStyle = `rgba(160, 185, 220, ${alpha})`;
          ctx.fillRect(s.x - s.size * 0.5, s.y - s.size * 0.5, s.size, s.size);
        }
        splashes.length = len;
      }

      function drawUmbrellas(ctx, time) {
        for (const umb of umbrellas) {
          // Handle
          ctx.strokeStyle = 'rgba(120, 90, 60, 0.7)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(umb.x, umb.y);
          ctx.lineTo(umb.x, umb.y + 50);
          ctx.stroke();

          // Handle hook
          ctx.beginPath();
          ctx.arc(umb.x + 6, umb.y + 50, 6, 0, Math.PI);
          ctx.stroke();

          // Canopy arc
          ctx.fillStyle = 'rgba(45, 35, 65, 0.85)';
          ctx.strokeStyle = 'rgba(70, 55, 95, 0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(umb.x, umb.y, UMBRELLA_RADIUS, 18, 0, Math.PI, 0);
          ctx.fill();
          ctx.stroke();

          // Canopy ribs
          ctx.strokeStyle = 'rgba(90, 70, 120, 0.4)';
          ctx.lineWidth = 0.8;
          const ribCount = 7;
          for (let i = 0; i < ribCount; i++) {
            const t = i / (ribCount - 1);
            const ribX = umb.x - UMBRELLA_RADIUS + t * UMBRELLA_RADIUS * 2;
            const normalizedX = Math.abs(ribX - umb.x) / UMBRELLA_RADIUS;
            const ribY = umb.y - Math.sqrt(Math.max(0, 1 - normalizedX * normalizedX)) * 18;
            ctx.beginPath();
            ctx.moveTo(umb.x, umb.y);
            ctx.lineTo(ribX, ribY);
            ctx.stroke();
          }

          // Water dripping off edges
          const dripPhase = time * 8 + umb.x;
          const leftDripAlpha = (Math.sin(dripPhase) * 0.5 + 0.5) * 0.6;
          const rightDripAlpha = (Math.sin(dripPhase + 2.5) * 0.5 + 0.5) * 0.6;

          ctx.fillStyle = `rgba(140, 165, 210, ${leftDripAlpha})`;
          const leftDripY = umb.y + (Math.sin(dripPhase) * 0.5 + 0.5) * 10;
          ctx.fillRect(umb.x - UMBRELLA_RADIUS - 0.5, umb.y, 1, leftDripY - umb.y + 3);

          ctx.fillStyle = `rgba(140, 165, 210, ${rightDripAlpha})`;
          const rightDripY = umb.y + (Math.sin(dripPhase + 2.5) * 0.5 + 0.5) * 10;
          ctx.fillRect(umb.x + UMBRELLA_RADIUS - 0.5, umb.y, 1, rightDripY - umb.y + 3);
        }
      }

      function drawLightning(ctx, w, h) {
        if (lightningBolts.length === 0 || lightningAlpha <= 0) return;

        // Screen flash
        ctx.fillStyle = `rgba(200, 210, 240, ${lightningAlpha * 0.15})`;
        ctx.fillRect(0, 0, w, h);

        // Draw bolt segments
        for (const bolt of lightningBolts) {
          for (const seg of bolt) {
            const alpha = lightningAlpha * (seg.branch ? 0.5 : 0.9);
            const width = seg.branch ? 1 : 2;

            // Glow
            ctx.strokeStyle = `rgba(180, 200, 255, ${alpha * 0.3})`;
            ctx.lineWidth = width + 4;
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();

            // Core
            ctx.strokeStyle = `rgba(220, 230, 255, ${alpha * 0.8})`;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.stroke();
          }
        }
      }

      function drawMist(ctx, w, h, time) {
        // Low fog near ground
        const mistY = groundY - 40;
        const mistH = 60;
        const grad = ctx.createLinearGradient(0, mistY, 0, mistY + mistH);
        const sway = Math.sin(time * 0.3) * 0.01;
        grad.addColorStop(0, 'rgba(20, 25, 40, 0)');
        grad.addColorStop(0.5, `rgba(20, 25, 40, ${0.08 + sway})`);
        grad.addColorStop(1, 'rgba(20, 25, 40, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, mistY, w, mistH);

        // Subtle horizontal mist bands
        for (let i = 0; i < 3; i++) {
          const bandY = groundY - 80 + i * 25 + Math.sin(time * 0.2 + i * 2) * 5;
          const bandAlpha = 0.02 + Math.sin(time * 0.4 + i * 1.7) * 0.01;
          ctx.fillStyle = `rgba(25, 30, 50, ${bandAlpha})`;
          ctx.fillRect(0, bandY, w, 12);
        }
      }

      function drawInstructions(ctx, w, h) {
        ctx.save();
        ctx.font = '11px monospace';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.textAlign = 'center';
        ctx.fillText(
          'click to place umbrella \u00B7 P panel \u00B7 E toggle',
          w / 2, h - 14,
        );
        ctx.restore();
      }

      // ─── createApp ──────────────────────────────────────
      const app = createApp({
        asciiConfig: {
          background: '#060610',
          sourceOpacity: 0,
          speed: 1,
          crtEnabled: true,
          crtScanlines: 0.15,
          crtGlow: 0.1,
        },
        layers: [
          // Background atmosphere - large blocks, moody
          {
            fontSize: 20,
            charset: 'blocks',
            colorScheme: 'ocean',
            pattern: 'breathing',
            patternMix: 0.08,
            blendMode: 'replace',
            opacity: 1,
          },
          // Rain detail - fine characters
          {
            fontSize: 7,
            charset: 'density',
            colorScheme: 'ocean',
            blendMode: 'add',
            opacity: 0.9,
          },
          // Mist/texture overlay
          {
            fontSize: 4,
            charset: 'braille',
            colorScheme: 'mono',
            pattern: 'plasma',
            patternMix: 0.05,
            blendMode: 'add',
            opacity: 0.15,
          },
        ],
        onResize(ctx, w, h) {
          groundY = h * GROUND_Y_RATIO;
          regenerateRain(w, h);
        },
        draw(ctx, { time, dt, width, height }) {
          const w = width;
          const h = height;
          const t = time * 0.001;

          // ── Wind ──
          windChangeTimer -= dt;
          if (windChangeTimer <= 0) {
            windTarget = WIND_BASE + (Math.random() - 0.3) * 50;
            windChangeTimer = 2 + Math.random() * 4;
          }
          windStrength = lerp(windStrength, windTarget, dt * 0.8);

          // ── Lightning ──
          lightningTimer -= dt;
          if (lightningTimer <= 0) {
            triggerLightning(w, h);
            lightningTimer = 5 + Math.random() * 10;
          }
          if (lightningAlpha > 0) {
            lightningAlpha -= dt * 2;
            if (lightningAlpha < 0) lightningAlpha = 0;
          }

          // ── Update rain ──
          updateRainLayer(rainFar, dt, w, h, 'far');
          updateRainLayer(rainMid, dt, w, h, 'mid');
          updateRainLayer(rainNear, dt, w, h, 'near');

          // ── Draw scene ──
          drawSkyGradient(ctx, w, h);
          drawClouds(ctx, w, h, dt);

          // Far rain (behind everything)
          drawRainLayer(ctx, rainFar, lightningAlpha);

          drawGround(ctx, w, h, t);
          drawPuddles(ctx, w, t, lightningAlpha);
          drawMist(ctx, w, h, t);

          // Mid rain
          drawRainLayer(ctx, rainMid, lightningAlpha);

          drawUmbrellas(ctx, t);
          drawSplashes(ctx, dt);

          // Near rain (in front of everything)
          drawRainLayer(ctx, rainNear, lightningAlpha);

          // Lightning on top
          drawLightning(ctx, w, h);

          // Instructions
          drawInstructions(ctx, w, h);
        },
      });

      // ── Initialize ──────────────────────────────────────
      groundY = app.height * GROUND_Y_RATIO;
      regenerateRain(app.width, app.height);

      // ─── Input ──────────────────────────────────────────
      function placeUmbrella(e) {
        const rect = app.canvas.getBoundingClientRect();
        const clientX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
        const clientY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
        const x = (clientX - rect.left) * (app.canvas.width / rect.width);
        const y = (clientY - rect.top) * (app.canvas.height / rect.height);

        // Only place above the ground
        const umbY = Math.min(y, groundY - 20);

        umbrellas.push({ x, y: umbY });
        if (umbrellas.length > MAX_UMBRELLAS) {
          umbrellas.shift();
        }
      }

      window.addEventListener('click', placeUmbrella);
      window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        placeUmbrella(e);
      }, { passive: false });
    </script>
  </body>
</html>
