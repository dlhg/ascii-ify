<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Flashlight</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, dist, clamp } from './utils.js';

      // ─── Flashlight State ───────────────────────────────
      let spotX = 0, spotY = 0;
      let targetX = 0, targetY = 0;
      let beamRadius = 0.2;

      // ─── Room Layout ────────────────────────────────────
      const furniture = [];
      const wallSegments = [];

      function initRoom(w, h) {
        furniture.length = 0;
        wallSegments.length = 0;

        // Walls (border rectangles)
        const wallT = 30;
        wallSegments.push({ x: 0, y: 0, w, h: wallT });              // top
        wallSegments.push({ x: 0, y: h - wallT, w, h: wallT });      // bottom
        wallSegments.push({ x: 0, y: 0, w: wallT, h });              // left
        wallSegments.push({ x: w - wallT, y: 0, w: wallT, h });      // right

        // Internal walls
        wallSegments.push({ x: w * 0.4, y: 0, w: 15, h: h * 0.35 });
        wallSegments.push({ x: w * 0.65, y: h * 0.5, w: 15, h: h * 0.5 });

        // Doorways (gaps in walls — draw as dark rects)
        // Furniture
        const pieces = [
          { x: w * 0.12, y: h * 0.15, w: w * 0.12, h: h * 0.06, type: 'table' },
          { x: w * 0.15, y: h * 0.5, w: w * 0.08, h: h * 0.08, type: 'chair' },
          { x: w * 0.5, y: h * 0.15, w: w * 0.15, h: h * 0.04, type: 'shelf' },
          { x: w * 0.75, y: h * 0.2, w: w * 0.1, h: h * 0.15, type: 'cabinet' },
          { x: w * 0.3, y: h * 0.7, w: w * 0.08, h: h * 0.06, type: 'chair' },
          { x: w * 0.8, y: h * 0.65, w: w * 0.12, h: h * 0.04, type: 'table' },
          { x: w * 0.1, y: h * 0.8, w: w * 0.15, h: h * 0.1, type: 'couch' },
          { x: w * 0.55, y: h * 0.4, w: w * 0.06, h: h * 0.06, type: 'chair' },
        ];
        furniture.push(...pieces);
      }

      // ─── Creatures ──────────────────────────────────────
      const NUM_CREATURES = 6;
      const creatures = [];

      function initCreatures(w, h) {
        creatures.length = 0;
        for (let i = 0; i < NUM_CREATURES; i++) {
          creatures.push({
            x: Math.random() * w * 0.8 + w * 0.1,
            y: Math.random() * h * 0.8 + h * 0.1,
            vx: 0, vy: 0,
            phase: Math.random() * Math.PI * 2,
            swaySpeed: 0.8 + Math.random() * 1.5,
            size: 15 + Math.random() * 20,
            hue: 80 + Math.random() * 60,
          });
        }
      }

      // ─── Draw Scene ─────────────────────────────────────
      function drawScene(ctx, t, w, h) {
        // Dark room base
        ctx.fillStyle = '#080810';
        ctx.fillRect(0, 0, w, h);

        // Floor — subtle tile pattern
        ctx.fillStyle = '#0c0c18';
        const tileSize = 40;
        for (let y = 0; y < h; y += tileSize) {
          for (let x = 0; x < w; x += tileSize) {
            if ((Math.floor(x / tileSize) + Math.floor(y / tileSize)) % 2 === 0) {
              ctx.fillRect(x, y, tileSize, tileSize);
            }
          }
        }

        // Walls — stone brick pattern
        for (const wall of wallSegments) {
          ctx.fillStyle = '#1a1a2a';
          ctx.fillRect(wall.x, wall.y, wall.w, wall.h);

          // Brick lines
          ctx.strokeStyle = 'rgba(40, 40, 70, 0.5)';
          ctx.lineWidth = 0.5;
          const brickH = 12, brickW = 25;
          for (let by = wall.y; by < wall.y + wall.h; by += brickH) {
            const offset = (Math.floor((by - wall.y) / brickH) % 2) * brickW / 2;
            for (let bx = wall.x + offset; bx < wall.x + wall.w; bx += brickW) {
              ctx.strokeRect(bx, by, brickW, brickH);
            }
          }
        }

        // Furniture
        for (const f of furniture) {
          const brightness = f.type === 'table' ? '#1e1e30' :
                            f.type === 'shelf' ? '#1a1a28' :
                            f.type === 'cabinet' ? '#22222e' : '#161624';
          ctx.fillStyle = brightness;
          ctx.fillRect(f.x, f.y, f.w, f.h);
          ctx.strokeStyle = 'rgba(60, 60, 90, 0.4)';
          ctx.lineWidth = 1;
          ctx.strokeRect(f.x, f.y, f.w, f.h);
        }

        // ── Creatures (drawn dimly — acid layer picks them up) ──
        for (const c of creatures) {
          const sway = Math.sin(t * c.swaySpeed + c.phase) * 5;

          // Body glow
          const glow = ctx.createRadialGradient(c.x + sway, c.y, 0, c.x + sway, c.y, c.size * 2);
          glow.addColorStop(0, `hsla(${c.hue}, 70%, 30%, 0.25)`);
          glow.addColorStop(0.5, `hsla(${c.hue}, 60%, 20%, 0.1)`);
          glow.addColorStop(1, `hsla(${c.hue}, 50%, 10%, 0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(c.x + sway, c.y, c.size * 2, 0, Math.PI * 2);
          ctx.fill();

          // Shadow body shape
          ctx.fillStyle = `hsla(${c.hue}, 50%, 25%, 0.35)`;
          // Head
          ctx.beginPath();
          ctx.arc(c.x + sway, c.y - c.size * 0.9, c.size * 0.3, 0, Math.PI * 2);
          ctx.fill();
          // Torso
          ctx.beginPath();
          ctx.moveTo(c.x + sway - c.size * 0.25, c.y - c.size * 0.5);
          ctx.lineTo(c.x + sway + c.size * 0.25, c.y - c.size * 0.5);
          ctx.lineTo(c.x + sway + c.size * 0.3, c.y + c.size * 0.3);
          ctx.lineTo(c.x + sway - c.size * 0.3, c.y + c.size * 0.3);
          ctx.closePath();
          ctx.fill();

          // Eyes — bright, glowing
          const eyeGlow = 0.5 + 0.5 * Math.sin(t * 3 + c.phase);
          for (const ex of [-1, 1]) {
            ctx.fillStyle = `hsla(${c.hue + 40}, 100%, 60%, ${0.6 * eyeGlow})`;
            ctx.beginPath();
            ctx.arc(c.x + sway + ex * c.size * 0.12, c.y - c.size * 0.9, c.size * 0.06, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ─── Update Creatures ───────────────────────────────
      function updateCreatures(dt, w, h) {
        const beamR = beamRadius * Math.min(w, h);

        for (const c of creatures) {
          const d = dist(c.x, c.y, spotX, spotY);
          const inBeam = d < beamR * 1.2;

          if (inBeam) {
            // Retreat from flashlight
            const dx = c.x - spotX;
            const dy = c.y - spotY;
            const len = Math.max(d, 1);
            c.vx += (dx / len) * 150 * dt;
            c.vy += (dy / len) * 150 * dt;
          } else {
            // Drift toward player slowly
            const dx = spotX - c.x;
            const dy = spotY - c.y;
            const len = Math.max(dist(c.x, c.y, spotX, spotY), 1);
            c.vx += (dx / len) * 20 * dt;
            c.vy += (dy / len) * 20 * dt;
          }

          c.vx *= 0.95;
          c.vy *= 0.95;
          c.x += c.vx * dt;
          c.y += c.vy * dt;

          // Wrap
          if (c.x < 40) c.x = w - 40;
          if (c.x > w - 40) c.x = 40;
          if (c.y < 40) c.y = h - 40;
          if (c.y > h - 40) c.y = 40;
        }
      }

      // ─── Flashlight Mask ────────────────────────────────
      function drawFlashlightMask(ctx, t, w, h) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        const r = beamRadius * Math.min(w, h);
        // Slight hand-shake jitter
        const jitterX = Math.sin(t * 7.3) * 2 + Math.sin(t * 13.1) * 1;
        const jitterY = Math.cos(t * 9.7) * 2 + Math.cos(t * 11.3) * 1;
        const bx = spotX + jitterX;
        const by = spotY + jitterY;

        const grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#dddddd');
        grad.addColorStop(0.8, '#666666');
        grad.addColorStop(1, '#000000');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: { background: '#04040a', sourceOpacity: 0 },
        layers: [
          // Layer 1: Room — visible IN flashlight beam
          {
            fontSize: 10,
            charset: 'blocks',
            colorScheme: 'mono',
            opacity: 1,
          },
          // Layer 2: Room detail — visible IN beam
          {
            fontSize: 6,
            charset: 'density',
            colorScheme: 'mono',
            blendMode: 'add',
            opacity: 0.5,
          },
          // Layer 3: Creatures — visible OUTSIDE beam
          {
            fontSize: 8,
            charset: 'braille',
            colorScheme: 'acid',
            opacity: 0.7,
          },
          // Layer 4: Ambient darkness
          {
            fontSize: 20,
            charset: 'minimal',
            colorScheme: 'mono',
            pattern: 'breathing',
            patternMix: 0.8,
            opacity: 0.06,
          },
          // Layer 5: Flashlight mask — invisible
          {
            fontSize: 4,
            charset: 'blocks',
            colorScheme: 'mono',
            opacity: 0,
          },
        ],
        draw(ctx, { time, dt, width: w, height: h }) {
          spotX = lerp(spotX, targetX, 1 - Math.exp(-10 * dt));
          spotY = lerp(spotY, targetY, 1 - Math.exp(-10 * dt));
          updateCreatures(dt, w, h);
          drawScene(ctx, time / 1000, w, h);
        },
        onResize(ctx, w, h) {
          initRoom(w, h);
          initCreatures(w, h);
          spotX = targetX = w / 2;
          spotY = targetY = h / 2;
        },
      });

      // ─── Mask Setup ─────────────────────────────────────
      const maskCanvas = document.createElement('canvas');
      const maskCtx = maskCanvas.getContext('2d');

      function resizeMask() {
        maskCanvas.width = app.canvas.width;
        maskCanvas.height = app.canvas.height;
      }
      resizeMask();
      window.addEventListener('resize', resizeMask);

      const layers = app.ascii.layers;
      layers[0].set('visible', false);
      layers[5].set('source', maskCanvas);

      // Room visible IN beam (normal mask)
      layers[1].set('maskLayer', layers[5].id);
      layers[2].set('maskLayer', layers[5].id);

      // Creatures visible OUTSIDE beam (inverted mask)
      layers[3].set('maskLayer', layers[5].id);
      layers[3].set('invertMask', true);

      app.ascii.on('render', () => {
        const t = performance.now() / 1000;
        drawFlashlightMask(maskCtx, t, maskCanvas.width, maskCanvas.height);
      });

      // ─── Input ──────────────────────────────────────────
      window.addEventListener('mousemove', (e) => {
        const rect = app.canvas.getBoundingClientRect();
        targetX = (e.clientX - rect.left) * (app.canvas.width / rect.width);
        targetY = (e.clientY - rect.top) * (app.canvas.height / rect.height);
      });
      window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        const rect = app.canvas.getBoundingClientRect();
        targetX = (touch.clientX - rect.left) * (app.canvas.width / rect.width);
        targetY = (touch.clientY - rect.top) * (app.canvas.height / rect.height);
      });
      app.canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        beamRadius += e.deltaY * -0.0003;
        beamRadius = Math.max(0.08, Math.min(0.35, beamRadius));
      }, { passive: false });
    </script>
  </body>
</html>
