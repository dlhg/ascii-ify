<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Plasma Vortex</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { ParticlePool } from './particles.js';
      import { lerp, clamp, smoothstep } from './utils.js';

      const TWO_PI = Math.PI * 2;

      // ─── Icosahedron Geometry ──────────────────────────
      const PHI = (1 + Math.sqrt(5)) / 2;
      const RAW_VERTS = [
        [-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0],
        [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
        [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1],
      ];
      const L = Math.sqrt(1 + PHI * PHI);
      const VERTS = RAW_VERTS.map(v => [v[0] / L, v[1] / L, v[2] / L]);
      const EDGES = [
        [0,11],[0,5],[0,1],[0,7],[0,10],
        [1,5],[1,9],[1,8],[1,7],
        [2,11],[2,4],[2,3],[2,6],[2,10],
        [3,4],[3,9],[3,8],[3,6],
        [4,5],[4,9],[4,11],[5,9],[5,11],
        [6,7],[6,8],[6,10],[7,8],[7,10],
        [8,9],[10,11],
      ];

      // ─── Phase Timings (seconds) ──────────────────────
      const T_SCATTER  = 2.5;
      const T_GATHER   = 6;
      const T_COLLAPSE = 7.5;
      const T_FLASH    = 8.2;
      const T_REVEAL   = 10.5;

      // ─── State ────────────────────────────────────────
      const COUNT = 1200;
      let parts = [];
      let elapsed = 0;
      let rotY = 0, rotX = 0;
      let initialized = false;

      const orbitPool = new ParticlePool({ maxParticles: 80, gravity: 0, drag: 1 });

      function init(w, h) {
        const cx = w / 2, cy = h / 2;
        parts = [];
        for (let i = 0; i < COUNT; i++) {
          const a = Math.random() * TWO_PI;
          const r = 80 + Math.random() * Math.max(w, h) * 0.45;
          parts.push({
            x: cx + Math.cos(a) * r,
            y: cy + Math.sin(a) * r,
            vx: (Math.random() - 0.5) * 30,
            vy: (Math.random() - 0.5) * 30,
            size: 0.5 + Math.random() * 2.5,
            br: 0.2 + Math.random() * 0.8,
          });
        }
        orbitPool.clear();
        initialized = true;
      }

      // ─── 3D Helpers ───────────────────────────────────
      function rotVert(v) {
        let [x, y, z] = v;
        let c = Math.cos(rotY), s = Math.sin(rotY);
        let x2 = x * c + z * s, z2 = -x * s + z * c;
        x = x2; z = z2;
        c = Math.cos(rotX); s = Math.sin(rotX);
        let y2 = y * c - z * s; z2 = y * s + z * c;
        return [x, y2, z2];
      }

      function project(v, cx, cy, size) {
        const FOV = 2.5;
        const z = v[2] + FOV;
        const s = FOV / z;
        return [cx + v[0] * size * s, cy + v[1] * size * s, z];
      }

      // ─── App ──────────────────────────────────────────
      const app = createApp({
        asciiConfig: {
          fontSize: 8,
          charset: 'braille',
          colorScheme: 'acid',
          background: '#020a02',
          sourceOpacity: 0,
        },
        layers: [
          { fontSize: 22, charset: 'blocks', blendMode: 'replace', opacity: 0.2 },
          { fontSize: 5, charset: 'braille', blendMode: 'add', opacity: 1 },
        ],

        draw(ctx, { dt, width, height }) {
          if (!initialized) init(width, height);
          elapsed += dt;
          const cx = width / 2, cy = height / 2;

          // ─── Trail fade ─────────────────────────────
          const fade = elapsed < T_SCATTER ? 0.12 :
                       elapsed < T_GATHER ? 0.04 :
                       elapsed < T_COLLAPSE ? 0.025 :
                       elapsed < T_FLASH ? 0.4 : 0.06;
          ctx.fillStyle = `rgba(2, 10, 2, ${fade})`;
          ctx.fillRect(0, 0, width, height);

          // ═══════════════════════════════════════════════
          // SCATTER — particles drift aimlessly
          // ═══════════════════════════════════════════════
          if (elapsed < T_SCATTER) {
            const appear = smoothstep(0, 0.8, elapsed);
            for (const p of parts) {
              p.vx += (Math.random() - 0.5) * 15 * dt;
              p.vy += (Math.random() - 0.5) * 15 * dt;
              p.vx *= 0.99;
              p.vy *= 0.99;
              p.x += p.vx * dt;
              p.y += p.vy * dt;

              ctx.fillStyle = `rgba(60, 255, 100, ${p.br * appear})`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, TWO_PI);
              ctx.fill();
            }
          }

          // ═══════════════════════════════════════════════
          // GATHER — vortex pulls particles inward
          // ═══════════════════════════════════════════════
          else if (elapsed < T_GATHER) {
            const t = (elapsed - T_SCATTER) / (T_GATHER - T_SCATTER);
            const strength = smoothstep(0, 1, t);

            for (const p of parts) {
              const dx = cx - p.x, dy = cy - p.y;
              const d = Math.sqrt(dx * dx + dy * dy) + 1;
              const angle = Math.atan2(dy, dx);

              const tang = strength * 220;
              const radial = strength * lerp(60, 350, t);
              p.vx += (-Math.sin(angle) * tang + dx / d * radial) * dt;
              p.vy += (Math.cos(angle) * tang + dy / d * radial) * dt;
              p.vx *= 0.97;
              p.vy *= 0.97;
              p.x += p.vx * dt;
              p.y += p.vy * dt;

              const dNorm = clamp(1 - d / Math.max(width, height), 0, 1);
              const g = Math.floor(lerp(180, 255, dNorm));
              const b = Math.floor(lerp(80, 200, strength));
              ctx.fillStyle = `rgba(80, ${g}, ${b}, ${clamp(p.br * (0.4 + strength * 0.6), 0, 1)})`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * lerp(1, 0.7, t), 0, TWO_PI);
              ctx.fill();
            }

            // Core glow
            const cg = smoothstep(0.3, 1, t);
            if (cg > 0) {
              const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 90);
              grad.addColorStop(0, `rgba(150, 255, 200, ${cg * 0.4})`);
              grad.addColorStop(1, 'rgba(0, 80, 40, 0)');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(cx, cy, 90, 0, TWO_PI);
              ctx.fill();
            }
          }

          // ═══════════════════════════════════════════════
          // COLLAPSE — particles rush to center
          // ═══════════════════════════════════════════════
          else if (elapsed < T_COLLAPSE) {
            const t = (elapsed - T_GATHER) / (T_COLLAPSE - T_GATHER);

            for (const p of parts) {
              const dx = cx - p.x, dy = cy - p.y;
              const d = Math.sqrt(dx * dx + dy * dy) + 1;
              const angle = Math.atan2(dy, dx);
              const pull = lerp(600, 2500, t * t);

              p.vx += (dx / d * pull - Math.sin(angle) * 120) * dt;
              p.vy += (dy / d * pull + Math.cos(angle) * 120) * dt;
              p.vx *= 0.94;
              p.vy *= 0.94;
              p.x += p.vx * dt;
              p.y += p.vy * dt;

              ctx.fillStyle = `rgba(120, 255, 220, ${clamp(p.br * lerp(0.8, 0.2, t), 0, 1)})`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * lerp(0.7, 0.2, t), 0, TWO_PI);
              ctx.fill();
            }

            // Intensifying core
            const r = lerp(70, 140, t);
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            grad.addColorStop(0, `rgba(200, 255, 230, ${lerp(0.3, 0.9, t)})`);
            grad.addColorStop(0.5, `rgba(80, 255, 150, ${lerp(0.2, 0.5, t)})`);
            grad.addColorStop(1, 'rgba(0, 60, 30, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, TWO_PI);
            ctx.fill();
          }

          // ═══════════════════════════════════════════════
          // FLASH — white-green burst
          // ═══════════════════════════════════════════════
          else if (elapsed < T_FLASH) {
            const t = (elapsed - T_COLLAPSE) / (T_FLASH - T_COLLAPSE);
            const flash = t < 0.35 ? smoothstep(0, 0.35, t) : 1 - smoothstep(0.35, 1, t);

            ctx.fillStyle = `rgba(200, 255, 220, ${flash * 0.85})`;
            ctx.fillRect(0, 0, width, height);

            // Seed orbit particles once
            if (orbitPool.length === 0) {
              orbitPool.emit(60, () => {
                const a = Math.random() * TWO_PI;
                return {
                  x: cx, y: cy,
                  vx: 0, vy: 0, life: 99999,
                  orbitR: 70 + Math.random() * 130,
                  orbitA: a,
                  orbitSpeed: 0.15 + Math.random() * 0.35,
                  size: 1 + Math.random() * 2,
                  br: 0.3 + Math.random() * 0.7,
                  yScale: 0.3 + Math.random() * 0.4,
                };
              });
            }
          }

          // ═══════════════════════════════════════════════
          // REVEAL + STEADY — rotating icosahedron
          // ═══════════════════════════════════════════════
          else {
            const revealT = clamp((elapsed - T_FLASH) / (T_REVEAL - T_FLASH), 0, 1);
            const targetSize = Math.min(width, height) * 0.15;
            const size = lerp(targetSize * 0.15, targetSize, smoothstep(0, 1, revealT));

            rotY += dt * 0.35;
            rotX += dt * 0.18;

            const projected = VERTS.map(v => project(rotVert(v), cx, cy, size));

            // Draw edges
            const ea = smoothstep(0, 0.5, revealT);
            ctx.lineWidth = 1.5;
            for (const [a, b] of EDGES) {
              const va = projected[a], vb = projected[b];
              const avgZ = (va[2] + vb[2]) / 2;
              const da = clamp(1 - (avgZ - 1.5) * 0.35, 0.15, 1);
              ctx.strokeStyle = `rgba(80, 255, 160, ${ea * da * 0.8})`;
              ctx.beginPath();
              ctx.moveTo(va[0], va[1]);
              ctx.lineTo(vb[0], vb[1]);
              ctx.stroke();
            }

            // Draw vertices
            for (const v of projected) {
              const da = clamp(1 - (v[2] - 1.5) * 0.35, 0.15, 1);
              const pulse = 3 + Math.sin(elapsed * 2.5) * 1;
              ctx.fillStyle = `rgba(160, 255, 220, ${ea * da})`;
              ctx.beginPath();
              ctx.arc(v[0], v[1], pulse, 0, TWO_PI);
              ctx.fill();
            }

            // Orbiting afterglow
            const oa = smoothstep(0, 0.4, revealT);
            orbitPool.forEach(p => {
              p.orbitA += p.orbitSpeed * dt;
              p.x = cx + Math.cos(p.orbitA) * p.orbitR;
              p.y = cy + Math.sin(p.orbitA) * p.orbitR * p.yScale;
              ctx.fillStyle = `rgba(100, 255, 180, ${oa * p.br * 0.45})`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, TWO_PI);
              ctx.fill();
            });

            // Ambient core glow
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 1.8);
            grad.addColorStop(0, 'rgba(80, 200, 140, 0.12)');
            grad.addColorStop(1, 'rgba(0, 40, 20, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, size * 1.8, 0, TWO_PI);
            ctx.fill();
          }
        },

        onResize(ctx, w, h) {
          elapsed = 0;
          initialized = false;
          orbitPool.clear();
        },
      });
    </script>
  </body>
</html>
