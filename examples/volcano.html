<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Volcano</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { ParticlePool } from './particles.js';
      import { lerp, clamp, smoothstep, lerpColor, rgb } from './utils.js';

      // ─── Palette ──────────────────────────────────────
      const WHITE      = [255, 255, 240];
      const YELLOW     = [255, 230, 60];
      const ORANGE     = [255, 140, 20];
      const RED        = [220, 40, 10];
      const DARK_RED   = [100, 15, 5];
      const ASH        = [60, 55, 50];
      const DARK_ASH   = [35, 32, 30];
      const ROCK_DARK  = [30, 18, 12];
      const ROCK_MID   = [50, 28, 18];
      const LAVA_BRIGHT = [255, 180, 30];
      const LAVA_HOT   = [255, 100, 10];
      const SKY_TOP    = [8, 2, 4];
      const SKY_BOT    = [45, 10, 6];
      const GROUND     = [20, 12, 8];

      // ─── Mountain geometry ────────────────────────────
      let mountainPoly = [];
      let craterLeft = 0, craterRight = 0, craterY = 0, peakX = 0;
      let lavaFlows = [];
      let w = 0, h = 0;

      function genMountain(width, height) {
        w = width;
        h = height;
        mountainPoly = [];

        peakX = w * 0.5;
        const peakY = h * 0.28;
        craterY = peakY;

        // Left foot to peak
        const leftFoot = w * 0.05;
        const rightFoot = w * 0.95;
        const baseY = h;

        // Build left slope with noise
        const leftSteps = 18;
        for (let i = 0; i <= leftSteps; i++) {
          const t = i / leftSteps;
          const x = lerp(leftFoot, peakX - w * 0.04, t);
          const y = lerp(baseY, peakY + h * 0.01, t);
          const noise = (Math.sin(t * 17.3) * 0.4 + Math.sin(t * 31.7) * 0.25 + Math.sin(t * 7.1) * 0.35) * w * 0.012;
          mountainPoly.push({ x: x + noise, y: y + Math.abs(noise) * 0.5 });
        }

        // Crater dip
        craterLeft = peakX - w * 0.04;
        craterRight = peakX + w * 0.04;
        const craterDepth = h * 0.015;
        mountainPoly.push({ x: craterLeft, y: peakY + h * 0.005 });
        mountainPoly.push({ x: peakX - w * 0.02, y: peakY + craterDepth });
        mountainPoly.push({ x: peakX, y: peakY + craterDepth + 2 });
        mountainPoly.push({ x: peakX + w * 0.02, y: peakY + craterDepth });
        mountainPoly.push({ x: craterRight, y: peakY + h * 0.005 });

        // Right slope with noise
        const rightSteps = 18;
        for (let i = 0; i <= rightSteps; i++) {
          const t = i / rightSteps;
          const x = lerp(peakX + w * 0.04, rightFoot, t);
          const y = lerp(peakY + h * 0.01, baseY, t);
          const noise = (Math.sin(t * 13.9) * 0.4 + Math.sin(t * 29.3) * 0.3 + Math.sin(t * 9.7) * 0.3) * w * 0.012;
          mountainPoly.push({ x: x + noise, y: y + Math.abs(noise) * 0.5 });
        }

        // Close bottom
        mountainPoly.push({ x: rightFoot, y: baseY + 10 });
        mountainPoly.push({ x: leftFoot, y: baseY + 10 });

        // Generate lava flow paths
        genLavaFlows(width, height, peakY);
      }

      function genLavaFlows(width, height, peakY) {
        lavaFlows = [];
        const flowDefs = [
          { startOffX: -0.015, sway: -1, length: 0.55 },
          { startOffX: 0.005,  sway: 1,  length: 0.65 },
          { startOffX: 0.025,  sway: 0.5, length: 0.45 },
        ];

        for (const def of flowDefs) {
          const pts = [];
          const steps = 30;
          const startX = peakX + def.startOffX * w;
          const startY = peakY + h * 0.02;
          const endY = startY + h * def.length;

          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const drift = Math.sin(t * 4.5 + def.sway) * w * 0.025 * t
                        + Math.sin(t * 9.1) * w * 0.008 * t;
            const x = startX + drift + def.sway * t * w * 0.06;
            const y = lerp(startY, endY, t);
            pts.push({ x, y, t });
          }
          lavaFlows.push(pts);
        }
      }

      // ─── Particles ───────────────────────────────────
      const eruption = new ParticlePool({ maxParticles: 1200, gravity: 180, drag: 0.997 });
      const embers   = new ParticlePool({ maxParticles: 400,  gravity: 25,  drag: 0.995 });
      const ashCloud = new ParticlePool({ maxParticles: 200,  gravity: -3,  drag: 0.999 });

      function emitEruption(dt) {
        // Main eruption column -- continuous dense stream
        const rate = 120;
        const count = Math.floor(rate * dt + (Math.random() < (rate * dt % 1) ? 1 : 0));

        eruption.emit(count, () => {
          const spread = (Math.random() - 0.5) * w * 0.03;
          const isBoulder = Math.random() < 0.08;
          const speed = (350 + Math.random() * 300) * (isBoulder ? 0.6 : 1);

          return {
            x: peakX + spread,
            y: craterY + h * 0.015,
            vx: spread * 3 + (Math.random() - 0.5) * 80,
            vy: -speed,
            life: 1.5 + Math.random() * 2.5,
            maxLife: 1.5 + Math.random() * 2.5,
            size: isBoulder ? 3 + Math.random() * 4 : 1 + Math.random() * 2.5,
            isBoulder,
          };
        });
      }

      function emitEmbers(dt) {
        // Ground-level embers near lava and base
        const rate = 15;
        const count = Math.floor(rate * dt + (Math.random() < (rate * dt % 1) ? 1 : 0));

        embers.emit(count, () => {
          const x = peakX + (Math.random() - 0.5) * w * 0.7;
          return {
            x,
            y: h - Math.random() * h * 0.08,
            vx: (Math.random() - 0.5) * 20,
            vy: -(30 + Math.random() * 50),
            life: 1 + Math.random() * 2,
            maxLife: 1 + Math.random() * 2,
            size: 0.5 + Math.random() * 1.5,
          };
        });
      }

      function emitAsh(dt) {
        const rate = 8;
        const count = Math.floor(rate * dt + (Math.random() < (rate * dt % 1) ? 1 : 0));

        ashCloud.emit(count, () => {
          return {
            x: peakX + (Math.random() - 0.5) * w * 0.12,
            y: craterY - h * 0.15 - Math.random() * h * 0.15,
            vx: 15 + Math.random() * 20, // wind drift right
            vy: -(5 + Math.random() * 10),
            life: 4 + Math.random() * 5,
            maxLife: 4 + Math.random() * 5,
            size: 20 + Math.random() * 50,
          };
        });
      }

      // ─── Drawing helpers ──────────────────────────────

      function drawSky(ctx, time) {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        // Pulse sky color slightly
        const pulse = 0.5 + Math.sin(time * 0.0005) * 0.15;
        const top = lerpColor(SKY_TOP, DARK_RED, pulse * 0.15);
        const bot = lerpColor(SKY_BOT, RED, pulse * 0.08);
        grad.addColorStop(0, rgb(top));
        grad.addColorStop(0.6, rgb(bot));
        grad.addColorStop(1, rgb(GROUND));
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      function drawMountain(ctx, time) {
        // Main rock body
        ctx.beginPath();
        ctx.moveTo(mountainPoly[0].x, mountainPoly[0].y);
        for (let i = 1; i < mountainPoly.length; i++) {
          ctx.lineTo(mountainPoly[i].x, mountainPoly[i].y);
        }
        ctx.closePath();

        // Dark rock gradient
        const grad = ctx.createLinearGradient(peakX, craterY, peakX, h);
        grad.addColorStop(0, rgb(ROCK_MID));
        grad.addColorStop(0.3, rgb(ROCK_DARK));
        grad.addColorStop(1, rgb([18, 10, 6]));
        ctx.fillStyle = grad;
        ctx.fill();

        // Glow veins on the slopes
        drawGlowVeins(ctx, time);
      }

      function drawGlowVeins(ctx, time) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        const veinCount = 12;
        for (let i = 0; i < veinCount; i++) {
          const seed = i * 7.31;
          const t = (Math.sin(time * 0.001 + seed) * 0.5 + 0.5);
          const alpha = t * 0.12 + 0.02;

          const startT = (i / veinCount);
          const side = i % 2 === 0 ? -1 : 1;
          const sx = peakX + side * w * 0.02 * startT;
          const sy = craterY + h * 0.04 + startT * h * 0.35;
          const ex = sx + side * w * (0.05 + startT * 0.08);
          const ey = sy + h * 0.08 + Math.sin(seed) * h * 0.04;

          ctx.beginPath();
          ctx.moveTo(sx, sy);
          const cx1 = lerp(sx, ex, 0.5) + Math.sin(seed * 2.3) * w * 0.02;
          const cy1 = lerp(sy, ey, 0.3);
          ctx.quadraticCurveTo(cx1, cy1, ex, ey);
          ctx.strokeStyle = `rgba(255, 80, 10, ${alpha})`;
          ctx.lineWidth = 1.5 + t * 2;
          ctx.stroke();

          // Glow around vein
          ctx.strokeStyle = `rgba(255, 40, 5, ${alpha * 0.4})`;
          ctx.lineWidth = 4 + t * 5;
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawLavaFlows(ctx, time) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        for (let f = 0; f < lavaFlows.length; f++) {
          const flow = lavaFlows[f];
          const pulse = 0.6 + Math.sin(time * 0.002 + f * 2.1) * 0.4;

          // Outer glow
          ctx.beginPath();
          ctx.moveTo(flow[0].x, flow[0].y);
          for (let i = 1; i < flow.length; i++) {
            ctx.lineTo(flow[i].x, flow[i].y);
          }
          ctx.strokeStyle = `rgba(255, 60, 0, ${0.15 * pulse})`;
          ctx.lineWidth = 12 + pulse * 6;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();

          // Mid glow
          ctx.beginPath();
          ctx.moveTo(flow[0].x, flow[0].y);
          for (let i = 1; i < flow.length; i++) {
            ctx.lineTo(flow[i].x, flow[i].y);
          }
          ctx.strokeStyle = `rgba(255, 120, 10, ${0.35 * pulse})`;
          ctx.lineWidth = 5 + pulse * 3;
          ctx.stroke();

          // Bright core
          ctx.beginPath();
          ctx.moveTo(flow[0].x, flow[0].y);
          for (let i = 1; i < flow.length; i++) {
            ctx.lineTo(flow[i].x, flow[i].y);
          }
          ctx.strokeStyle = `rgba(255, 210, 60, ${0.6 * pulse})`;
          ctx.lineWidth = 1.5 + pulse * 1.5;
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawCraterGlow(ctx, time) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        const pulse = 0.7 + Math.sin(time * 0.003) * 0.3;
        const cx = peakX;
        const cy = craterY + h * 0.012;

        // Deep glow in crater
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.06);
        grad.addColorStop(0, `rgba(255, 220, 80, ${0.6 * pulse})`);
        grad.addColorStop(0.3, `rgba(255, 120, 20, ${0.35 * pulse})`);
        grad.addColorStop(0.6, `rgba(200, 40, 0, ${0.15 * pulse})`);
        grad.addColorStop(1, 'rgba(100, 10, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(cx - w * 0.08, cy - h * 0.06, w * 0.16, h * 0.12);

        // Upward light column (faint)
        const colGrad = ctx.createLinearGradient(cx, cy, cx, cy - h * 0.2);
        colGrad.addColorStop(0, `rgba(255, 160, 40, ${0.15 * pulse})`);
        colGrad.addColorStop(1, 'rgba(255, 80, 10, 0)');
        ctx.fillStyle = colGrad;
        ctx.beginPath();
        ctx.moveTo(cx - w * 0.035, cy);
        ctx.lineTo(cx - w * 0.07, cy - h * 0.2);
        ctx.lineTo(cx + w * 0.07, cy - h * 0.2);
        ctx.lineTo(cx + w * 0.035, cy);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawAshCloud(ctx) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';

        ashCloud.forEach((p) => {
          const t = 1 - p.life / p.maxLife;
          const alpha = (1 - t) * 0.12;
          const col = lerpColor(ASH, DARK_ASH, t);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.8 + t * 0.5), 0, Math.PI * 2);
          ctx.fillStyle = rgb(col, alpha);
          ctx.fill();
        });

        ctx.restore();
      }

      function drawEruptionParticles(ctx) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        eruption.forEach((p) => {
          const t = 1 - p.life / p.maxLife; // 0 = new, 1 = dead
          let col, alpha;

          if (t < 0.15) {
            col = lerpColor(WHITE, YELLOW, t / 0.15);
            alpha = 1;
          } else if (t < 0.35) {
            col = lerpColor(YELLOW, ORANGE, (t - 0.15) / 0.2);
            alpha = 1;
          } else if (t < 0.6) {
            col = lerpColor(ORANGE, RED, (t - 0.35) / 0.25);
            alpha = 0.9;
          } else if (t < 0.8) {
            col = lerpColor(RED, DARK_RED, (t - 0.6) / 0.2);
            alpha = 0.7;
          } else {
            col = lerpColor(DARK_RED, ASH, (t - 0.8) / 0.2);
            alpha = 0.5 - (t - 0.8) * 1.5;
          }

          alpha = clamp(alpha, 0, 1);

          if (p.isBoulder) {
            // Draw boulder as a larger rect with a glow
            const s = p.size * (1 - t * 0.3);
            ctx.fillStyle = rgb(col, alpha);
            ctx.fillRect(p.x - s, p.y - s, s * 2, s * 2);
            // Glow
            ctx.fillStyle = rgb(col, alpha * 0.3);
            ctx.fillRect(p.x - s * 2, p.y - s * 2, s * 4, s * 4);
          } else {
            const s = p.size * (1 - t * 0.5);
            ctx.fillStyle = rgb(col, alpha);
            ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
          }
        });

        ctx.restore();
      }

      function drawEmbers(ctx) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        embers.forEach((p) => {
          const t = 1 - p.life / p.maxLife;
          const col = lerpColor(ORANGE, RED, t);
          const alpha = (1 - t) * 0.8;
          const s = p.size * (1 - t * 0.5);
          ctx.fillStyle = rgb(col, alpha);
          ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
        });

        ctx.restore();
      }

      function drawGroundEmbers(ctx, time) {
        // Scattered glowing spots on the ground
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        const count = 20;
        for (let i = 0; i < count; i++) {
          const seed = i * 13.37;
          const x = w * 0.1 + (Math.sin(seed) * 0.5 + 0.5) * w * 0.8;
          const y = h - Math.abs(Math.cos(seed * 1.7)) * h * 0.05;
          const pulse = Math.sin(time * 0.002 + seed) * 0.5 + 0.5;
          const alpha = pulse * 0.08;
          const size = 3 + pulse * 4;

          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 100, 20, ${alpha})`;
          ctx.fill();
        }

        ctx.restore();
      }

      // ─── Eruption Bursts (periodic intensity spikes) ──
      let burstTimer = 0;
      let burstIntensity = 0;

      function updateBurst(dt) {
        burstTimer -= dt;
        if (burstTimer <= 0) {
          burstTimer = 2 + Math.random() * 4;
          burstIntensity = 0.6 + Math.random() * 0.4;
        }
        burstIntensity *= 0.97;
      }

      function emitBurst() {
        if (burstIntensity < 0.1) return;

        const extra = Math.floor(burstIntensity * 30);
        eruption.emit(extra, () => {
          const spread = (Math.random() - 0.5) * w * 0.05;
          const speed = 400 + Math.random() * 350;
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;

          return {
            x: peakX + spread,
            y: craterY + h * 0.01,
            vx: Math.cos(angle) * speed * 0.7,
            vy: Math.sin(angle) * speed,
            life: 2 + Math.random() * 3,
            maxLife: 2 + Math.random() * 3,
            size: 2 + Math.random() * 3.5,
            isBoulder: Math.random() < 0.2,
          };
        });
      }

      // ─── App ──────────────────────────────────────────

      createApp({
        asciiConfig: {
          fontSize: 6,
          charset: 'density',
          colorScheme: 'fire',
          background: '#0a0204',
          sourceOpacity: 0,
        },
        layers: [
          { fontSize: 4, charset: 'braille', colorScheme: 'fire', blendMode: 'add', opacity: 0.2 },
          { fontSize: 10, charset: 'blocks', colorScheme: 'mono', blendMode: 'add', opacity: 0.08 },
        ],

        onResize(ctx, width, height) {
          genMountain(width, height);
        },

        draw(ctx, { time, dt, width, height }) {
          if (w !== width || h !== height) {
            genMountain(width, height);
          }

          // Update particles
          updateBurst(dt);
          emitEruption(dt);
          emitBurst();
          emitEmbers(dt);
          emitAsh(dt);

          eruption.update(dt);
          embers.update(dt);
          ashCloud.update(dt);

          // Draw scene back-to-front
          drawSky(ctx, time);
          drawGroundEmbers(ctx, time);
          drawMountain(ctx, time);
          drawLavaFlows(ctx, time);
          drawCraterGlow(ctx, time);
          drawAshCloud(ctx);
          drawEruptionParticles(ctx);
          drawEmbers(ctx);
        },
      });
    </script>
  </body>
</html>
