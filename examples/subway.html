<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ascii-ify — Subway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #08080c; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="source"></canvas>
  <script type="module">
    import { createApp } from './boilerplate.js';
    import { lerp, clamp, dist } from './utils.js';

    /* ─── Map & viewport ─── */
    const MAP_W = 60, MAP_H = 40;
    const VIEW_W = 24, VIEW_H = 16;
    const pk = (x, y) => `${x},${y}`;

    function rgba(hex, a) {
      return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
    }

    /* ─── Subway lines (variable density, curved paths) ─── */
    const LINES = [
      // ── Horizontals ──
      { color: '#ff3535', path: [ // Red: upper arc, sparse outer / dense core
        [0,8],[14,8],[20,11],[22,12],[24,12],[26,12],[28,12],[34,10],[52,8],[60,9]
      ]},
      { color: '#2d7dd2', path: [ // Blue: mid-level S-curve, dense core
        [0,18],[8,18],[14,20],[18,20],[21,20],[24,20],[28,19],[32,18],[38,18],[52,17],[60,18]
      ]},
      { color: '#c154c1', path: [ // Purple: lower arc, dense core
        [0,30],[8,28],[14,26],[18,25],[21,24],[24,24],[28,25],[34,26],[38,28],[56,30],[60,30]
      ]},
      { color: '#aabbcc', path: [ // Silver: far south, very sparse
        [0,38],[14,36],[28,36],[42,36],[48,36],[60,38]
      ]},

      // ── Verticals ──
      { color: '#00cc44', path: [ // Green: west N-S, gentle curve
        [14,0],[14,8],[13,12],[13,16],[14,20],[14,24],[14,26],[14,30],[14,36],[14,40]
      ]},
      { color: '#ff8822', path: [ // Orange: center N-S
        [28,0],[28,8],[28,12],[28,16],[28,20],[28,24],[28,28],[28,36],[28,40]
      ]},
      { color: '#00ddcc', path: [ // Teal: east N-S, long sparse curves
        [48,0],[47,8],[46,14],[45,20],[46,28],[48,36],[48,40]
      ]},

      // ── Diagonals ──
      { color: '#ffdd00', path: [ // Yellow: NW→SE flowing curve
        [0,0],[6,3],[14,8],[18,12],[22,16],[24,20],[28,24],[34,30],[42,36],[60,40]
      ]},
      { color: '#ff6699', path: [ // Pink: NE→SW flowing curve
        [60,0],[52,6],[44,10],[38,14],[32,18],[28,20],[24,24],[18,28],[14,36],[0,40]
      ]},

      // ── Core connectors (dense) ──
      { color: '#88dd22', path: [ // Lime: very dense core vertical
        [24,2],[24,6],[24,10],[24,12],[24,14],[24,16],[24,18],[24,20],[24,22],[24,24],[24,28],[24,34]
      ]},
      { color: '#8866dd', path: [ // Indigo: east connector
        [38,0],[38,6],[38,10],[38,14],[38,18],[38,22],[38,28],[38,38]
      ]},
      { color: '#dd8833', path: [ // Brown: west connector, dense middle
        [8,0],[8,8],[8,14],[8,16],[8,18],[8,20],[8,22],[8,28],[8,40]
      ]},
    ];

    /* ─── Station index ─── */
    const stationMap = new Map();
    for (const line of LINES) {
      for (const [x, y] of line.path) {
        const k = pk(x, y);
        if (!stationMap.has(k)) stationMap.set(k, { gx: x, gy: y, n: 0 });
        stationMap.get(k).n++;
      }
    }

    const LABELS = {
      '14,8': 'North Gate',     '24,12': 'Midtown',       '28,12': 'Commerce',
      '8,18': 'Park Place',     '14,20': 'Riverside',     '24,20': 'Grand Central',
      '28,20': 'City Hall',     '38,18': 'Convention',     '14,26': 'University',
      '24,24': 'Herald Sq',     '28,24': 'Metro Center',   '38,28': 'Harborview',
      '14,36': 'Old Town',      '28,36': 'Grand Av',      '42,36': 'Bayshore',
      '48,36': 'Beach',
    };

    const DISTRICTS = [
      { text: 'DOWNTOWN', x: 22, y: 22 },    { text: 'MIDTOWN', x: 28, y: 9 },
      { text: 'UPTOWN', x: 16, y: 3 },        { text: 'EAST END', x: 50, y: 20 },
      { text: 'WEST SIDE', x: 5, y: 14 },     { text: 'WATERFRONT', x: 46, y: 32 },
      { text: 'SOUTH BAY', x: 28, y: 38 },    { text: 'NORTHSIDE', x: 40, y: 3 },
    ];

    /* ─── Trains ─── */
    const trains = [];
    for (const line of LINES) {
      const count = Math.max(3, Math.ceil(line.path.length * 0.4));
      for (let i = 0; i < count; i++) {
        trains.push({
          line,
          t: i / count,
          speed: 0.028 + Math.random() * 0.014,
          dir: i % 2 === 0 ? 1 : -1,
          wait: Math.random() * 2,
        });
      }
    }

    /* ─── Catmull-Rom helpers ─── */
    function neighbors(path, i) {
      const n = path.length - 1;
      return [
        path[Math.max(0, i - 1)],
        path[i],
        path[Math.min(n, i + 1)],
        path[Math.min(n, i + 2)],
      ];
    }

    function drawCurve(ctx, path, tx, ty) {
      ctx.beginPath();
      ctx.moveTo(tx(path[0][0]), ty(path[0][1]));
      for (let i = 0; i < path.length - 1; i++) {
        const [p0, p1, p2, p3] = neighbors(path, i);
        ctx.bezierCurveTo(
          tx(p1[0] + (p2[0] - p0[0]) / 6), ty(p1[1] + (p2[1] - p0[1]) / 6),
          tx(p2[0] - (p3[0] - p1[0]) / 6), ty(p2[1] - (p3[1] - p1[1]) / 6),
          tx(p2[0]), ty(p2[1])
        );
      }
    }

    function drawSegment(ctx, path, i, tx, ty) {
      const [p0, p1, p2, p3] = neighbors(path, i);
      ctx.beginPath();
      ctx.moveTo(tx(p1[0]), ty(p1[1]));
      ctx.bezierCurveTo(
        tx(p1[0] + (p2[0] - p0[0]) / 6), ty(p1[1] + (p2[1] - p0[1]) / 6),
        tx(p2[0] - (p3[0] - p1[0]) / 6), ty(p2[1] - (p3[1] - p1[1]) / 6),
        tx(p2[0]), ty(p2[1])
      );
    }

    function posAt(path, t, tx, ty) {
      const n = path.length - 1;
      const f = clamp(t, 0, 1) * n;
      const i = Math.min(Math.floor(f), n - 1);
      const s = f - i, s2 = s * s, s3 = s2 * s;
      const [p0, p1, p2, p3] = neighbors(path, i);
      return {
        x: tx(0.5 * (2*p1[0] + (-p0[0]+p2[0])*s + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*s2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*s3)),
        y: ty(0.5 * (2*p1[1] + (-p0[1]+p2[1])*s + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*s2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*s3)),
      };
    }

    /* ─── App ─── */
    const app = createApp({
      asciiConfig: { background: '#06060a' },
      layers: [
        { fontSize: 12, charset: 'density', colorScheme: 'rainbow', blendMode: 'replace' },
        { fontSize: 5, charset: 'braille', colorScheme: 'neon', blendMode: 'add', opacity: 0.3 },
      ],

      draw(ctx, { time, dt, width: w, height: h }) {
        ctx.fillStyle = '#06060a';
        ctx.fillRect(0, 0, w, h);

        const sec = time / 1000;
        const s = Math.min(w, h);
        const lw = Math.max(4, s * 0.006);

        /* ── Camera (slow Lissajous drift) ── */
        const ampX = MAP_W / 2 - VIEW_W / 2 - 1;
        const ampY = MAP_H / 2 - VIEW_H / 2 - 1;
        const camX = MAP_W / 2 + ampX * Math.sin(sec * 0.07);
        const camY = MAP_H / 2 + ampY * Math.sin(sec * 0.05 + 1.2);

        const cellW = w / VIEW_W;
        const cellH = h / VIEW_H;
        const tx = (c) => (c - camX + VIEW_W / 2) * cellW;
        const ty = (r) => (r - camY + VIEW_H / 2) * cellH;

        /* ── Background grid ── */
        ctx.strokeStyle = 'rgba(255,255,255,0.015)';
        ctx.lineWidth = 1;
        const c0 = Math.floor(camX - VIEW_W / 2) - 1;
        const c1 = Math.ceil(camX + VIEW_W / 2) + 1;
        const r0 = Math.floor(camY - VIEW_H / 2) - 1;
        const r1 = Math.ceil(camY + VIEW_H / 2) + 1;
        for (let c = c0; c <= c1; c += 2) {
          const x = tx(c);
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let r = r0; r <= r1; r += 2) {
          const y = ty(r);
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        /* ── District labels ── */
        ctx.font = `bold ${Math.max(16, s * 0.03)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255,255,255,0.025)';
        for (const d of DISTRICTS) {
          const dx = tx(d.x), dy = ty(d.y);
          if (dx > -100 && dx < w + 100 && dy > -40 && dy < h + 40) {
            ctx.fillText(d.text, dx, dy);
          }
        }

        /* ── Route glow (animated pulse per segment) ── */
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const line of LINES) {
          for (let i = 0; i < line.path.length - 1; i++) {
            const pulse = 0.04 + 0.025 * Math.sin(sec * 1.5 - i * 0.7);
            ctx.strokeStyle = rgba(line.color, pulse);
            ctx.lineWidth = lw * 3;
            drawSegment(ctx, line.path, i, tx, ty);
            ctx.stroke();
          }
        }

        /* ── Route lines (curved) ── */
        for (const line of LINES) {
          // Shadow
          ctx.strokeStyle = 'rgba(0,0,0,0.5)';
          ctx.lineWidth = lw + 4;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          drawCurve(ctx, line.path, tx, ty);
          ctx.stroke();

          // Line
          ctx.strokeStyle = line.color;
          ctx.lineWidth = lw;
          drawCurve(ctx, line.path, tx, ty);
          ctx.stroke();
        }

        /* ── Stations ── */
        for (const [, st] of stationMap) {
          const sx = tx(st.gx), sy = ty(st.gy);
          if (sx < -20 || sx > w + 20 || sy < -20 || sy > h + 20) continue;
          const transfer = st.n > 1;
          const r = transfer ? Math.max(6, s * 0.007) : Math.max(3, s * 0.004);
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.fill();
          if (transfer) {
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }

        /* ── Transfer pulses ── */
        for (const [, st] of stationMap) {
          if (st.n < 2) continue;
          const sx = tx(st.gx), sy = ty(st.gy);
          if (sx < -30 || sx > w + 30 || sy < -30 || sy > h + 30) continue;
          const pulse = 0.12 + 0.08 * Math.sin(sec * 2.5 + st.gx * 1.7);
          const pr = Math.max(16, s * 0.018);
          const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, pr);
          g.addColorStop(0, `rgba(255,255,255,${pulse})`);
          g.addColorStop(1, 'transparent');
          ctx.fillStyle = g;
          ctx.fillRect(sx - pr, sy - pr, pr * 2, pr * 2);
        }

        /* ── Station labels ── */
        const fs = Math.max(9, s * 0.012);
        ctx.font = `${fs}px monospace`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        for (const [key, name] of Object.entries(LABELS)) {
          const st = stationMap.get(key);
          if (!st) continue;
          const sx = tx(st.gx), sy = ty(st.gy);
          if (sx < -60 || sx > w + 60 || sy < -20 || sy > h + 20) continue;
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.fillText(name, sx + Math.max(8, s * 0.009), sy);
        }

        /* ── Trains ── */
        for (const train of trains) {
          // Update
          if (train.wait > 0) {
            train.wait -= dt;
          } else {
            const prev = train.t;
            train.t += train.speed * train.dir * dt;

            // Station dwell on crossing
            const n = train.line.path.length - 1;
            for (let i = 1; i < n; i++) {
              const st = i / n;
              if ((prev < st && train.t >= st) || (prev > st && train.t <= st)) {
                train.t = st;
                train.wait = 0.15 + Math.random() * 0.35;
                break;
              }
            }

            // Bounce at termini
            if (train.t >= 1) { train.t = 1; train.dir = -1; train.wait = 0.8 + Math.random(); }
            if (train.t <= 0) { train.t = 0; train.dir = 1; train.wait = 0.8 + Math.random(); }
          }

          const pos = posAt(train.line.path, train.t, tx, ty);
          if (pos.x < -50 || pos.x > w + 50 || pos.y < -50 || pos.y > h + 50) continue;

          // Outer glow
          const gr = Math.max(30, s * 0.04);
          const g1 = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, gr);
          g1.addColorStop(0, rgba(train.line.color, 0.7));
          g1.addColorStop(0.35, rgba(train.line.color, 0.2));
          g1.addColorStop(1, 'transparent');
          ctx.fillStyle = g1;
          ctx.fillRect(pos.x - gr, pos.y - gr, gr * 2, gr * 2);

          // Bright core
          const cr = Math.max(12, s * 0.016);
          const g2 = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, cr);
          g2.addColorStop(0, '#ffffff');
          g2.addColorStop(0.4, rgba(train.line.color, 0.9));
          g2.addColorStop(1, 'transparent');
          ctx.fillStyle = g2;
          ctx.fillRect(pos.x - cr, pos.y - cr, cr * 2, cr * 2);

          // Train dot
          const dr = Math.max(5, s * 0.007);
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, dr, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.fill();
        }
      },
    });
  </script>
</body>
</html>
