<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Control Panel Example</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { AsciiIfy } from '../src/index.js';

      // ─── Source Canvas ────────────────────────────────────
      const source = document.getElementById('source');
      const sCtx = source.getContext('2d');

      function resizeSource() {
        source.width = window.innerWidth;
        source.height = window.innerHeight;
      }
      resizeSource();
      window.addEventListener('resize', resizeSource);

      function drawSource(time) {
        const w = source.width, h = source.height;
        const t = time * 0.001;

        // Animated noise-like pattern
        const grad = sCtx.createRadialGradient(
          w / 2 + Math.sin(t) * 200, h / 2 + Math.cos(t * 0.7) * 150, 50,
          w / 2, h / 2, Math.max(w, h) * 0.7
        );
        grad.addColorStop(0, `hsl(${(t * 25) % 360} 90% 55%)`);
        grad.addColorStop(0.4, `hsl(${(t * 25 + 90) % 360} 80% 35%)`);
        grad.addColorStop(1, '#0a0a15');
        sCtx.fillStyle = grad;
        sCtx.fillRect(0, 0, w, h);

        // Orbiting circles
        for (let i = 0; i < 6; i++) {
          const angle = t * (0.5 + i * 0.1) + i * Math.PI / 3;
          const r = 120 + i * 30;
          const x = w / 2 + Math.cos(angle) * r;
          const y = h / 2 + Math.sin(angle) * r;
          const size = 25 + Math.sin(t * 2 + i) * 15;

          sCtx.beginPath();
          sCtx.arc(x, y, size, 0, Math.PI * 2);
          sCtx.fillStyle = `hsla(${(i * 60 + t * 30) % 360} 85% 60% / 0.8)`;
          sCtx.fill();
        }
      }

      // ─── ASCII-ify with Control Panel ─────────────────────
      const ascii = new AsciiIfy(source, {
        fontSize: 14,
        charset: 'density',
        colorScheme: 'vapor',
        sourceOpacity: 0,
        pattern: 'plasma',
        patternMix: 0.3,
        colorCycle: true,
        colorCycleRate: 0.5,
      });

      // Show the control panel
      ascii.showPanel();

      function loop(time) {
        drawSource(time);
        ascii.render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
