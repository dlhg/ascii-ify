<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Text Reveal</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { ParticlePool } from './particles.js';
      import { lerp, clamp } from './utils.js';

      // ─── Words to cycle through ──────────────────────────
      const WORDS = [
        'ASCII',
        'DREAM',
        'PIXEL',
        'GLYPH',
        'VOXEL',
        'LIGHT',
        'PULSE',
        'BLOOM',
        'DEPTH',
        'WAVES',
      ];
      let wordIndex = 0;
      let charReveal = 0; // how many chars revealed (float for smooth)
      let holdTimer = 0;
      let phase = 'typing';  // typing | hold | erasing | pause
      const TYPING_SPEED = 5;  // chars per second
      const ERASE_SPEED = 8;
      const HOLD_TIME = 3;
      const PAUSE_TIME = 0.5;

      // ─── Nebula Particle System ───────────────────────────
      const pool = new ParticlePool({ maxParticles: 3000, gravity: 0, drag: 0.99 });

      let emitAccum = 0;
      const EMIT_RATE = 200; // particles per second

      function emitNebula(dt, w, h) {
        emitAccum += EMIT_RATE * dt;
        const count = Math.floor(emitAccum);
        emitAccum -= count;

        pool.emit(count, () => {
          // Emit from random positions with slow drift
          const angle = Math.random() * Math.PI * 2;
          const speed = 10 + Math.random() * 30;
          return {
            x: Math.random() * w,
            y: Math.random() * h,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 3 + Math.random() * 4,
            maxLife: 0,
            size: 2 + Math.random() * 6,
            hue: Math.random() * 360,
            sat: 60 + Math.random() * 30,
          };
        });

        // Set maxLife after emit
        pool.forEach(p => { if (!p.maxLife) p.maxLife = p.life; });
      }

      function drawNebula(ctx, t, w, h) {
        // Deep space
        ctx.fillStyle = '#04020c';
        ctx.fillRect(0, 0, w, h);

        // Slow color-shifting background nebula clouds
        for (let i = 0; i < 4; i++) {
          const cx = w * (0.2 + 0.6 * Math.sin(t * 0.1 + i * 1.5));
          const cy = h * (0.3 + 0.4 * Math.cos(t * 0.08 + i * 2.1));
          const cloudR = Math.min(w, h) * (0.2 + 0.1 * Math.sin(t * 0.15 + i));
          const hue = (t * 10 + i * 90) % 360;

          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cloudR);
          grad.addColorStop(0, `hsla(${hue}, 80%, 40%, 0.12)`);
          grad.addColorStop(0.4, `hsla(${hue + 30}, 70%, 30%, 0.06)`);
          grad.addColorStop(1, `hsla(${hue + 60}, 60%, 20%, 0)`);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        // Draw particles
        pool.forEach(p => {
          const lifeRatio = p.life / p.maxLife;
          const alpha = lifeRatio < 0.3 ? lifeRatio / 0.3 : lifeRatio > 0.8 ? (1 - lifeRatio) / 0.2 : 1;
          const r = p.size * (0.5 + 0.5 * alpha);

          // Particle glow
          const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
          glow.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, 65%, ${alpha * 0.3})`);
          glow.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, 40%, 0)`);
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2);
          ctx.fill();

          // Particle core
          ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, 75%, ${alpha * 0.7})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
        });

        // Twinkling stars
        for (let i = 0; i < 80; i++) {
          const sx = (i * 137.5 + 23) % w;
          const sy = (i * 97.3 + 41) % h;
          const twinkle = 0.3 + 0.7 * Math.pow(Math.sin(t * (1 + i * 0.05) + i * 2.3) * 0.5 + 0.5, 3);
          ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * 0.5})`;
          ctx.beginPath();
          ctx.arc(sx, sy, 0.5 + twinkle, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ─── Draw text onto mask canvas ───────────────────────
      function drawTextMask(ctx, t, w, h) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        const word = WORDS[wordIndex];
        const revealed = Math.floor(charReveal);
        if (revealed <= 0) return;

        const text = word.substring(0, revealed);

        // Calculate font size to fill ~70% of width
        const targetWidth = w * 0.7;
        const fontSize = Math.min(targetWidth / (word.length * 0.6), h * 0.35);

        ctx.font = `900 ${fontSize}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Main text — bright white for mask
        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, w / 2, h / 2);

        // Partially revealed next character (fading in)
        if (revealed < word.length && phase === 'typing') {
          const frac = charReveal - revealed;
          const nextChar = word[revealed];
          // Measure position for the partial character
          const fullText = word.substring(0, revealed + 1);
          const fullWidth = ctx.measureText(fullText).width;
          const partialWidth = ctx.measureText(text).width;
          const charX = w / 2 - ctx.measureText(word.substring(0, revealed + 1)).width / 2
                       + (partialWidth + fullWidth) / 2 - ctx.measureText(text).width / 2;

          ctx.globalAlpha = frac;
          ctx.fillText(fullText, w / 2, h / 2);
          ctx.globalAlpha = 1;
        }

        // Subtle glow around text
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 20;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillText(text, w / 2, h / 2);
        ctx.shadowBlur = 0;

        // Cursor blink
        if (phase === 'typing' || phase === 'hold') {
          const blink = Math.sin(t * 5) > 0;
          if (blink) {
            const metrics = ctx.measureText(text);
            const cursorX = w / 2 + metrics.width / 2 + 5;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cursorX, h / 2 - fontSize * 0.35, fontSize * 0.06, fontSize * 0.7);
          }
        }
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: { background: '#04020c', sourceOpacity: 0 },
        layers: [
          // Layer 1: Nebula scene — masked by text shape (Layer 3)
          {
            fontSize: 6,
            charset: 'density',
            colorScheme: 'rainbow',
            blendMode: 'replace',
            opacity: 1,
          },
          // Layer 2: Subtle background texture — always visible
          {
            fontSize: 20,
            charset: 'braille',
            colorScheme: 'vapor',
            pattern: 'plasma',
            patternMix: 0.9,
            blendMode: 'replace',
            opacity: 0.08,
          },
          // Layer 3: Text mask — invisible, used as mask source
          {
            fontSize: 4,
            charset: 'blocks',
            colorScheme: 'mono',
            blendMode: 'replace',
            opacity: 0,
          },
        ],
        draw(ctx, { time, dt, width: w, height: h }) {
          const t = time / 1000;
          const word = WORDS[wordIndex];

          // State machine for text animation
          switch (phase) {
            case 'typing':
              charReveal += TYPING_SPEED * dt;
              if (charReveal >= word.length) {
                charReveal = word.length;
                phase = 'hold';
                holdTimer = HOLD_TIME;
              }
              break;
            case 'hold':
              holdTimer -= dt;
              if (holdTimer <= 0) phase = 'erasing';
              break;
            case 'erasing':
              charReveal -= ERASE_SPEED * dt;
              if (charReveal <= 0) {
                charReveal = 0;
                phase = 'pause';
                holdTimer = PAUSE_TIME;
              }
              break;
            case 'pause':
              holdTimer -= dt;
              if (holdTimer <= 0) {
                wordIndex = (wordIndex + 1) % WORDS.length;
                phase = 'typing';
              }
              break;
          }

          // Update particles
          emitNebula(dt, w, h);
          pool.update(dt);

          // Draw nebula scene
          drawNebula(ctx, t, w, h);

          // Instructions
          ctx.save();
          ctx.font = '12px monospace';
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.fillText(
            'P panel \u00b7 E toggle',
            w / 2, h - 16
          );
          ctx.restore();
        },
      });

      // ─── Mask Canvas Setup ────────────────────────────────
      const nebulaCanvas = document.createElement('canvas');
      const nebulaCtx = nebulaCanvas.getContext('2d');
      const maskCanvas = document.createElement('canvas');
      const maskCtx = maskCanvas.getContext('2d');

      function resizeCanvases() {
        nebulaCanvas.width = maskCanvas.width = app.canvas.width;
        nebulaCanvas.height = maskCanvas.height = app.canvas.height;
      }
      resizeCanvases();
      window.addEventListener('resize', resizeCanvases);

      // layers[0] is the auto-created default; our configs are at [1], [2], [3]
      const layers = app.ascii.layers;
      layers[0].set('visible', false);      // hide default — it would show the full scene unmasked
      layers[3].set('source', maskCanvas);  // text mask layer

      // Nebula scene (Layer 1) is masked by text shapes (Layer 3)
      layers[1].set('maskLayer', layers[3].id);

      // Render text mask each frame
      app.ascii.on('render', () => {
        const t = performance.now() / 1000;
        drawTextMask(maskCtx, t, maskCanvas.width, maskCanvas.height);
      });
    </script>
  </body>
</html>
