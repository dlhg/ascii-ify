<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Dimensions</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, dist, smoothstep } from './utils.js';

      // ─── Dimension Charge Points ────────────────────────
      // Each dimension has 3 charge points that drift in lissajous paths
      const NUM_CHARGES = 3;
      const dimensions = [
        { charges: [], color: '#ff6030' }, // Fire
        { charges: [], color: '#3080ff' }, // Ocean
        { charges: [], color: '#c050ff' }, // Vapor
      ];

      function initCharges() {
        for (let d = 0; d < 3; d++) {
          dimensions[d].charges = [];
          for (let i = 0; i < NUM_CHARGES; i++) {
            dimensions[d].charges.push({
              freqX: 0.1 + d * 0.07 + i * 0.03,
              freqY: 0.08 + d * 0.05 + i * 0.04,
              phaseX: d * 2.1 + i * 1.3,
              phaseY: d * 1.7 + i * 2.5,
              ampX: 0.25 + i * 0.05,
              ampY: 0.25 + i * 0.05,
              offsetX: 0.2 + d * 0.25,
              offsetY: 0.25 + ((d + i) % 3) * 0.2,
            });
          }
        }
      }
      initCharges();

      function getChargePos(charge, t, w, h) {
        return {
          x: (charge.offsetX + Math.sin(t * charge.freqX + charge.phaseX) * charge.ampX) * w,
          y: (charge.offsetY + Math.sin(t * charge.freqY + charge.phaseY) * charge.ampY) * h,
        };
      }

      // ─── Compute Field Strength ─────────────────────────
      function fieldStrength(px, py, charges, t, w, h) {
        let sum = 0;
        for (const c of charges) {
          const pos = getChargePos(c, t, w, h);
          const dx = px - pos.x;
          const dy = py - pos.y;
          const d = Math.sqrt(dx * dx + dy * dy) + 1;
          sum += 10000 / (d * d);
        }
        return sum;
      }

      // ─── Draw Generative Content ────────────────────────
      function drawContent(ctx, t, w, h) {
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, w, h);

        // Overlapping plasma
        for (let i = 0; i < 10; i++) {
          const angle = t * (0.1 + i * 0.04) + i * 0.628;
          const d = Math.min(w, h) * (0.1 + 0.12 * Math.sin(t * 0.3 + i));
          const gx = w / 2 + Math.cos(angle) * d;
          const gy = h / 2 + Math.sin(angle) * d;
          const r = Math.min(w, h) * 0.18;

          const hue = (i * 36 + t * 25) % 360;
          const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
          grad.addColorStop(0, `hsla(${hue}, 85%, 50%, 0.35)`);
          grad.addColorStop(0.5, `hsla(${hue + 30}, 75%, 35%, 0.15)`);
          grad.addColorStop(1, `hsla(${hue + 60}, 65%, 25%, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(gx, gy, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Spiral vortex lines
        ctx.lineWidth = 1;
        for (let i = 0; i < 12; i++) {
          const hue = (i * 30 + t * 40) % 360;
          ctx.strokeStyle = `hsla(${hue}, 70%, 50%, 0.15)`;
          ctx.beginPath();
          for (let j = 0; j < 40; j++) {
            const tt = j / 40;
            const angle = tt * Math.PI * 4 + t * 0.5 + i * 0.524;
            const r = tt * Math.min(w, h) * 0.4;
            const px = w / 2 + Math.cos(angle) * r;
            const py = h / 2 + Math.sin(angle) * r;
            if (j === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        // Bright points
        for (let i = 0; i < 30; i++) {
          const angle = i * 2.399 + t * 0.3;
          const r = ((i * 0.618 + t * 0.04) % 1) * Math.min(w, h) * 0.45;
          const px = w / 2 + Math.cos(angle) * r;
          const py = h / 2 + Math.sin(angle) * r;
          const alpha = 0.3 + 0.3 * Math.sin(t * 4 + i * 2.3);
          const hue = (i * 30 + t * 50) % 360;
          ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
          ctx.beginPath();
          ctx.arc(px, py, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ─── Draw Boundary Glow ─────────────────────────────
      function drawBoundaryGlow(ctx, t, w, h) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0)';
        ctx.clearRect(0, 0, w, h);

        // Sample at lower resolution for performance
        const step = 8;
        for (let y = 0; y < h; y += step) {
          for (let x = 0; x < w; x += step) {
            const fields = dimensions.map(d => fieldStrength(x, y, d.charges, t, w, h));
            const sorted = [...fields].sort((a, b) => b - a);
            const ratio = sorted[1] / (sorted[0] + 0.001);

            // Near boundary when top two fields are close
            if (ratio > 0.6) {
              const intensity = smoothstep(0.6, 0.95, ratio);
              const pulse = 0.5 + 0.5 * Math.sin(t * 4 + x * 0.02 + y * 0.02);
              const alpha = intensity * pulse * 0.6;

              if (alpha > 0.02) {
                const hue = (t * 60 + x * 0.3 + y * 0.2) % 360;
                ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
                ctx.fillRect(x - step / 2, y - step / 2, step, step);
              }
            }
          }
        }
      }

      // ─── Compute Voronoi Masks ──────────────────────────
      // At 1/4 resolution for performance
      const MASK_SCALE = 4;
      let maskW = 0, maskH = 0;
      const maskImageDatas = [null, null, null];

      function computeVoronoiMasks(t, w, h) {
        const mw = Math.ceil(w / MASK_SCALE);
        const mh = Math.ceil(h / MASK_SCALE);

        if (mw !== maskW || mh !== maskH) {
          maskW = mw;
          maskH = mh;
          for (let d = 0; d < 3; d++) {
            maskImageDatas[d] = new ImageData(mw, mh);
          }
        }

        // Clear all mask data
        for (let d = 0; d < 3; d++) {
          maskImageDatas[d].data.fill(0);
        }

        // Compute per-pixel
        for (let my = 0; my < mh; my++) {
          const py = my * MASK_SCALE;
          for (let mx = 0; mx < mw; mx++) {
            const px = mx * MASK_SCALE;
            const idx = (my * mw + mx) * 4;

            // Compute field strength for each dimension
            let maxField = 0;
            let maxDim = 0;
            let secondField = 0;

            for (let d = 0; d < 3; d++) {
              const f = fieldStrength(px, py, dimensions[d].charges, t, w, h);
              if (f > maxField) {
                secondField = maxField;
                maxField = f;
                maxDim = d;
              } else if (f > secondField) {
                secondField = f;
              }
            }

            // Smooth transition at boundaries
            const sharpness = maxField / (secondField + 0.001);
            const alpha = Math.min(smoothstep(1, 2.5, sharpness) * 255, 255);

            maskImageDatas[maxDim].data[idx] = 255;
            maskImageDatas[maxDim].data[idx + 1] = 255;
            maskImageDatas[maxDim].data[idx + 2] = 255;
            maskImageDatas[maxDim].data[idx + 3] = alpha;
          }
        }
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: { background: '#030308', sourceOpacity: 0 },
        layers: [
          // Layer 1: Dimension A — Fire
          { fontSize: 8, charset: 'blocks', colorScheme: 'fire', pattern: 'spiral', patternMix: 0.3, opacity: 1 },
          // Layer 2: Dimension B — Ocean
          { fontSize: 5, charset: 'braille', colorScheme: 'ocean', pattern: 'plasma', patternMix: 0.4, opacity: 1 },
          // Layer 3: Dimension C — Vapor
          { fontSize: 7, charset: 'density', colorScheme: 'vapor', pattern: 'kaleidoscope', patternMix: 0.3, opacity: 1 },
          // Layer 4: Boundary glow
          { fontSize: 6, charset: 'density', colorScheme: 'neon', blendMode: 'add', opacity: 0.5 },
          // Layers 5-7: Mask layers (invisible)
          { fontSize: 4, charset: 'blocks', colorScheme: 'mono', opacity: 0 },
          { fontSize: 4, charset: 'blocks', colorScheme: 'mono', opacity: 0 },
          { fontSize: 4, charset: 'blocks', colorScheme: 'mono', opacity: 0 },
        ],
        draw(ctx, { time, dt, width: w, height: h }) {
          drawContent(ctx, time / 1000, w, h);
        },
      });

      // ─── Mask & Glow Canvases ───────────────────────────
      const maskCanvases = Array.from({ length: 3 }, () => {
        const c = document.createElement('canvas');
        return { canvas: c, ctx: c.getContext('2d') };
      });
      const glowCanvas = document.createElement('canvas');
      const glowCtx = glowCanvas.getContext('2d');

      // Temp canvases for upscaling
      const tempCanvases = Array.from({ length: 3 }, () => {
        const c = document.createElement('canvas');
        return { canvas: c, ctx: c.getContext('2d') };
      });

      function resizeMasks() {
        const w = app.canvas.width;
        const h = app.canvas.height;
        for (let i = 0; i < 3; i++) {
          maskCanvases[i].canvas.width = w;
          maskCanvases[i].canvas.height = h;
          tempCanvases[i].canvas.width = Math.ceil(w / MASK_SCALE);
          tempCanvases[i].canvas.height = Math.ceil(h / MASK_SCALE);
        }
        glowCanvas.width = w;
        glowCanvas.height = h;
      }
      resizeMasks();
      window.addEventListener('resize', resizeMasks);

      const layers = app.ascii.layers;
      layers[0].set('visible', false);

      // Wire masks
      for (let i = 0; i < 3; i++) {
        layers[5 + i].set('source', maskCanvases[i].canvas);
        layers[1 + i].set('maskLayer', layers[5 + i].id);
      }

      // Glow layer source
      layers[4].set('source', glowCanvas);

      app.ascii.on('render', () => {
        const t = performance.now() / 1000;
        const w = app.canvas.width;
        const h = app.canvas.height;

        // Compute Voronoi at low resolution
        computeVoronoiMasks(t, w, h);

        // Upscale masks to full resolution
        for (let i = 0; i < 3; i++) {
          if (maskImageDatas[i]) {
            tempCanvases[i].ctx.putImageData(maskImageDatas[i], 0, 0);
            maskCanvases[i].ctx.clearRect(0, 0, w, h);
            maskCanvases[i].ctx.imageSmoothingEnabled = true;
            maskCanvases[i].ctx.drawImage(tempCanvases[i].canvas, 0, 0, w, h);
          }
        }

        // Draw boundary glow
        drawBoundaryGlow(glowCtx, t, w, h);
      });
    </script>
  </body>
</html>
