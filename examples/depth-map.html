<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify - 3D Depth Map</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #050507; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';

      const nodes = [];
      for (let i = 0; i < 9; i++) {
        nodes.push({
          x: 0.15 + Math.random() * 0.7,
          y: 0.18 + Math.random() * 0.64,
          r: 0.08 + Math.random() * 0.16,
          phase: Math.random() * Math.PI * 2,
          rate: 0.3 + Math.random() * 0.45,
        });
      }

      function draw(ctx, { time, width: w, height: h }) {
        const t = time * 0.001;

        ctx.fillStyle = '#030306';
        ctx.fillRect(0, 0, w, h);

        const band = ctx.createLinearGradient(0, 0, w, h);
        band.addColorStop(0, '#071126');
        band.addColorStop(0.45, '#143244');
        band.addColorStop(1, '#37122d');
        ctx.fillStyle = band;
        ctx.fillRect(0, 0, w, h);

        ctx.globalCompositeOperation = 'screen';
        for (const n of nodes) {
          const x = (n.x + Math.sin(t * n.rate + n.phase) * 0.08) * w;
          const y = (n.y + Math.cos(t * n.rate * 1.2 + n.phase) * 0.08) * h;
          const r = n.r * Math.min(w, h);
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, 'rgba(255,255,255,0.95)');
          g.addColorStop(0.24, 'rgba(115,235,214,0.72)');
          g.addColorStop(0.58, 'rgba(238,80,160,0.24)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';

        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        for (let y = -h; y < h * 2; y += 42) {
          ctx.beginPath();
          ctx.moveTo(0, y + Math.sin(t + y * 0.01) * 16);
          for (let x = 0; x <= w; x += 32) {
            ctx.lineTo(x, y + x * 0.18 + Math.sin(t * 1.4 + x * 0.014 + y * 0.02) * 16);
          }
          ctx.stroke();
        }
      }

      const app = createApp({
        asciiConfig: {
          fontSize: 12,
          density: 1.2,
          charset: 'density',
          colorScheme: 'neon',
          background: '#050507',
          sourceOpacity: 0,
          renderMode: '3d',
          depthScale: 220,
          perspective: 520,
          rotationX: -0.62,
          rotationY: 0.42,
          rotationZ: -0.06,
          cameraZ: 620,
          depthOpacity: 0.18,
          fade: 0.18,
          colorCycle: true,
          colorCycleRate: 0.25,
          crtEnabled: true,
          crtScanlines: 0.18,
          crtGlow: 0.22,
        },
        draw,
      });

      document.addEventListener('mousemove', (e) => {
        const nx = e.clientX / window.innerWidth - 0.5;
        const ny = e.clientY / window.innerHeight - 0.5;
        app.ascii.set({
          rotationY: 0.42 + nx * 0.45,
          rotationX: -0.62 - ny * 0.35,
        });
      });
    </script>
  </body>
</html>
