<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Maze Runner</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { AsciiIfy } from '../src/index.js';

      // ─── Source Canvas ────────────────────────────────────
      const source = document.getElementById('source');
      const ctx = source.getContext('2d');

      function resizeSource() {
        source.width = window.innerWidth;
        source.height = window.innerHeight;
        if (maze.length) generateMaze();
      }
      source.width = window.innerWidth;
      source.height = window.innerHeight;
      window.addEventListener('resize', resizeSource);

      // ─── Maze State ─────────────────────────────────────
      let cols = 25;
      let rows = 25;
      let cellW, cellH;
      let maze = [];
      let visited = [];
      let playerCol = 0, playerRow = 0;
      let playerX = 0, playerY = 0;       // lerp display position (pixels)
      let targetX = 0, targetY = 0;       // target pixel position
      let moveCount = 0;
      let timerStart = 0;
      let timerRunning = false;
      let elapsed = 0;
      let completed = false;
      const VISIBILITY_FULL = 3;
      const VISIBILITY_DIM = 6;

      // ─── Maze Generation (Recursive Backtracker) ────────
      function generateMaze() {
        const w = source.width;
        const h = source.height;
        cols = Math.max(10, Math.min(30, Math.floor(w / 32)));
        rows = Math.max(10, Math.min(30, Math.floor(h / 32)));
        cellW = w / cols;
        cellH = h / rows;

        // Initialize cells with all walls
        maze = [];
        visited = [];
        for (let r = 0; r < rows; r++) {
          maze[r] = [];
          visited[r] = [];
          for (let c = 0; c < cols; c++) {
            maze[r][c] = { top: true, right: true, bottom: true, left: true };
            visited[r][c] = false;
          }
        }

        // Recursive backtracker (iterative with stack)
        const stack = [];
        const carveVisited = Array.from({ length: rows }, () => Array(cols).fill(false));
        carveVisited[0][0] = true;
        stack.push([0, 0]);

        while (stack.length > 0) {
          const [cr, cc] = stack[stack.length - 1];
          const neighbors = [];

          // Top
          if (cr > 0 && !carveVisited[cr - 1][cc]) neighbors.push([cr - 1, cc, 'top', 'bottom']);
          // Right
          if (cc < cols - 1 && !carveVisited[cr][cc + 1]) neighbors.push([cr, cc + 1, 'right', 'left']);
          // Bottom
          if (cr < rows - 1 && !carveVisited[cr + 1][cc]) neighbors.push([cr + 1, cc, 'bottom', 'top']);
          // Left
          if (cc > 0 && !carveVisited[cr][cc - 1]) neighbors.push([cr, cc - 1, 'left', 'right']);

          if (neighbors.length === 0) {
            stack.pop();
          } else {
            const [nr, nc, wall, opposite] = neighbors[Math.random() * neighbors.length | 0];
            maze[cr][cc][wall] = false;
            maze[nr][nc][opposite] = false;
            carveVisited[nr][nc] = true;
            stack.push([nr, nc]);
          }
        }

        // Reset player
        playerCol = 0;
        playerRow = 0;
        playerX = cellW * 0.5;
        playerY = cellH * 0.5;
        targetX = playerX;
        targetY = playerY;
        moveCount = 0;
        timerStart = 0;
        timerRunning = false;
        elapsed = 0;
        completed = false;
        visited = Array.from({ length: rows }, () => Array(cols).fill(false));
        visited[0][0] = true;
      }

      generateMaze();

      // ─── Player Movement ────────────────────────────────
      function movePlayer(dr, dc) {
        if (completed) return;

        const cell = maze[playerRow][playerCol];
        if (dr === -1 && cell.top) return;
        if (dr === 1 && cell.bottom) return;
        if (dc === -1 && cell.left) return;
        if (dc === 1 && cell.right) return;

        const nr = playerRow + dr;
        const nc = playerCol + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return;

        playerRow = nr;
        playerCol = nc;
        targetX = nc * cellW + cellW * 0.5;
        targetY = nr * cellH + cellH * 0.5;
        visited[nr][nc] = true;
        moveCount++;

        if (!timerRunning) {
          timerRunning = true;
          timerStart = performance.now();
        }

        // Check win
        if (playerRow === rows - 1 && playerCol === cols - 1) {
          completed = true;
          timerRunning = false;
        }
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') { e.preventDefault(); movePlayer(-1, 0); }
        if (e.key === 'ArrowDown') { e.preventDefault(); movePlayer(1, 0); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); movePlayer(0, -1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); movePlayer(0, 1); }
        if (e.key === 'r' || e.key === 'R') generateMaze();
        if (e.key === 'p' || e.key === 'P') ascii.togglePanel();
        if (e.key === 'e' || e.key === 'E') ascii.set('enabled', !ascii.get('enabled'));
      });

      // ─── Fog of War Calculation ─────────────────────────
      function getCellVisibility(r, c) {
        const dist = Math.abs(r - playerRow) + Math.abs(c - playerCol);
        if (dist <= VISIBILITY_FULL) return 1.0;
        if (dist <= VISIBILITY_DIM) {
          return 0.4 + 0.6 * (1 - (dist - VISIBILITY_FULL) / (VISIBILITY_DIM - VISIBILITY_FULL));
        }
        if (visited[r] && visited[r][c]) return 0.08;
        return 0;
      }

      // ─── Drawing ────────────────────────────────────────
      function draw(time) {
        const w = source.width;
        const h = source.height;

        // Update timer
        if (timerRunning) {
          elapsed = (performance.now() - timerStart) / 1000;
        }

        // Smooth player movement (lerp)
        const lerpSpeed = 0.18;
        playerX += (targetX - playerX) * lerpSpeed;
        playerY += (targetY - playerY) * lerpSpeed;

        // Clear
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        const t = time * 0.001;

        // Draw maze cells with fog
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const vis = getCellVisibility(r, c);
            if (vis <= 0) continue;

            const x = c * cellW;
            const y = r * cellH;
            const cell = maze[r][c];

            // Floor
            let floorColor;
            if (r === 0 && c === 0) {
              floorColor = `rgba(20, 80, 30, ${vis})`;
            } else if (r === rows - 1 && c === cols - 1) {
              const pulse = 0.5 + 0.5 * Math.sin(t * 3);
              const glow = Math.floor(30 + pulse * 40);
              floorColor = `rgba(${glow + 20}, ${glow}, 5, ${vis})`;
            } else {
              floorColor = `rgba(10, 10, 18, ${vis})`;
            }
            ctx.fillStyle = floorColor;
            ctx.fillRect(x, y, cellW, cellH);

            // Walls
            ctx.strokeStyle = `rgba(102, 102, 102, ${vis})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (cell.top) { ctx.moveTo(x, y); ctx.lineTo(x + cellW, y); }
            if (cell.right) { ctx.moveTo(x + cellW, y); ctx.lineTo(x + cellW, y + cellH); }
            if (cell.bottom) { ctx.moveTo(x, y + cellH); ctx.lineTo(x + cellW, y + cellH); }
            if (cell.left) { ctx.moveTo(x, y); ctx.lineTo(x, y + cellH); }
            ctx.stroke();
          }
        }

        // End marker glow
        {
          const ex = (cols - 1) * cellW + cellW * 0.5;
          const ey = (rows - 1) * cellH + cellH * 0.5;
          const endVis = getCellVisibility(rows - 1, cols - 1);
          if (endVis > 0) {
            const pulse = 0.5 + 0.5 * Math.sin(t * 2.5);
            const glowR = cellW * (0.6 + pulse * 0.4);
            const grad = ctx.createRadialGradient(ex, ey, 0, ex, ey, glowR);
            grad.addColorStop(0, `rgba(255, 170, 34, ${0.5 * endVis * pulse})`);
            grad.addColorStop(0.6, `rgba(255, 120, 10, ${0.2 * endVis * pulse})`);
            grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(ex, ey, glowR, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Player glow and circle
        {
          const glowR = cellW * 0.6;
          const grad = ctx.createRadialGradient(playerX, playerY, 0, playerX, playerY, glowR);
          grad.addColorStop(0, 'rgba(68, 221, 255, 0.3)');
          grad.addColorStop(0.5, 'rgba(68, 221, 255, 0.1)');
          grad.addColorStop(1, 'rgba(68, 221, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(playerX, playerY, glowR, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#44ddff';
          ctx.beginPath();
          ctx.arc(playerX, playerY, Math.min(cellW, cellH) * 0.25, 0, Math.PI * 2);
          ctx.fill();
        }

        // ─── Minimap ──────────────────────────────────────
        {
          const scale = 3;
          const mmW = cols * scale;
          const mmH = rows * scale;
          const mmX = w - mmW - 14;
          const mmY = 14;

          // Background
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fillRect(mmX - 2, mmY - 2, mmW + 4, mmH + 4);
          ctx.strokeStyle = 'rgba(68, 221, 255, 0.3)';
          ctx.lineWidth = 1;
          ctx.strokeRect(mmX - 2, mmY - 2, mmW + 4, mmH + 4);

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!visited[r][c]) continue;
              ctx.fillStyle = 'rgba(60, 60, 80, 0.7)';
              ctx.fillRect(mmX + c * scale, mmY + r * scale, scale, scale);

              // Draw minimap walls
              ctx.strokeStyle = 'rgba(100, 100, 120, 0.5)';
              ctx.lineWidth = 0.5;
              const mx = mmX + c * scale;
              const my = mmY + r * scale;
              const cell = maze[r][c];
              ctx.beginPath();
              if (cell.top) { ctx.moveTo(mx, my); ctx.lineTo(mx + scale, my); }
              if (cell.right) { ctx.moveTo(mx + scale, my); ctx.lineTo(mx + scale, my + scale); }
              if (cell.bottom) { ctx.moveTo(mx, my + scale); ctx.lineTo(mx + scale, my + scale); }
              if (cell.left) { ctx.moveTo(mx, my); ctx.lineTo(mx, my + scale); }
              ctx.stroke();
            }
          }

          // End position
          ctx.fillStyle = '#ffaa22';
          ctx.fillRect(mmX + (cols - 1) * scale, mmY + (rows - 1) * scale, scale, scale);

          // Player position
          ctx.fillStyle = '#44ddff';
          ctx.fillRect(mmX + playerCol * scale, mmY + playerRow * scale, scale, scale);
        }

        // ─── HUD ──────────────────────────────────────────
        ctx.font = '14px monospace';
        ctx.textBaseline = 'top';

        // Timer
        const mins = Math.floor(elapsed / 60);
        const secs = Math.floor(elapsed % 60);
        const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        ctx.fillStyle = 'rgba(180, 180, 200, 0.7)';
        ctx.fillText(`TIME  ${timeStr}`, 14, 14);

        // Moves
        ctx.fillText(`MOVES ${moveCount}`, 14, 34);

        // Instructions
        ctx.font = '11px monospace';
        ctx.fillStyle = 'rgba(120, 120, 140, 0.45)';
        ctx.textAlign = 'center';
        ctx.fillText('arrow keys to move \u00b7 R for new maze \u00b7 P panel \u00b7 E toggle', w * 0.5, h - 20);
        ctx.textAlign = 'left';

        // ─── Completion Screen ────────────────────────────
        if (completed) {
          // Dim overlay
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.fillRect(0, 0, w, h);

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Title
          ctx.font = 'bold 32px monospace';
          ctx.fillStyle = '#ffaa22';
          ctx.fillText('MAZE COMPLETE!', w * 0.5, h * 0.4);

          // Stats
          ctx.font = '18px monospace';
          ctx.fillStyle = 'rgba(200, 200, 220, 0.9)';
          ctx.fillText(`Time: ${timeStr}   Moves: ${moveCount}`, w * 0.5, h * 0.4 + 48);

          // Restart prompt
          ctx.font = '14px monospace';
          ctx.fillStyle = 'rgba(68, 221, 255, 0.7)';
          ctx.fillText('Press R to generate a new maze', w * 0.5, h * 0.4 + 90);

          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
        }
      }

      // ─── ASCII-ify with Layers ──────────────────────────
      const ascii = new AsciiIfy(source, {
        background: '#08080c',
        sourceOpacity: 0,
        speed: 1,
      });

      // Layer 1: Walls and floor — blocks for solid walls
      ascii.addLayer({
        source: source,
        fontSize: 12,
        charset: 'blocks',
        colorScheme: 'mono',
        blendMode: 'replace',
        opacity: 1,
      });

      // Layer 2: Player and markers — same fontSize for pixel-aligned overlay
      ascii.addLayer({
        source: source,
        fontSize: 12,
        charset: 'density',
        colorScheme: 'acid',
        blendMode: 'add',
        opacity: 0.8,
      });

      // Layer 3: Fog atmosphere — breathing pattern for organic fog
      ascii.addLayer({
        source: source,
        fontSize: 10,
        charset: 'braille',
        colorScheme: 'ocean',
        pattern: 'breathing',
        patternMix: 0.5,
        blendMode: 'add',
        opacity: 0.25,
      });

      // ─── Animation Loop ─────────────────────────────────
      function loop(time) {
        draw(time);
        ascii.render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
