<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Pong</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { AsciiIfy } from '../src/index.js';

      const source = document.getElementById('source');
      const ctx = source.getContext('2d');

      function resize() {
        source.width = window.innerWidth;
        source.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // ─── Game State ──────────────────────────────────────
      const PADDLE_W = 18;
      const PADDLE_H_RATIO = 0.15;
      const BALL_R = 10;
      const PADDLE_SPEED = 600;
      const BALL_SPEED_INIT = 400;
      const BALL_SPEED_MAX = 900;
      const MARGIN = 40;

      let p1y = 0.5, p2y = 0.5; // paddle center (0-1)
      let score1 = 0, score2 = 0;
      let ballX, ballY, ballVX, ballVY;
      let serving = true;
      let serveTimer = 0;
      let rallyCount = 0;
      let lastTime = 0;
      let flashTimer = 0;
      let flashSide = 0; // -1 left, 1 right

      const keys = {};
      document.addEventListener('keydown', e => { keys[e.key] = true; });
      document.addEventListener('keyup', e => { keys[e.key] = false; });

      function resetBall(direction) {
        const w = source.width, h = source.height;
        ballX = w / 2;
        ballY = h / 2;
        const angle = (Math.random() - 0.5) * Math.PI * 0.5;
        const speed = BALL_SPEED_INIT;
        ballVX = Math.cos(angle) * speed * direction;
        ballVY = Math.sin(angle) * speed;
        serving = true;
        serveTimer = 0.8;
        rallyCount = 0;
      }

      resetBall(Math.random() < 0.5 ? -1 : 1);

      // ─── Draw ────────────────────────────────────────────
      function draw(time) {
        const w = source.width, h = source.height;
        const dt = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        const t = time * 0.001;

        const paddleH = h * PADDLE_H_RATIO;

        // ─── Input ───
        if (keys['w'] || keys['W']) p1y -= PADDLE_SPEED * dt / h;
        if (keys['s'] || keys['S']) p1y += PADDLE_SPEED * dt / h;
        if (keys['ArrowUp'])        p2y -= PADDLE_SPEED * dt / h;
        if (keys['ArrowDown'])      p2y += PADDLE_SPEED * dt / h;

        const halfPad = (paddleH / h) / 2;
        p1y = Math.max(halfPad, Math.min(1 - halfPad, p1y));
        p2y = Math.max(halfPad, Math.min(1 - halfPad, p2y));

        // ─── Ball Physics ───
        if (serving) {
          serveTimer -= dt;
          if (serveTimer <= 0) serving = false;
        } else {
          ballX += ballVX * dt;
          ballY += ballVY * dt;

          // Top/bottom bounce
          if (ballY - BALL_R < 0)     { ballY = BALL_R; ballVY = Math.abs(ballVY); }
          if (ballY + BALL_R > h)     { ballY = h - BALL_R; ballVY = -Math.abs(ballVY); }

          // Paddle collision - left
          const p1Top = p1y * h - paddleH / 2;
          if (ballX - BALL_R < MARGIN + PADDLE_W && ballX - BALL_R > MARGIN - 5 &&
              ballY > p1Top && ballY < p1Top + paddleH && ballVX < 0) {
            ballVX = -ballVX;
            ballX = MARGIN + PADDLE_W + BALL_R;
            const hitPos = (ballY - p1Top) / paddleH - 0.5;
            ballVY += hitPos * 300;
            rallyCount++;
            const speed = Math.min(BALL_SPEED_MAX, Math.sqrt(ballVX * ballVX + ballVY * ballVY) * 1.05);
            const angle = Math.atan2(ballVY, ballVX);
            ballVX = Math.cos(angle) * speed;
            ballVY = Math.sin(angle) * speed;
          }

          // Paddle collision - right
          const p2Top = p2y * h - paddleH / 2;
          if (ballX + BALL_R > w - MARGIN - PADDLE_W && ballX + BALL_R < w - MARGIN + 5 &&
              ballY > p2Top && ballY < p2Top + paddleH && ballVX > 0) {
            ballVX = -ballVX;
            ballX = w - MARGIN - PADDLE_W - BALL_R;
            const hitPos = (ballY - p2Top) / paddleH - 0.5;
            ballVY += hitPos * 300;
            rallyCount++;
            const speed = Math.min(BALL_SPEED_MAX, Math.sqrt(ballVX * ballVX + ballVY * ballVY) * 1.05);
            const angle = Math.atan2(ballVY, ballVX);
            ballVX = Math.cos(angle) * speed;
            ballVY = Math.sin(angle) * speed;
          }

          // Score
          if (ballX < 0) {
            score2++;
            flashTimer = 0.5; flashSide = 1;
            resetBall(-1);
          }
          if (ballX > w) {
            score1++;
            flashTimer = 0.5; flashSide = -1;
            resetBall(1);
          }
        }

        if (flashTimer > 0) flashTimer -= dt;

        // ─── Render ───
        // Background
        ctx.fillStyle = '#0a0a18';
        ctx.fillRect(0, 0, w, h);

        // Center line
        ctx.setLineDash([12, 12]);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w / 2, 0);
        ctx.lineTo(w / 2, h);
        ctx.stroke();
        ctx.setLineDash([]);

        // Score flash glow
        if (flashTimer > 0) {
          const alpha = flashTimer * 0.6;
          const gx = flashSide < 0 ? w * 0.25 : w * 0.75;
          const grad = ctx.createRadialGradient(gx, h / 2, 0, gx, h / 2, w * 0.3);
          grad.addColorStop(0, `rgba(255, 100, 255, ${alpha})`);
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        // Paddles with glow
        const glowIntensity = 0.3 + Math.sin(t * 3) * 0.1;
        function drawPaddle(x, cy) {
          const py = cy * h - paddleH / 2;
          // Glow
          ctx.shadowColor = `rgba(120, 200, 255, ${glowIntensity})`;
          ctx.shadowBlur = 20;
          ctx.fillStyle = '#c0e8ff';
          ctx.fillRect(x, py, PADDLE_W, paddleH);
          ctx.shadowBlur = 0;
        }
        drawPaddle(MARGIN, p1y);
        drawPaddle(w - MARGIN - PADDLE_W, p2y);

        // Ball with trail
        if (!serving) {
          // Trail
          for (let i = 5; i >= 1; i--) {
            const tx = ballX - ballVX * dt * i * 1.5;
            const ty = ballY - ballVY * dt * i * 1.5;
            ctx.beginPath();
            ctx.arc(tx, ty, BALL_R * (1 - i * 0.12), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 200, 100, ${0.15 - i * 0.025})`;
            ctx.fill();
          }
          // Ball
          ctx.shadowColor = 'rgba(255, 180, 50, 0.8)';
          ctx.shadowBlur = 25;
          ctx.beginPath();
          ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
          ctx.fillStyle = '#ffe080';
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          // Blinking ball during serve
          if (Math.sin(serveTimer * 20) > 0) {
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
            ctx.fillStyle = '#ffe080';
            ctx.fill();
          }
        }

        // Score text
        ctx.font = `bold ${Math.min(w * 0.08, 80)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(255, 255, 255, ${0.15 + Math.sin(t * 2) * 0.03})`;
        ctx.fillText(score1, w * 0.35, h * 0.15);
        ctx.fillText(score2, w * 0.65, h * 0.15);

        // Rally counter
        if (rallyCount > 3) {
          ctx.font = `bold ${Math.min(w * 0.03, 24)}px monospace`;
          ctx.fillStyle = `rgba(255, 180, 50, ${0.4 + Math.sin(t * 5) * 0.2})`;
          ctx.fillText(`rally ${rallyCount}`, w / 2, h * 0.06);
        }

        // Instructions (fade out)
        if (score1 + score2 === 0 && serving) {
          ctx.font = '14px monospace';
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          ctx.fillText('W/S — left paddle    ↑/↓ — right paddle    P — toggle panel', w / 2, h - 30);
        }
      }

      // ─── ASCII-ify ────────────────────────────────────────
      const ascii = new AsciiIfy(source, {
        fontSize: 18,
        charset: 'blocks',
        colorScheme: 'neon',
        sourceOpacity: 0,
        colorCycle: true,
        colorCycleRate: 0.3,
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'p' || e.key === 'P') ascii.togglePanel();
      });

      function loop(time) {
        draw(time);
        ascii.render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
