<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Aurora Borealis</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { ParticlePool } from './particles.js';
      import { lerp, clamp, smoothstep, mulberry32 } from './utils.js';

      // ─── Seeded RNG ──────────────────────────────────
      const rng = mulberry32(7);

      // ─── Stars ───────────────────────────────────────
      const NUM_STARS = 180;
      const stars = [];

      function initStars(w, h) {
        stars.length = 0;
        for (let i = 0; i < NUM_STARS; i++) {
          stars.push({
            x: rng() * w,
            y: rng() * h * 0.72, // above mountain line
            size: 0.4 + rng() * 1.8,
            brightness: 0.3 + rng() * 0.7,
            twinkleSpeed: 0.5 + rng() * 3.0,
            twinklePhase: rng() * Math.PI * 2,
          });
        }
      }

      // ─── Mountain Ridges ─────────────────────────────
      // 5 overlapping ridges with varying heights for depth
      const NUM_RIDGES = 5;
      const ridges = [];

      function generateRidge(w, h, ridgeIndex) {
        const points = [];
        const baseY = h * (0.72 + ridgeIndex * 0.045); // stagger from 72% to 90%
        const amplitude = h * (0.12 - ridgeIndex * 0.015); // front ridges are shorter
        const segments = 60;
        const segW = w / segments;

        // Use layered sine waves for natural mountain shapes
        const freq1 = 0.8 + rng() * 0.6;
        const freq2 = 2.0 + rng() * 1.5;
        const freq3 = 4.5 + rng() * 2.0;
        const phase1 = rng() * Math.PI * 2;
        const phase2 = rng() * Math.PI * 2;
        const phase3 = rng() * Math.PI * 2;

        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const nx = t * Math.PI * 2;
          const peakHeight =
            Math.sin(nx * freq1 + phase1) * 0.5 +
            Math.sin(nx * freq2 + phase2) * 0.3 +
            Math.sin(nx * freq3 + phase3) * 0.15;
          // Sharpen peaks
          const sharpened = peakHeight > 0 ? Math.pow(peakHeight, 0.7) : -Math.pow(-peakHeight, 0.7);
          points.push({
            x: i * segW,
            y: baseY - Math.max(0, sharpened) * amplitude,
          });
        }
        return { points, baseY, ridgeIndex };
      }

      function initRidges(w, h) {
        ridges.length = 0;
        // Reset RNG seed for ridges to be consistent
        const ridgeRng = mulberry32(42);
        for (let i = 0; i < NUM_RIDGES; i++) {
          ridges.push(generateRidge(w, h, i));
        }
      }

      // ─── Aurora Curtain Bands ────────────────────────
      const NUM_BANDS = 6;
      const bands = [];

      function initBands(w) {
        bands.length = 0;
        for (let i = 0; i < NUM_BANDS; i++) {
          bands.push({
            baseX: w * (0.1 + (i / (NUM_BANDS - 1)) * 0.8), // spread across screen
            width: 40 + rng() * 80,
            // Sine wave parameters for undulation
            freq1: 0.3 + rng() * 0.4,
            freq2: 0.8 + rng() * 0.6,
            amp1: 30 + rng() * 50,
            amp2: 10 + rng() * 25,
            phase1: rng() * Math.PI * 2,
            phase2: rng() * Math.PI * 2,
            driftSpeed: 0.02 + rng() * 0.04, // horizontal drift speed
            driftAmp: 20 + rng() * 60,
            intensityPhase: rng() * Math.PI * 2,
            intensitySpeed: 0.15 + rng() * 0.3,
            // Color bias: 0 = green, 0.5 = teal, 1 = purple
            colorBias: i / (NUM_BANDS - 1),
            // Vertical streak parameters
            streakCount: 8 + Math.floor(rng() * 12),
          });
        }
      }

      // ─── Snow Particles ──────────────────────────────
      const snow = new ParticlePool({ maxParticles: 300, gravity: 8, drag: 0.998 });

      function spawnSnow(w, h, dt) {
        const count = Math.floor(2 * dt * 60);
        snow.emit(count, () => ({
          x: rng() * w,
          y: -5,
          vx: (rng() - 0.5) * 15,
          vy: 10 + rng() * 20,
          life: 8 + rng() * 12,
          maxLife: 20,
          size: 0.5 + rng() * 1.5,
          brightness: 0.3 + rng() * 0.5,
          wobblePhase: rng() * Math.PI * 2,
          wobbleSpeed: 1 + rng() * 2,
          gravity: 5 + rng() * 10,
        }));
      }

      // ─── Aurora Color Helpers ────────────────────────
      function auroraColor(bias, intensity, verticalT) {
        // bias: 0 = green, 0.5 = teal/cyan, 1 = purple/magenta
        // verticalT: 0 = top of curtain, 1 = bottom
        // intensity: overall brightness multiplier

        // Green is dominant in the middle; purple at edges; blue transitions
        let r, g, b;

        if (bias < 0.3) {
          // Green dominant with slight blue
          r = lerp(20, 60, verticalT) * intensity;
          g = lerp(180, 255, 1 - verticalT * 0.3) * intensity;
          b = lerp(80, 140, verticalT) * intensity;
        } else if (bias < 0.7) {
          // Teal / cyan transition
          r = lerp(15, 40, verticalT) * intensity;
          g = lerp(160, 220, 1 - verticalT * 0.4) * intensity;
          b = lerp(120, 200, 1 - verticalT * 0.2) * intensity;
        } else {
          // Purple / magenta at the edges
          r = lerp(100, 180, 1 - verticalT * 0.3) * intensity;
          g = lerp(40, 100, 1 - verticalT * 0.5) * intensity;
          b = lerp(160, 240, 1 - verticalT * 0.2) * intensity;
        }

        return { r: clamp(r, 0, 255), g: clamp(g, 0, 255), b: clamp(b, 0, 255) };
      }

      // ─── Draw Routines ───────────────────────────────

      function drawSky(ctx, w, h) {
        // Deep dark arctic night sky
        const grad = ctx.createLinearGradient(0, 0, 0, h * 0.75);
        grad.addColorStop(0, '#010408');
        grad.addColorStop(0.3, '#020810');
        grad.addColorStop(0.6, '#031018');
        grad.addColorStop(1, '#041520');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      function drawStars(ctx, w, h, t) {
        for (const star of stars) {
          const twinkle = 0.5 + 0.5 * Math.sin(t * star.twinkleSpeed + star.twinklePhase);
          const alpha = star.brightness * (0.4 + twinkle * 0.6);
          const size = star.size * (0.7 + twinkle * 0.3);

          // Star core
          ctx.fillStyle = `rgba(220, 230, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, size, 0, Math.PI * 2);
          ctx.fill();

          // Subtle glow for brighter stars
          if (star.brightness > 0.6) {
            ctx.fillStyle = `rgba(200, 215, 255, ${alpha * 0.15})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, size * 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawAurora(ctx, w, h, t) {
        const auroraTop = h * 0.05;
        const auroraBottom = h * 0.65;
        const auroraHeight = auroraBottom - auroraTop;

        ctx.save();

        for (const band of bands) {
          // Current horizontal position with slow drift
          const drift = Math.sin(t * band.driftSpeed) * band.driftAmp;
          const centerX = band.baseX + drift;

          // Pulsing intensity
          const pulse = 0.5 + 0.5 * Math.sin(t * band.intensitySpeed + band.intensityPhase);
          const bandIntensity = 0.3 + pulse * 0.7;

          // Draw vertical curtain as a series of vertical strips
          const numStrips = 30;
          const stripWidth = band.width / numStrips;

          for (let s = 0; s < numStrips; s++) {
            const stripT = s / numStrips; // 0..1 across the band width
            const stripX = centerX - band.width / 2 + s * stripWidth;

            // Horizontal undulation: each strip displaced vertically by sine waves
            const verticalShift =
              Math.sin(t * band.freq1 + stripT * 4 + band.phase1) * band.amp1 +
              Math.sin(t * band.freq2 + stripT * 8 + band.phase2) * band.amp2;

            // Strip intensity varies across the band (brighter in the center)
            const edgeFade = 1 - Math.pow(Math.abs(stripT - 0.5) * 2, 1.5);
            // Additional random-ish streak variation
            const streakVar = 0.5 + 0.5 * Math.sin(stripT * band.streakCount * Math.PI + t * 0.3);
            const stripIntensity = bandIntensity * edgeFade * (0.4 + streakVar * 0.6);

            if (stripIntensity < 0.02) continue;

            // Draw the vertical strip as a gradient from top to bottom
            const x = stripX;
            const topY = auroraTop + verticalShift;
            const botY = auroraBottom + verticalShift * 0.3;
            const stripH = botY - topY;

            if (stripH <= 0) continue;

            // Create a vertical gradient for this strip
            const grad = ctx.createLinearGradient(x, topY, x, botY);

            // Top of curtain: faint, wispy
            const cTop = auroraColor(band.colorBias, stripIntensity * 0.2, 0);
            // Upper portion: building intensity
            const cUpper = auroraColor(band.colorBias, stripIntensity * 0.6, 0.2);
            // Middle: peak brightness
            const cMid = auroraColor(band.colorBias, stripIntensity, 0.4);
            // Lower: fading with color shift
            const cLower = auroraColor(band.colorBias, stripIntensity * 0.5, 0.7);
            // Bottom: wispy fade out
            const cBot = auroraColor(band.colorBias, stripIntensity * 0.1, 1.0);

            grad.addColorStop(0, `rgba(${cTop.r | 0}, ${cTop.g | 0}, ${cTop.b | 0}, 0)`);
            grad.addColorStop(0.15, `rgba(${cUpper.r | 0}, ${cUpper.g | 0}, ${cUpper.b | 0}, ${stripIntensity * 0.3})`);
            grad.addColorStop(0.35, `rgba(${cMid.r | 0}, ${cMid.g | 0}, ${cMid.b | 0}, ${stripIntensity * 0.6})`);
            grad.addColorStop(0.55, `rgba(${cMid.r | 0}, ${cMid.g | 0}, ${cMid.b | 0}, ${stripIntensity * 0.5})`);
            grad.addColorStop(0.75, `rgba(${cLower.r | 0}, ${cLower.g | 0}, ${cLower.b | 0}, ${stripIntensity * 0.25})`);
            grad.addColorStop(1, `rgba(${cBot.r | 0}, ${cBot.g | 0}, ${cBot.b | 0}, 0)`);

            ctx.fillStyle = grad;
            ctx.fillRect(x, topY, stripWidth + 1, stripH);
          }

          // Aurora glow: a large radial gradient around the band center
          const glowColor = auroraColor(band.colorBias, bandIntensity, 0.4);
          const glowCenterY = auroraTop + auroraHeight * 0.4;
          const glowRadius = band.width * 1.5 + bandIntensity * 80;
          const glow = ctx.createRadialGradient(
            centerX, glowCenterY, 0,
            centerX, glowCenterY, glowRadius,
          );
          glow.addColorStop(0, `rgba(${glowColor.r | 0}, ${glowColor.g | 0}, ${glowColor.b | 0}, ${bandIntensity * 0.08})`);
          glow.addColorStop(0.4, `rgba(${glowColor.r | 0}, ${glowColor.g | 0}, ${glowColor.b | 0}, ${bandIntensity * 0.04})`);
          glow.addColorStop(1, `rgba(${glowColor.r | 0}, ${glowColor.g | 0}, ${glowColor.b | 0}, 0)`);
          ctx.fillStyle = glow;
          ctx.fillRect(centerX - glowRadius, glowCenterY - glowRadius, glowRadius * 2, glowRadius * 2);
        }

        ctx.restore();
      }

      function drawMountains(ctx, w, h, t) {
        for (let r = 0; r < ridges.length; r++) {
          const ridge = ridges[r];
          const depth = r / (NUM_RIDGES - 1); // 0 = far, 1 = near

          // Farther ridges are lighter (silhouette with slight atmospheric haze)
          const baseBright = lerp(18, 6, depth);
          const blueShift = lerp(25, 10, depth);

          // Subtle aurora reflection on distant ridges
          const reflectAlpha = lerp(0.08, 0.02, depth);
          const reflectGreen = lerp(40, 15, depth);

          ctx.fillStyle = `rgb(${baseBright | 0}, ${(baseBright + reflectGreen * reflectAlpha) | 0}, ${(baseBright + blueShift) | 0})`;

          ctx.beginPath();
          ctx.moveTo(0, h);

          for (const pt of ridge.points) {
            ctx.lineTo(pt.x, pt.y);
          }

          ctx.lineTo(w, h);
          ctx.closePath();
          ctx.fill();

          // Thin highlight line on the ridge top for depth
          if (r < NUM_RIDGES - 1) {
            ctx.strokeStyle = `rgba(30, 60, 80, ${lerp(0.15, 0.04, depth)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < ridge.points.length; i++) {
              const pt = ridge.points[i];
              if (i === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
          }
        }
      }

      function drawAuroraReflection(ctx, w, h, t) {
        // Faint aurora glow reflected on the upper mountain ridges
        if (ridges.length === 0) return;

        const firstRidge = ridges[0];
        const reflectionY = firstRidge.baseY;

        // Draw a soft horizontal glow band just above the mountain line
        for (const band of bands) {
          const drift = Math.sin(t * band.driftSpeed) * band.driftAmp;
          const centerX = band.baseX + drift;
          const pulse = 0.5 + 0.5 * Math.sin(t * band.intensitySpeed + band.intensityPhase);
          const intensity = 0.15 + pulse * 0.15;

          const color = auroraColor(band.colorBias, intensity, 0.5);
          const reflGrad = ctx.createRadialGradient(
            centerX, reflectionY - 10, 0,
            centerX, reflectionY - 10, band.width * 0.8,
          );
          reflGrad.addColorStop(0, `rgba(${color.r | 0}, ${color.g | 0}, ${color.b | 0}, ${intensity * 0.12})`);
          reflGrad.addColorStop(1, `rgba(${color.r | 0}, ${color.g | 0}, ${color.b | 0}, 0)`);
          ctx.fillStyle = reflGrad;
          ctx.fillRect(centerX - band.width, reflectionY - band.width * 0.8, band.width * 2, band.width * 0.8);
        }
      }

      function drawSnow(ctx, w, h, t) {
        snow.forEach((p) => {
          // Gentle horizontal wobble
          const wobble = Math.sin(t * p.wobbleSpeed + p.wobblePhase) * 8;
          const drawX = p.x + wobble;

          const lifeRatio = p.life / p.maxLife;
          const alpha = p.brightness * clamp(lifeRatio, 0, 1) * 0.6;

          ctx.fillStyle = `rgba(200, 210, 230, ${alpha})`;
          ctx.beginPath();
          ctx.arc(drawX, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawAtmosphericHaze(ctx, w, h) {
        // Faint atmospheric haze near the horizon
        const hazeGrad = ctx.createLinearGradient(0, h * 0.55, 0, h * 0.78);
        hazeGrad.addColorStop(0, 'rgba(8, 15, 25, 0)');
        hazeGrad.addColorStop(0.5, 'rgba(8, 15, 25, 0.08)');
        hazeGrad.addColorStop(1, 'rgba(8, 15, 25, 0.2)');
        ctx.fillStyle = hazeGrad;
        ctx.fillRect(0, h * 0.55, w, h * 0.23);

        // Vignette
        const vig = ctx.createRadialGradient(
          w * 0.5, h * 0.4, Math.min(w, h) * 0.3,
          w * 0.5, h * 0.4, Math.max(w, h) * 0.75,
        );
        vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vig.addColorStop(0.7, 'rgba(0, 0, 0, 0.05)');
        vig.addColorStop(1, 'rgba(0, 0, 0, 0.25)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, w, h);
      }

      // ─── Main App ────────────────────────────────────
      const app = createApp({
        asciiConfig: {
          fontSize: 6,
          charset: 'braille',
          colorScheme: 'neon',
          background: '#020810',
          sourceOpacity: 0,
        },
        layers: [
          {
            fontSize: 12,
            charset: 'blocks',
            colorScheme: 'mono',
            blendMode: 'add',
            opacity: 0.08,
          },
          {
            fontSize: 8,
            charset: 'density',
            edgeDetect: true,
            edgeCharset: 'box-light',
            blendMode: 'add',
            opacity: 0.15,
          },
        ],
        draw(ctx, { time, dt, width: w, height: h }) {
          const t = time / 1000;

          // Clear
          ctx.fillStyle = '#020810';
          ctx.fillRect(0, 0, w, h);

          // Sky
          drawSky(ctx, w, h);

          // Stars (behind aurora)
          drawStars(ctx, w, h, t);

          // Aurora curtains
          drawAurora(ctx, w, h, t);

          // Aurora reflection on mountains
          drawAuroraReflection(ctx, w, h, t);

          // Atmospheric haze (between aurora and mountains)
          drawAtmosphericHaze(ctx, w, h);

          // Mountains (in front of everything)
          drawMountains(ctx, w, h, t);

          // Snow
          spawnSnow(w, h, dt);
          snow.update(dt);
          drawSnow(ctx, w, h, t);
        },
        onResize(ctx, w, h) {
          initStars(w, h);
          initRidges(w, h);
          initBands(w);
          snow.clear();
        },
      });

      // ─── Initialize ──────────────────────────────────
      initStars(app.width, app.height);
      initRidges(app.width, app.height);
      initBands(app.width);
    </script>
  </body>
</html>
