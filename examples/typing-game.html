<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Typing Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { AsciiIfy } from '../src/index.js';

      // ─── Source Canvas ──────────────────────────────────────
      const source = document.getElementById('source');
      const ctx = source.getContext('2d');

      function resize() {
        source.width = window.innerWidth;
        source.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      // ─── Constants ──────────────────────────────────────────
      const MAX_LIVES = 5;
      const BASE_SPEED = 65;
      const SPEED_PER_LEVEL = 10;
      const MAX_SPEED = 180;
      const BASE_SPAWN_INTERVAL = 2.2;
      const MIN_SPAWN_INTERVAL = 0.55;
      const WORDS_PER_LEVEL = 5;
      const MAX_PARTICLES = 500;

      // ─── Group Colors (word visual groups) ─────────────────
      const GROUP_COLORS = [
        { base: [0, 220, 255], glow: [100, 255, 255] },   // cyan
        { base: [255, 80, 200], glow: [255, 150, 230] },   // magenta
        { base: [255, 200, 50], glow: [255, 240, 130] },   // gold
      ];

      // ─── Word Lists ─────────────────────────────────────────
      const WORDS_SHORT = [
        'and','for','but','not','you','all','can','had','was','our',
        'out','day','has','him','how','its','may','now','old','way',
        'who','did','say','too','run','try','ask','own','got','bit',
        'bug','cut','dig','dot','duo','fit','fog','fun','git','gun',
        'hit','hot','hub','jam','joy','key','kid','kit','lag','log',
      ];
      const WORDS_MEDIUM = [
        'data','hack','link','loud','null','root','sync','void','wiki',
        'bash','bold','bind','bomb','boot','buzz','cast','char','bits',
        'club','coil','copy','corn','curl','dart','dial','disk','dock',
        'down','drag','draw','drum','dual','dust','fair','farm','fast',
        'flag','flow','foam','fold','font','fork','form','frog','fury',
      ];
      const WORDS_LONG = [
        'global','matrix','string','syntax','binary','cursor','branch',
        'bitmap','botany','builds','citrus','colour','column','commit',
        'crisis','crypto','daring','dialog','domain','dragon','dynamo',
        'fabric','factor','finish','fossil','galaxy','gaming','ground',
        'hallow','hybrid','junior','lastly','layout','liquid','malloc',
        'macro','margin','signal','school','shadow','static','submit',
        'algorithm','conductor','constrain','cocktail','blackbird',
        'cinnamon','dinosaur','dominion','fishtail','gladiator',
        'goldfinch','hangman','ignition','landlord','midnight',
        'milkyway','mountain','navigator','obituary','outgrowing',
        'radiation','sailboat','squadron','sunlight','thumbtack',
        'transmit','unicorn','volcanic','windmill','xylophon',
      ];

      // ─── Game State ─────────────────────────────────────────
      let state = 'waiting';
      let score = 0;
      let combo = 0;
      let bestCombo = 0;
      let lives = MAX_LIVES;
      let difficulty = 0;
      let destroyedCount = 0;

      let words = [];
      let spawnTimer = 0;
      let spawnInterval = BASE_SPAWN_INTERVAL;

      let activeWord = null;
      let typedChars = 0;

      let wordGroupCounter = 0;

      let particles = [];
      let shakeTimer = 0;
      let missFlash = 0;
      let comboPopScale = 0;
      let lastTime = 0;

      // ─── Input ──────────────────────────────────────────────
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { ascii.togglePanel(); return; }

        if (state === 'waiting' || state === 'gameover') {
          if (e.key === 'e' || e.key === 'E') { ascii.set('enabled', !ascii.get('enabled')); return; }
          if (e.key === 'p' || e.key === 'P') { ascii.togglePanel(); return; }
          if (e.key === ' ') { startGame(); e.preventDefault(); }
          return;
        }
        if (state !== 'playing') return;

        if (e.key === 'Backspace') {
          if (activeWord) {
            activeWord.letterStates.fill('pending');
            activeWord.active = false;
            activeWord = null;
            typedChars = 0;
          }
          e.preventDefault();
          return;
        }

        if (e.key === 'e' || e.key === 'E') { ascii.set('enabled', !ascii.get('enabled')); return; }
        if (e.key === 'p' || e.key === 'P') { ascii.togglePanel(); return; }
        if (e.key === ' ') { e.preventDefault(); return; }
        if (e.key.length !== 1) return;
        const typed = e.key.toLowerCase();

        if (!activeWord) {
          let best = null;
          for (const w of words) {
            if (w.text[0] === typed) {
              if (!best || w.y > best.y) best = w;
            }
          }
          if (best) {
            activeWord = best;
            best.active = true;
            destroyLetter(best, 0);
            typedChars = 1;
            best.flash = 1;
            if (typedChars >= best.text.length) {
              destroyWord(best);
            }
          }
          return;
        }

        const expected = activeWord.text[typedChars];
        if (typed === expected) {
          destroyLetter(activeWord, typedChars);
          typedChars++;
          activeWord.flash = 1;
          if (typedChars >= activeWord.text.length) {
            destroyWord(activeWord);
          }
        } else {
          activeWord.letterStates.fill('pending');
          activeWord.active = false;
          activeWord = null;
          typedChars = 0;
          combo = 0;
          updateColorCycle();
        }
      });

      // ─── Word Management ────────────────────────────────────
      function pickWord() {
        const r = Math.random();
        if (difficulty < 3) {
          return WORDS_SHORT[Math.floor(Math.random() * WORDS_SHORT.length)];
        } else if (difficulty < 6) {
          const pool = r < 0.4 ? WORDS_SHORT : WORDS_MEDIUM;
          return pool[Math.floor(Math.random() * pool.length)];
        } else {
          const pool = r < 0.2 ? WORDS_SHORT : r < 0.55 ? WORDS_MEDIUM : WORDS_LONG;
          return pool[Math.floor(Math.random() * pool.length)];
        }
      }

      function findSpawnX(text) {
        const w = source.width;
        const fontSize = Math.min(w * 0.2, 180);
        ctx.font = `bold ${fontSize}px monospace`;
        const textWidth = ctx.measureText(text).width;
        const margin = 20;
        const minX = textWidth / 2 + margin;
        const maxX = w - textWidth / 2 - margin;
        if (maxX <= minX) return w / 2;

        for (let attempt = 0; attempt < 10; attempt++) {
          const x = minX + Math.random() * (maxX - minX);
          let overlaps = false;
          for (const existing of words) {
            if (existing.y < 60 && Math.abs(existing.x - x) < textWidth + 40) {
              overlaps = true;
              break;
            }
          }
          if (!overlaps) return x;
        }
        return minX + Math.random() * (maxX - minX);
      }

      function spawnWord() {
        const text = pickWord();
        const speed = Math.min(BASE_SPEED + difficulty * SPEED_PER_LEVEL, MAX_SPEED);
        const group = wordGroupCounter++ % 3;
        words.push({
          text,
          x: findSpawnX(text),
          y: -20,
          speed: speed * (0.85 + Math.random() * 0.3),
          flash: 0,
          active: false,
          destructionStyle: Math.floor(Math.random() * 5),
          group,
          letterStates: new Array(text.length).fill('pending'),
        });
      }

      function destroyWord(word) {
        const basePoints = word.text.length * 10;
        const comboBonus = combo * 5;
        score += basePoints + comboBonus;

        combo++;
        if (combo > bestCombo) bestCombo = combo;
        comboPopScale = 1;

        spawnCompletionBurst(word.x, word.y, word.group);

        const idx = words.indexOf(word);
        if (idx >= 0) words.splice(idx, 1);

        activeWord = null;
        typedChars = 0;

        updateColorCycle();

        destroyedCount++;
        if (destroyedCount % WORDS_PER_LEVEL === 0) {
          difficulty++;
        }
      }

      function missWord(word) {
        if (word === activeWord) {
          activeWord = null;
          typedChars = 0;
        }
        const idx = words.indexOf(word);
        if (idx >= 0) words.splice(idx, 1);

        lives--;
        combo = 0;
        updateColorCycle();
        shakeTimer = 0.15;
        missFlash = 1;

        if (lives <= 0) {
          state = 'gameover';
          ascii.set('colorCycle', false);
        }
      }

      // ─── Letter Destruction ─────────────────────────────────
      function destroyLetter(word, letterIndex) {
        word.letterStates[letterIndex] = 'done';
        const fontSize = Math.min(source.width * 0.2, 180);
        ctx.font = `bold ${fontSize}px monospace`;
        const charWidth = ctx.measureText('M').width;
        const fullWidth = charWidth * word.text.length;
        const startX = word.x - fullWidth / 2;
        const letterX = startX + letterIndex * charWidth + charWidth / 2;
        const letterY = word.y;
        spawnLetterDestruction(word.text[letterIndex], letterX, letterY, word.destructionStyle, word.group);
      }

      // ─── Particles ──────────────────────────────────────────
      function spawnLetterDestruction(char, x, y, style, group) {
        const fontSize = Math.min(source.width * 0.2, 180);

        switch (style) {
          case 0: { // EXPLODE
            if (particles.length < MAX_PARTICLES) {
              const a = Math.random() * Math.PI * 2;
              const s = 100 + Math.random() * 150;
              particles.push({
                char, x, y,
                vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80,
                life: 0.5 + Math.random() * 0.3, maxLife: 0.8,
                rotation: 0, angularVel: (Math.random() - 0.5) * 15,
                size: fontSize * 0.7, style: 'explode', group, scaleDecay: 1,
              });
            }
            const sparkCount = 6 + (Math.random() * 5 | 0);
            for (let i = 0; i < sparkCount; i++) {
              if (particles.length >= MAX_PARTICLES) break;
              const a = Math.random() * Math.PI * 2;
              const s = 60 + Math.random() * 140;
              particles.push({
                char: null, x, y,
                vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
                life: 0.3 + Math.random() * 0.3, maxLife: 0.6,
                size: 2 + Math.random() * 4, style: 'explode', group,
                rotation: 0, angularVel: 0, scaleDecay: 1,
              });
            }
            break;
          }
          case 1: { // FALL
            if (particles.length < MAX_PARTICLES) {
              particles.push({
                char, x, y,
                vx: (Math.random() - 0.5) * 20, vy: 30,
                life: 1.2 + Math.random() * 0.5, maxLife: 1.7,
                rotation: 0, angularVel: (Math.random() - 0.5) * 4,
                size: fontSize * 0.9, style: 'fall', group, scaleDecay: 1,
              });
            }
            break;
          }
          case 2: { // DISSOLVE
            const dotCount = 10 + (Math.random() * 8 | 0);
            for (let i = 0; i < dotCount; i++) {
              if (particles.length >= MAX_PARTICLES) break;
              const a = Math.random() * Math.PI * 2;
              const s = 15 + Math.random() * 40;
              particles.push({
                char: null,
                x: x + (Math.random() - 0.5) * 20,
                y: y + (Math.random() - 0.5) * 20,
                vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                life: 0.6 + Math.random() * 0.6, maxLife: 1.2,
                size: 1.5 + Math.random() * 3, style: 'dissolve', group,
                rotation: 0, angularVel: 0, scaleDecay: 1,
              });
            }
            break;
          }
          case 3: { // SHATTER
            const shardCount = 5 + (Math.random() * 4 | 0);
            for (let i = 0; i < shardCount; i++) {
              if (particles.length >= MAX_PARTICLES) break;
              const a = Math.random() * Math.PI * 2;
              const s = 150 + Math.random() * 200;
              particles.push({
                char: null, x, y,
                vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50,
                life: 0.3 + Math.random() * 0.3, maxLife: 0.6,
                size: 6 + Math.random() * 10, style: 'shatter', group,
                rotation: a, angularVel: (Math.random() - 0.5) * 20, scaleDecay: 1,
              });
            }
            if (particles.length < MAX_PARTICLES) {
              particles.push({
                char, x, y,
                vx: (Math.random() - 0.5) * 250, vy: -100 - Math.random() * 100,
                life: 0.25 + Math.random() * 0.15, maxLife: 0.4,
                size: fontSize * 0.5, style: 'shatter', group,
                rotation: 0, angularVel: (Math.random() - 0.5) * 25, scaleDecay: 1,
              });
            }
            break;
          }
          case 4: { // VAPORIZE
            if (particles.length < MAX_PARTICLES) {
              particles.push({
                char, x, y,
                vx: (Math.random() - 0.5) * 10, vy: -60 - Math.random() * 40,
                life: 0.8 + Math.random() * 0.4, maxLife: 1.2,
                rotation: 0, angularVel: (Math.random() - 0.5) * 2,
                size: fontSize * 0.9, style: 'vaporize', group, scaleDecay: 0.96,
              });
            }
            for (let i = 0; i < 4; i++) {
              if (particles.length >= MAX_PARTICLES) break;
              particles.push({
                char: null,
                x: x + (Math.random() - 0.5) * 15,
                y: y + Math.random() * 10,
                vx: (Math.random() - 0.5) * 15, vy: -30 - Math.random() * 20,
                life: 0.5 + Math.random() * 0.4, maxLife: 0.9,
                size: 2 + Math.random() * 3, style: 'vaporize', group,
                rotation: 0, angularVel: 0, scaleDecay: 0.98,
              });
            }
            break;
          }
        }
      }

      function spawnCompletionBurst(x, y, group) {
        const count = 12 + (Math.random() * 6 | 0);
        for (let i = 0; i < count; i++) {
          if (particles.length >= MAX_PARTICLES) break;
          const a = (i / count) * Math.PI * 2 + Math.random() * 0.3;
          const s = 80 + Math.random() * 100;
          particles.push({
            char: null, x, y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 0.4 + Math.random() * 0.3, maxLife: 0.7,
            size: 3 + Math.random() * 4, style: 'explode', group,
            rotation: 0, angularVel: 0, scaleDecay: 1,
          });
        }
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          switch (p.style) {
            case 'fall':
              p.vy += 600 * dt;
              p.vx *= 0.99;
              break;
            case 'vaporize':
              p.vy -= 30 * dt;
              p.vx *= 0.95;
              p.vy *= 0.98;
              p.size *= p.scaleDecay;
              break;
            case 'dissolve':
              p.vx *= 0.94;
              p.vy *= 0.94;
              p.vx += (Math.random() - 0.5) * 20 * dt;
              p.vy += (Math.random() - 0.5) * 20 * dt;
              break;
            case 'shatter':
              p.vy += 100 * dt;
              p.vx *= 0.99;
              break;
            default:
              p.vy += 200 * dt;
              p.vx *= 0.97;
              break;
          }

          if (p.angularVel) p.rotation += p.angularVel * dt;
        }
      }

      function drawParticles() {
        for (const p of particles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          const gc = p.group != null ? GROUP_COLORS[p.group] : null;

          if (p.char) {
            ctx.save();
            ctx.translate(p.x, p.y);
            if (p.rotation) ctx.rotate(p.rotation);
            if (p.style === 'vaporize') ctx.globalAlpha = alpha * alpha;

            ctx.font = `bold ${p.size}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (gc) {
              const [r, g, b] = gc.glow;
              ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.85})`;
            } else {
              ctx.fillStyle = `rgba(100, 255, 200, ${alpha * 0.8})`;
            }

            ctx.fillText(p.char, 0, 0);
            ctx.restore();
          } else if (p.style === 'shatter') {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            if (gc) {
              const [r, g, b] = gc.glow;
              ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.9})`;
            } else {
              ctx.strokeStyle = `rgba(255, 255, 200, ${alpha * 0.8})`;
            }
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-p.size / 2, 0);
            ctx.lineTo(p.size / 2, 0);
            ctx.lineTo(p.size * 0.3, p.size * 0.3);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            if (gc) {
              const [r, g, b] = gc.glow;
              ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.6})`;
            } else {
              ctx.fillStyle = `rgba(255, 255, 200, ${alpha * 0.6})`;
            }
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }

      // ─── Game Logic ─────────────────────────────────────────
      function startGame() {
        state = 'playing';
        score = 0;
        combo = 0;
        bestCombo = 0;
        lives = MAX_LIVES;
        difficulty = 0;
        destroyedCount = 0;
        wordGroupCounter = 0;
        words = [];
        particles = [];
        activeWord = null;
        typedChars = 0;
        spawnTimer = 0.5;
        shakeTimer = 0;
        missFlash = 0;
        comboPopScale = 0;
        ascii.set('colorCycle', false);
        ascii.set('colorCycleRate', 0.3);
      }

      function update(dt) {
        // Spawn words
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnWord();
          spawnInterval = Math.max(MIN_SPAWN_INTERVAL, BASE_SPAWN_INTERVAL - difficulty * 0.15);
          spawnTimer = spawnInterval * (0.8 + Math.random() * 0.4);
        }

        // Move words
        for (let i = words.length - 1; i >= 0; i--) {
          const w = words[i];
          w.y += w.speed * dt;
          w.flash = Math.max(0, w.flash - 3 * dt);
          if (w.y > source.height + 10) {
            missWord(w);
          }
        }

        updateParticles(dt);
      }

      // ─── Draw ───────────────────────────────────────────────
      function drawBackground(t, w, h) {
        const bgBright = 6 + (combo > 5 ? Math.sin(t * 3) * 3 : 0);
        ctx.fillStyle = `rgb(${bgBright}, ${bgBright}, ${bgBright + 4})`;
        ctx.fillRect(0, 0, w, h);
      }

      function drawWords() {
        const w = source.width;
        const h = source.height;
        const fontSize = Math.min(w * 0.2, 180);
        ctx.font = `bold ${fontSize}px monospace`;
        const charWidth = ctx.measureText('M').width;

        for (const word of words) {
          const gc = GROUP_COLORS[word.group];
          const fullWidth = charWidth * word.text.length;
          const startX = word.x - fullWidth / 2;

          ctx.font = `bold ${fontSize}px monospace`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';

          for (let i = 0; i < word.text.length; i++) {
            if (word.letterStates[i] !== 'pending') continue;

            const letterX = startX + i * charWidth;

            if (word.active && word === activeWord) {
              const [r, g, b] = gc.glow;
              ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.8 + word.flash * 0.2})`;
            } else {
              const urgency = Math.max(0, word.y / h);
              const [br, bg, bb] = gc.base;
              const r = Math.floor(br + urgency * (255 - br));
              const g = Math.floor(bg - urgency * bg);
              const b = Math.floor(bb - urgency * bb);
              ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.8)`;
            }

            ctx.fillText(word.text[i], letterX, word.y);
          }

          // Underline for active word under remaining letters
          if (word.active && word === activeWord) {
            let firstPending = -1, lastPending = -1;
            for (let i = 0; i < word.letterStates.length; i++) {
              if (word.letterStates[i] === 'pending') {
                if (firstPending === -1) firstPending = i;
                lastPending = i;
              }
            }
            if (firstPending >= 0) {
              const [r, g, b] = gc.glow;
              ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.4)`;
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(startX + firstPending * charWidth, word.y + fontSize * 0.55);
              ctx.lineTo(startX + (lastPending + 1) * charWidth, word.y + fontSize * 0.55);
              ctx.stroke();
            }
          }
        }
      }

      function drawHUD() {
        const w = source.width;
        const h = source.height;
        const cx = w / 2;

        // Score
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = `bold ${Math.min(w * 0.08, 72)}px monospace`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillText(`${score}`, cx, 20);

        // Lives
        ctx.textAlign = 'left';
        ctx.font = `${Math.min(w * 0.035, 30)}px monospace`;
        ctx.fillStyle = 'rgba(255, 100, 80, 0.6)';
        const livesStr = '\u2665'.repeat(lives) + '\u2661'.repeat(MAX_LIVES - lives);
        ctx.fillText(livesStr, 16, 16);

        // Combo
        if (combo > 1) {
          const popScale = 1 + comboPopScale * 0.4;
          const comboSize = Math.min(w * 0.055, 48) * popScale;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.font = `bold ${comboSize}px monospace`;
          const hue = (combo * 20) % 360;
          ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.5 + comboPopScale * 0.4})`;
          ctx.fillText(`${combo}x`, cx, 85);
        }

        // Level
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.font = '16px monospace';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillText(`lvl ${difficulty + 1}`, w - 16, 16);
      }

      function drawMissFlash(w, h) {
        if (missFlash > 0) {
          const grad = ctx.createLinearGradient(0, h - 80, 0, h);
          grad.addColorStop(0, 'rgba(255, 0, 0, 0)');
          grad.addColorStop(1, `rgba(255, 30, 30, ${missFlash * 0.4})`);
          ctx.fillStyle = grad;
          ctx.fillRect(0, h - 80, w, 80);
          missFlash = Math.max(0, missFlash - 0.03);
        }
      }

      function drawWaiting(t, w, h) {
        const cx = w / 2;
        const cy = h / 2;
        const pulse = 0.5 + Math.sin(t * 2) * 0.2;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `bold ${Math.min(w * 0.14, 120)}px monospace`;
        ctx.fillStyle = `rgba(180, 240, 255, ${pulse})`;
        ctx.fillText('TYPE', cx, cy - 40);

        ctx.font = `${Math.min(w * 0.04, 36)}px monospace`;
        ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.5})`;
        ctx.fillText('press space to start', cx, cy + 40);

        ctx.font = '18px monospace';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.fillText('type falling words \u00b7 combos shift colors', cx, h - 60);
        ctx.fillText('ESC panel \u00b7 ` toggle filter', cx, h - 35);
      }

      function drawGameOver(t, w, h) {
        const cx = w / 2;
        const cy = h / 2;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, w, h);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `bold ${Math.min(w * 0.12, 100)}px monospace`;
        ctx.fillStyle = 'rgba(255, 80, 60, 0.8)';
        ctx.fillText('GAME OVER', cx, cy - 60);

        ctx.font = `${Math.min(w * 0.06, 50)}px monospace`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fillText(`score: ${score}`, cx, cy + 20);

        if (bestCombo > 1) {
          ctx.font = `${Math.min(w * 0.04, 36)}px monospace`;
          ctx.fillStyle = 'rgba(255, 200, 50, 0.5)';
          ctx.fillText(`best combo: ${bestCombo}x`, cx, cy + 80);
        }

        const restartPulse = 0.3 + Math.sin(t * 3) * 0.15;
        ctx.font = `${Math.min(w * 0.04, 36)}px monospace`;
        ctx.fillStyle = `rgba(255, 255, 255, ${restartPulse})`;
        ctx.fillText('press space to restart', cx, cy + 150);
      }

      // ─── Combo / Color Cycle ────────────────────────────────
      function updateColorCycle() {
        if (combo < 3) {
          ascii.set('colorCycle', false);
        } else if (combo < 5) {
          ascii.set('colorCycle', true);
          ascii.set('colorCycleRate', 0.3);
        } else if (combo < 10) {
          ascii.set('colorCycleRate', 0.8);
        } else if (combo < 20) {
          ascii.set('colorCycleRate', 1.5);
        } else {
          ascii.set('colorCycleRate', 3.0);
        }
      }

      // ─── ASCII-ify with Layers ──────────────────────────────
      const ascii = new AsciiIfy(source, {
        background: '#06060a',
        sourceOpacity: 0,
        speed: 1,
        colorCycle: false,
        colorCycleRate: 0.3,
      });

      // Layer 1: Background vortex — binary tunnel atmosphere
      ascii.addLayer({
        source,
        fontSize: 5,
        charset: 'binary',
        colorScheme: 'ocean',
        pattern: 'kaleidoscope',
        patternMix: 0.77,
        opacity: 0.15,
        fade: 1,
        blendMode: 'replace',
      });

      // Layer 2: Game detail — words, HUD, crisp text
      ascii.addLayer({
        source,
        fontSize: 10,
        charset: 'density',
        colorScheme: 'neon',
        blendMode: 'add',
        opacity: 0.85,
      });

      // Layer 3: Fine particles — destruction effects, glow
      ascii.addLayer({
        source,
        fontSize: 7,
        charset: 'braille',
        colorScheme: 'fire',
        blendMode: 'add',
        opacity: 0.35,
      });

      // ─── Main Loop ─────────────────────────────────────────
      function loop(time) {
        const w = source.width;
        const h = source.height;
        const dt = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        const t = time * 0.001;

        if (state === 'playing') update(dt);

        // Screen shake
        let shakeX = 0, shakeY = 0;
        if (shakeTimer > 0) {
          shakeX = (Math.random() - 0.5) * 8;
          shakeY = (Math.random() - 0.5) * 8;
          shakeTimer -= dt;
        }
        comboPopScale = Math.max(0, comboPopScale - dt * 5);

        ctx.save();
        ctx.translate(shakeX, shakeY);

        drawBackground(t, w, h);

        if (state === 'playing') {
          drawWords();
          drawParticles();
          drawHUD();
          drawMissFlash(w, h);
        } else if (state === 'waiting') {
          drawWaiting(t, w, h);
        } else if (state === 'gameover') {
          drawWords();
          drawParticles();
          drawGameOver(t, w, h);
        }

        ctx.restore();

        ascii.render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
