<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Synthwave Sunset</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, clamp } from './utils.js';

      // ─── Stars ────────────────────────────────────────────
      const NUM_STARS = 200;
      const stars = [];

      function initStars(w, h) {
        stars.length = 0;
        for (let i = 0; i < NUM_STARS; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h * 0.42,
            size: 0.5 + Math.random() * 1.5,
            twinkleSpeed: 1 + Math.random() * 3,
            twinkleOffset: Math.random() * Math.PI * 2,
            brightness: 0.3 + Math.random() * 0.7,
          });
        }
      }

      // ─── Mountains ────────────────────────────────────────
      function drawMountains(ctx, w, horizonY) {
        const peaks = [
          { x: -0.05, y: 0.06 },
          { x: 0.12, y: 0.10 },
          { x: 0.25, y: 0.05 },
          { x: 0.38, y: 0.12 },
          { x: 0.50, y: 0.04 },
          { x: 0.62, y: 0.11 },
          { x: 0.75, y: 0.06 },
          { x: 0.88, y: 0.13 },
          { x: 1.05, y: 0.05 },
        ];

        // Mountain silhouette
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        for (let i = 0; i < peaks.length; i++) {
          const px = peaks[i].x * w;
          const py = horizonY - peaks[i].y * w;
          if (i === 0) {
            ctx.lineTo(px, py);
          } else {
            // Smooth curve between peaks
            const prev = peaks[i - 1];
            const cpx = ((prev.x + peaks[i].x) / 2) * w;
            ctx.quadraticCurveTo(cpx, py * 0.97, px, py);
          }
        }
        ctx.lineTo(w, horizonY);
        ctx.closePath();

        // Dark fill
        ctx.fillStyle = '#0a0012';
        ctx.fill();

        // Purple edge glow
        ctx.strokeStyle = 'rgba(140, 40, 180, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Second glow pass
        ctx.strokeStyle = 'rgba(180, 60, 220, 0.2)';
        ctx.lineWidth = 5;
        ctx.stroke();
      }

      // ─── Palm Trees ───────────────────────────────────────
      function drawPalmTree(ctx, baseX, baseY, height, lean, time) {
        const segments = 20;
        const sway = Math.sin(time * 0.0005 + lean * 2) * 8;

        // Trunk
        ctx.strokeStyle = '#0a0012';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        for (let i = 1; i <= segments; i++) {
          const t = i / segments;
          const x = baseX + lean * t * 30 + sway * t * t;
          const y = baseY - height * t;
          ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Trunk outline glow
        ctx.strokeStyle = 'rgba(100, 20, 140, 0.3)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        for (let i = 1; i <= segments; i++) {
          const t = i / segments;
          const x = baseX + lean * t * 30 + sway * t * t;
          const y = baseY - height * t;
          ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Crown position
        const crownX = baseX + lean * 30 + sway;
        const crownY = baseY - height;

        // Fronds
        const frondCount = 7;
        for (let i = 0; i < frondCount; i++) {
          const angle = (i / frondCount) * Math.PI * 1.6 - Math.PI * 0.3;
          const frondLen = height * 0.45 + Math.sin(i * 1.5) * height * 0.1;
          const fSway = Math.sin(time * 0.0008 + i) * 5;

          ctx.strokeStyle = '#0a0012';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(crownX, crownY);

          const endX = crownX + Math.cos(angle) * frondLen + fSway;
          const endY = crownY + Math.sin(angle) * frondLen * 0.5 - frondLen * 0.2;
          const cpX = crownX + Math.cos(angle) * frondLen * 0.6;
          const cpY = crownY + Math.sin(angle) * frondLen * 0.2 - frondLen * 0.35;

          ctx.quadraticCurveTo(cpX, cpY, endX, endY);
          ctx.stroke();

          // Glow
          ctx.strokeStyle = 'rgba(80, 10, 120, 0.25)';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(crownX, crownY);
          ctx.quadraticCurveTo(cpX, cpY, endX, endY);
          ctx.stroke();
        }
      }

      // ─── Draw ─────────────────────────────────────────────
      let gridOffset = 0;

      function draw(ctx, { time, dt, width: w, height: h }) {
        const horizonY = h * 0.48;

        // ── Sky gradient ──
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0, '#05000a');
        skyGrad.addColorStop(0.3, '#12003a');
        skyGrad.addColorStop(0.6, '#2a0050');
        skyGrad.addColorStop(0.8, '#6b0060');
        skyGrad.addColorStop(0.92, '#c41070');
        skyGrad.addColorStop(1, '#ff4488');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, horizonY + 2);

        // ── Stars ──
        for (const star of stars) {
          const twinkle = 0.4 + 0.6 * Math.sin(time * 0.001 * star.twinkleSpeed + star.twinkleOffset);
          const alpha = star.brightness * twinkle;
          // Fade stars near horizon
          const fadeZone = horizonY * 0.35;
          const horizonFade = star.y > fadeZone ? clamp(1 - (star.y - fadeZone) / (horizonY * 0.15), 0, 1) : 1;

          ctx.globalAlpha = alpha * horizonFade;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // ── Sun ──
        const sunRadius = Math.min(w, h) * 0.15;
        const pulse = 1 + Math.sin(time * 0.0006) * 0.03;
        const r = sunRadius * pulse;
        const sunX = w * 0.5;
        const sunY = horizonY;

        // Sun glow
        const sunGlow = ctx.createRadialGradient(sunX, sunY, r * 0.5, sunX, sunY, r * 2.5);
        sunGlow.addColorStop(0, 'rgba(255, 100, 50, 0.25)');
        sunGlow.addColorStop(0.4, 'rgba(255, 50, 100, 0.1)');
        sunGlow.addColorStop(1, 'rgba(255, 50, 100, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, w, h);

        // Sun body — draw as horizontal bands with gaps
        ctx.save();
        ctx.beginPath();
        ctx.arc(sunX, sunY, r, 0, Math.PI * 2);
        ctx.clip();

        // Sun gradient fill
        const sunGrad = ctx.createLinearGradient(sunX, sunY - r, sunX, sunY + r);
        sunGrad.addColorStop(0, '#ffee44');
        sunGrad.addColorStop(0.3, '#ffaa22');
        sunGrad.addColorStop(0.6, '#ff5522');
        sunGrad.addColorStop(1, '#cc1144');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(sunX - r, sunY - r, r * 2, r * 2);

        // Horizontal band cutouts (classic synthwave sun lines)
        // Lines get thicker toward the bottom
        const numBands = 8;
        const bandRegionTop = sunY - r * 0.1;
        const bandRegionBottom = sunY + r;
        ctx.fillStyle = '#05000a'; // Match background for transparency effect

        for (let i = 0; i < numBands; i++) {
          const t = i / numBands;
          const bandY = lerp(bandRegionTop, bandRegionBottom, t);
          const bandHeight = lerp(2, r * 0.12, t * t);
          const gap = lerp(r * 0.04, r * 0.06, t);
          ctx.fillRect(sunX - r, bandY, r * 2, bandHeight);
        }

        ctx.restore();

        // ── Mountains ──
        drawMountains(ctx, w, horizonY);

        // ── Ground / Grid floor ──
        // Ground base color
        const groundGrad = ctx.createLinearGradient(0, horizonY, 0, h);
        groundGrad.addColorStop(0, '#12003a');
        groundGrad.addColorStop(0.3, '#08001a');
        groundGrad.addColorStop(1, '#05000a');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, horizonY, w, h - horizonY);

        // ── Perspective grid ──
        gridOffset += dt * 80; // Scroll speed

        const vanishX = w * 0.5;
        const vanishY = horizonY;
        const gridBottom = h;
        const gridDepth = gridBottom - vanishY;

        // Number of horizontal lines
        const hLineCount = 30;
        const gridCycleLength = gridDepth / hLineCount;
        const scrollOffset = (gridOffset % gridCycleLength) / gridCycleLength;

        // Horizontal grid lines (cyan) — perspective spacing
        for (let i = 0; i < hLineCount; i++) {
          // Exponential spacing for perspective
          const t = (i + scrollOffset) / hLineCount;
          const y = vanishY + gridDepth * (t * t);

          if (y < vanishY || y > gridBottom) continue;

          // Lines closer to camera are brighter and thicker
          const proximity = (y - vanishY) / gridDepth;
          const alpha = proximity * 0.8;
          const lineWidth = 0.5 + proximity * 2;

          ctx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
          ctx.lineWidth = lineWidth;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();

          // Glow
          if (proximity > 0.3) {
            ctx.strokeStyle = `rgba(0, 255, 255, ${alpha * 0.15})`;
            ctx.lineWidth = lineWidth * 4;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }
        }

        // Vertical grid lines (magenta) — converging to vanishing point
        const vLineCount = 24;
        const halfLines = vLineCount / 2;
        const spreadAtBottom = w * 1.2;

        for (let i = -halfLines; i <= halfLines; i++) {
          const xBottom = vanishX + (i / halfLines) * spreadAtBottom;

          // Distance from center affects brightness
          const centerDist = Math.abs(i) / halfLines;
          const alpha = lerp(0.7, 0.15, centerDist);

          ctx.strokeStyle = `rgba(255, 0, 180, ${alpha})`;
          ctx.lineWidth = lerp(1.5, 0.5, centerDist);
          ctx.beginPath();
          ctx.moveTo(vanishX, vanishY);
          ctx.lineTo(xBottom, gridBottom);
          ctx.stroke();

          // Glow for center lines
          if (centerDist < 0.5) {
            ctx.strokeStyle = `rgba(255, 0, 180, ${alpha * 0.12})`;
            ctx.lineWidth = lerp(6, 2, centerDist);
            ctx.beginPath();
            ctx.moveTo(vanishX, vanishY);
            ctx.lineTo(xBottom, gridBottom);
            ctx.stroke();
          }
        }

        // Horizon glow line
        const horizonGlow = ctx.createLinearGradient(0, vanishY - 8, 0, vanishY + 8);
        horizonGlow.addColorStop(0, 'rgba(255, 0, 180, 0)');
        horizonGlow.addColorStop(0.5, 'rgba(255, 0, 180, 0.5)');
        horizonGlow.addColorStop(1, 'rgba(255, 0, 180, 0)');
        ctx.fillStyle = horizonGlow;
        ctx.fillRect(0, vanishY - 8, w, 16);

        // ── Palm trees ──
        drawPalmTree(ctx, w * 0.08, horizonY + 2, h * 0.22, -0.8, time);
        drawPalmTree(ctx, w * 0.15, horizonY + 2, h * 0.16, -0.5, time);
        drawPalmTree(ctx, w * 0.85, horizonY + 2, h * 0.20, 0.7, time);
        drawPalmTree(ctx, w * 0.93, horizonY + 2, h * 0.24, 0.9, time);

        // ── Ambient glow overlay at bottom ──
        const ambientGlow = ctx.createRadialGradient(w * 0.5, h, 0, w * 0.5, h, w * 0.6);
        ambientGlow.addColorStop(0, 'rgba(255, 0, 180, 0.06)');
        ambientGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = ambientGlow;
        ctx.fillRect(0, horizonY, w, h - horizonY);
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: {
          fontSize: 6,
          charset: 'density',
          colorScheme: 'vapor',
          background: '#05000a',
          sourceOpacity: 0,
          crtEnabled: true,
          crtScanlines: 0.3,
          crtGlow: 0.4,
          crtDistortion: 0.02,
          crtFlicker: 0.03,
        },
        layers: [
          {
            fontSize: 4,
            charset: 'braille',
            colorScheme: 'neon',
            blendMode: 'add',
            opacity: 0.2,
          },
          {
            fontSize: 8,
            charset: 'density',
            edgeDetect: true,
            edgeCharset: 'box-light',
            edgeThreshold: 0.2,
            blendMode: 'add',
            opacity: 0.15,
          },
        ],
        draw,
        onResize(ctx, w, h) {
          initStars(w, h);
        },
      });
    </script>
  </body>
</html>
