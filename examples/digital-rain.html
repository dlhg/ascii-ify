<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Digital Rain</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
      .instructions {
        position: fixed;
        bottom: 12px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: monospace;
        font-size: 12px;
        color: rgba(0, 255, 65, 0.25);
        pointer-events: none;
        z-index: 10;
        letter-spacing: 1px;
      }
      .speed-indicator {
        position: fixed;
        top: 20px;
        right: 24px;
        font-family: monospace;
        font-size: 18px;
        color: #00ff41;
        pointer-events: none;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.15s;
        text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <div class="instructions">
      move mouse to part rain &middot; click for glitch &middot; scroll to change speed &middot; P panel &middot; E toggle
    </div>
    <div class="speed-indicator" id="speed-indicator"></div>
    <script type="module">
      import { AsciiIfy } from '../src/index.js';

      // ─── Source Canvas ────────────────────────────────────
      const source = document.getElementById('source');
      const sCtx = source.getContext('2d');
      const speedIndicator = document.getElementById('speed-indicator');

      function resizeSource() {
        source.width = window.innerWidth;
        source.height = window.innerHeight;
        initColumns();
      }
      resizeSource();
      window.addEventListener('resize', resizeSource);

      // ─── Rain State ─────────────────────────────────────
      const COL_WIDTH = 18;
      let columns = [];
      let speed = 1.0;
      let mouseX = -9999;
      let mouseY = -9999;
      const MOUSE_RADIUS = 150;
      let glitchBursts = [];
      let speedFadeTimer = 0;

      // Matrix character pool — katakana-inspired + digits + symbols
      const MATRIX_CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFZ<>{}|/\\=+*:;!?@#$%^&';

      function randomChar() {
        return MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
      }

      // ─── Column Class ───────────────────────────────────
      class Column {
        constructor(x, canvasHeight) {
          this.x = x;
          this.reset(canvasHeight, true);
        }

        reset(canvasHeight, scatter = false) {
          this.speed = 60 + Math.random() * 180;
          this.tailLength = 8 + Math.floor(Math.random() * 22);
          this.charSize = 14 + Math.floor(Math.random() * 4);
          this.y = scatter ? -(Math.random() * canvasHeight) : -(this.tailLength * this.charSize);
          this.chars = [];
          for (let i = 0; i < this.tailLength; i++) {
            this.chars.push(randomChar());
          }
          // Occasional char mutation timer
          this.mutateTimer = 0;
          this.mutateInterval = 0.05 + Math.random() * 0.1;
        }

        update(dt, globalSpeed, canvasHeight) {
          this.y += this.speed * globalSpeed * dt;

          // Mutate random chars in tail for flickering effect
          this.mutateTimer += dt;
          if (this.mutateTimer >= this.mutateInterval) {
            this.mutateTimer = 0;
            const idx = Math.floor(Math.random() * this.chars.length);
            this.chars[idx] = randomChar();
          }

          // Reset when fully off bottom
          if (this.y - this.tailLength * this.charSize > canvasHeight) {
            this.reset(canvasHeight);
          }
        }
      }

      function initColumns() {
        const w = source.width;
        const h = source.height;
        const count = Math.floor(w / COL_WIDTH);
        columns = [];
        for (let i = 0; i < count; i++) {
          const x = i * COL_WIDTH + COL_WIDTH * 0.5 + (Math.random() - 0.5) * 4;
          columns.push(new Column(x, h));
        }
      }
      initColumns();

      // ─── Glitch Burst ───────────────────────────────────
      class GlitchBurst {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 0;
          this.maxRadius = 120 + Math.random() * 80;
          this.alpha = 1.0;
          this.chars = [];
          const numChars = 20 + Math.floor(Math.random() * 16);
          for (let i = 0; i < numChars; i++) {
            this.chars.push({
              angle: (Math.PI * 2 * i) / numChars + (Math.random() - 0.5) * 0.3,
              char: randomChar(),
              offset: 0.6 + Math.random() * 0.4,
            });
          }
        }

        update(dt) {
          this.radius += 300 * dt;
          this.alpha -= 1.2 * dt;
          if (this.alpha < 0) this.alpha = 0;
          // Mutate some chars during burst
          if (Math.random() < 0.3) {
            const idx = Math.floor(Math.random() * this.chars.length);
            this.chars[idx].char = randomChar();
          }
        }

        get alive() {
          return this.alpha > 0.01;
        }
      }

      // ─── Mouse / Input ──────────────────────────────────
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      window.addEventListener('mouseleave', () => {
        mouseX = -9999;
        mouseY = -9999;
      });

      window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        mouseX = touch.clientX;
        mouseY = touch.clientY;
      }, { passive: true });

      window.addEventListener('touchend', () => {
        mouseX = -9999;
        mouseY = -9999;
      });

      // Click — glitch burst
      window.addEventListener('click', (e) => {
        glitchBursts.push(new GlitchBurst(e.clientX, e.clientY));
      });

      window.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        glitchBursts.push(new GlitchBurst(touch.clientX, touch.clientY));
      }, { passive: true });

      // Scroll — speed control
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        speed += e.deltaY * -0.003;
        speed = Math.max(0.2, Math.min(5.0, speed));
        speedIndicator.textContent = speed.toFixed(1) + 'x';
        speedIndicator.style.opacity = '1';
        speedFadeTimer = 1.0;
      }, { passive: false });

      // ─── Draw Source ────────────────────────────────────
      function drawSource(dt) {
        const w = source.width;
        const h = source.height;

        // Dark background with slight fade for trails
        sCtx.fillStyle = 'rgba(5, 5, 5, 0.35)';
        sCtx.fillRect(0, 0, w, h);

        // Update & draw columns
        for (const col of columns) {
          col.update(dt, speed, h);

          // Mouse repulsion — compute distance
          const dx = col.x - mouseX;
          const dy = col.y - mouseY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          let dimFactor = 1.0;
          let xOffset = 0;

          if (dist < MOUSE_RADIUS) {
            const proximity = 1 - dist / MOUSE_RADIUS;
            dimFactor = 0.1 + 0.9 * (1 - proximity * proximity);
            // Push column away from cursor horizontally
            const angle = Math.atan2(dy, dx);
            xOffset = Math.cos(angle) * proximity * 40;
          }

          const drawX = col.x + xOffset;

          // Draw tail segments (oldest to newest, bottom to top)
          for (let i = 0; i < col.tailLength; i++) {
            const segY = col.y - (col.tailLength - 1 - i) * col.charSize;
            if (segY < -col.charSize || segY > h + col.charSize) continue;

            // Fade factor: 0 at tail tip, 1 at head
            const fadeFactor = i / (col.tailLength - 1);
            const alpha = fadeFactor * fadeFactor * dimFactor;

            if (alpha < 0.02) continue;

            // Color: fade from dark green to bright green
            const g = Math.floor(40 + fadeFactor * 215);
            const r = Math.floor(fadeFactor * fadeFactor * 20);
            const b = Math.floor(fadeFactor * fadeFactor * 10);

            sCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
            sCtx.font = `${col.charSize}px monospace`;
            sCtx.fillText(col.chars[i], drawX, segY);
          }

          // Draw bright head
          if (col.y > -col.charSize && col.y < h + col.charSize) {
            const headAlpha = dimFactor;
            // Bright green-white head
            sCtx.fillStyle = `rgba(180, 255, 180, ${headAlpha})`;
            sCtx.font = `bold ${col.charSize}px monospace`;
            sCtx.fillText(randomChar(), drawX, col.y);

            // Head glow
            const glowSize = col.charSize * 1.5;
            const glow = sCtx.createRadialGradient(
              drawX + col.charSize * 0.3, col.y - col.charSize * 0.3,
              0,
              drawX + col.charSize * 0.3, col.y - col.charSize * 0.3,
              glowSize
            );
            glow.addColorStop(0, `rgba(0, 255, 65, ${0.25 * headAlpha})`);
            glow.addColorStop(1, 'rgba(0, 255, 65, 0)');
            sCtx.fillStyle = glow;
            sCtx.fillRect(
              drawX - glowSize + col.charSize * 0.3,
              col.y - glowSize - col.charSize * 0.3,
              glowSize * 2,
              glowSize * 2
            );
          }
        }

        // ─── Draw Glitch Bursts ─────────────────────────────
        for (let i = glitchBursts.length - 1; i >= 0; i--) {
          const burst = glitchBursts[i];
          burst.update(dt);

          if (!burst.alive) {
            glitchBursts.splice(i, 1);
            continue;
          }

          sCtx.font = 'bold 16px monospace';
          for (const c of burst.chars) {
            const r = burst.radius * c.offset;
            const cx = burst.x + Math.cos(c.angle) * r;
            const cy = burst.y + Math.sin(c.angle) * r;

            if (cx < -20 || cx > w + 20 || cy < -20 || cy > h + 20) continue;

            // Bright white-green flash that fades to green
            const flash = burst.alpha;
            const rr = Math.floor(100 * flash + 0);
            const gg = Math.floor(255 * flash);
            const bb = Math.floor(100 * flash);
            sCtx.fillStyle = `rgba(${rr}, ${gg}, ${bb}, ${flash * 0.9})`;
            sCtx.fillText(c.char, cx, cy);
          }

          // Central flash
          if (burst.alpha > 0.5) {
            const flashR = burst.maxRadius * 0.3 * burst.alpha;
            const grad = sCtx.createRadialGradient(
              burst.x, burst.y, 0,
              burst.x, burst.y, flashR
            );
            grad.addColorStop(0, `rgba(0, 255, 65, ${burst.alpha * 0.4})`);
            grad.addColorStop(0.5, `rgba(0, 200, 40, ${burst.alpha * 0.15})`);
            grad.addColorStop(1, 'rgba(0, 100, 20, 0)');
            sCtx.fillStyle = grad;
            sCtx.fillRect(burst.x - flashR, burst.y - flashR, flashR * 2, flashR * 2);
          }
        }

        // Speed indicator fade
        if (speedFadeTimer > 0) {
          speedFadeTimer -= dt;
          if (speedFadeTimer <= 0) {
            speedIndicator.style.opacity = '0';
          }
        }
      }

      // ─── ASCII-ify with Layers ────────────────────────────
      const ascii = new AsciiIfy(source, {
        background: '#08080c',
        sourceOpacity: 0,
        speed: 1,
      });

      // Layer 1: Rain columns — binary charset is the star
      ascii.addLayer({
        source: source,
        fontSize: 14,
        charset: 'binary',
        colorScheme: 'acid',
        blendMode: 'replace',
        opacity: 1,
      });

      // Layer 2: Head glow — same fontSize for precise registration
      ascii.addLayer({
        source: source,
        fontSize: 14,
        charset: 'density',
        colorScheme: 'neon',
        blendMode: 'add',
        opacity: 0.5,
      });

      // Layer 3: Interference — moiré pattern adds depth
      ascii.addLayer({
        source: source,
        fontSize: 10,
        charset: 'braille',
        colorScheme: 'mono',
        pattern: 'moiré',
        patternMix: 0.7,
        blendMode: 'add',
        opacity: 0.15,
      });

      // ─── Controls ─────────────────────────────────────────
      document.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') ascii.togglePanel();
        if (e.key === 'e' || e.key === 'E') ascii.set('enabled', !ascii.get('enabled'));
      });

      // ─── Main Loop ────────────────────────────────────────
      let lastTime = 0;

      function loop(time) {
        const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.05) : 0.016;
        lastTime = time;

        drawSource(dt);
        ascii.render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
