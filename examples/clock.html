<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Clock</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';

      // ─── Roman Numerals ────────────────────────────────────
      const NUMERALS = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];

      // ─── Draw Hand (filled tapered polygon) ────────────────
      function drawHand(ctx, cx, cy, angle, length, baseW, tipW, color) {
        const tipX = cx + Math.cos(angle) * length;
        const tipY = cy + Math.sin(angle) * length;
        const perp = angle + Math.PI / 2;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(tipX + Math.cos(perp) * tipW / 2, tipY + Math.sin(perp) * tipW / 2);
        ctx.lineTo(tipX - Math.cos(perp) * tipW / 2, tipY - Math.sin(perp) * tipW / 2);
        ctx.lineTo(cx - Math.cos(perp) * baseW / 2, cy - Math.sin(perp) * baseW / 2);
        ctx.lineTo(cx + Math.cos(perp) * baseW / 2, cy + Math.sin(perp) * baseW / 2);
        ctx.closePath();
        ctx.fill();
      }

      // ─── Draw ──────────────────────────────────────────────
      function draw(ctx, { width: w, height: h }) {
        const now = new Date();
        const hr = now.getHours() % 12;
        const mn = now.getMinutes();
        const sc = now.getSeconds();
        const ms = now.getMilliseconds();

        // Smooth continuous angles
        const secFrac = sc + ms / 1000;
        const minFrac = mn + secFrac / 60;
        const hourFrac = hr + minFrac / 60;

        const secAngle  = (secFrac / 60) * Math.PI * 2 - Math.PI / 2;
        const minAngle  = (minFrac / 60) * Math.PI * 2 - Math.PI / 2;
        const hourAngle = (hourFrac / 12) * Math.PI * 2 - Math.PI / 2;

        const cx = w / 2;
        const cy = h / 2;
        const radius = Math.min(w, h) * 0.38;

        // ── Background ──
        ctx.fillStyle = '#030308';
        ctx.fillRect(0, 0, w, h);

        // Vignette
        const vig = ctx.createRadialGradient(cx, cy, radius * 0.5, cx, cy, Math.max(w, h) * 0.8);
        vig.addColorStop(0, 'rgba(3, 3, 8, 0)');
        vig.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, w, h);

        // ── Clock Face ──
        // Outer ambient glow
        const ambient = ctx.createRadialGradient(cx, cy, radius * 0.85, cx, cy, radius * 1.25);
        ambient.addColorStop(0, 'rgba(80, 100, 160, 0.04)');
        ambient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = ambient;
        ctx.fillRect(0, 0, w, h);

        // Face fill
        ctx.fillStyle = '#08080f';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        // Outer ring
        ctx.strokeStyle = '#708098';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        // Inner decorative ring
        ctx.strokeStyle = '#303848';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.92, 0, Math.PI * 2);
        ctx.stroke();

        // Second track ring
        ctx.strokeStyle = '#1c2030';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.82, 0, Math.PI * 2);
        ctx.stroke();

        // ── Minute Markers ──
        for (let i = 0; i < 60; i++) {
          if (i % 5 === 0) continue;
          const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
          const r1 = radius * 0.89;
          const r2 = radius * 0.92;
          ctx.strokeStyle = '#3a4050';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
          ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
          ctx.stroke();
        }

        // ── Hour Markers ──
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
          const r1 = radius * 0.84;
          const r2 = radius * 0.92;
          ctx.strokeStyle = i % 3 === 0 ? '#b0c0d8' : '#8090a8';
          ctx.lineWidth = i % 3 === 0 ? 4 : 2.5;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
          ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
          ctx.stroke();
        }

        // ── Roman Numerals ──
        ctx.font = `bold ${radius * 0.1 | 0}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#8898b0';

        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
          const nx = cx + Math.cos(a) * radius * 0.7;
          const ny = cy + Math.sin(a) * radius * 0.7;
          ctx.fillText(NUMERALS[i], nx, ny);
        }

        // ── Hour Hand ──
        drawHand(ctx, cx, cy, hourAngle, radius * 0.5, 14, 5, '#c0d0e0');

        // ── Minute Hand ──
        drawHand(ctx, cx, cy, minAngle, radius * 0.72, 10, 3, '#b0c4d8');

        // ── Second Hand ──
        // Main sweep
        drawHand(ctx, cx, cy, secAngle, radius * 0.78, 3, 1.5, '#ff5544');
        // Counter-weight tail
        const tailAngle = secAngle + Math.PI;
        drawHand(ctx, cx, cy, tailAngle, radius * 0.18, 5, 3, '#ff5544');

        // Second tip glow
        const tipX = cx + Math.cos(secAngle) * radius * 0.78;
        const tipY = cy + Math.sin(secAngle) * radius * 0.78;
        const tipGlow = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 12);
        tipGlow.addColorStop(0, 'rgba(255, 85, 68, 0.35)');
        tipGlow.addColorStop(1, 'rgba(255, 85, 68, 0)');
        ctx.fillStyle = tipGlow;
        ctx.beginPath();
        ctx.arc(tipX, tipY, 12, 0, Math.PI * 2);
        ctx.fill();

        // ── Center Cap ──
        ctx.fillStyle = '#a0b0c8';
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d0dce8';
        ctx.beginPath();
        ctx.arc(cx, cy, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // ─── App ───────────────────────────────────────────────
      createApp({
        asciiConfig: {
          fontSize: 14,
          colorScheme: 'neon',
          background: '#030308',
          sourceOpacity: 0,
          edgeDetect: true,
          edgeCharset: 'box-light',
          edgeThreshold: 0.1,
          crtEnabled: true,
          crtScanlines: 0.2,
          crtGlow: 0.6,
          crtDistortion: 0.1,
          crtFlicker: 0.02,
        },
        draw,
      });
    </script>
  </body>
</html>
