<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Reaction Diffusion</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { clamp } from './utils.js';

      // ─── Presets ──────────────────────────────────────────
      const PRESETS = [
        { name: 'Coral',    f: 0.0545, k: 0.062  },
        { name: 'Mitosis',  f: 0.0367, k: 0.0649 },
        { name: 'Maze',     f: 0.029,  k: 0.057  },
        { name: 'Solitons', f: 0.039,  k: 0.058  },
        { name: 'Worms',    f: 0.078,  k: 0.061  },
      ];

      let presetIdx = 0;
      let feedRate = PRESETS[0].f;
      let killRate = PRESETS[0].k;

      // Diffusion rates
      const Da = 1.0;
      const Db = 0.5;

      // ─── Grid ─────────────────────────────────────────────
      const SCALE = 4; // simulation runs at canvas_size / SCALE
      let gw, gh;
      let curA, curB, nxtA, nxtB;

      // Offscreen canvas for rendering the simulation to an image
      let simCanvas, simCtx, simImage;

      function initGrid(w, h) {
        gw = Math.floor(w / SCALE);
        gh = Math.floor(h / SCALE);
        const len = gw * gh;

        curA = new Float32Array(len);
        curB = new Float32Array(len);
        nxtA = new Float32Array(len);
        nxtB = new Float32Array(len);

        // Fill A=1, B=0 everywhere
        curA.fill(1.0);
        curB.fill(0.0);

        // Create offscreen canvas
        simCanvas = document.createElement('canvas');
        simCanvas.width = gw;
        simCanvas.height = gh;
        simCtx = simCanvas.getContext('2d');
        simImage = simCtx.createImageData(gw, gh);
      }

      // ─── Seed ─────────────────────────────────────────────
      function seedCircle(cx, cy, radius) {
        const r2 = radius * radius;
        for (let dy = -radius; dy <= radius; dy++) {
          for (let dx = -radius; dx <= radius; dx++) {
            if (dx * dx + dy * dy > r2) continue;
            const x = ((cx + dx) % gw + gw) % gw;
            const y = ((cy + dy) % gh + gh) % gh;
            const i = y * gw + x;
            curB[i] = 1.0;
          }
        }
      }

      function seedRandom() {
        // Clear
        curA.fill(1.0);
        curB.fill(0.0);

        // Place several random seed circles
        const count = 6 + Math.floor(Math.random() * 6);
        for (let n = 0; n < count; n++) {
          const cx = Math.floor(Math.random() * gw);
          const cy = Math.floor(Math.random() * gh);
          const r = 3 + Math.floor(Math.random() * 5);
          seedCircle(cx, cy, r);
        }
      }

      // ─── Laplacian (9-point stencil, toroidal) ────────────
      function laplacian(arr, x, y) {
        const xm = (x - 1 + gw) % gw;
        const xp = (x + 1) % gw;
        const ym = (y - 1 + gh) % gh;
        const yp = (y + 1) % gh;

        return (
          arr[ym * gw + xm] * 0.05 +
          arr[ym * gw + x ] * 0.2  +
          arr[ym * gw + xp] * 0.05 +
          arr[y  * gw + xm] * 0.2  +
          arr[y  * gw + x ] * -1.0 +
          arr[y  * gw + xp] * 0.2  +
          arr[yp * gw + xm] * 0.05 +
          arr[yp * gw + x ] * 0.2  +
          arr[yp * gw + xp] * 0.05
        );
      }

      // ─── Simulate N steps ─────────────────────────────────
      function simulate(steps) {
        const dt = 1.0;
        for (let s = 0; s < steps; s++) {
          for (let y = 0; y < gh; y++) {
            for (let x = 0; x < gw; x++) {
              const i = y * gw + x;
              const a = curA[i];
              const b = curB[i];
              const abb = a * b * b;
              const lA = laplacian(curA, x, y);
              const lB = laplacian(curB, x, y);

              nxtA[i] = clamp(a + (Da * lA - abb + feedRate * (1.0 - a)) * dt, 0, 1);
              nxtB[i] = clamp(b + (Db * lB + abb - (killRate + feedRate) * b) * dt, 0, 1);
            }
          }
          // Swap buffers
          const tmpA = curA; curA = nxtA; nxtA = tmpA;
          const tmpB = curB; curB = nxtB; nxtB = tmpB;
        }
      }

      // ─── Render simulation to offscreen canvas ────────────
      // Color gradient: dark purple -> deep blue -> cyan -> white
      function bToColor(b) {
        // Remap b for visual contrast
        const v = clamp(b * 2.5, 0, 1);

        let r, g, bl;
        if (v < 0.25) {
          // Dark purple/black -> deep blue
          const t = v / 0.25;
          r = 8 + t * 15;
          g = 2 + t * 5;
          bl = 20 + t * 60;
        } else if (v < 0.5) {
          // Deep blue -> teal
          const t = (v - 0.25) / 0.25;
          r = 23 - t * 10;
          g = 7 + t * 80;
          bl = 80 + t * 60;
        } else if (v < 0.75) {
          // Teal -> cyan
          const t = (v - 0.5) / 0.25;
          r = 13 + t * 40;
          g = 87 + t * 100;
          bl = 140 + t * 60;
        } else {
          // Cyan -> bright white
          const t = (v - 0.75) / 0.25;
          r = 53 + t * 202;
          g = 187 + t * 68;
          bl = 200 + t * 55;
        }

        return [r | 0, g | 0, bl | 0];
      }

      function renderSim() {
        const data = simImage.data;
        for (let y = 0; y < gh; y++) {
          for (let x = 0; x < gw; x++) {
            const i = y * gw + x;
            const pi = i * 4;
            const [r, g, b] = bToColor(curB[i]);
            data[pi]     = r;
            data[pi + 1] = g;
            data[pi + 2] = b;
            data[pi + 3] = 255;
          }
        }
        simCtx.putImageData(simImage, 0, 0);
      }

      // ─── Mouse Interaction ────────────────────────────────
      let mouseDown = false;

      function seedAtMouse(e) {
        const rect = app.canvas.getBoundingClientRect();
        const clientX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
        const clientY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
        const mx = (clientX - rect.left) / rect.width;
        const my = (clientY - rect.top) / rect.height;
        const gx = Math.floor(mx * gw);
        const gy = Math.floor(my * gh);
        seedCircle(gx, gy, 3);
      }

      // ─── Preset Notification ──────────────────────────────
      let presetMsg = '';
      let presetMsgTime = 0;

      function showPresetMsg(name) {
        presetMsg = name;
        presetMsgTime = 2.0;
      }

      // ─── Draw ─────────────────────────────────────────────
      function draw(ctx, { time, dt, width: w, height: h }) {
        if (!curA) return; // not initialized yet

        // Run simulation steps
        simulate(10);

        // Render simulation to offscreen canvas
        renderSim();

        // Draw simulation scaled up to full canvas
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(simCanvas, 0, 0, w, h);

        // Preset notification fade
        if (presetMsgTime > 0) {
          presetMsgTime -= dt;
          const alpha = clamp(presetMsgTime / 0.5, 0, 1);
          ctx.save();
          ctx.font = 'bold 18px monospace';
          ctx.textAlign = 'center';
          ctx.fillStyle = `rgba(180, 230, 255, ${alpha * 0.9})`;
          ctx.fillText(presetMsg, w / 2, 40);
          ctx.restore();
        }

        // HUD
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.fillText(
          'click to seed \u00b7 1-5 presets \u00b7 space reset \u00b7 P panel \u00b7 E toggle',
          w / 2, h - 14,
        );
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: {
          background: '#050510',
          sourceOpacity: 0,
          speed: 1,
        },
        layers: [
          {
            fontSize: 6,
            charset: 'braille',
            colorScheme: 'vapor',
            blendMode: 'replace',
            opacity: 1,
          },
          {
            fontSize: 6,
            edgeDetect: true,
            edgeThreshold: 0.12,
            edgeCharset: 'box-light',
            colorScheme: 'ocean',
            blendMode: 'add',
            opacity: 0.4,
          },
        ],
        draw,
        onResize(ctx, w, h) {
          initGrid(w, h);
          seedRandom();
        },
        onKeydown(e) {
          // Number keys 1-5: switch preset
          const num = parseInt(e.key, 10);
          if (num >= 1 && num <= 5) {
            presetIdx = num - 1;
            feedRate = PRESETS[presetIdx].f;
            killRate = PRESETS[presetIdx].k;
            showPresetMsg(`${num}. ${PRESETS[presetIdx].name}  (f=${feedRate}, k=${killRate})`);
            return;
          }
          // Spacebar: reset
          if (e.key === ' ') {
            e.preventDefault();
            seedRandom();
            return;
          }
        },
        showPanel: true,
      });

      // ─── Mouse / Touch Events ─────────────────────────────
      app.canvas.addEventListener('mousedown', (e) => {
        mouseDown = true;
        seedAtMouse(e);
      });
      app.canvas.addEventListener('mousemove', (e) => {
        if (mouseDown) seedAtMouse(e);
      });
      window.addEventListener('mouseup', () => { mouseDown = false; });

      app.canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        seedAtMouse(e);
      }, { passive: false });
      app.canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        seedAtMouse(e);
      }, { passive: false });

      // ─── Initial Setup ────────────────────────────────────
      initGrid(app.width, app.height);
      seedRandom();
    </script>
  </body>
</html>
