<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Text Portal</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, clamp, smoothstep } from './utils.js';

      // ─── Words in different scripts ─────────────────────
      const WORDS = [
        'DREAM',    // English
        'МЕЧТА',    // Russian (Cyrillic) — dream
        '夢',       // Japanese (Kanji) — dream
        'حلم',      // Arabic — dream
        '꿈',       // Korean — dream
        'ΦΩΤΙΑ',    // Greek — fire
        'सपना',     // Hindi (Devanagari) — dream
        '光',       // Chinese (Hanzi) — light
        'СВЕТ',     // Russian (Cyrillic) — light
        'ひかり',    // Japanese (Hiragana) — light
        'نور',      // Arabic — light
        '빛',       // Korean — light
        'ΟΝΕΙΡΟ',   // Greek — dream
        'ฝัน',      // Thai — dream
        '梦想',      // Chinese — dream
        'CHAOS',    // English
        'ユメ',      // Japanese (Katakana) — dream
        'ТЕНЬ',     // Russian (Cyrillic) — shadow
        '영혼',      // Korean — soul
        'आग',       // Hindi (Devanagari) — fire
      ];
      const WORD_DURATION = 3.5; // seconds per word
      let wordIndex = 0;

      // ─── Particles for dissolve ─────────────────────────
      const particles = [];

      function spawnDissolveParticles(text, fontSize, w, h) {
        particles.length = 0;
        // Measure actual text width for accurate particle placement
        const measureCanvas = document.createElement('canvas');
        const measureCtx = measureCanvas.getContext('2d');
        measureCtx.font = `bold ${fontSize}px "Noto Sans", "Arial Unicode MS", sans-serif`;
        const totalWidth = measureCtx.measureText(text).width;
        const charWidth = totalWidth / Math.max(text.length, 1);

        const startX = (w - totalWidth) / 2;

        for (let i = 0; i < text.length; i++) {
          const cx = startX + i * charWidth + charWidth / 2;
          const cy = h / 2;
          // Multiple particles per letter
          for (let j = 0; j < 8; j++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 80 + Math.random() * 200;
            particles.push({
              x: cx + (Math.random() - 0.5) * charWidth * 0.6,
              y: cy + (Math.random() - 0.5) * fontSize * 0.6,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 1,
              decay: 1.5 + Math.random() * 1.5,
              size: 3 + Math.random() * 5,
            });
          }
        }
      }

      // ─── Draw Generative Content ────────────────────────
      function drawContent(ctx, t, w, h) {
        // Dark base
        ctx.fillStyle = '#030308';
        ctx.fillRect(0, 0, w, h);

        // Plasma waves
        const cx = w / 2, cy = h / 2;
        for (let i = 0; i < 8; i++) {
          const angle = t * (0.15 + i * 0.05) + i * 0.785;
          const d = Math.min(w, h) * (0.12 + 0.08 * Math.sin(t * 0.3 + i));
          const gx = cx + Math.cos(angle) * d;
          const gy = cy + Math.sin(angle) * d;
          const r = Math.min(w, h) * (0.15 + 0.08 * Math.sin(t * 0.5 + i * 2));

          const hue = (t * 40 + i * 45) % 360;
          const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
          grad.addColorStop(0, `hsla(${hue}, 90%, 55%, 0.45)`);
          grad.addColorStop(0.4, `hsla(${hue + 20}, 80%, 40%, 0.2)`);
          grad.addColorStop(1, `hsla(${hue + 40}, 70%, 30%, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(gx, gy, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Flowing trails
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 20; i++) {
          const startAngle = i * 0.314 + t * 0.2;
          const r = ((i * 0.618 + t * 0.03) % 1) * Math.min(w, h) * 0.4;
          const hue = (i * 18 + t * 60) % 360;
          ctx.strokeStyle = `hsla(${hue}, 85%, 55%, 0.3)`;
          ctx.beginPath();
          for (let j = 0; j < 20; j++) {
            const tt = j / 20;
            const a = startAngle + tt * 2;
            const rr = r * (1 - tt * 0.3);
            const px = cx + Math.cos(a) * rr;
            const py = cy + Math.sin(a) * rr;
            if (j === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        // Bright sparkles
        for (let i = 0; i < 50; i++) {
          const angle = i * 2.399 + t * 0.4;
          const r = ((i * 0.618 + t * 0.05) % 1) * Math.min(w, h) * 0.45;
          const px = cx + Math.cos(angle) * r;
          const py = cy + Math.sin(angle) * r;
          const alpha = 0.4 + 0.4 * Math.sin(t * 5 + i * 2.1);
          const hue = (i * 25 + t * 70) % 360;

          ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
          ctx.beginPath();
          ctx.arc(px, py, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ─── Draw Text Mask ─────────────────────────────────
      function drawTextMask(ctx, t, w, h) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        const cycleT = t % WORD_DURATION;
        const newIndex = Math.floor(t / WORD_DURATION) % WORDS.length;

        // Trigger dissolve on word change
        if (newIndex !== wordIndex) {
          const fontSize = Math.min(w * 0.14, h * 0.28);
          spawnDissolveParticles(WORDS[wordIndex], fontSize, w, h);
          wordIndex = newIndex;
        }

        const word = WORDS[wordIndex];
        const fontSize = Math.min(w * 0.14, h * 0.28);
        ctx.font = `bold ${fontSize}px "Noto Sans", "Arial Unicode MS", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Phase: 0-0.15 scale in, 0.15-0.8 hold, 0.8-1.0 dissolve
        const phase = cycleT / WORD_DURATION;

        if (phase < 0.15) {
          // Scale in with elastic ease
          const p = phase / 0.15;
          const elastic = 1 - Math.pow(2, -10 * p) * Math.cos(p * 5 * Math.PI);
          const scale = elastic;

          ctx.save();
          ctx.translate(w / 2, h / 2);
          ctx.scale(scale, scale);

          // Glow
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 25;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(word, 0, 0);
          ctx.shadowBlur = 0;
          ctx.fillText(word, 0, 0);
          ctx.restore();
        } else if (phase < 0.8) {
          // Hold — gentle floating
          const holdT = (phase - 0.15) / 0.65;
          const floatY = Math.sin(holdT * Math.PI * 2) * 5;
          const rot = Math.sin(holdT * Math.PI) * 0.02;

          ctx.save();
          ctx.translate(w / 2, h / 2 + floatY);
          ctx.rotate(rot);

          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 20;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(word, 0, 0);
          ctx.shadowBlur = 0;
          ctx.fillText(word, 0, 0);
          ctx.restore();
        } else {
          // Dissolve — fade out + particles
          const dissolveT = (phase - 0.8) / 0.2;
          const alpha = 1 - dissolveT;

          if (alpha > 0.01) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(w / 2, h / 2);
            const scale = 1 + dissolveT * 0.3;
            ctx.scale(scale, scale);

            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15 + dissolveT * 30;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(word, 0, 0);
            ctx.restore();
          }

          // Update and draw particles
          const dt = 0.016;
          for (const p of particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= p.decay * dt;
            if (p.life > 0) {
              ctx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.6})`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: { background: '#02020a', sourceOpacity: 0 },
        layers: [
          // Layer 1: Generative visuals — visible through text
          { fontSize: 5, charset: 'braille', colorScheme: 'rainbow', opacity: 1 },
          // Layer 2: Secondary detail — visible through text
          { fontSize: 4, charset: 'density', colorScheme: 'neon', blendMode: 'add', opacity: 0.4 },
          // Layer 3: Outside texture — visible where text ISN'T
          { fontSize: 18, charset: 'minimal', colorScheme: 'mono', pattern: 'moiré', patternMix: 0.5, opacity: 0.06 },
          // Layer 4: Text mask — invisible
          { fontSize: 4, charset: 'blocks', colorScheme: 'mono', opacity: 0 },
        ],
        draw(ctx, { time, dt, width: w, height: h }) {
          drawContent(ctx, time / 1000, w, h);
        },
      });

      // ─── Mask Setup ─────────────────────────────────────
      const maskCanvas = document.createElement('canvas');
      const maskCtx = maskCanvas.getContext('2d');

      function resizeMask() {
        maskCanvas.width = app.canvas.width;
        maskCanvas.height = app.canvas.height;
      }
      resizeMask();
      window.addEventListener('resize', resizeMask);

      const layers = app.ascii.layers;
      layers[0].set('visible', false);
      layers[4].set('source', maskCanvas);

      // Visuals through text (normal mask)
      layers[1].set('maskLayer', layers[4].id);
      layers[2].set('maskLayer', layers[4].id);

      // Outside texture (inverted mask)
      layers[3].set('maskLayer', layers[4].id);
      layers[3].set('invertMask', true);

      app.ascii.on('render', () => {
        const t = performance.now() / 1000;
        drawTextMask(maskCtx, t, maskCanvas.width, maskCanvas.height);
      });
    </script>
  </body>
</html>
