<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify - Skyline EQ</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #02020a; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { clamp, mulberry32 } from './utils.js';
      import { envelope, hits } from './music.js';

      // ── Skyline EQ ───────────────────────────────────────────────
      // The city is a spectrum analyser. Towers on the left light floor by
      // floor with the bass, the middle with the mids, the right with the
      // highs, and each keeps a bright peak floor that falls back slowly.
      // Kicks strobe the aircraft beacons and the skyglow; snares throw the
      // downtown searchlights to a new angle; loudness speeds up the traffic.
      const PARAMS = [
        { key: 'low', label: 'Low towers', min: 0, max: 1, def: 0.25 },
        { key: 'mid', label: 'Middle towers', min: 0, max: 1, def: 0.2 },
        { key: 'high', label: 'High towers', min: 0, max: 1, def: 0.15 },
        { key: 'strobe', label: 'Beacon strobe (hits)', min: 0, max: 1, def: 0 },
        { key: 'beams', label: 'Searchlights (hits)', min: 0, max: 1, def: 0 },
        { key: 'traffic', label: 'Traffic', min: 0, max: 1, def: 0.2 },
      ];
      const FLOOR = 11;   // storey height, world units
      const bandEnv = [envelope(0.04, 0.18), envelope(0.04, 0.18), envelope(0.03, 0.15)];
      const trafficEnv = envelope(0.3, 0.8), strobeEnv = envelope(0.005, 0.25);
      const strobeHits = hits(), beamHits = hits();
      const levels = [0, 0, 0];
      let strobe = 0, traffic = 0;
      const beams = [{ angle: -0.35, target: -0.35, flare: 0 }, { angle: 0.3, target: 0.3, flare: 0 }];

      // ─── World Layout ───────────────────────────────────
      const SPX = 66;          // block spacing (lateral, X)
      const SPZ = 72;          // block spacing (depth, Z)
      const Z0 = 90;           // nearest row depth
      const COL_MIN = -6, COL_MAX = 6;
      const ROW_MIN = 0, ROW_MAX = 34;
      const DOWNTOWN_ROW = 29; // far cluster of tall towers sits here
      const DECK_Y = 27;       // top of the viaduct deck
      const DECK_HW = 9;       // deck half-width
      const NEAR = 1;
      const CAR_LEN = 32, CAR_GAP = 6, NCARS = 6;
      const TRAIN_SPAN = NCARS * (CAR_LEN + CAR_GAP);
      const TRACK_Z0 = 70;
      const TRACK_Z1 = Z0 + ROW_MAX * SPZ;
      const PILLAR_STEP = 150;
      const TRACKS = [
        { x: -99, deckY: DECK_Y, deckHW: DECK_HW, speed: 150, dir: -1, headZ: TRACK_Z1, body: '24,24,32', side: '16,16,22', top: '30,30,40', windows: '255,225,150' },
        { x: 116, deckY: DECK_Y - 5, deckHW: DECK_HW, speed: 118, dir: 1, headZ: TRACK_Z0 - TRAIN_SPAN, body: '18,28,34', side: '11,18,24', top: '24,38,44', windows: '145,225,255' },
      ];

      const rng = mulberry32(4242);

      // ─── Camera ─────────────────────────────────────────
      const cam = { x: 130, y: 118, z: -35, yaw: -0.16, pitch: -0.29 };
      let W = 0, H = 0, focal = 800, horizonY = 0;

      function computeView() {
        focal = H * 1.02;
        horizonY = H / 2 + focal * Math.tan(cam.pitch);
      }

      function toCam(wx, wy, wz) {
        const dx = wx - cam.x, dy = wy - cam.y, dz = wz - cam.z;
        const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
        const rx = dx * cy - dz * sy;
        const rz1 = dx * sy + dz * cy;
        const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
        const ry = dy * cp - rz1 * sp;
        const rz = dy * sp + rz1 * cp;
        return { rx, ry, rz };
      }

      function project(wx, wy, wz) {
        const c = toCam(wx, wy, wz);
        if (c.rz <= NEAR) return null;
        const s = focal / c.rz;
        return { x: W / 2 + c.rx * s, y: H / 2 - c.ry * s, z: c.rz, s };
      }

      // ─── Building Generation ────────────────────────────
      let buildings = [];

      function makeWindows(b) {
        const wins = [];
        const stepX = 9, stepY = FLOOR, inset = 5;
        // front face (toward camera, -Z), side face chosen toward avenue center
        const frontZ = b.z - b.d / 2;
        const sideSign = b.x < 0 ? 1 : -1;
        const sideX = b.x + sideSign * b.w / 2;

        const addWin = (wx, wy, wz) => {
          const ambient = rng() < 0.18;
          let col;
          const hue = rng();
          if (hue < 0.72) col = [255, 205 + rng() * 45, 120 + rng() * 60]; // warm
          else if (hue < 0.9) col = [150, 195, 255];                            // cool
          else if (hue < 0.96) col = [255, 255, 235];                           // white
          else col = [255, 90, 60];                                             // red
          wins.push({
            x: wx, y: wy, z: wz,
            col, ambient,
            bright: 0.55 + rng() * 0.6,
            tw: 0.4 + rng() * 1.6,
            ph: rng() * Math.PI * 2,
            flick: rng() < 0.22,
          });
        };

        for (let wy = inset; wy < b.h - inset; wy += stepY) {
          for (let wx = -b.w / 2 + inset; wx < b.w / 2 - inset; wx += stepX)
            addWin(b.x + wx, wy, frontZ);
          for (let wz = -b.d / 2 + inset; wz < b.d / 2 - inset; wz += stepX)
            addWin(sideX, wy, b.z + wz);
        }
        return wins;
      }

      function initCity() {
        buildings = [];
        for (let col = COL_MIN; col <= COL_MAX; col++) {
          for (let row = ROW_MIN; row <= ROW_MAX; row++) {
            if (rng() < 0.22) continue; // plazas / streets
            const x = col * SPX + (rng() - 0.5) * 12;
            const z = Z0 + row * SPZ + (rng() - 0.5) * 12;
            // keep the viaduct avenues clear
            if (TRACKS.some((track) => x > track.x - 30 && x < track.x + 30)) continue;

            const w = 32 + rng() * 22;
            const d = 32 + rng() * 22;
            const dtf = clamp(1 - (Math.abs(col) / 3.2 + Math.abs(row - DOWNTOWN_ROW) / 9), 0, 1);
            const h = 30 + rng() * 75 + Math.pow(dtf, 1.5) * (150 + rng() * 95);
            const b = {
              x, z, w, d, h,
              band: col < -2 ? 0 : col > 2 ? 2 : 1,
              gain: 0.75 + rng() * 0.5,
              fill: 0, peak: 0,
              beacon: h > 120 ? { ph: rng() * Math.PI * 2, sp: 1.4 + rng() * 1.2 } : null,
            };
            b.wins = makeWindows(b);
            buildings.push(b);
          }
        }
      }

      // ─── Draw Helpers ───────────────────────────────────
      function fillQuad(ctx, a, b, c, d, style) {
        const pa = project(a[0], a[1], a[2]);
        const pb = project(b[0], b[1], b[2]);
        const pc = project(c[0], c[1], c[2]);
        const pd = project(d[0], d[1], d[2]);
        if (!pa || !pb || !pc || !pd) return;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.lineTo(pc.x, pc.y);
        ctx.lineTo(pd.x, pd.y);
        ctx.closePath();
        ctx.fillStyle = style;
        ctx.fill();
      }

      function drawBox(ctx, cx, cz, hw, hd, y0, y1, front, side, top) {
        const x0 = cx - hw, x1 = cx + hw, z0 = cz - hd, z1 = cz + hd;
        // top
        if (top) fillQuad(ctx, [x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1], top);
        // front face (toward camera)
        fillQuad(ctx, [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], front);
        // visible side
        if (cx < cam.x)
          fillQuad(ctx, [x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0], side);
        else
          fillQuad(ctx, [x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], side);
      }

      function drawWindow(ctx, wx, wy, wz, col, alpha) {
        const p = project(wx, wy, wz);
        if (!p || p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) return;
        const sz = Math.max(1, 3.0 * p.s);
        ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
        ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
        if (p.s > 0.9 && alpha > 0.4) {
          const g = sz * 2.4;
          ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.14})`;
          ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
        }
      }

      function drawBuilding(ctx, b, t) {
        drawBox(ctx, b.x, b.z, b.w / 2, b.d / 2, 0, b.h,
          'rgb(13,14,23)', 'rgb(8,9,16)', 'rgb(18,19,30)');
        // Floors below the band level are lit; the peak floor glows white.
        const floor = FLOOR / b.h;
        for (const win of b.wins) {
          const f = win.y / b.h;
          const peak = Math.abs(f - b.peak) < floor * 0.6 && b.peak > floor;
          if (peak) { drawWindow(ctx, win.x, win.y, win.z, [255, 250, 240], 1); continue; }
          const lit = f < b.fill;
          if (!lit && !win.ambient) continue;
          let inten = win.bright * (0.62 + 0.38 * Math.sin(t * win.tw + win.ph)) * (lit ? 1.25 : 0.45);
          if (win.flick && Math.sin(t * 0.35 + win.ph) < -0.7) inten *= 0.12;
          drawWindow(ctx, win.x, win.y, win.z, win.col, clamp(inten, 0, 1));
        }
        // aircraft warning beacon on tall towers; kicks strobe them all together
        if (b.beacon) {
          const blink = Math.max(Math.sin(t * b.beacon.sp + b.beacon.ph) > 0.3 ? 0.6 : 0.08, strobe);
          const p = project(b.x, b.h + 3, b.z);
          if (p) {
            const sz = Math.max(1.5, 3 * p.s);
            ctx.fillStyle = `rgba(255,50,40,${0.9 * blink})`;
            ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
            const g = sz * 5;
            ctx.fillStyle = `rgba(255,50,40,${0.18 * blink})`;
            ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
          }
        }
      }

      // ─── Elevated Tracks + Trains ───────────────────────
      function drawTrackSegment(ctx, track, z0, z1) {
        // deck slab
        drawBox(ctx, track.x, (z0 + z1) / 2, track.deckHW, (z1 - z0) / 2, track.deckY - 5, track.deckY,
          'rgb(16,16,22)', 'rgb(10,10,15)', 'rgb(22,22,30)');
      }

      function drawPillar(ctx, track, z) {
        drawBox(ctx, track.x, z, 4, 4, 0, track.deckY - 5,
          'rgb(11,11,16)', 'rgb(7,7,11)', null);
      }

      function updateTrains(dt) {
        for (const track of TRACKS) {
          track.headZ += track.speed * track.dir * dt;
          if (track.dir < 0 && track.headZ < TRACK_Z0 - TRAIN_SPAN) track.headZ = TRACK_Z1 + TRAIN_SPAN;
          if (track.dir > 0 && track.headZ > TRACK_Z1 + TRAIN_SPAN) track.headZ = TRACK_Z0 - TRAIN_SPAN;
        }
      }

      function drawTrainCar(ctx, track, cz, t, isHead, isTail) {
        const y0 = track.deckY, y1 = track.deckY + 17;
        drawBox(ctx, track.x, cz, track.deckHW - 1, CAR_LEN / 2, y0, y1,
          `rgb(${track.body})`, `rgb(${track.side})`, `rgb(${track.top})`);
        // lit window strip on the +X face (toward camera)
        const winY = y0 + 9;
        const faceX = track.x + track.deckHW - 1;
        for (let dz = -CAR_LEN / 2 + 4; dz < CAR_LEN / 2 - 3; dz += 5) {
          const flick = Math.sin(t * 6 + dz + cz * 0.1) > -0.85 ? 1 : 0.3;
          const p = project(faceX, winY, cz + dz);
          if (!p) continue;
          const sz = Math.max(1, 4 * p.s);
          ctx.fillStyle = `rgba(${track.windows},${0.9 * flick})`;
          ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz * 0.7);
          const g = sz * 2.2;
          ctx.fillStyle = `rgba(${track.windows},${0.15 * flick})`;
          ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
        }
        // headlight / taillight
        if (isHead || isTail) {
          const endZ = cz + (isHead ? track.dir : -track.dir) * CAR_LEN / 2;
          const p = project(track.x, track.deckY + 5, endZ);
          if (p) {
            const sz = Math.max(2, 5 * p.s);
            const c = isHead ? '255,245,220' : '255,60,40';
            ctx.fillStyle = `rgba(${c},0.95)`;
            ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
            const g = sz * 4;
            ctx.fillStyle = `rgba(${c},0.16)`;
            ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
          }
        }
      }

      // ─── Street Traffic ─────────────────────────────────
      const cars = [];
      function initCars() {
        cars.length = 0;
        const lanes = [-2 * SPX + 33, -33, 33, 2 * SPX + 33];
        for (let i = 0; i < 26; i++) {
          const lane = lanes[Math.floor(rng() * lanes.length)];
          cars.push({
            x: lane + (rng() - 0.5) * 6,
            z: TRACK_Z0 + rng() * (TRACK_Z1 - TRACK_Z0),
            vz: (rng() < 0.5 ? -1 : 1) * (55 + rng() * 70),
            red: rng() < 0.4,
          });
        }
      }
      function updateCars(dt) {
        for (const c of cars) {
          c.z += c.vz * dt * (0.5 + traffic * 3);
          if (c.z < TRACK_Z0) c.z += (TRACK_Z1 - TRACK_Z0);
          if (c.z > TRACK_Z1) c.z -= (TRACK_Z1 - TRACK_Z0);
        }
      }
      function drawCar(ctx, c) {
        const p = project(c.x, 2.5, c.z);
        if (!p || p.x < -30 || p.x > W + 30) return;
        const sz = Math.max(1, 3 * p.s);
        const col = c.red ? '255,45,30' : '255,240,205';
        ctx.fillStyle = `rgba(${col},0.95)`;
        ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz * 0.8);
        const g = sz * 3.5;
        ctx.fillStyle = `rgba(${col},0.12)`;
        ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
      }

      // ─── Sky ────────────────────────────────────────────
      let stars = [];
      function initStars() {
        stars = [];
        for (let i = 0; i < 120; i++)
          stars.push({ x: rng(), y: rng(), b: 0.1 + rng() * 0.35, sp: 0.3 + rng() * 1.8, ph: rng() * 6.28 });
      }

      function drawSky(ctx, t) {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#01010a');
        sky.addColorStop(clamp(horizonY / H - 0.05, 0, 1), '#04040f');
        sky.addColorStop(clamp(horizonY / H, 0, 1), '#0a0812');
        sky.addColorStop(1, '#050509');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        // stars above horizon
        for (const s of stars) {
          const sy = s.y * horizonY;
          if (sy > horizonY) continue;
          const tw = 0.4 + 0.6 * Math.sin(t * s.sp + s.ph);
          ctx.fillStyle = `rgba(200,210,240,${s.b * tw})`;
          ctx.fillRect(s.x * W, sy, 1.3, 1.3);
        }

        // warm skyglow rising from the distant downtown cluster
        const gx = W / 2, gy = horizonY;
        const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, W * 0.5);
        glow.addColorStop(0, `rgba(255,150,70,${0.1 + strobe * 0.25})`);
        glow.addColorStop(0.35, `rgba(220,110,50,${0.05 + strobe * 0.12})`);
        glow.addColorStop(1, 'rgba(120,60,30,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
      }

      // ─── Music ──────────────────────────────────────────
      function listen(dt, param) {
        ['low', 'mid', 'high'].forEach((key, i) => { levels[i] = bandEnv[i](param(key), dt); });
        traffic = trafficEnv(param('traffic'), dt);
        strobe = strobeEnv(strobeHits(param('strobe'), dt) ? 1 : 0, dt);
        const beam = beamHits(param('beams'), dt);
        for (const b of beams) {
          if (beam) { b.target = (Math.random() - 0.5) * 1.1; b.flare = 0.6 + beam * 0.6; }
          b.angle += (b.target - b.angle) * (1 - Math.exp(-dt / 0.25));
          b.flare *= Math.exp(-dt / 0.6);
        }
        for (const b of buildings) {
          b.fill = clamp(levels[b.band] * b.gain * 1.15, 0, 1);
          b.peak = Math.max(b.fill, b.peak - dt * 0.35);
        }
      }

      // Searchlights rise from downtown; a snare swings them and flares them.
      function drawBeams(ctx) {
        const base = project(0, 40, Z0 + DOWNTOWN_ROW * SPZ);
        if (!base) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        beams.forEach((b, i) => {
          const x0 = base.x + (i ? 40 : -40) * base.s;
          const a = b.angle + Math.sin(performance.now() / 1000 * 0.4 + i * 2) * 0.12;
          const len = H * 1.2, spread = 0.045;
          const g = ctx.createLinearGradient(x0, base.y, x0 + Math.sin(a) * len, base.y - Math.cos(a) * len);
          g.addColorStop(0, `rgba(200,220,255,${0.22 + b.flare * 0.5})`);
          g.addColorStop(1, 'rgba(200,220,255,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(x0, base.y);
          ctx.lineTo(x0 + Math.sin(a - spread) * len, base.y - Math.cos(a - spread) * len);
          ctx.lineTo(x0 + Math.sin(a + spread) * len, base.y - Math.cos(a + spread) * len);
          ctx.closePath();
          ctx.fill();
        });
        ctx.restore();
      }

      // ─── Frame Assembly ─────────────────────────────────
      function render(ctx, t, dt) {
        cam.x = 130 + 8 * Math.sin(t * 0.05);
        cam.yaw = -0.16 + 0.018 * Math.sin(t * 0.045);
        cam.pitch = -0.29 + 0.015 * Math.sin(t * 0.037);
        cam.y = 118 + 2.5 * Math.sin(t * 0.07);
        computeView();

        updateCars(dt);
        updateTrains(dt);

        ctx.fillStyle = '#02020a';
        ctx.fillRect(0, 0, W, H);
        drawSky(ctx, t);
        drawBeams(ctx);

        // Depth-sorted draw list (painter's algorithm, far → near)
        const draws = [];
        const push = (wx, wy, wz, fn) => {
          const c = toCam(wx, wy, wz);
          if (c.rz <= NEAR) return;
          draws.push({ z: c.rz, fn });
        };

        for (const b of buildings) {
          const p = project(b.x, b.h / 2, b.z);
          if (!p || p.x < -W || p.x > 2 * W) continue;
          push(b.x, b.h / 2, b.z, () => drawBuilding(ctx, b, t));
        }

        // track pillars + deck segments
        for (const track of TRACKS) {
          for (let z = TRACK_Z0; z < TRACK_Z1; z += PILLAR_STEP)
            push(track.x, track.deckY / 2, z, () => drawPillar(ctx, track, z));
          for (let z = TRACK_Z0; z < TRACK_Z1; z += SPZ) {
            const z0 = z, z1 = Math.min(z + SPZ, TRACK_Z1);
            push(track.x, track.deckY, (z0 + z1) / 2, () => drawTrackSegment(ctx, track, z0, z1));
          }
        }

        // train cars
        for (const track of TRACKS) {
          for (let i = 0; i < NCARS; i++) {
            const cz = track.headZ - i * track.dir * (CAR_LEN + CAR_GAP);
            if (cz < TRACK_Z0 - CAR_LEN || cz > TRACK_Z1 + CAR_LEN) continue;
            push(track.x, track.deckY + 8, cz, () => drawTrainCar(ctx, track, cz, t, i === 0, i === NCARS - 1));
          }
        }

        for (const c of cars) push(c.x, 2.5, c.z, () => drawCar(ctx, c));

        draws.sort((a, b) => b.z - a.z);
        for (const d of draws) d.fn();
      }

      // ─── Init ───────────────────────────────────────────
      initCity();
      initStars();
      initCars();

      createApp({
        sceneParams: PARAMS,
        sceneTitle: 'Skyline',
        asciiConfig: {
          enabled: true,
          fontSize: 16,
          fontSizeSmoothing: 0,
          density: 1,
          charset: 'density',
          colorScheme: 'rainbow',
          background: '#02020a',
          fade: 0,
          speed: 1,
          pattern: null,
          patternMix: 0,
          colorCycle: false,
          colorCycleRate: 0.5,
          sourceOpacity: 0,
          opacity: 1,
          blendMode: 'replace',
          offsetX: 0,
          offsetY: 0,
          zIndex: 0,
          renderMode: '3d',
          depthScale: 260,
          perspective: 1600,
          rotationX: 0.18,
          rotationY: 0.1,
          rotationZ: 0,
          cameraZ: 700,
          depthOpacity: 0.35,
          depthSmoothing: 0,
          edgeDetect: false,
          edgeThreshold: 0.15,
          edgeCharset: 'box-light',
          crtEnabled: false,
          crtScanlines: 0.3,
          crtGlow: 0,
          crtDistortion: 0,
          crtFlicker: 0,
          automations: {
            rotationY: { type: 'sine', amount: 0.12, rate: 0.03 },
          },
        },
        layers: [
          { fontSize: 2, charset: 'density', colorScheme: 'rainbow', blendMode: 'replace', opacity: 1 },
          { fontSize: 9, charset: 'density', colorScheme: 'fire', blendMode: 'replace', opacity: 1 },
          { fontSize: 6, charset: 'braille', colorScheme: 'fire', pattern: 'breathing', patternMix: 0.08, blendMode: 'add', opacity: 0.22 },
          { fontSize: 28, charset: 'blocks', colorScheme: 'ocean', blendMode: 'add', opacity: 0.06, offsetX: -1947 },
        ],
        onResize(ctx, w, h) {
          W = w; H = h;
          computeView();
        },
        onKeydown(e) {
          if (e.key.toLowerCase() === 'r') {
            initCity();
            initCars();
            TRACKS[0].headZ = TRACK_Z1;
            TRACKS[1].headZ = TRACK_Z0 - TRAIN_SPAN;
          }
        },
        draw(ctx, { time, dt, param }) {
          listen(dt, param);
          render(ctx, time * 0.001, dt);
        },
      });
    </script>
  </body>
</html>
