<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — 3D Cityscape</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #02020a; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { clamp, mulberry32 } from './utils.js';

      // ─── World Layout ───────────────────────────────────
      const SPX = 66;          // block spacing (lateral, X)
      const SPZ = 72;          // block spacing (depth, Z)
      const Z0 = 90;           // nearest row depth
      const COL_MIN = -6, COL_MAX = 6;
      const ROW_MIN = 0, ROW_MAX = 34;
      const DOWNTOWN_ROW = 29; // far cluster of tall towers sits here
      const TRACK_X = -99;     // elevated viaduct runs down this avenue
      const DECK_Y = 27;       // top of the viaduct deck
      const DECK_HW = 9;       // deck half-width
      const NEAR = 1;

      const rng = mulberry32(4242);

      // ─── Camera ─────────────────────────────────────────
      const cam = { x: 0, y: 47, z: 0, yaw: 0, pitch: -0.06 };
      let W = 0, H = 0, focal = 800, horizonY = 0;

      function computeView() {
        focal = H * 1.02;
        horizonY = H / 2 + focal * Math.tan(cam.pitch);
      }

      function toCam(wx, wy, wz) {
        const dx = wx - cam.x, dy = wy - cam.y, dz = wz - cam.z;
        const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
        const rx = dx * cy - dz * sy;
        const rz1 = dx * sy + dz * cy;
        const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
        const ry = dy * cp - rz1 * sp;
        const rz = dy * sp + rz1 * cp;
        return { rx, ry, rz };
      }

      function project(wx, wy, wz) {
        const c = toCam(wx, wy, wz);
        if (c.rz <= NEAR) return null;
        const s = focal / c.rz;
        return { x: W / 2 + c.rx * s, y: H / 2 - c.ry * s, z: c.rz, s };
      }

      // ─── Building Generation ────────────────────────────
      let buildings = [];

      function makeWindows(b) {
        const wins = [];
        const stepX = 7, stepY = 8.5, inset = 5;
        // front face (toward camera, -Z), side face chosen toward avenue center
        const frontZ = b.z - b.d / 2;
        const sideSign = b.x < 0 ? 1 : -1;
        const sideX = b.x + sideSign * b.w / 2;

        const addWin = (wx, wy, wz) => {
          const r = rng();
          const lit = r < 0.55;
          let col;
          const hue = rng();
          if (!lit) col = null;
          else if (hue < 0.72) col = [255, 205 + rng() * 45, 120 + rng() * 60]; // warm
          else if (hue < 0.9) col = [150, 195, 255];                            // cool
          else if (hue < 0.96) col = [255, 255, 235];                           // white
          else col = [255, 90, 60];                                             // red
          wins.push({
            x: wx, y: wy, z: wz,
            col,
            bright: 0.55 + rng() * 0.6,
            tw: 0.4 + rng() * 1.6,
            ph: rng() * Math.PI * 2,
            flick: rng() < 0.22,
          });
        };

        for (let wy = inset; wy < b.h - inset; wy += stepY) {
          for (let wx = -b.w / 2 + inset; wx < b.w / 2 - inset; wx += stepX)
            addWin(b.x + wx, wy, frontZ);
          for (let wz = -b.d / 2 + inset; wz < b.d / 2 - inset; wz += stepX)
            addWin(sideX, wy, b.z + wz);
        }
        return wins;
      }

      function initCity() {
        buildings = [];
        for (let col = COL_MIN; col <= COL_MAX; col++) {
          for (let row = ROW_MIN; row <= ROW_MAX; row++) {
            if (rng() < 0.22) continue; // plazas / streets
            const x = col * SPX + (rng() - 0.5) * 12;
            const z = Z0 + row * SPZ + (rng() - 0.5) * 12;
            // keep the viaduct avenue clear
            if (x > TRACK_X - 30 && x < TRACK_X + 30) continue;

            const w = 32 + rng() * 22;
            const d = 32 + rng() * 22;
            const dtf = clamp(1 - (Math.abs(col) / 3.2 + Math.abs(row - DOWNTOWN_ROW) / 9), 0, 1);
            const h = 20 + rng() * 26 + Math.pow(dtf, 1.5) * (150 + rng() * 95);
            const b = {
              x, z, w, d, h,
              beacon: h > 120 ? { ph: rng() * Math.PI * 2, sp: 1.4 + rng() * 1.2 } : null,
            };
            b.wins = makeWindows(b);
            buildings.push(b);
          }
        }
      }

      // ─── Draw Helpers ───────────────────────────────────
      function fillQuad(ctx, a, b, c, d, style) {
        const pa = project(a[0], a[1], a[2]);
        const pb = project(b[0], b[1], b[2]);
        const pc = project(c[0], c[1], c[2]);
        const pd = project(d[0], d[1], d[2]);
        if (!pa || !pb || !pc || !pd) return;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.lineTo(pc.x, pc.y);
        ctx.lineTo(pd.x, pd.y);
        ctx.closePath();
        ctx.fillStyle = style;
        ctx.fill();
      }

      function drawBox(ctx, cx, cz, hw, hd, y0, y1, front, side, top) {
        const x0 = cx - hw, x1 = cx + hw, z0 = cz - hd, z1 = cz + hd;
        // top
        if (top) fillQuad(ctx, [x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1], top);
        // front face (toward camera)
        fillQuad(ctx, [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], front);
        // visible side
        if (cx < cam.x)
          fillQuad(ctx, [x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0], side);
        else
          fillQuad(ctx, [x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], side);
      }

      function drawWindow(ctx, wx, wy, wz, col, alpha) {
        const p = project(wx, wy, wz);
        if (!p || p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) return;
        const sz = Math.max(1, 3.0 * p.s);
        ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
        ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
        if (p.s > 0.9 && alpha > 0.4) {
          const g = sz * 2.4;
          ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.14})`;
          ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
        }
      }

      function drawBuilding(ctx, b, t) {
        drawBox(ctx, b.x, b.z, b.w / 2, b.d / 2, 0, b.h,
          'rgb(13,14,23)', 'rgb(8,9,16)', 'rgb(18,19,30)');
        for (const win of b.wins) {
          if (!win.col) continue;
          let inten = win.bright * (0.62 + 0.38 * Math.sin(t * win.tw + win.ph));
          if (win.flick && Math.sin(t * 0.35 + win.ph) < -0.7) inten *= 0.12;
          drawWindow(ctx, win.x, win.y, win.z, win.col, clamp(inten, 0, 1));
        }
        // aircraft warning beacon on tall towers
        if (b.beacon) {
          const blink = Math.sin(t * b.beacon.sp + b.beacon.ph) > 0.3 ? 1 : 0.08;
          const p = project(b.x, b.h + 3, b.z);
          if (p) {
            const sz = Math.max(1.5, 3 * p.s);
            ctx.fillStyle = `rgba(255,50,40,${0.9 * blink})`;
            ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
            const g = sz * 5;
            ctx.fillStyle = `rgba(255,50,40,${0.18 * blink})`;
            ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
          }
        }
      }

      // ─── Elevated Track + Train ─────────────────────────
      const TRACK_Z0 = 70;
      const TRACK_Z1 = Z0 + ROW_MAX * SPZ;
      const PILLAR_STEP = 150;
      const CAR_LEN = 32, CAR_GAP = 6, NCARS = 6;
      const TRAIN_SPAN = NCARS * (CAR_LEN + CAR_GAP);
      let trainHeadZ = TRACK_Z1;

      function drawTrackSegment(ctx, z0, z1) {
        // deck slab
        drawBox(ctx, TRACK_X, (z0 + z1) / 2, DECK_HW, (z1 - z0) / 2, DECK_Y - 5, DECK_Y,
          'rgb(16,16,22)', 'rgb(10,10,15)', 'rgb(22,22,30)');
      }

      function drawPillar(ctx, z) {
        drawBox(ctx, TRACK_X, z, 4, 4, 0, DECK_Y - 5,
          'rgb(11,11,16)', 'rgb(7,7,11)', null);
      }

      function drawTrainCar(ctx, cz, t, isHead, isTail) {
        const y0 = DECK_Y, y1 = DECK_Y + 17;
        drawBox(ctx, TRACK_X, cz, DECK_HW - 1, CAR_LEN / 2, y0, y1,
          'rgb(24,24,32)', 'rgb(16,16,22)', 'rgb(30,30,40)');
        // lit window strip on the +X face (toward camera)
        const winY = y0 + 9;
        const faceX = TRACK_X + DECK_HW - 1;
        for (let dz = -CAR_LEN / 2 + 4; dz < CAR_LEN / 2 - 3; dz += 5) {
          const flick = Math.sin(t * 6 + dz + cz * 0.1) > -0.85 ? 1 : 0.3;
          const p = project(faceX, winY, cz + dz);
          if (!p) continue;
          const sz = Math.max(1, 4 * p.s);
          ctx.fillStyle = `rgba(255,225,150,${0.9 * flick})`;
          ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz * 0.7);
          const g = sz * 2.2;
          ctx.fillStyle = `rgba(255,215,140,${0.15 * flick})`;
          ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
        }
        // headlight / taillight
        if (isHead || isTail) {
          const endZ = cz - CAR_LEN / 2;
          const p = project(TRACK_X, DECK_Y + 5, endZ);
          if (p) {
            const sz = Math.max(2, 5 * p.s);
            const c = isHead ? '255,245,220' : '255,60,40';
            ctx.fillStyle = `rgba(${c},0.95)`;
            ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
            const g = sz * 4;
            ctx.fillStyle = `rgba(${c},0.16)`;
            ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
          }
        }
      }

      // ─── Street Traffic ─────────────────────────────────
      const cars = [];
      function initCars() {
        cars.length = 0;
        const lanes = [-2 * SPX + 33, -33, 33, 2 * SPX + 33];
        for (let i = 0; i < 26; i++) {
          const lane = lanes[Math.floor(rng() * lanes.length)];
          cars.push({
            x: lane + (rng() - 0.5) * 6,
            z: TRACK_Z0 + rng() * (TRACK_Z1 - TRACK_Z0),
            vz: (rng() < 0.5 ? -1 : 1) * (55 + rng() * 70),
            red: rng() < 0.4,
          });
        }
      }
      function updateCars(dt) {
        for (const c of cars) {
          c.z += c.vz * dt;
          if (c.z < TRACK_Z0) c.z += (TRACK_Z1 - TRACK_Z0);
          if (c.z > TRACK_Z1) c.z -= (TRACK_Z1 - TRACK_Z0);
        }
      }
      function drawCar(ctx, c) {
        const p = project(c.x, 2.5, c.z);
        if (!p || p.x < -30 || p.x > W + 30) return;
        const sz = Math.max(1, 3 * p.s);
        const col = c.red ? '255,45,30' : '255,240,205';
        ctx.fillStyle = `rgba(${col},0.95)`;
        ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz * 0.8);
        const g = sz * 3.5;
        ctx.fillStyle = `rgba(${col},0.12)`;
        ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
      }

      // ─── Sky ────────────────────────────────────────────
      let stars = [];
      function initStars() {
        stars = [];
        for (let i = 0; i < 120; i++)
          stars.push({ x: rng(), y: rng(), b: 0.1 + rng() * 0.35, sp: 0.3 + rng() * 1.8, ph: rng() * 6.28 });
      }

      function drawSky(ctx, t) {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#01010a');
        sky.addColorStop(clamp(horizonY / H - 0.05, 0, 1), '#04040f');
        sky.addColorStop(clamp(horizonY / H, 0, 1), '#0a0812');
        sky.addColorStop(1, '#050509');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        // stars above horizon
        for (const s of stars) {
          const sy = s.y * horizonY;
          if (sy > horizonY) continue;
          const tw = 0.4 + 0.6 * Math.sin(t * s.sp + s.ph);
          ctx.fillStyle = `rgba(200,210,240,${s.b * tw})`;
          ctx.fillRect(s.x * W, sy, 1.3, 1.3);
        }

        // warm skyglow rising from the distant downtown cluster
        const gx = W / 2, gy = horizonY;
        const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, W * 0.5);
        glow.addColorStop(0, 'rgba(255,150,70,0.10)');
        glow.addColorStop(0.35, 'rgba(220,110,50,0.05)');
        glow.addColorStop(1, 'rgba(120,60,30,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
      }

      // ─── Frame Assembly ─────────────────────────────────
      function render(ctx, t, dt) {
        cam.x = 6 * Math.sin(t * 0.05);
        cam.yaw = 0.02 * Math.sin(t * 0.045);
        cam.pitch = -0.06 + 0.012 * Math.sin(t * 0.037);
        cam.y = 47 + 1.5 * Math.sin(t * 0.07);
        computeView();

        updateCars(dt);
        trainHeadZ -= 150 * dt;
        if (trainHeadZ < TRACK_Z0 - CAR_LEN) trainHeadZ = TRACK_Z1 + TRAIN_SPAN;

        ctx.fillStyle = '#02020a';
        ctx.fillRect(0, 0, W, H);
        drawSky(ctx, t);

        // Depth-sorted draw list (painter's algorithm, far → near)
        const draws = [];
        const push = (wx, wy, wz, fn) => {
          const c = toCam(wx, wy, wz);
          if (c.rz <= NEAR) return;
          draws.push({ z: c.rz, fn });
        };

        for (const b of buildings) {
          const p = project(b.x, b.h / 2, b.z);
          if (!p || p.x < -W || p.x > 2 * W) continue;
          push(b.x, b.h / 2, b.z, () => drawBuilding(ctx, b, t));
        }

        // track pillars + deck segments
        for (let z = TRACK_Z0; z < TRACK_Z1; z += PILLAR_STEP)
          push(TRACK_X, DECK_Y / 2, z, () => drawPillar(ctx, z));
        for (let z = TRACK_Z0; z < TRACK_Z1; z += SPZ) {
          const z0 = z, z1 = Math.min(z + SPZ, TRACK_Z1);
          push(TRACK_X, DECK_Y, (z0 + z1) / 2, () => drawTrackSegment(ctx, z0, z1));
        }

        // train cars
        for (let i = 0; i < NCARS; i++) {
          const cz = trainHeadZ + i * (CAR_LEN + CAR_GAP);
          if (cz < TRACK_Z0 - CAR_LEN || cz > TRACK_Z1 + CAR_LEN) continue;
          push(TRACK_X, DECK_Y + 8, cz, () => drawTrainCar(ctx, cz, t, i === 0, i === NCARS - 1));
        }

        for (const c of cars) push(c.x, 2.5, c.z, () => drawCar(ctx, c));

        draws.sort((a, b) => b.z - a.z);
        for (const d of draws) d.fn();
      }

      // ─── Init ───────────────────────────────────────────
      initCity();
      initStars();
      initCars();

      createApp({
        asciiConfig: {
          background: '#02020a',
          sourceOpacity: 0,
          speed: 1,
          colorCycle: false,
        },
        layers: [
          { fontSize: 9, charset: 'density', colorScheme: 'fire', blendMode: 'replace', opacity: 1 },
          { fontSize: 6, charset: 'braille', colorScheme: 'fire', pattern: 'breathing', patternMix: 0.08, blendMode: 'add', opacity: 0.22 },
          { fontSize: 15, charset: 'blocks', colorScheme: 'ocean', blendMode: 'add', opacity: 0.06 },
        ],
        onResize(ctx, w, h) {
          W = w; H = h;
          computeView();
        },
        onKeydown(e) {
          if (e.key.toLowerCase() === 'r') {
            initCity();
            initCars();
            trainHeadZ = TRACK_Z1;
          }
        },
        draw(ctx, { time, dt }) {
          render(ctx, time * 0.001, dt);
        },
      });
    </script>
  </body>
</html>
