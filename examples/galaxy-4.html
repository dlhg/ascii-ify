<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Galaxy 4</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';

      // ─── Deep Field Parameters ───────────────────────────
      const NUM_BG_STARS = 500;
      const ROTATION_SPEED = 0.015;

      // ─── Galaxy Definitions ──────────────────────────────
      // Foreground: large spiral, lower-left, partially off-screen
      const FOREGROUND = {
        cx: 0.25, cy: 0.72,
        radiusFrac: 0.40,
        arms: 3,
        tilt: 0.55,          // elliptical flattening (1=face-on, 0=edge-on)
        stars: 1600,
        rotSpeed: 0.015,
        coreHue: 40,         // warm yellow
        armHue: 230,         // cool blue
        coreFrac: 0.06,
        hasGravity: true,
      };

      // Medium galaxies
      const MEDIUM_GALAXIES = [
        { // Edge-on spiral (thin line)
          cx: 0.72, cy: 0.28, radiusFrac: 0.16, arms: 2, tilt: 0.08,
          stars: 400, rotSpeed: 0.012, coreHue: 45, armHue: 200, coreFrac: 0.08,
        },
        { // Face-on spiral
          cx: 0.60, cy: 0.52, radiusFrac: 0.12, arms: 2, tilt: 0.92,
          stars: 350, rotSpeed: -0.018, coreHue: 220, armHue: 260, coreFrac: 0.07,
        },
        { // Elliptical (glowing blob, no arms)
          cx: 0.38, cy: 0.22, radiusFrac: 0.09, arms: 0, tilt: 0.7,
          stars: 300, rotSpeed: 0.005, coreHue: 35, armHue: 30, coreFrac: 0.15,
        },
      ];

      // Tiny distant galaxies (small smudges)
      const TINY_GALAXIES = [
        { cx: 0.12, cy: 0.15, radiusFrac: 0.035, stars: 60, tilt: 0.5, coreHue: 210 },
        { cx: 0.85, cy: 0.12, radiusFrac: 0.025, stars: 50, tilt: 0.3, coreHue: 40 },
        { cx: 0.90, cy: 0.65, radiusFrac: 0.04, stars: 70, tilt: 0.8, coreHue: 260 },
        { cx: 0.15, cy: 0.45, radiusFrac: 0.03, stars: 55, tilt: 0.6, coreHue: 190 },
        { cx: 0.50, cy: 0.08, radiusFrac: 0.03, stars: 45, tilt: 0.4, coreHue: 30 },
        { cx: 0.78, cy: 0.82, radiusFrac: 0.035, stars: 60, tilt: 0.7, coreHue: 280 },
        { cx: 0.45, cy: 0.35, radiusFrac: 0.02, stars: 40, tilt: 0.55, coreHue: 50 },
        { cx: 0.65, cy: 0.78, radiusFrac: 0.028, stars: 48, tilt: 0.45, coreHue: 220 },
      ];

      // ─── Generate Stars for a Galaxy ─────────────────────
      function makeSpiral(def) {
        const arr = [];
        const arms = def.arms || 0;
        for (let i = 0; i < def.stars; i++) {
          const isCore = i < def.stars * 0.25;
          let dist, angle;

          if (arms === 0) {
            // Elliptical: gaussian-ish distribution
            const r1 = (Math.random() + Math.random() + Math.random()) / 3;
            dist = r1;
            angle = Math.random() * Math.PI * 2;
          } else if (isCore) {
            dist = Math.random() * 0.15;
            angle = Math.random() * Math.PI * 2;
          } else {
            const arm = i % arms;
            const armBase = (arm / arms) * Math.PI * 2;
            const t = Math.random();
            dist = Math.pow(t, 0.6);
            const spiralAngle = Math.log(1 + dist * 10) * 0.3 * 6;
            const scatter = (Math.random() - 0.5) * 0.45 * (0.3 + dist * 0.7);
            angle = armBase + spiralAngle + scatter;
          }

          const t = Math.min(1, dist);
          const hue = (def.coreHue || 40) * (1 - t) + (def.armHue || def.coreHue || 230) * t + (Math.random() - 0.5) * 30;
          const sat = isCore ? 30 + Math.random() * 30 : 40 + Math.random() * 40;
          const light = isCore ? 70 + Math.random() * 25 : 35 + Math.random() * 35;
          const size = isCore ? 0.8 + Math.random() * 2.5 : 0.3 + Math.random() * 2.0;
          const brightness = isCore ? 0.6 + Math.random() * 0.4 : 0.2 + Math.random() * 0.7;
          const orbitSpeed = 1 / Math.max(Math.pow(dist || 0.01, 0.7), 0.08);

          arr.push({
            angle, dist, orbitSpeed, size, brightness,
            hue, sat, light,
            dx: 0, dy: 0,
          });
        }
        return arr;
      }

      const foregroundStars = makeSpiral(FOREGROUND);
      const mediumStarSets = MEDIUM_GALAXIES.map(g => makeSpiral(g));
      const tinyStarSets = TINY_GALAXIES.map(g => makeSpiral({
        ...g, arms: Math.random() < 0.5 ? 2 : 0, armHue: g.coreHue + 40, coreFrac: 0.15,
      }));

      // Gravitational lensing arc near foreground galaxy
      const lensingParticles = [];
      for (let i = 0; i < 60; i++) {
        const arcAngle = -Math.PI * 0.6 + (Math.random() - 0.5) * 1.0;
        lensingParticles.push({
          angle: arcAngle,
          dist: 0.55 + (Math.random() - 0.5) * 0.03,
          brightness: 0.1 + Math.random() * 0.25,
          size: 0.4 + Math.random() * 1.2,
        });
      }

      // ─── Camera / Zoom ────────────────────────────────────
      let zoom = 1.0;
      const ZOOM_MIN = 0.5;
      const ZOOM_MAX = 2.5;

      // ─── Mouse Gravity Well ───────────────────────────────
      let mouseDown = false;
      let mouseX = 0;
      let mouseY = 0;

      let globalTime = 0;
      let bgStars = null;

      function drawDeepField(ctx, dt, w, h) {
        globalTime += dt;
        const minDim = Math.min(w, h);

        // Clear
        ctx.fillStyle = '#04040a';
        ctx.fillRect(0, 0, w, h);

        // ── Background Stars (dense deep-field) ──
        if (!bgStars) {
          bgStars = [];
          for (let i = 0; i < NUM_BG_STARS; i++) {
            const b = Math.random();
            // Color temperature variation
            const temp = Math.random();
            let hue, sat;
            if (temp < 0.2) { hue = 220; sat = 40; }       // blue-white
            else if (temp < 0.5) { hue = 0; sat = 0; }      // white
            else if (temp < 0.75) { hue = 45; sat = 30; }    // yellow-white
            else if (temp < 0.9) { hue = 30; sat = 50; }     // orange
            else { hue = 10; sat = 60; }                     // red

            bgStars.push({
              x: Math.random(), y: Math.random(),
              r: 0.3 + b * 1.5,
              b: 0.15 + b * 0.55,
              hue, sat,
              hasDiffraction: b > 0.92,
              spikeLen: 4 + Math.random() * 6,
              twinkleSpeed: 0.5 + Math.random() * 2,
              twinklePhase: Math.random() * Math.PI * 2,
            });
          }
        }

        for (const s of bgStars) {
          const alpha = s.b * (0.6 + 0.4 * Math.sin(globalTime * s.twinkleSpeed + s.twinklePhase));
          const light = 70 + s.b * 25;
          const color = s.sat === 0
            ? `rgba(${Math.floor(200 + s.b * 55)}, ${Math.floor(210 + s.b * 45)}, 255, ${alpha})`
            : `hsla(${s.hue}, ${s.sat}%, ${light}%, ${alpha})`;

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
          ctx.fill();

          // Diffraction spikes for brightest stars
          if (s.hasDiffraction) {
            const sx = s.x * w;
            const sy = s.y * h;
            const len = s.spikeLen * (0.8 + 0.2 * Math.sin(globalTime * s.twinkleSpeed + s.twinklePhase));
            ctx.strokeStyle = `hsla(${s.hue}, ${s.sat}%, ${light}%, ${alpha * 0.5})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(sx - len, sy);
            ctx.lineTo(sx + len, sy);
            ctx.moveTo(sx, sy - len);
            ctx.lineTo(sx, sy + len);
            ctx.stroke();
          }
        }

        // ── Helper: Draw a Galaxy ──
        function drawGalaxy(def, starArr, rotation) {
          const gcx = def.cx * w;
          const gcy = def.cy * h;
          const radius = minDim * def.radiusFrac * zoom;
          const tilt = def.tilt || 1;
          const coreR = radius * (def.coreFrac || 0.06);

          // Core glow
          if (coreR > 2) {
            const coreGlow = ctx.createRadialGradient(gcx, gcy, 0, gcx, gcy, coreR * 3);
            const coreHue = def.coreHue || 40;
            coreGlow.addColorStop(0, `hsla(${coreHue}, 40%, 90%, 0.35)`);
            coreGlow.addColorStop(0.3, `hsla(${coreHue}, 45%, 70%, 0.15)`);
            coreGlow.addColorStop(0.7, `hsla(${coreHue}, 50%, 50%, 0.04)`);
            coreGlow.addColorStop(1, `hsla(${coreHue}, 50%, 40%, 0)`);
            ctx.fillStyle = coreGlow;
            ctx.beginPath();
            ctx.arc(gcx, gcy, coreR * 3, 0, Math.PI * 2);
            ctx.fill();

            // Inner bright core
            const innerGlow = ctx.createRadialGradient(gcx, gcy, 0, gcx, gcy, coreR);
            innerGlow.addColorStop(0, `hsla(${coreHue}, 30%, 95%, 0.8)`);
            innerGlow.addColorStop(0.4, `hsla(${coreHue}, 40%, 80%, 0.3)`);
            innerGlow.addColorStop(1, `hsla(${coreHue}, 50%, 60%, 0)`);
            ctx.fillStyle = innerGlow;
            ctx.beginPath();
            ctx.arc(gcx, gcy, coreR, 0, Math.PI * 2);
            ctx.fill();
          }

          // Stars
          for (const s of starArr) {
            const angle = s.angle + rotation * s.orbitSpeed;
            let sx = gcx + Math.cos(angle) * s.dist * radius + s.dx;
            let sy = gcy + Math.sin(angle) * s.dist * radius * tilt + s.dy;

            // Mouse gravity (foreground only)
            if (def.hasGravity && mouseDown) {
              const gdx = mouseX - sx;
              const gdy = mouseY - sy;
              const gDist = Math.sqrt(gdx * gdx + gdy * gdy);
              if (gDist < 300) {
                const force = (1 - gDist / 300) * 3;
                s.dx += gdx * force * dt * 0.4;
                s.dy += gdy * force * dt * 0.4;
              }
              s.dx *= 0.99; s.dy *= 0.99;
            } else if (def.hasGravity) {
              s.dx *= 0.96; s.dy *= 0.96;
            }

            sx = gcx + Math.cos(angle) * s.dist * radius + s.dx;
            sy = gcy + Math.sin(angle) * s.dist * radius * tilt + s.dy;

            const twinkle = 0.7 + 0.3 * Math.sin(globalTime * 3 + s.angle * 100 + s.dist * 50);
            const alpha = s.brightness * twinkle;

            if (s.size > 1.5 && s.brightness > 0.6) {
              const glowRadius = s.size * zoom * 3;
              const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowRadius);
              glow.addColorStop(0, `hsla(${s.hue}, ${s.sat}%, ${s.light}%, ${alpha * 0.3})`);
              glow.addColorStop(1, `hsla(${s.hue}, ${s.sat}%, ${s.light}%, 0)`);
              ctx.fillStyle = glow;
              ctx.fillRect(sx - glowRadius, sy - glowRadius, glowRadius * 2, glowRadius * 2);
            }

            ctx.fillStyle = `hsla(${s.hue}, ${s.sat}%, ${s.light}%, ${alpha})`;
            ctx.beginPath();
            ctx.arc(sx, sy, s.size * zoom * 0.7, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        const rotation = globalTime * ROTATION_SPEED;

        // Draw tiny galaxies first (farthest)
        for (let i = 0; i < TINY_GALAXIES.length; i++) {
          drawGalaxy(TINY_GALAXIES[i], tinyStarSets[i], rotation * 0.5);
        }

        // Draw medium galaxies
        for (let i = 0; i < MEDIUM_GALAXIES.length; i++) {
          drawGalaxy(MEDIUM_GALAXIES[i], mediumStarSets[i], rotation * 0.8);
        }

        // Draw gravitational lensing arc near foreground galaxy
        const fgcx = FOREGROUND.cx * w;
        const fgcy = FOREGROUND.cy * h;
        const fgRadius = minDim * FOREGROUND.radiusFrac * zoom;
        for (const lp of lensingParticles) {
          const angle = lp.angle + globalTime * 0.003;
          const distPx = lp.dist * fgRadius;
          const px = fgcx + Math.cos(angle) * distPx;
          const py = fgcy + Math.sin(angle) * distPx * 0.4;
          const twinkle = 0.7 + 0.3 * Math.sin(globalTime * 1.5 + lp.angle);
          const alpha = lp.brightness * twinkle;

          ctx.fillStyle = `rgba(160, 200, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(px, py, lp.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw foreground galaxy last (closest)
        drawGalaxy(FOREGROUND, foregroundStars, rotation);

        // Foreground galaxy outer halo
        const halo = ctx.createRadialGradient(fgcx, fgcy, fgRadius * 0.3, fgcx, fgcy, fgRadius * 1.2);
        halo.addColorStop(0, 'rgba(100, 80, 160, 0.02)');
        halo.addColorStop(0.5, 'rgba(60, 50, 120, 0.015)');
        halo.addColorStop(1, 'rgba(30, 20, 60, 0)');
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, w, h);
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: {
          fontSize: 16,
          colorScheme: 'rainbow',
          background: '#04040a',
          sourceOpacity: 0,
        },
        layers: [
          {
            fontSize: 4,
            charset: 'density',
            colorScheme: 'vapor',
            offsetX: -107,
            offsetY: -2,
            zIndex: 15,
          },
          {
            fontSize: 4,
            charset: 'blocks',
            colorScheme: 'ocean',
            offsetX: -72,
          },
          {
            fontSize: 14.5,
            charset: 'minimal',
            colorScheme: 'vapor',
            patternMix: 0.58,
            opacity: 0.6,
            blendMode: 'add',
          },
          {
            fontSize: 5.5,
            charset: 'braille',
            colorScheme: 'ocean',
            pattern: 'moiré',
            patternMix: 0.5,
            fade: 1,
            blendMode: 'add',
            offsetX: -72,
            offsetY: 33,
            edgeDetect: true,
          },
        ],
        draw(ctx, { dt, width: w, height: h }) {
          drawDeepField(ctx, dt, w, h);
        },
      });

      // ─── Canvas / Window Events ───────────────────────────
      app.canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoom -= e.deltaY * 0.001;
        zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom));
      }, { passive: false });

      window.addEventListener('mousedown', (e) => {
        mouseDown = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
      });
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });
      window.addEventListener('mouseup', () => {
        mouseDown = false;
      });

      window.addEventListener('touchstart', (e) => {
        mouseDown = true;
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      });
      window.addEventListener('touchmove', (e) => {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      });
      window.addEventListener('touchend', () => {
        mouseDown = false;
      });
    </script>
  </body>
</html>
