<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Playground</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }

      .drop-zone {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 5;
        transition: opacity 0.4s;
      }

      .drop-zone.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .drop-zone.drag-over .drop-border {
        border-color: rgba(255, 107, 53, 0.6);
        background: rgba(255, 107, 53, 0.04);
      }

      .drop-border {
        border: 2px dashed rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 48px 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        transition: all 0.3s;
      }

      .drop-icon {
        font-size: 48px;
        opacity: 0.25;
      }

      .drop-label {
        font-family: monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.35);
        text-align: center;
      }

      .drop-hint {
        font-family: monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
      <div class="drop-zone" id="drop-zone">
        <div class="drop-border">
          <div class="drop-icon">&#x1F5BC;</div>
          <div class="drop-label">Drop an image or video</div>
          <div class="drop-hint">or just play with the defaults</div>
        </div>
      </div>
    </div>
    <script type="module">
      import { AsciiIfy } from '../src/index.js';

      // ─── Source Canvas ────────────────────────────────────
      const source = document.getElementById('source');
      const sCtx = source.getContext('2d');
      const dropZone = document.getElementById('drop-zone');

      let mediaEl = null;
      let hasMedia = false;

      function resizeSource() {
        source.width = window.innerWidth;
        source.height = window.innerHeight;
      }
      resizeSource();
      window.addEventListener('resize', resizeSource);

      // ─── Default Animation (before any drop) ─────────────
      function drawDefault(t) {
        const w = source.width, h = source.height;
        sCtx.fillStyle = '#08080c';
        sCtx.fillRect(0, 0, w, h);

        for (let i = 0; i < 6; i++) {
          const x = w / 2 + Math.cos(t * 0.5 + i * 1.05) * w * 0.28;
          const y = h / 2 + Math.sin(t * 0.7 + i * 0.85) * h * 0.28;
          const r = 60 + Math.sin(t * 0.8 + i * 2) * 30;
          const grad = sCtx.createRadialGradient(x, y, 0, x, y, r);
          const hue = (i * 60 + t * 25) % 360;
          grad.addColorStop(0, `hsla(${hue}, 80%, 55%, 0.9)`);
          grad.addColorStop(0.6, `hsla(${hue}, 70%, 40%, 0.3)`);
          grad.addColorStop(1, 'transparent');
          sCtx.fillStyle = grad;
          sCtx.fillRect(x - r, y - r, r * 2, r * 2);
        }

        // Slow-moving wave bands
        for (let i = 0; i < 3; i++) {
          const y = h * (0.25 + i * 0.25) + Math.sin(t * 0.3 + i) * h * 0.1;
          const grad = sCtx.createLinearGradient(0, y - 40, 0, y + 40);
          const hue = (t * 15 + i * 120) % 360;
          grad.addColorStop(0, 'transparent');
          grad.addColorStop(0.5, `hsla(${hue}, 60%, 45%, 0.15)`);
          grad.addColorStop(1, 'transparent');
          sCtx.fillStyle = grad;
          sCtx.fillRect(0, y - 40, w, 80);
        }
      }

      // ─── Media Drawing ────────────────────────────────────
      function drawMedia() {
        if (!mediaEl) return;
        const w = source.width, h = source.height;
        sCtx.fillStyle = '#000';
        sCtx.fillRect(0, 0, w, h);

        // Cover-fit
        const mw = mediaEl.videoWidth || mediaEl.naturalWidth || mediaEl.width;
        const mh = mediaEl.videoHeight || mediaEl.naturalHeight || mediaEl.height;
        if (!mw || !mh) return;
        const scale = Math.max(w / mw, h / mh);
        const dw = mw * scale, dh = mh * scale;
        sCtx.drawImage(mediaEl, (w - dw) / 2, (h - dh) / 2, dw, dh);
      }

      // ─── Drop Zone ────────────────────────────────────────
      // All drag events on document so dropping anywhere works
      document.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
        dropZone.classList.remove('hidden');
      });

      document.addEventListener('dragover', (e) => {
        e.preventDefault();
      });

      document.addEventListener('dragleave', (e) => {
        // Only remove if leaving the document entirely
        if (e.relatedTarget === null) {
          dropZone.classList.remove('drag-over');
          if (hasMedia) dropZone.classList.add('hidden');
        }
      });

      document.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');

        const file = e.dataTransfer.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);

        if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = url;
          video.loop = true;
          video.muted = true;
          video.playsInline = true;
          video.play();
          mediaEl = video;
          hasMedia = true;
          dropZone.classList.add('hidden');
        } else if (file.type.startsWith('image/')) {
          const img = new Image();
          img.onload = () => {
            mediaEl = img;
            hasMedia = true;
            dropZone.classList.add('hidden');
          };
          img.src = url;
        }
      });

      // ─── HUD ──────────────────────────────────────────────
      function drawHUD() {
        const w = source.width, h = source.height;
        sCtx.save();
        sCtx.font = '11px monospace';
        sCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        sCtx.textAlign = 'center';
        sCtx.fillText(
          'drop image/video \u00B7 P panel \u00B7 E toggle',
          w / 2,
          h - 14,
        );
        sCtx.restore();
      }

      // ─── ASCII-ify Setup ──────────────────────────────────
      const ascii = new AsciiIfy(source, {
        background: '#08080c',
        sourceOpacity: 0,
        fontSize: 12,
        charset: 'density',
        colorScheme: 'rainbow',
      });

      // Base layer
      ascii.addLayer({
        source: source,
        fontSize: 14,
        charset: 'density',
        colorScheme: 'rainbow',
        blendMode: 'replace',
        opacity: 1,
        zIndex: 0,
      });

      // Overlay layer — different look stacked on top
      ascii.addLayer({
        source: source,
        fontSize: 8,
        charset: 'braille',
        colorScheme: 'vapor',
        blendMode: 'add',
        opacity: 0.4,
        zIndex: 1,
      });

      // Panel open by default
      ascii.showPanel();

      // ─── Render Loop ──────────────────────────────────────
      const startTime = performance.now();

      function loop() {
        const t = (performance.now() - startTime) / 1000;
        if (hasMedia) {
          drawMedia();
        } else {
          drawDefault(t);
        }
        drawHUD();
        ascii.render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      // ─── Keyboard ─────────────────────────────────────────
      document.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') ascii.togglePanel();
        if (e.key === 'e' || e.key === 'E') ascii.set('enabled', !ascii.get('enabled'));
      });
    </script>
  </body>
</html>
