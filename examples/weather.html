<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Weather</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { AsciiIfy } from '../src/index.js';

      // ─── Source Canvas ────────────────────────────────────
      const source = document.getElementById('source');
      const sCtx = source.getContext('2d');

      function resizeSource() {
        source.width = window.innerWidth;
        source.height = window.innerHeight;
        generateClouds();
      }
      resizeSource();
      window.addEventListener('resize', resizeSource);

      // ─── Season State ─────────────────────────────────────
      // 0 = Rain, 1 = Snow, 2 = Sun, 3 = Storm → wraps to 0
      let seasonPhase = 0;
      let autoAdvance = true;
      let time = 0;

      const SEASON_NAMES = ['Rain', 'Snow', 'Sun', 'Storm'];
      const SEASON_ICONS = ['~', '*', 'o', '!'];

      // Season color palettes — values must be bright enough for ASCII sampling
      const SEASON_COLORS = {
        rain:  { skyTop: [80, 95, 130],  skyBot: [110, 125, 155], ridges: [[50, 75, 80],  [65, 95, 105],  [85, 120, 130]] },
        snow:  { skyTop: [150, 160, 185], skyBot: [180, 190, 210], ridges: [[130, 145, 165], [155, 170, 190], [180, 195, 215]] },
        sun:   { skyTop: [100, 170, 240], skyBot: [180, 210, 245], ridges: [[70, 130, 60],  [100, 165, 80],  [140, 200, 110]] },
        storm: { skyTop: [55, 45, 75],   skyBot: [85, 70, 110],  ridges: [[45, 40, 65],  [65, 55, 90],  [90, 75, 115]] },
      };
      const PALETTES = [SEASON_COLORS.rain, SEASON_COLORS.snow, SEASON_COLORS.sun, SEASON_COLORS.storm];

      function lerpColor(a, b, t) {
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t,
        ];
      }

      function rgbStr(c) {
        return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
      }

      function getSeasonPalette(phase) {
        const i = Math.floor(phase) % 4;
        const j = (i + 1) % 4;
        const t = phase - Math.floor(phase);
        const a = PALETTES[i];
        const b = PALETTES[j];
        return {
          skyTop: lerpColor(a.skyTop, b.skyTop, t),
          skyBot: lerpColor(a.skyBot, b.skyBot, t),
          ridges: [
            lerpColor(a.ridges[0], b.ridges[0], t),
            lerpColor(a.ridges[1], b.ridges[1], t),
            lerpColor(a.ridges[2], b.ridges[2], t),
          ],
        };
      }

      // ─── Terrain ──────────────────────────────────────────
      function ridgeY(x, w, h, ridgeIndex, t) {
        // Each ridge is a composite of sine waves at different frequencies
        const nx = x / w;
        const offsets = [0, 1.5, 3.2]; // phase offsets per ridge
        const baseHeights = [0.35, 0.50, 0.65]; // vertical position (fraction of h)
        const amplitudes = [0.12, 0.10, 0.08];
        const o = offsets[ridgeIndex];
        const base = baseHeights[ridgeIndex] * h;
        const amp = amplitudes[ridgeIndex] * h;

        return base
          + Math.sin(nx * 3.5 + o + t * 0.03) * amp * 0.6
          + Math.sin(nx * 7.2 + o * 2 + t * 0.02) * amp * 0.25
          + Math.sin(nx * 13.1 + o * 0.5 + t * 0.01) * amp * 0.15;
      }

      function drawTerrain(pal) {
        const w = source.width;
        const h = source.height;

        // Sky gradient
        const grad = sCtx.createLinearGradient(0, 0, 0, h * 0.6);
        grad.addColorStop(0, rgbStr(pal.skyTop));
        grad.addColorStop(1, rgbStr(pal.skyBot));
        sCtx.fillStyle = grad;
        sCtx.fillRect(0, 0, w, h);

        // Draw 3 ridges back to front
        for (let r = 0; r < 3; r++) {
          sCtx.fillStyle = rgbStr(pal.ridges[r]);
          sCtx.beginPath();
          sCtx.moveTo(0, h);
          for (let x = 0; x <= w; x += 3) {
            sCtx.lineTo(x, ridgeY(x, w, h, r, time));
          }
          sCtx.lineTo(w, h);
          sCtx.closePath();
          sCtx.fill();
        }
      }

      // ─── Precipitation ────────────────────────────────────
      const particles = [];
      const MAX_PARTICLES = 500;

      // Season weights: [rain, snow, sun, storm]
      function getSeasonWeights(phase) {
        const weights = [0, 0, 0, 0];
        const i = Math.floor(phase) % 4;
        const j = (i + 1) % 4;
        const t = phase - Math.floor(phase);
        weights[i] = 1 - t;
        weights[j] = t;
        return weights;
      }

      function spawnParticle() {
        const w = source.width;
        const h = source.height;
        const weights = getSeasonWeights(seasonPhase);

        // Determine particle type by weighted random
        const roll = Math.random();
        let type;
        let cumulative = 0;
        for (let i = 0; i < 4; i++) {
          cumulative += weights[i];
          if (roll < cumulative) {
            type = i;
            break;
          }
        }
        if (type === undefined) type = 3;

        const p = { x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, type, size: 1, alpha: 1 };

        if (type === 0) {
          // Rain — bright streaks
          p.x = Math.random() * w * 1.2 - w * 0.1;
          p.y = -10 - Math.random() * 60;
          p.vx = -1.5 - Math.random() * 1;
          p.vy = 8 + Math.random() * 6;
          p.life = p.maxLife = 80 + Math.random() * 40;
          p.size = 2 + Math.random() * 2;
          p.alpha = 0.7 + Math.random() * 0.3;
        } else if (type === 1) {
          // Snow — large soft glows
          p.x = Math.random() * w * 1.1;
          p.y = -5 - Math.random() * 30;
          p.vx = (Math.random() - 0.5) * 0.8;
          p.vy = 0.8 + Math.random() * 1.5;
          p.life = p.maxLife = 200 + Math.random() * 150;
          p.size = 3 + Math.random() * 4;
          p.alpha = 0.7 + Math.random() * 0.3;
          p.wobblePhase = Math.random() * Math.PI * 2;
          p.wobbleAmp = 0.3 + Math.random() * 0.6;
        } else if (type === 2) {
          // Sun ray / dust mote — warm bright glows
          p.x = Math.random() * w;
          p.y = Math.random() * h * 0.7;
          p.vx = 0.15 + Math.random() * 0.3;
          p.vy = 0.1 + Math.random() * 0.2;
          p.life = p.maxLife = 150 + Math.random() * 100;
          p.size = 3 + Math.random() * 5;
          p.alpha = 0.4 + Math.random() * 0.4;
        } else {
          // Storm — fast bright streaks
          p.x = Math.random() * w * 1.4 - w * 0.2;
          p.y = -10 - Math.random() * 80;
          p.vx = -3 - Math.random() * 3;
          p.vy = 10 + Math.random() * 10;
          p.life = p.maxLife = 50 + Math.random() * 30;
          p.size = 2 + Math.random() * 2;
          p.alpha = 0.7 + Math.random() * 0.3;
        }

        return p;
      }

      // Desired particle counts per season
      const SEASON_DENSITIES = [400, 200, 80, 450];

      function getTargetParticleCount(phase) {
        const weights = getSeasonWeights(phase);
        let count = 0;
        for (let i = 0; i < 4; i++) count += weights[i] * SEASON_DENSITIES[i];
        return count | 0;
      }

      // Lightning state
      let lightningTimer = 0;
      let lightningAlpha = 0;

      function updateParticles(dt) {
        const w = source.width;
        const h = source.height;
        const target = Math.min(getTargetParticleCount(seasonPhase), MAX_PARTICLES);

        // Spawn to meet target
        while (particles.length < target) {
          particles.push(spawnParticle());
        }

        // Update existing
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life--;

          // Snow wobble
          if (p.type === 1 && p.wobblePhase !== undefined) {
            p.wobblePhase += dt * 2.5;
            p.x += Math.sin(p.wobblePhase) * p.wobbleAmp;
          }

          p.x += p.vx;
          p.y += p.vy;

          // Remove dead or off-screen
          if (p.life <= 0 || p.y > h + 20 || p.x < -40 || p.x > w + 40) {
            particles.splice(i, 1);
          }
        }

        // Lightning (storm season)
        const weights = getSeasonWeights(seasonPhase);
        const stormWeight = weights[3];
        if (stormWeight > 0.2) {
          lightningTimer -= dt;
          if (lightningTimer <= 0) {
            if (Math.random() < stormWeight * 0.3) {
              lightningAlpha = 0.6 + Math.random() * 0.4;
            }
            lightningTimer = 0.1 + Math.random() * 0.3;
          }
        }
        lightningAlpha *= 0.85; // decay
      }

      function drawParticles() {
        const w = source.width;
        const h = source.height;

        for (const p of particles) {
          const lifeRatio = p.life / p.maxLife;
          const alpha = p.alpha * lifeRatio;

          if (p.type === 0) {
            // Rain — bright streaks with glow
            sCtx.strokeStyle = `rgba(200, 220, 255, ${alpha})`;
            sCtx.lineWidth = p.size;
            sCtx.beginPath();
            sCtx.moveTo(p.x, p.y);
            sCtx.lineTo(p.x + p.vx * 3, p.y + p.vy * 3);
            sCtx.stroke();
          } else if (p.type === 1) {
            // Snow — large bright glowing dots
            const r = p.size * 3;
            const gradient = sCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
            gradient.addColorStop(0, `rgba(240, 245, 255, ${alpha})`);
            gradient.addColorStop(0.5, `rgba(220, 230, 250, ${alpha * 0.5})`);
            gradient.addColorStop(1, `rgba(200, 210, 240, 0)`);
            sCtx.fillStyle = gradient;
            sCtx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
          } else if (p.type === 2) {
            // Sun — large warm golden glows
            const r = p.size * 4;
            const gradient = sCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
            gradient.addColorStop(0, `rgba(255, 240, 160, ${alpha})`);
            gradient.addColorStop(0.4, `rgba(255, 210, 100, ${alpha * 0.5})`);
            gradient.addColorStop(1, `rgba(255, 180, 60, 0)`);
            sCtx.fillStyle = gradient;
            sCtx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
          } else {
            // Storm — fast bright streaks
            sCtx.strokeStyle = `rgba(210, 220, 255, ${alpha})`;
            sCtx.lineWidth = p.size;
            sCtx.beginPath();
            sCtx.moveTo(p.x, p.y);
            sCtx.lineTo(p.x + p.vx * 3, p.y + p.vy * 3);
            sCtx.stroke();
          }
        }

        // Lightning flash overlay
        if (lightningAlpha > 0.01) {
          sCtx.fillStyle = `rgba(230, 230, 255, ${lightningAlpha * 0.6})`;
          sCtx.fillRect(0, 0, w, h);
        }
      }

      // ─── Clouds / Fog ─────────────────────────────────────
      let clouds = [];

      function generateClouds() {
        clouds = [];
        const w = source.width;
        const h = source.height;
        const count = 8 + Math.floor(Math.random() * 5);
        for (let i = 0; i < count; i++) {
          clouds.push({
            x: Math.random() * w * 1.5 - w * 0.25,
            y: h * 0.05 + Math.random() * h * 0.5,
            rx: 60 + Math.random() * 140,
            ry: 25 + Math.random() * 50,
            speed: 0.15 + Math.random() * 0.4,
            baseAlpha: 0.35 + Math.random() * 0.3,
            depthLayer: Math.random(), // 0=far, 1=near — affects parallax
          });
        }
      }
      generateClouds();

      // Season fog settings: [cloudAlpha multiplier, ground fog height, ground fog alpha]
      const SEASON_FOG = [
        { cloudMul: 1.0, groundH: 0.15, groundA: 0.30 }, // rain
        { cloudMul: 0.8, groundH: 0.30, groundA: 0.45 }, // snow — thick ground fog
        { cloudMul: 0.4, groundH: 0.08, groundA: 0.10 }, // sun — wispy
        { cloudMul: 1.5, groundH: 0.20, groundA: 0.35 }, // storm — dense
      ];

      function getFogSettings(phase) {
        const weights = getSeasonWeights(phase);
        const out = { cloudMul: 0, groundH: 0, groundA: 0 };
        for (let i = 0; i < 4; i++) {
          out.cloudMul += weights[i] * SEASON_FOG[i].cloudMul;
          out.groundH += weights[i] * SEASON_FOG[i].groundH;
          out.groundA += weights[i] * SEASON_FOG[i].groundA;
        }
        return out;
      }

      function drawClouds(dt) {
        const w = source.width;
        const h = source.height;
        const fog = getFogSettings(seasonPhase);

        // Drifting cloud blobs
        for (const c of clouds) {
          c.x += c.speed * (0.5 + c.depthLayer * 0.5) * 60 * dt;
          if (c.x - c.rx > w * 1.2) c.x = -c.rx - Math.random() * 100;

          const alpha = c.baseAlpha * fog.cloudMul;
          if (alpha < 0.01) continue;

          const gradient = sCtx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.rx);
          gradient.addColorStop(0, `rgba(220, 225, 240, ${alpha})`);
          gradient.addColorStop(0.6, `rgba(200, 205, 220, ${alpha * 0.6})`);
          gradient.addColorStop(1, `rgba(180, 185, 200, 0)`);
          sCtx.fillStyle = gradient;

          sCtx.save();
          sCtx.translate(c.x, c.y);
          sCtx.scale(1, c.ry / c.rx);
          sCtx.beginPath();
          sCtx.arc(0, 0, c.rx, 0, Math.PI * 2);
          sCtx.fill();
          sCtx.restore();
        }

        // Ground fog
        if (fog.groundA > 0.01) {
          const fogH = h * fog.groundH;
          const fogGrad = sCtx.createLinearGradient(0, h - fogH, 0, h);
          fogGrad.addColorStop(0, `rgba(200, 210, 225, 0)`);
          fogGrad.addColorStop(0.4, `rgba(200, 210, 225, ${fog.groundA * 0.6})`);
          fogGrad.addColorStop(1, `rgba(200, 210, 225, ${fog.groundA})`);
          sCtx.fillStyle = fogGrad;
          sCtx.fillRect(0, h - fogH, w, fogH);
        }
      }

      // ─── HUD ──────────────────────────────────────────────
      function drawHUD() {
        const w = source.width;
        const h = source.height;
        const i = Math.floor(seasonPhase) % 4;
        const j = (i + 1) % 4;
        const t = seasonPhase - Math.floor(seasonPhase);

        // Season name — crossfade
        sCtx.save();
        sCtx.font = 'bold 28px monospace';
        sCtx.textBaseline = 'top';

        const label1 = `${SEASON_ICONS[i]} ${SEASON_NAMES[i]} ${SEASON_ICONS[i]}`;
        const label2 = `${SEASON_ICONS[j]} ${SEASON_NAMES[j]} ${SEASON_ICONS[j]}`;

        sCtx.fillStyle = `rgba(220, 220, 230, ${0.7 * (1 - t)})`;
        sCtx.fillText(label1, 24, 24);
        if (t > 0.05) {
          sCtx.fillStyle = `rgba(220, 220, 230, ${0.7 * t})`;
          sCtx.fillText(label2, 24, 24);
        }

        // Controls
        sCtx.font = '13px monospace';
        sCtx.fillStyle = 'rgba(180, 180, 190, 0.45)';
        const lines = [
          `Scroll: cycle seasons`,
          `A: auto-advance ${autoAdvance ? 'ON' : 'OFF'}`,
          `P: panel  E: toggle`,
        ];
        for (let k = 0; k < lines.length; k++) {
          sCtx.fillText(lines[k], 24, h - 60 + k * 18);
        }

        sCtx.restore();
      }

      // ─── ascii-ify Setup ──────────────────────────────────
      const ascii = new AsciiIfy(source, {
        fontSize: 14,
        charset: 'blocks',
        colorScheme: 'mono',
        background: '#06060a',
        speed: 0.6,
      });

      // Layer 1 — Terrain: blocks + mono (base, via parent config)
      // (Implicit — the parent AsciiIfy instance IS the terrain layer when no layers override it)

      // Layer 2 — Precipitation: braille + ocean
      const precipLayer = ascii.addLayer({
        fontSize: 8,
        charset: 'braille',
        colorScheme: 'ocean',
        blendMode: 'add',
        opacity: 0.75,
      });

      // Layer 3 — Atmosphere: density + vapor
      const fogLayer = ascii.addLayer({
        fontSize: 18,
        charset: 'density',
        colorScheme: 'vapor',
        blendMode: 'add',
        opacity: 0.35,
        pattern: 'breathing',
        patternMix: 0.15,
      });

      // ─── Input ─────────────────────────────────────────────
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        seasonPhase += e.deltaY * 0.002;
        if (seasonPhase < 0) seasonPhase += 4;
        seasonPhase = seasonPhase % 4;
      }, { passive: false });

      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'p') ascii.togglePanel();
        if (key === 'e') ascii.set('enabled', !ascii.get('enabled'));
        if (key === 'a') autoAdvance = !autoAdvance;
      });

      // Touch: swipe up/down to change season
      let touchStartY = 0;
      window.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const dy = touchStartY - e.touches[0].clientY;
        touchStartY = e.touches[0].clientY;
        seasonPhase += dy * 0.004;
        if (seasonPhase < 0) seasonPhase += 4;
        seasonPhase = seasonPhase % 4;
      }, { passive: false });

      // ─── Dynamic Layer Tuning ──────────────────────────────
      function updateLayerParams() {
        const weights = getSeasonWeights(seasonPhase);
        // rain=0, snow=1, sun=2, storm=3

        // Precip layer: shift color between ocean (rain/storm) and mono (snow) and fire (sun)
        // Use ocean for rain/storm, mono for snow (white), fire warmth for sun
        const schemes = ['ocean', 'mono', 'fire', 'ocean'];
        // Pick dominant season's scheme
        let maxW = 0, dominant = 0;
        for (let i = 0; i < 4; i++) {
          if (weights[i] > maxW) { maxW = weights[i]; dominant = i; }
        }
        precipLayer.set('colorScheme', schemes[dominant]);

        // Precip opacity: higher during storm/rain, lower during sun
        const precipOpacity = weights[0] * 0.75 + weights[1] * 0.6 + weights[2] * 0.3 + weights[3] * 0.85;
        precipLayer.set('opacity', precipOpacity);

        // Fog layer opacity
        const fogSettings = getFogSettings(seasonPhase);
        fogLayer.set('opacity', 0.2 + fogSettings.cloudMul * 0.15);
      }

      // ─── Render Loop ──────────────────────────────────────
      let prevTime = performance.now();

      function frame(now) {
        const dt = Math.min((now - prevTime) / 1000, 0.05);
        prevTime = now;
        time += dt;

        // Auto-advance seasons
        if (autoAdvance) {
          seasonPhase = (seasonPhase + dt * 0.06) % 4;
        }

        const pal = getSeasonPalette(seasonPhase);

        // 1. Terrain
        drawTerrain(pal);

        // 2. Precipitation
        updateParticles(dt);
        drawParticles();

        // 3. Clouds / fog
        drawClouds(dt);

        // 4. HUD
        drawHUD();

        // 5. Update ascii-ify layer params & render
        updateLayerParams();
        ascii.render();

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    </script>
  </body>
</html>
