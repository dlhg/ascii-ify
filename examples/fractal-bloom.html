<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify - Fractal Bloom</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; cursor: grab; }
      .container.dragging { cursor: grabbing; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>

    <script type="module">
      import { createApp } from './boilerplate.js';
      import { smoothstep } from './utils.js';
      import { envelope, hits } from './music.js';
      import { shaderScene, orbitControls, orbitCamera, rotX, rotY, mul3, SHADER_ASCII } from './shader-scene.js';

      // ── Fractal Bloom ────────────────────────────────────────────
      // A Mandelbulb grown like a flower. Its power drifts between shapes,
      // so lobes fold open and closed, and its surface is coloured
      // like nacre by how close each point's orbit came to the origin. The
      // deepest folds glow from inside; a faint aura clings to the edges.
      //
      // Mids reshape the bloom, bass makes it breathe light, kicks flash its
      // veins, snares turn the colour wheel, highs glint on the petals.
      // Drag to orbit, scroll to zoom.
      const PARAMS = [
        { key: 'morph', label: 'Morph', min: 0, max: 1, def: 0.3 },
        { key: 'breath', label: 'Breath', min: 0, max: 1, def: 0.25 },
        { key: 'flash', label: 'Vein flash (hits)', min: 0, max: 1, def: 0 },
        { key: 'turn', label: 'Colour turn (hits)', min: 0, max: 1, def: 0 },
        { key: 'glint', label: 'Glint', min: 0, max: 1, def: 0.2 },
        { key: 'approach', label: 'Approach', min: 0, max: 1, def: 0.2 },
      ];

      const FRAG = `
        uniform vec3 uCamPos;
        uniform mat3 uRotM;
        uniform float uPower;
        uniform float uBreath;
        uniform float uFlash;
        uniform float uHue;
        uniform float uGlint;
        uniform float uFade;

        // Mandelbulb distance estimate, plus an orbit trap for colouring.
        vec2 map(vec3 p) {
          p = p * uRotM;
          vec3 z = p;
          float dr = 1.0, r = 0.0, trap = 1e9;
          for (int i = 0; i < 5; i++) {
            r = length(z);
            if (r > 2.0) break;
            float th = acos(clamp(z.y / r, -1.0, 1.0)) * uPower;
            float ph = atan(z.z, z.x) * uPower;
            dr = pow(r, uPower - 1.0) * uPower * dr + 1.0;
            z = pow(r, uPower) * vec3(sin(th) * cos(ph), cos(th), sin(th) * sin(ph)) + p;
            trap = min(trap, dot(z, z));
          }
          return vec2(0.5 * log(max(r, 1e-4)) * r / dr, trap);
        }

        vec3 calcNormal(vec3 p, float e) {
          vec2 k = vec2(1.0, -1.0) * e;
          return normalize(k.xyy * map(p + k.xyy).x + k.yyx * map(p + k.yyx).x +
                           k.yxy * map(p + k.yxy).x + k.xxx * map(p + k.xxx).x);
        }

        // Nacre: saturated sea-glass, violet and rose gold, turned by uHue.
        vec3 nacre(float t) {
          vec3 c = 0.5 + 0.5 * cos(TAU * (t * vec3(1.0, 0.9, 0.8) + vec3(0.0, 0.25, 0.55) + uHue));
          return c * c * 1.4;
        }

        void main() {
          vec3 ro = uCamPos;
          vec3 rd = cameraRay(ro, vec3(0.0), 1.9);

          vec3 col = vec3(0.0);
          // Faint backdrop: a cold radial bloom behind the flower.
          vec2 q = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
          col += vec3(0.05, 0.03, 0.08) * exp(-dot(q, q) * 1.2);

          float b = dot(ro, rd), c = dot(ro, ro) - 1.25 * 1.25;
          float disc = b * b - c;
          float minD = 1e9, minT = 0.0;
          if (disc > 0.0) {
            float t = max(0.0, -b - sqrt(disc));
            float tEnd = -b + sqrt(disc);
            vec2 h = vec2(1.0);
            float steps = 0.0;
            bool hit = false;
            for (int i = 0; i < 130; i++) {
              h = map(ro + rd * t);
              if (h.x < minD) { minD = h.x; minT = t; }
              if (h.x < 0.0035 * t) { hit = true; break; }
              t += h.x * 0.9;
              steps += 1.0;
              if (t > tEnd) break;
            }
            if (hit) {
              vec3 p = ro + rd * t;
              vec3 n = calcNormal(p, 0.004 * t);
              float trap = h.y;
              float ao = clamp(1.0 - steps / 90.0, 0.0, 1.0);
              ao = 0.25 + 0.75 * ao * (0.5 + 0.5 * clamp(sqrt(trap) * 1.6, 0.0, 1.0));

              vec3 alb = nacre(sqrt(trap) * 1.3 + dot(n, vec3(0.2, 0.3, 0.1)));
              vec3 L1 = normalize(vec3(-0.6, 0.8, 0.5));
              vec3 L2 = normalize(vec3(0.7, -0.2, -0.6));
              float d1 = max(dot(n, L1), 0.0), d2 = max(dot(n, L2), 0.0);
              vec3 H = normalize(L1 - rd);
              float spec = pow(max(dot(n, H), 0.0), 40.0);
              float fres = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);

              col = alb * (d1 * vec3(1.0, 0.92, 0.82) * 2.2 + d2 * vec3(0.35, 0.5, 0.9) * 0.9 + 0.25) * ao;
              col += spec * vec3(1.0, 0.95, 0.9) * ao * (0.8 + uGlint);
              col += fres * nacre(0.6 + trap) * 0.9 * ao;
              // Glints: sparkle where a facet catches the key light.
              float g = hash(floor(p * 140.0) + floor(uTime * 8.0));
              col += step(0.985 - uGlint * 0.03, g) * spec * 6.0 * uGlint;
              // Veins: the innermost orbits glow from inside the folds.
              float vein = smoothstep(0.28, 0.0, trap);
              col += nacre(trap * 4.0 + uTime * 0.05 + 0.35) * vein * (0.25 + uBreath * 0.8 + uFlash * 3.0);
            } else {
              // Aura where rays grazed the surface.
              col += nacre(0.15) * exp(-minD * 40.0) * (0.25 + uBreath * 0.5 + uFlash * 0.8);
            }
          }
          gl_FragColor = vec4(finish(col, 2.6, 0.75) * uFade, 1.0);
        }
      `;

      const scene = shaderScene(FRAG, { scale: 0.42, maxWidth: 640 });
      const orbit = orbitControls({ pitch: [-1.2, 1.2], zoom: [-1.2, 3], zoomRate: 0.002 });

      const morphEnv = envelope(0.4, 1.2);
      const breathEnv = envelope(0.06, 0.5);
      const glintEnv = envelope(0.02, 0.2);
      const approachEnv = envelope(1.5, 3);
      const flashHits = hits(), turnHits = hits();
      let flash = 0, hue = 0, hueTarget = 0, shapeT = 0;

      function draw(ctx, { time, dt, width: w, height: h, param }) {
        const t = time / 1000;
        const morph = morphEnv(param('morph'), dt);
        const breath = breathEnv(param('breath'), dt);
        const glint = glintEnv(param('glint'), dt);
        const approach = approachEnv(param('approach'), dt);
        flash = Math.max(flash * Math.exp(-dt * 4), flashHits(param('flash'), dt));
        const turn = turnHits(param('turn'), dt);
        if (turn) hueTarget += 0.12 + turn * 0.1;
        hueTarget += dt * 0.006;
        hue += (hueTarget - hue) * (1 - Math.exp(-dt * 2.5));

        // The bloom drifts between power 5 (soft, petalled) and 10 (spiky).
        shapeT += dt * (0.04 + morph * 0.25);
        const power = 6.5 + 2.5 * Math.sin(shapeT) + breath * 0.4;

        const rotM = mul3(rotY(t * 0.07), rotX(0.35 + 0.15 * Math.sin(t * 0.05)));
        const intro = 1 - smoothstep(0, 8, t);
        const yaw = t * 0.04 + orbit.yaw;
        const pitch = 0.35 + 0.2 * Math.sin(t * 0.06) + orbit.pitch;
        const dist = Math.max(1.35, 3.3 - approach * 0.8 + orbit.zoom + intro * intro * 3);
        const cam = orbitCamera([0, 0, 0], yaw, pitch, dist);

        scene.draw(ctx, w, h, t, (u) => {
          u.v3('uCamPos', cam);
          u.m3('uRotM', rotM);
          u.f('uPower', power);
          u.f('uBreath', breath);
          u.f('uFlash', flash);
          u.f('uHue', hue);
          u.f('uGlint', glint);
          u.f('uFade', smoothstep(0, 3, t));
        });
      }

      createApp({
        sceneParams: PARAMS,
        sceneTitle: 'Bloom',
        asciiConfig: { ...SHADER_ASCII, background: '#000000' },
        draw,
      });
    </script>
  </body>
</html>
