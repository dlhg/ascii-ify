<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Starfield</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';

      // ─── Starfield State ──────────────────────────────────
      const NUM_STARS = 800;
      const MAX_DEPTH = 1500;
      const FOCAL_LENGTH = 300;

      let speed = 1.0;
      let mouseX = 0.5; // normalized 0–1
      let mouseY = 0.5;

      class Star {
        constructor() {
          this.reset(true);
        }

        reset(randomZ = false) {
          // Spread stars in a wide volume around the camera axis
          this.x = (Math.random() - 0.5) * 2000;
          this.y = (Math.random() - 0.5) * 2000;
          this.z = randomZ ? Math.random() * MAX_DEPTH : MAX_DEPTH;
          this.prevScreenX = null;
          this.prevScreenY = null;

          // Color variation — mostly cool/white, occasional warm
          const roll = Math.random();
          if (roll < 0.65) {
            // White / blue-white
            const temp = 200 + Math.random() * 40;
            const sat = 5 + Math.random() * 25;
            const lit = 80 + Math.random() * 20;
            this.color = `hsl(${temp} ${sat}% ${lit}%)`;
          } else if (roll < 0.85) {
            // Blue
            const temp = 210 + Math.random() * 30;
            const sat = 40 + Math.random() * 40;
            const lit = 70 + Math.random() * 25;
            this.color = `hsl(${temp} ${sat}% ${lit}%)`;
          } else if (roll < 0.95) {
            // Warm yellow/orange
            const temp = 30 + Math.random() * 30;
            const sat = 50 + Math.random() * 40;
            const lit = 70 + Math.random() * 25;
            this.color = `hsl(${temp} ${sat}% ${lit}%)`;
          } else {
            // Red/crimson
            const temp = 0 + Math.random() * 20;
            const sat = 60 + Math.random() * 30;
            const lit = 60 + Math.random() * 20;
            this.color = `hsl(${temp} ${sat}% ${lit}%)`;
          }
        }
      }

      const stars = [];
      for (let i = 0; i < NUM_STARS; i++) {
        stars.push(new Star());
      }

      // ─── Draw Starfield ───────────────────────────────────
      function drawStarfield(ctx, dt, w, h) {
        // Vanishing point follows mouse
        const cx = w * mouseX;
        const cy = h * mouseY;

        // Clear to deep space
        ctx.fillStyle = '#02020a';
        ctx.fillRect(0, 0, w, h);

        // Subtle radial glow at vanishing point for warp effect
        const glowRadius = Math.min(w, h) * (0.3 + speed * 0.15);
        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
        glow.addColorStop(0, `rgba(40, 60, 120, ${0.03 * speed})`);
        glow.addColorStop(0.5, `rgba(20, 30, 80, ${0.015 * speed})`);
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        // Move & draw stars
        const moveSpeed = 400 * speed * dt;

        for (let i = 0; i < NUM_STARS; i++) {
          const star = stars[i];

          // Save previous screen position before moving
          const prevZ = star.z;
          const prevScreenX = prevZ > 0 ? (star.x / prevZ) * FOCAL_LENGTH + cx : null;
          const prevScreenY = prevZ > 0 ? (star.y / prevZ) * FOCAL_LENGTH + cy : null;

          // Move star toward camera
          star.z -= moveSpeed;

          // Respawn if behind camera or too close
          if (star.z <= 1) {
            star.reset();
            continue;
          }

          // Project to 2D
          const screenX = (star.x / star.z) * FOCAL_LENGTH + cx;
          const screenY = (star.y / star.z) * FOCAL_LENGTH + cy;

          // Skip if off screen (with generous margin for streaks)
          const margin = 200;
          if (screenX < -margin || screenX > w + margin || screenY < -margin || screenY > h + margin) {
            continue;
          }

          // Brightness & size inversely proportional to depth
          const depthFactor = 1 - star.z / MAX_DEPTH;
          const brightness = Math.pow(depthFactor, 1.5);
          const size = 0.5 + depthFactor * 3;

          // Draw streak/trail line (warp effect)
          if (prevScreenX !== null && prevZ > 1) {
            const streakAlpha = brightness * 0.6;
            ctx.strokeStyle = star.color.replace(')', ` / ${streakAlpha})`).replace('hsl(', 'hsl(');

            // Streak length scales with speed and proximity
            const streakFactor = speed * depthFactor;
            const trailX = prevScreenX + (prevScreenX - screenX) * streakFactor * 0.5;
            const trailY = prevScreenY + (prevScreenY - screenY) * streakFactor * 0.5;

            ctx.lineWidth = Math.max(0.5, size * 0.6);
            ctx.beginPath();
            ctx.moveTo(trailX, trailY);
            ctx.lineTo(screenX, screenY);
            ctx.stroke();
          }

          // Draw star point
          const alpha = brightness;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = star.color;
          ctx.beginPath();
          ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
          ctx.fill();

          // Bright glow for close stars
          if (depthFactor > 0.7) {
            const glowAlpha = (depthFactor - 0.7) * 2.5;
            ctx.globalAlpha = glowAlpha * 0.3;
            ctx.beginPath();
            ctx.arc(screenX, screenY, size * 3, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.globalAlpha = 1;
        }
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: { background: '#02020a', sourceOpacity: 0 },
        layers: [
          // Layer 1: Distant stars — large, sparse, monochrome
          {
            fontSize: 16,
            charset: 'minimal',
            colorScheme: 'mono',
            blendMode: 'replace',
            opacity: 1,
          },
          // Layer 2: Close stars / streaks — small, dense, neon glow
          {
            fontSize: 8,
            charset: 'density',
            colorScheme: 'neon',
            blendMode: 'add',
            opacity: 0.7,
          },
          // Layer 3: Warp glow — braille tunnel overlay
          {
            fontSize: 10,
            charset: 'braille',
            colorScheme: 'ocean',
            pattern: 'tunnel',
            patternMix: 0.3,
            blendMode: 'add',
            opacity: 0.15,
          },
        ],
        draw(ctx, { dt, width: w, height: h }) {
          drawStarfield(ctx, dt, w, h);
        },
      });

      // ─── Mouse / Input ────────────────────────────────────
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX / window.innerWidth;
        mouseY = e.clientY / window.innerHeight;
      });

      app.canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        speed += e.deltaY * -0.002;
        speed = Math.max(0.2, Math.min(5.0, speed));
      }, { passive: false });

      // Touch support for mobile
      window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        mouseX = touch.clientX / window.innerWidth;
        mouseY = touch.clientY / window.innerHeight;
      });
    </script>
  </body>
</html>
