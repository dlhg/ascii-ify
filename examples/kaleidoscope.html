<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Kaleidoscope</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, clamp } from './utils.js';

      // ─── Kaleidoscope Config ────────────────────────────────
      const SEGMENTS = 8;            // N-fold symmetry
      const SECTOR_ANGLE = (Math.PI * 2) / SEGMENTS;
      const SEED_SIZE = 512;         // offscreen seed canvas resolution

      // ─── Offscreen Seed Canvas ──────────────────────────────
      const seedCanvas = document.createElement('canvas');
      seedCanvas.width = SEED_SIZE;
      seedCanvas.height = SEED_SIZE;
      const seedCtx = seedCanvas.getContext('2d');

      // Fill seed with black initially
      seedCtx.fillStyle = '#000';
      seedCtx.fillRect(0, 0, SEED_SIZE, SEED_SIZE);

      // ─── Orbiting Shapes ────────────────────────────────────
      // Each shape orbits around the seed canvas center, leaving trails
      const shapes = [
        {
          orbitRadius: 0.28,
          orbitSpeed: 0.23,
          orbitPhase: 0,
          size: 40,
          hueBase: 0,
          hueSpeed: 12,
          secondaryOrbitRadius: 0.08,
          secondaryOrbitSpeed: 0.7,
        },
        {
          orbitRadius: 0.35,
          orbitSpeed: -0.17,
          orbitPhase: Math.PI * 0.66,
          size: 30,
          hueBase: 90,
          hueSpeed: 18,
          secondaryOrbitRadius: 0.06,
          secondaryOrbitSpeed: -1.1,
        },
        {
          orbitRadius: 0.18,
          orbitSpeed: 0.31,
          orbitPhase: Math.PI * 1.33,
          size: 50,
          hueBase: 200,
          hueSpeed: 10,
          secondaryOrbitRadius: 0.1,
          secondaryOrbitSpeed: 0.5,
        },
        {
          orbitRadius: 0.4,
          orbitSpeed: 0.12,
          orbitPhase: Math.PI * 0.5,
          size: 25,
          hueBase: 300,
          hueSpeed: 22,
          secondaryOrbitRadius: 0.05,
          secondaryOrbitSpeed: -0.9,
        },
      ];

      // ─── Update Seed Canvas ─────────────────────────────────
      // Draws orbiting shapes with trails onto the seed canvas
      function updateSeed(time) {
        const t = time / 1000;
        const cx = SEED_SIZE / 2;
        const cy = SEED_SIZE / 2;

        // Semi-transparent overlay for trail effect
        seedCtx.fillStyle = 'rgba(0, 0, 0, 0.04)';
        seedCtx.fillRect(0, 0, SEED_SIZE, SEED_SIZE);

        for (const shape of shapes) {
          // Primary orbit
          const primaryAngle = t * shape.orbitSpeed + shape.orbitPhase;
          const primaryR = shape.orbitRadius * SEED_SIZE;
          const px = cx + Math.cos(primaryAngle) * primaryR;
          const py = cy + Math.sin(primaryAngle) * primaryR;

          // Secondary orbit (epicycle) for more organic motion
          const secondaryAngle = t * shape.secondaryOrbitSpeed + shape.orbitPhase * 2;
          const secondaryR = shape.secondaryOrbitRadius * SEED_SIZE;
          const sx = px + Math.cos(secondaryAngle) * secondaryR;
          const sy = py + Math.sin(secondaryAngle) * secondaryR;

          // Slowly shifting hue
          const hue = (shape.hueBase + t * shape.hueSpeed) % 360;
          const saturation = 85 + 15 * Math.sin(t * 0.5 + shape.orbitPhase);
          const lightness = 50 + 15 * Math.sin(t * 0.7 + shape.orbitPhase * 1.5);

          // Draw glowing circle
          const r = shape.size + 8 * Math.sin(t * 1.3 + shape.orbitPhase);
          const grad = seedCtx.createRadialGradient(sx, sy, 0, sx, sy, r);
          grad.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness}%, 0.9)`);
          grad.addColorStop(0.4, `hsla(${hue}, ${saturation}%, ${lightness * 0.7}%, 0.5)`);
          grad.addColorStop(1, `hsla(${hue}, ${saturation}%, ${lightness * 0.3}%, 0)`);

          seedCtx.beginPath();
          seedCtx.arc(sx, sy, r, 0, Math.PI * 2);
          seedCtx.fillStyle = grad;
          seedCtx.fill();

          // Draw a smaller bright core
          const coreR = r * 0.3;
          const coreGrad = seedCtx.createRadialGradient(sx, sy, 0, sx, sy, coreR);
          coreGrad.addColorStop(0, `hsla(${(hue + 30) % 360}, 100%, 85%, 0.8)`);
          coreGrad.addColorStop(1, `hsla(${(hue + 30) % 360}, 100%, 60%, 0)`);

          seedCtx.beginPath();
          seedCtx.arc(sx, sy, coreR, 0, Math.PI * 2);
          seedCtx.fillStyle = coreGrad;
          seedCtx.fill();

          // Occasional connecting lines between shapes for extra pattern complexity
          if (shape === shapes[0]) {
            const nextShape = shapes[1];
            const na = t * nextShape.orbitSpeed + nextShape.orbitPhase;
            const nr = nextShape.orbitRadius * SEED_SIZE;
            const nx = cx + Math.cos(na) * nr;
            const ny = cy + Math.sin(na) * nr;

            seedCtx.beginPath();
            seedCtx.moveTo(sx, sy);
            seedCtx.lineTo(nx, ny);
            seedCtx.strokeStyle = `hsla(${(hue + 60) % 360}, 80%, 60%, 0.15)`;
            seedCtx.lineWidth = 2;
            seedCtx.stroke();
          }
        }

        // Add a subtle pulsing ring near center for structure
        const ringR = SEED_SIZE * (0.12 + 0.03 * Math.sin(t * 0.6));
        const ringHue = (t * 15) % 360;
        seedCtx.beginPath();
        seedCtx.arc(cx, cy, ringR, 0, Math.PI * 2);
        seedCtx.strokeStyle = `hsla(${ringHue}, 70%, 55%, 0.12)`;
        seedCtx.lineWidth = 3 + 2 * Math.sin(t * 0.8);
        seedCtx.stroke();
      }

      // ─── Render Kaleidoscope ────────────────────────────────
      // Reflects the seed canvas with N-fold symmetry onto the main canvas
      function renderKaleidoscope(ctx, w, h) {
        const cx = w / 2;
        const cy = h / 2;
        const radius = Math.sqrt(cx * cx + cy * cy);

        // Scale factor to fill the screen from the seed canvas
        const scale = (radius * 2) / SEED_SIZE;

        for (let i = 0; i < SEGMENTS; i++) {
          const angle = i * SECTOR_ANGLE;
          const mirror = i % 2 === 1;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);

          // Clip to a pie-slice sector
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, 0, SECTOR_ANGLE);
          ctx.closePath();
          ctx.clip();

          // Mirror every other segment for true kaleidoscope reflection
          if (mirror) {
            ctx.scale(1, -1);
            ctx.rotate(SECTOR_ANGLE);
          }

          // Draw the seed canvas, centered at origin, scaled to fill
          ctx.scale(scale, scale);
          ctx.drawImage(seedCanvas, -SEED_SIZE / 2, -SEED_SIZE / 2);

          ctx.restore();
        }
      }

      // ─── Vignette ───────────────────────────────────────────
      let vignetteCanvas = null;
      let vignetteW = 0;
      let vignetteH = 0;

      function getVignette(w, h) {
        if (vignetteCanvas && vignetteW === w && vignetteH === h) return vignetteCanvas;

        vignetteCanvas = document.createElement('canvas');
        vignetteCanvas.width = w;
        vignetteCanvas.height = h;
        vignetteW = w;
        vignetteH = h;

        const vCtx = vignetteCanvas.getContext('2d');
        const cx = w / 2;
        const cy = h / 2;
        const outerR = Math.sqrt(cx * cx + cy * cy);

        const grad = vCtx.createRadialGradient(cx, cy, outerR * 0.3, cx, cy, outerR);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        grad.addColorStop(0.7, 'rgba(0, 0, 0, 0.15)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');

        vCtx.fillStyle = grad;
        vCtx.fillRect(0, 0, w, h);

        return vignetteCanvas;
      }

      // ─── Draw ───────────────────────────────────────────────
      function draw(ctx, { time, dt, width: w, height: h }) {
        // Clear
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, w, h);

        // Update the seed pattern
        updateSeed(time);

        // Render kaleidoscope reflection onto main canvas
        renderKaleidoscope(ctx, w, h);

        // Apply vignette
        ctx.drawImage(getVignette(w, h), 0, 0);
      }

      // ─── App Setup ──────────────────────────────────────────
      createApp({
        asciiConfig: {
          fontSize: 6,
          charset: 'density',
          colorScheme: 'rainbow',
          colorCycle: true,
          colorCycleRate: 0.5,
          background: '#050505',
          sourceOpacity: 0,
        },
        layers: [
          {
            fontSize: 4,
            charset: 'braille',
            colorScheme: 'neon',
            blendMode: 'add',
            opacity: 0.25,
          },
        ],
        draw,
        onResize(ctx, w, h) {
          // Invalidate vignette cache
          vignetteCanvas = null;
        },
      });
    </script>
  </body>
</html>
