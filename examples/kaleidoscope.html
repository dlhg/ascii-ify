<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Kaleidoscope</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';

      // ─── Kaleidoscope Parameters ────────────────────────
      const SEGMENTS = 8;
      const SEGMENT_ANGLE = (Math.PI * 2) / SEGMENTS;
      let rotationSpeed = 0.3;
      let globalTime = 0;
      let frozen = false;
      let freezeTimer = 0;

      // ─── Mouse State ───────────────────────────────────
      let mouseX = 0;
      let mouseY = 0;
      let mouseAngle = 0;
      let mouseDist = 0;

      function updatePolar(canvasW, canvasH) {
        const cx = canvasW / 2;
        const cy = canvasH / 2;
        const dx = mouseX - cx;
        const dy = mouseY - cy;
        mouseAngle = Math.atan2(dy, dx);
        mouseDist = Math.min(Math.sqrt(dx * dx + dy * dy) / Math.min(cx, cy), 1);
      }

      // ─── Draw Seed Wedge ────────────────────────────────
      function drawSeedWedge(ctx, radius, t) {
        // Orbiting circle 1: large, slow orbit
        const orbit1Angle = t * 0.7 + mouseAngle * 0.5;
        const orbit1Dist = radius * (0.3 + mouseDist * 0.3);
        const orbit1X = Math.cos(orbit1Angle) * orbit1Dist;
        const orbit1Y = Math.sin(orbit1Angle) * orbit1Dist;
        const orbit1Radius = radius * (0.06 + 0.04 * Math.sin(t * 1.3));

        const hue1 = (t * 40) % 360;
        ctx.fillStyle = `hsla(${hue1}, 90%, 60%, 0.85)`;
        ctx.beginPath();
        ctx.arc(orbit1X, orbit1Y, orbit1Radius, 0, Math.PI * 2);
        ctx.fill();

        // Glow around circle 1
        const glow1 = ctx.createRadialGradient(orbit1X, orbit1Y, 0, orbit1X, orbit1Y, orbit1Radius * 3);
        glow1.addColorStop(0, `hsla(${hue1}, 95%, 70%, 0.4)`);
        glow1.addColorStop(1, `hsla(${hue1}, 95%, 70%, 0)`);
        ctx.fillStyle = glow1;
        ctx.beginPath();
        ctx.arc(orbit1X, orbit1Y, orbit1Radius * 3, 0, Math.PI * 2);
        ctx.fill();

        // Orbiting circle 2: smaller, faster orbit, opposite direction
        const orbit2Angle = -t * 1.1 + mouseAngle * 0.8;
        const orbit2Dist = radius * (0.5 + mouseDist * 0.2);
        const orbit2X = Math.cos(orbit2Angle) * orbit2Dist;
        const orbit2Y = Math.sin(orbit2Angle) * orbit2Dist;
        const orbit2Radius = radius * (0.035 + 0.025 * Math.sin(t * 2.1));

        const hue2 = (t * 40 + 120) % 360;
        ctx.fillStyle = `hsla(${hue2}, 85%, 55%, 0.9)`;
        ctx.beginPath();
        ctx.arc(orbit2X, orbit2Y, orbit2Radius, 0, Math.PI * 2);
        ctx.fill();

        // Glow around circle 2
        const glow2 = ctx.createRadialGradient(orbit2X, orbit2Y, 0, orbit2X, orbit2Y, orbit2Radius * 2.5);
        glow2.addColorStop(0, `hsla(${hue2}, 90%, 65%, 0.35)`);
        glow2.addColorStop(1, `hsla(${hue2}, 90%, 65%, 0)`);
        ctx.fillStyle = glow2;
        ctx.beginPath();
        ctx.arc(orbit2X, orbit2Y, orbit2Radius * 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Sine-wave ribbon 1
        const hue3 = (t * 40 + 60) % 360;
        ctx.strokeStyle = `hsla(${hue3}, 95%, 60%, 0.6)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const frac = i / 40;
          const rx = frac * radius * 0.8;
          const ry = Math.sin(frac * 6 + t * 1.5 + mouseAngle * 2) * radius * 0.12 * frac;
          if (i === 0) ctx.moveTo(rx, ry);
          else ctx.lineTo(rx, ry);
        }
        ctx.stroke();

        // Sine-wave ribbon 2: offset phase and angle
        const hue4 = (t * 40 + 240) % 360;
        ctx.strokeStyle = `hsla(${hue4}, 90%, 55%, 0.5)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const frac = i / 40;
          const rx = frac * radius * 0.7;
          const ry = Math.cos(frac * 5 + t * 2.0 + mouseAngle * 1.5) * radius * 0.1 * frac;
          if (i === 0) ctx.moveTo(rx, ry);
          else ctx.lineTo(rx, ry);
        }
        ctx.stroke();
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: { background: '#08080c', sourceOpacity: 0, speed: 1 },
        layers: [
          // Layer 1: Core kaleidoscope — kaleidoscope pattern reinforces the symmetry
          {
            fontSize: 12,
            charset: 'density',
            colorScheme: 'rainbow',
            pattern: 'kaleidoscope',
            patternMix: 0.7,
            blendMode: 'replace',
            opacity: 1,
          },
          // Layer 2: Geometric structure — diamond pattern adds inner geometry
          {
            fontSize: 18,
            charset: 'blocks',
            colorScheme: 'vapor',
            pattern: 'diamond',
            patternMix: 0.5,
            blendMode: 'add',
            opacity: 0.3,
          },
          // Layer 3: Organic detail — spiral adds fine swirling detail
          {
            fontSize: 6,
            charset: 'braille',
            colorScheme: 'acid',
            pattern: 'spiral',
            patternMix: 0.6,
            blendMode: 'add',
            opacity: 0.2,
          },
        ],
        draw(ctx, { dt, width: w, height: h }) {
          // Handle freeze
          if (frozen) {
            freezeTimer -= dt;
            if (freezeTimer <= 0) frozen = false;
          } else {
            globalTime += dt * rotationSpeed;
          }

          const cx = w / 2;
          const cy = h / 2;
          const radius = Math.min(w, h) * 0.45;
          const t = globalTime;

          // Clear with dark background
          ctx.fillStyle = '#06060e';
          ctx.fillRect(0, 0, w, h);

          // Background radial gradient from center
          const bgHue = (t * 15) % 360;
          const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
          bgGrad.addColorStop(0, `hsla(${bgHue}, 60%, 15%, 0.5)`);
          bgGrad.addColorStop(0.5, `hsla(${(bgHue + 40) % 360}, 50%, 8%, 0.3)`);
          bgGrad.addColorStop(1, 'rgba(6, 6, 14, 0)');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, w, h);

          // ── Draw kaleidoscope segments ──
          ctx.save();
          ctx.translate(cx, cy);

          // Build a triangular clip path for one wedge
          const wedgeHalfAngle = SEGMENT_ANGLE / 2;

          for (let i = 0; i < SEGMENTS; i++) {
            const angle = SEGMENT_ANGLE * i + t * 0.2;

            // Draw original wedge
            ctx.save();
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(-wedgeHalfAngle) * radius * 1.5, Math.sin(-wedgeHalfAngle) * radius * 1.5);
            ctx.lineTo(Math.cos(wedgeHalfAngle) * radius * 1.5, Math.sin(wedgeHalfAngle) * radius * 1.5);
            ctx.closePath();
            ctx.clip();
            drawSeedWedge(ctx, radius, t);
            ctx.restore();

            // Draw mirrored wedge
            ctx.save();
            ctx.rotate(angle);
            ctx.scale(1, -1);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(-wedgeHalfAngle) * radius * 1.5, Math.sin(-wedgeHalfAngle) * radius * 1.5);
            ctx.lineTo(Math.cos(wedgeHalfAngle) * radius * 1.5, Math.sin(wedgeHalfAngle) * radius * 1.5);
            ctx.closePath();
            ctx.clip();
            drawSeedWedge(ctx, radius, t);
            ctx.restore();
          }

          ctx.restore();

          // Center bright glow
          const centerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.15);
          const cHue = (t * 30 + 180) % 360;
          centerGlow.addColorStop(0, `hsla(${cHue}, 80%, 80%, 0.5)`);
          centerGlow.addColorStop(0.5, `hsla(${cHue}, 70%, 50%, 0.15)`);
          centerGlow.addColorStop(1, `hsla(${cHue}, 60%, 30%, 0)`);
          ctx.fillStyle = centerGlow;
          ctx.beginPath();
          ctx.arc(cx, cy, radius * 0.15, 0, Math.PI * 2);
          ctx.fill();

          // ── Instructions ──
          ctx.save();
          ctx.font = '12px monospace';
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.fillText(
            'move mouse to shape pattern \u00b7 scroll to change speed \u00b7 click to freeze \u00b7 P panel \u00b7 E toggle',
            cx, h - 16
          );
          ctx.restore();
        },
      });

      // ─── Canvas / Window Events ───────────────────────────
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        updatePolar(app.width, app.height);
      });

      app.canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        rotationSpeed += e.deltaY * -0.0005;
        rotationSpeed = Math.max(-1.5, Math.min(1.5, rotationSpeed));
      }, { passive: false });

      window.addEventListener('click', () => {
        frozen = true;
        freezeTimer = 0.5;
      });
    </script>
  </body>
</html>
