<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Galaxy 3</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';

      // ─── Barred Spiral Parameters ────────────────────────
      const NUM_STARS = 3500;
      const NUM_DUST = 1000;
      const NUM_BG_STARS = 300;
      const GALAXY_RADIUS_FRAC = 0.35;
      const BAR_RATIO = 0.4;
      const CORE_RADIUS_FRAC = 0.06;
      const BAR_ROTATION_SPEED = 0.012;
      const ARM_ROTATION_SPEED = 0.008;
      const SPIRAL_TIGHTNESS = 0.45;

      // ─── Star Generation ─────────────────────────────────
      const stars = [];

      function initStars() {
        stars.length = 0;
        for (let i = 0; i < NUM_STARS; i++) {
          const type = Math.random();
          let dist, armAngle, isBar = false, armIdx = -1;

          if (type < 0.25) {
            // Bar stars
            isBar = true;
            const barPos = (Math.random() - 0.5) * 2;
            dist = Math.abs(barPos) * BAR_RATIO;
            const barDir = barPos >= 0 ? 0 : Math.PI;
            const spread = (Math.random() - 0.5) * 0.12;
            armAngle = barDir + spread;
          } else if (type < 0.70) {
            // Main spiral arm stars (2 arms from bar ends)
            armIdx = Math.floor(Math.random() * 2);
            const t = Math.random();
            dist = BAR_RATIO + t * (1 - BAR_RATIO);
            const spiralAngle = armIdx * Math.PI + t * Math.PI * 2.5 * SPIRAL_TIGHTNESS;
            const scatter = (Math.random() - 0.5) * (0.06 + t * 0.16);
            armAngle = spiralAngle + scatter;
          } else if (type < 0.85) {
            // Secondary arms (offset by 90 degrees, weaker)
            armIdx = 2 + Math.floor(Math.random() * 2);
            const t = Math.random();
            dist = 0.3 + t * 0.65;
            const spiralAngle = (armIdx - 2) * Math.PI + Math.PI / 2 + t * Math.PI * 2 * SPIRAL_TIGHTNESS;
            const scatter = (Math.random() - 0.5) * (0.08 + t * 0.2);
            armAngle = spiralAngle + scatter;
          } else {
            // Scattered disk stars
            dist = Math.random() * 0.9;
            armAngle = Math.random() * Math.PI * 2;
          }

          const orbitSpeed = 1 / Math.max(Math.pow(dist || 0.01, 0.7), 0.08);
          const size = 0.5 + Math.random() * 2.2 * (1 - dist * 0.4);
          const brightness = 0.3 + Math.random() * 0.7 * (1 - dist * 0.3);

          // Bar stars are warm, arm stars transition from warm to cool
          let hue, sat, light;
          if (isBar) {
            hue = 25 + Math.random() * 35;
            sat = 45 + Math.random() * 30;
            light = 65 + Math.random() * 25;
          } else if (dist < 0.3) {
            hue = 30 + Math.random() * 50;
            sat = 40 + Math.random() * 30;
            light = 60 + Math.random() * 25;
          } else if (dist < 0.6) {
            hue = 50 + Math.random() * 80 + dist * 180;
            sat = 50 + Math.random() * 30;
            light = 45 + Math.random() * 30;
          } else {
            hue = 200 + Math.random() * 80;
            sat = 50 + Math.random() * 40;
            light = 35 + Math.random() * 35;
          }

          stars.push({
            armAngle, dist, orbitSpeed, size, brightness, isBar, armIdx,
            hue, sat, light,
            dx: 0, dy: 0,
            twinklePhase: Math.random() * Math.PI * 2,
            twinkleSpeed: 1 + Math.random() * 3,
          });
        }
      }
      initStars();

      // ─── Dust Lanes ──────────────────────────────────────
      const dustParticles = [];

      function initDust() {
        dustParticles.length = 0;
        for (let i = 0; i < NUM_DUST; i++) {
          const armIdx = Math.floor(Math.random() * 2);
          const t = Math.random();
          const dist = BAR_RATIO * 0.5 + t * (1 - BAR_RATIO * 0.5);
          const spiralAngle = armIdx * Math.PI + t * Math.PI * 2.5 * SPIRAL_TIGHTNESS;
          const interArmOffset = Math.PI / 2;
          const scatter = (Math.random() - 0.5) * 0.3;
          const armAngle = spiralAngle + interArmOffset + scatter;
          const orbitSpeed = 1 / Math.max(Math.pow(dist, 0.7), 0.08);

          dustParticles.push({
            armAngle, dist, orbitSpeed,
            opacity: 0.05 + Math.random() * 0.12,
            size: 3 + Math.random() * 8,
            dx: 0, dy: 0,
          });
        }
      }
      initDust();

      // ─── Nebula Clouds ───────────────────────────────────
      const nebulae = [];
      const nebulaColors = [
        [200, 40, 200],  // magenta
        [0, 200, 220],   // cyan
        [0, 180, 160],   // teal
        [220, 160, 30],  // amber
        [100, 60, 220],  // violet
        [40, 180, 100],  // emerald
        [220, 80, 60],   // coral
        [60, 120, 220],  // blue
        [180, 50, 160],  // fuchsia
        [20, 200, 180],  // aqua
      ];

      function initNebulae() {
        nebulae.length = 0;
        for (let i = 0; i < 10; i++) {
          nebulae.push({
            angle: Math.random() * Math.PI * 2,
            dist: 0.25 + Math.random() * 0.55,
            radius: 0.12 + Math.random() * 0.16,
            color: nebulaColors[i],
            phase: Math.random() * Math.PI * 2,
            pulseSpeed: 0.3 + Math.random() * 0.5,
            baseOpacity: 0.06 + Math.random() * 0.07,
          });
        }
      }
      initNebulae();

      // ─── HII Regions (star-forming knots) ────────────────
      const hiiRegions = [];

      function initHII() {
        hiiRegions.length = 0;
        for (let i = 0; i < 18; i++) {
          const armIdx = i % 2;
          const t = 0.3 + Math.random() * 0.65;
          const baseAngle = armIdx * Math.PI + t * Math.PI * 2.5 * SPIRAL_TIGHTNESS;
          hiiRegions.push({
            t, armIdx, baseAngle,
            radius: 0.02 + Math.random() * 0.025,
            phase: Math.random() * Math.PI * 2,
            brightness: 0.5 + Math.random() * 0.5,
          });
        }
      }
      initHII();

      // ─── Camera / Zoom ────────────────────────────────────
      let zoom = 1.0;
      const ZOOM_MIN = 0.5;
      const ZOOM_MAX = 2.0;

      // ─── Mouse Gravity Well ───────────────────────────────
      let mouseDown = false;
      let mouseX = 0;
      let mouseY = 0;

      let globalTime = 0;
      let bgStars = null;

      function drawBarredGalaxy(ctx, dt, w, h) {
        globalTime += dt;

        const cx = w / 2;
        const cy = h / 2;
        const minDim = Math.min(w, h);
        const galaxyRadius = minDim * GALAXY_RADIUS_FRAC * zoom;
        const coreRadius = minDim * CORE_RADIUS_FRAC * zoom;
        const barAngle = globalTime * BAR_ROTATION_SPEED;
        const armRotation = globalTime * ARM_ROTATION_SPEED;

        // Clear
        ctx.fillStyle = '#04040a';
        ctx.fillRect(0, 0, w, h);

        // ── Background Stars ──
        if (!bgStars) {
          bgStars = [];
          for (let i = 0; i < NUM_BG_STARS; i++) {
            bgStars.push({
              x: Math.random(), y: Math.random(),
              r: 0.3 + Math.random() * 0.8,
              b: 0.15 + Math.random() * 0.35,
              twinkleSpeed: 0.5 + Math.random() * 2,
              twinklePhase: Math.random() * Math.PI * 2,
            });
          }
        }
        for (const s of bgStars) {
          const alpha = s.b * (0.6 + 0.4 * Math.sin(globalTime * s.twinkleSpeed + s.twinklePhase));
          ctx.fillStyle = `rgba(200, 210, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // ── Nebula Clouds (behind everything) ──
        for (const n of nebulae) {
          const nebAngle = n.angle + globalTime * 0.005;
          const nx = cx + Math.cos(nebAngle) * n.dist * galaxyRadius;
          const ny = cy + Math.sin(nebAngle) * n.dist * galaxyRadius * 0.55;
          const nr = n.radius * galaxyRadius;
          const pulse = 0.6 + 0.4 * Math.sin(globalTime * n.pulseSpeed + n.phase);
          const opacity = n.baseOpacity * pulse;

          const [r, g, b] = n.color;
          const grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
          grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${opacity})`);
          grad.addColorStop(0.4, `rgba(${r}, ${g}, ${b}, ${opacity * 0.5})`);
          grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(nx, ny, nr, 0, Math.PI * 2);
          ctx.fill();
        }

        // ── Bar Glow ──
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(barAngle);
        const barLen = BAR_RATIO * galaxyRadius;
        const barGrad = ctx.createLinearGradient(-barLen, 0, barLen, 0);
        barGrad.addColorStop(0, 'rgba(255, 180, 100, 0)');
        barGrad.addColorStop(0.2, 'rgba(255, 200, 130, 0.08)');
        barGrad.addColorStop(0.5, 'rgba(255, 220, 170, 0.12)');
        barGrad.addColorStop(0.8, 'rgba(255, 200, 130, 0.08)');
        barGrad.addColorStop(1, 'rgba(255, 180, 100, 0)');
        ctx.fillStyle = barGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, barLen, barLen * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // ── Core Glow ──
        const coreGlow1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius * 3);
        coreGlow1.addColorStop(0, 'rgba(255, 240, 200, 0.45)');
        coreGlow1.addColorStop(0.2, 'rgba(255, 220, 150, 0.25)');
        coreGlow1.addColorStop(0.5, 'rgba(255, 180, 100, 0.08)');
        coreGlow1.addColorStop(1, 'rgba(255, 150, 80, 0)');
        ctx.fillStyle = coreGlow1;
        ctx.fillRect(0, 0, w, h);

        const coreGlow2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius);
        coreGlow2.addColorStop(0, 'rgba(255, 255, 240, 0.9)');
        coreGlow2.addColorStop(0.3, 'rgba(255, 240, 200, 0.5)');
        coreGlow2.addColorStop(0.7, 'rgba(255, 200, 130, 0.15)');
        coreGlow2.addColorStop(1, 'rgba(200, 150, 100, 0)');
        ctx.fillStyle = coreGlow2;
        ctx.beginPath();
        ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
        ctx.fill();

        const pulse = 0.8 + 0.2 * Math.sin(globalTime * 0.5);
        const coreGlow3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius * 0.5 * pulse);
        coreGlow3.addColorStop(0, `rgba(255, 255, 250, ${0.8 * pulse})`);
        coreGlow3.addColorStop(1, 'rgba(255, 230, 180, 0)');
        ctx.fillStyle = coreGlow3;
        ctx.beginPath();
        ctx.arc(cx, cy, coreRadius * 0.5 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // ── Dust Lanes ──
        for (const d of dustParticles) {
          const angle = d.armAngle + armRotation * d.orbitSpeed + (d.dist * 0.5);
          let sx = cx + Math.cos(angle) * d.dist * galaxyRadius + d.dx;
          let sy = cy + Math.sin(angle) * d.dist * galaxyRadius * 0.55 + d.dy;

          if (!mouseDown) { d.dx *= 0.96; d.dy *= 0.96; }
          else {
            const gdx = mouseX - sx;
            const gdy = mouseY - sy;
            const gDist = Math.sqrt(gdx * gdx + gdy * gdy);
            if (gDist < 250) {
              const force = (1 - gDist / 250) * 2.5;
              d.dx += gdx * force * dt * 0.3;
              d.dy += gdy * force * dt * 0.3;
            }
            d.dx *= 0.99; d.dy *= 0.99;
          }

          ctx.fillStyle = `rgba(4, 4, 15, ${d.opacity})`;
          ctx.beginPath();
          ctx.arc(sx, sy, d.size * zoom, 0, Math.PI * 2);
          ctx.fill();
        }

        // ── HII Regions (bright pink-red star-forming knots) ──
        for (const h of hiiRegions) {
          const angle = h.baseAngle + armRotation + h.t * 0.5;
          const r = (BAR_RATIO + h.t * (1 - BAR_RATIO)) * galaxyRadius;
          const hx = cx + Math.cos(angle) * r;
          const hy = cy + Math.sin(angle) * r * 0.55;
          const hPulse = 0.5 + 0.5 * Math.sin(globalTime * 1.2 + h.phase);
          const hr = h.radius * galaxyRadius * (0.8 + 0.2 * hPulse);
          const opacity = h.brightness * (0.15 + 0.1 * hPulse);

          const grad = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
          grad.addColorStop(0, `rgba(255, 60, 100, ${opacity})`);
          grad.addColorStop(0.3, `rgba(255, 40, 80, ${opacity * 0.6})`);
          grad.addColorStop(0.7, `rgba(200, 20, 60, ${opacity * 0.2})`);
          grad.addColorStop(1, 'rgba(180, 10, 40, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(hx, hy, hr, 0, Math.PI * 2);
          ctx.fill();
        }

        // ── Stars ──
        for (const s of stars) {
          let angle, sx, sy;

          if (s.isBar) {
            // Bar stars rotate rigidly with the bar
            angle = s.armAngle + barAngle;
            const spread = Math.sin(angle * 3 + globalTime * 0.1) * 8;
            sx = cx + Math.cos(angle) * s.dist * galaxyRadius + Math.cos(angle + Math.PI / 2) * spread + s.dx;
            sy = cy + Math.sin(angle) * s.dist * galaxyRadius * 0.55 + Math.sin(angle + Math.PI / 2) * spread * 0.55 + s.dy;
          } else {
            // Arm and disk stars: differential rotation with winding
            const windUp = (s.dist * 0.5);
            angle = s.armAngle + armRotation * s.orbitSpeed + windUp;
            sx = cx + Math.cos(angle) * s.dist * galaxyRadius + s.dx;
            sy = cy + Math.sin(angle) * s.dist * galaxyRadius * 0.55 + s.dy;
          }

          // Mouse gravity
          if (mouseDown) {
            const gdx = mouseX - sx;
            const gdy = mouseY - sy;
            const gDist = Math.sqrt(gdx * gdx + gdy * gdy);
            if (gDist < 300) {
              const force = (1 - gDist / 300) * 3;
              s.dx += gdx * force * dt * 0.4;
              s.dy += gdy * force * dt * 0.4;
            }
            s.dx *= 0.99; s.dy *= 0.99;
          } else {
            s.dx *= 0.96; s.dy *= 0.96;
          }

          // Check nebula tinting
          let hue = s.hue, satBoost = 0, lightBoost = 0;
          for (const n of nebulae) {
            const nebAngle = n.angle + globalTime * 0.005;
            const nx = cx + Math.cos(nebAngle) * n.dist * galaxyRadius;
            const ny = cy + Math.sin(nebAngle) * n.dist * galaxyRadius * 0.55;
            const ndx = sx - nx;
            const ndy = sy - ny;
            const nDist = Math.sqrt(ndx * ndx + ndy * ndy);
            const nr = n.radius * galaxyRadius;
            if (nDist < nr) {
              const influence = (1 - nDist / nr) * 0.4;
              // Shift hue toward nebula color
              const [cr, cg, cb] = n.color;
              const nebHue = Math.atan2(cb - cg, cr - cg) * 180 / Math.PI + 180;
              hue = hue + (nebHue - hue) * influence;
              satBoost += influence * 15;
              lightBoost += influence * 8;
            }
          }

          const twinkle = 0.7 + 0.3 * Math.sin(globalTime * s.twinkleSpeed + s.twinklePhase);
          const alpha = s.brightness * twinkle;

          const finalSat = Math.min(100, s.sat + satBoost);
          const finalLight = Math.min(90, s.light + lightBoost);

          if (s.size > 1.5 && s.brightness > 0.6) {
            const glowRadius = s.size * zoom * 3;
            const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowRadius);
            glow.addColorStop(0, `hsla(${hue}, ${finalSat}%, ${finalLight}%, ${alpha * 0.3})`);
            glow.addColorStop(1, `hsla(${hue}, ${finalSat}%, ${finalLight}%, 0)`);
            ctx.fillStyle = glow;
            ctx.fillRect(sx - glowRadius, sy - glowRadius, glowRadius * 2, glowRadius * 2);
          }

          ctx.fillStyle = `hsla(${hue}, ${finalSat}%, ${finalLight}%, ${alpha})`;
          ctx.beginPath();
          ctx.arc(sx, sy, s.size * zoom * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }

        // ── Outer Halo ──
        const halo = ctx.createRadialGradient(cx, cy, galaxyRadius * 0.3, cx, cy, galaxyRadius * 1.2);
        halo.addColorStop(0, 'rgba(100, 80, 160, 0.02)');
        halo.addColorStop(0.5, 'rgba(60, 50, 120, 0.015)');
        halo.addColorStop(1, 'rgba(30, 20, 60, 0)');
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, w, h);
      }

      // ─── App ──────────────────────────────────────────────
      const app = createApp({
        asciiConfig: {
          fontSize: 16,
          colorScheme: 'rainbow',
          background: '#04040a',
          sourceOpacity: 0,
        },
        layers: [
          {
            fontSize: 4,
            charset: 'density',
            colorScheme: 'vapor',
            offsetX: -107,
            offsetY: -2,
            zIndex: 15,
          },
          {
            fontSize: 4,
            charset: 'blocks',
            colorScheme: 'ocean',
            offsetX: -72,
          },
          {
            fontSize: 14.5,
            charset: 'minimal',
            colorScheme: 'vapor',
            patternMix: 0.58,
            opacity: 0.6,
            blendMode: 'add',
          },
          {
            fontSize: 5.5,
            charset: 'braille',
            colorScheme: 'ocean',
            pattern: 'moiré',
            patternMix: 0.5,
            fade: 1,
            blendMode: 'add',
            offsetX: -72,
            offsetY: 33,
            edgeDetect: true,
          },
        ],
        draw(ctx, { dt, width: w, height: h }) {
          drawBarredGalaxy(ctx, dt, w, h);
        },
      });

      // ─── Canvas / Window Events ───────────────────────────
      app.canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoom -= e.deltaY * 0.001;
        zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom));
      }, { passive: false });

      window.addEventListener('mousedown', (e) => {
        mouseDown = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
      });
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });
      window.addEventListener('mouseup', () => {
        mouseDown = false;
      });

      window.addEventListener('touchstart', (e) => {
        mouseDown = true;
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      });
      window.addEventListener('touchmove', (e) => {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      });
      window.addEventListener('touchend', () => {
        mouseDown = false;
      });
    </script>
  </body>
</html>
