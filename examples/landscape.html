<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Landscape</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { AsciiIfy } from '../src/index.js';

      // ─── Source Canvas ────────────────────────────────────
      const source = document.getElementById('source');
      const sCtx = source.getContext('2d');

      function resizeSource() {
        source.width = window.innerWidth;
        source.height = window.innerHeight;
      }
      resizeSource();
      window.addEventListener('resize', resizeSource);

      // ─── Utilities ────────────────────────────────────────
      function lerp(a, b, t) { return a + (b - a) * t; }
      function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

      function lerpColor(c1, c2, t) {
        return [
          lerp(c1[0], c2[0], t),
          lerp(c1[1], c2[1], t),
          lerp(c1[2], c2[2], t),
        ];
      }

      function rgb(c, a) {
        if (a !== undefined) return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
        return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
      }

      function smoothstep(lo, hi, x) {
        const t = clamp((x - lo) / (hi - lo), 0, 1);
        return t * t * (3 - 2 * t);
      }

      // Mulberry32 PRNG
      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ─── Time System ──────────────────────────────────────
      const CYCLE_DURATION = 120;
      let cycleTime = 0.18; // start at morning

      // Sky color palettes: [zenith, horizon]
      const SKY_NIGHT    = { zenith: [10, 10, 26],  horizon: [16, 16, 42]  };
      const SKY_PREDAWN  = { zenith: [10, 10, 26],  horizon: [42, 21, 32]  };
      const SKY_DAWN     = { zenith: [26, 32, 64],  horizon: [255, 136, 68] };
      const SKY_DAY      = { zenith: [51, 136, 204], horizon: [136, 187, 221] };
      const SKY_DUSK     = { zenith: [42, 32, 80],  horizon: [238, 85, 51]  };
      const SKY_TWILIGHT = { zenith: [21, 21, 48],  horizon: [51, 34, 85]  };

      function getTimeOfDay(t) {
        let skyBrightness, starVisibility, sunProgress, moonProgress;
        let sky, glowIntensity;

        // Sun visible 0.08–0.55, moon visible 0.63–0.95
        sunProgress = clamp((t - 0.08) / (0.55 - 0.08), 0, 1);
        moonProgress = clamp((t - 0.63) / (0.95 - 0.63), 0, 1);
        const sunVisible = t >= 0.08 && t <= 0.55;
        const moonVisible = t >= 0.63 && t <= 0.95;

        // Sky palette blending
        if (t < 0.08) {
          // Night → pre-dawn
          const p = t / 0.08;
          sky = { zenith: lerpColor(SKY_NIGHT.zenith, SKY_PREDAWN.zenith, p),
                  horizon: lerpColor(SKY_NIGHT.horizon, SKY_PREDAWN.horizon, p) };
          skyBrightness = lerp(0, 0.05, p);
          starVisibility = lerp(1, 0.8, p);
          glowIntensity = 0;
        } else if (t < 0.18) {
          // Dawn
          const p = (t - 0.08) / 0.1;
          sky = { zenith: lerpColor(SKY_PREDAWN.zenith, SKY_DAY.zenith, p),
                  horizon: lerpColor(SKY_DAWN.horizon, SKY_DAY.horizon, p) };
          skyBrightness = lerp(0.05, 0.8, p);
          starVisibility = lerp(0.8, 0, smoothstep(0, 0.6, p));
          glowIntensity = Math.sin(p * Math.PI) * 0.6;
        } else if (t < 0.45) {
          // Full day
          sky = SKY_DAY;
          skyBrightness = 1;
          starVisibility = 0;
          glowIntensity = 0;
        } else if (t < 0.55) {
          // Dusk
          const p = (t - 0.45) / 0.1;
          sky = { zenith: lerpColor(SKY_DAY.zenith, SKY_DUSK.zenith, p),
                  horizon: lerpColor(SKY_DAY.horizon, SKY_DUSK.horizon, p) };
          skyBrightness = lerp(1, 0.15, p);
          starVisibility = smoothstep(0.4, 1, p);
          glowIntensity = Math.sin(p * Math.PI) * 0.5;
        } else if (t < 0.63) {
          // Twilight
          const p = (t - 0.55) / 0.08;
          sky = { zenith: lerpColor(SKY_DUSK.zenith, SKY_TWILIGHT.zenith, p),
                  horizon: lerpColor(SKY_DUSK.horizon, SKY_TWILIGHT.horizon, p) };
          skyBrightness = lerp(0.15, 0.02, p);
          starVisibility = lerp(0.7, 1, p);
          glowIntensity = lerp(0.2, 0, p);
        } else if (t < 0.95) {
          // Night
          const p = (t - 0.63) / 0.32;
          sky = { zenith: lerpColor(SKY_TWILIGHT.zenith, SKY_NIGHT.zenith, Math.min(p * 2, 1)),
                  horizon: lerpColor(SKY_TWILIGHT.horizon, SKY_NIGHT.horizon, Math.min(p * 2, 1)) };
          skyBrightness = 0.02;
          starVisibility = 1;
          glowIntensity = 0;
        } else {
          // Pre-dawn
          const p = (t - 0.95) / 0.05;
          sky = { zenith: lerpColor(SKY_NIGHT.zenith, SKY_PREDAWN.zenith, p),
                  horizon: lerpColor(SKY_NIGHT.horizon, SKY_PREDAWN.horizon, p) };
          skyBrightness = lerp(0.02, 0.05, p);
          starVisibility = lerp(1, 0.8, p);
          glowIntensity = p * 0.2;
        }

        // Terrain & cloud colors derived from sky brightness
        const terrainDay = [42, 74, 26];
        const terrainNight = [10, 21, 8];
        const terrainColor = lerpColor(terrainNight, terrainDay, skyBrightness);

        const cloudDay = [255, 255, 255];
        const cloudDawn = [255, 190, 130];
        const cloudNight = [40, 45, 65];
        let cloudColor;
        if (t >= 0.08 && t < 0.18) {
          cloudColor = lerpColor(cloudDawn, cloudDay, (t - 0.08) / 0.1);
        } else if (t >= 0.45 && t < 0.55) {
          cloudColor = lerpColor(cloudDay, cloudDawn, (t - 0.45) / 0.1);
        } else if (skyBrightness > 0.5) {
          cloudColor = cloudDay;
        } else {
          cloudColor = lerpColor(cloudNight, cloudDay, skyBrightness * 2);
        }

        return {
          sky, skyBrightness, starVisibility, glowIntensity,
          sunProgress, moonProgress, sunVisible, moonVisible,
          terrainColor, cloudColor,
        };
      }

      // ─── Star System ──────────────────────────────────────
      const NUM_STARS = 150;
      const stars = [];
      for (let i = 0; i < NUM_STARS; i++) {
        stars.push({
          nx: Math.random(),
          ny: Math.random() * 0.55,
          brightness: 0.3 + Math.random() * 0.7,
          twinkleSpeed: 0.5 + Math.random() * 3,
          twinklePhase: Math.random() * Math.PI * 2,
          size: 0.5 + Math.random() * 1.5,
        });
      }

      // ─── Cloud System ─────────────────────────────────────
      const clouds = [];

      function spawnCloud(randomX) {
        const rng = mulberry32(Math.random() * 999999 | 0);
        const numBlobs = 3 + (rng() * 4 | 0);
        const cw = 60 + rng() * 120;
        const ch = 20 + rng() * 30;
        const blobs = [];
        for (let i = 0; i < numBlobs; i++) {
          blobs.push({
            ox: (rng() - 0.5) * cw * 0.7,
            oy: (rng() - 0.5) * ch * 0.4,
            rx: 20 + rng() * (cw * 0.35),
            ry: 10 + rng() * (ch * 0.4),
          });
        }
        return {
          x: randomX ? Math.random() * (source.width + 200) - 100 : -cw,
          y: 30 + Math.random() * (source.height * 0.32),
          baseSpeed: 10 + Math.random() * 20,
          width: cw,
          height: ch,
          blobs,
        };
      }

      // Initialize clouds spread across the sky
      for (let i = 0; i < 6; i++) clouds.push(spawnCloud(true));

      // ─── Wind System ──────────────────────────────────────
      let baseWind = 10;
      let gustStrength = 0;
      let gustTimer = 5 + Math.random() * 10;
      let gustPhase = 'idle'; // idle, ramp, hold, decay
      let gustPhaseTimer = 0;
      const windParticles = [];

      function updateWind(dt) {
        if (gustPhase === 'idle') {
          gustTimer -= dt;
          if (gustTimer <= 0) {
            gustPhase = 'ramp';
            gustPhaseTimer = 1;
            gustStrength = 20 + Math.random() * 30;
          }
        } else if (gustPhase === 'ramp') {
          gustPhaseTimer -= dt;
          if (gustPhaseTimer <= 0) {
            gustPhase = 'hold';
            gustPhaseTimer = 2 + Math.random() * 2;
          }
        } else if (gustPhase === 'hold') {
          gustPhaseTimer -= dt;
          if (gustPhaseTimer <= 0) {
            gustPhase = 'decay';
            gustPhaseTimer = 2;
          }
        } else if (gustPhase === 'decay') {
          gustPhaseTimer -= dt;
          if (gustPhaseTimer <= 0) {
            gustPhase = 'idle';
            gustTimer = 8 + Math.random() * 7;
            gustStrength = 0;
          }
        }

        // Current wind speed
        let currentGust = 0;
        if (gustPhase === 'ramp') currentGust = gustStrength * (1 - gustPhaseTimer);
        else if (gustPhase === 'hold') currentGust = gustStrength;
        else if (gustPhase === 'decay') currentGust = gustStrength * (gustPhaseTimer / 2);

        const windSpeed = baseWind + currentGust;

        // Spawn wind particles during gusts
        if (currentGust > 10 && windParticles.length < 40) {
          windParticles.push({
            x: -10,
            y: 50 + Math.random() * (source.height * 0.7),
            len: 8 + Math.random() * 20,
            speed: windSpeed * (1.5 + Math.random()),
            life: 0.5 + Math.random() * 1,
            maxLife: 1.5,
          });
        }

        // Update particles
        for (let i = windParticles.length - 1; i >= 0; i--) {
          const p = windParticles[i];
          p.x += p.speed * dt;
          p.life -= dt;
          if (p.life <= 0 || p.x > source.width + 50) {
            windParticles.splice(i, 1);
          }
        }

        return windSpeed;
      }

      // ─── Bird System ──────────────────────────────────────
      const flocks = [];
      let birdTimer = 5;

      function spawnFlock() {
        const count = 3 + (Math.random() * 5 | 0);
        const birds = [];
        for (let i = 0; i < count; i++) {
          // V-formation offsets
          const side = i % 2 === 0 ? 1 : -1;
          const row = Math.ceil(i / 2);
          birds.push({
            ox: -row * 12,
            oy: side * row * 8,
          });
        }
        return {
          x: -40,
          y: 40 + Math.random() * (source.height * 0.3),
          speed: 40 + Math.random() * 40,
          wingPhase: Math.random() * Math.PI * 2,
          birds,
        };
      }

      // ─── Mountain System ──────────────────────────────────
      const MOUNTAIN_RANGES = [
        { parallax: 0.05, dayColor: [85, 102, 119], nightColor: [21, 21, 37], baseHeight: 0.35, amp: 0.08, baseFreq: 0.0008, octaves: 2, seed: 42 },
        { parallax: 0.15, dayColor: [68, 85, 102],  nightColor: [16, 16, 32], baseHeight: 0.38, amp: 0.1,  baseFreq: 0.001,  octaves: 3, seed: 137 },
        { parallax: 0.3,  dayColor: [51, 68, 85],   nightColor: [10, 10, 24], baseHeight: 0.42, amp: 0.12, baseFreq: 0.0015, octaves: 4, seed: 271 },
      ];

      function mountainHeight(worldX, range) {
        let h = 0;
        for (let o = 0; o < range.octaves; o++) {
          const freq = range.baseFreq * Math.pow(2, o);
          const amp = range.amp * Math.pow(0.5, o);
          h += Math.sin(worldX * freq + range.seed * 17.3) * amp;
          h += Math.cos(worldX * freq * 0.7 + range.seed * 31.1) * amp * 0.5;
        }
        return range.baseHeight + h;
      }

      // ─── Terrain & Vegetation ─────────────────────────────
      const CAMERA_SPEED = 30;
      let cameraX = 0;
      const CHUNK_SIZE = 200;
      const chunkCache = new Map();
      const GROUND_Y = 0.82; // ground starts at 82% of screen height

      function generateChunk(index) {
        const rng = mulberry32(index * 73856093);
        const numTrees = 1 + (rng() * 3 | 0);
        const numBushes = 2 + (rng() * 4 | 0);
        const trees = [];
        const bushes = [];

        for (let i = 0; i < numTrees; i++) {
          trees.push({
            ox: rng() * CHUNK_SIZE,
            height: 40 + rng() * 40,
            width: 20 + rng() * 30,
            tiers: 1 + (rng() * 3 | 0), // 1–3 triangle tiers
          });
        }
        for (let i = 0; i < numBushes; i++) {
          bushes.push({
            ox: rng() * CHUNK_SIZE,
            height: 12 + rng() * 18,
            width: 20 + rng() * 25,
          });
        }
        return { trees, bushes };
      }

      function getChunk(index) {
        if (!chunkCache.has(index)) {
          chunkCache.set(index, generateChunk(index));
        }
        return chunkCache.get(index);
      }

      // ─── Drawing Functions ────────────────────────────────
      function drawSky(w, h, tod) {
        const grad = sCtx.createLinearGradient(0, 0, 0, h * 0.7);
        grad.addColorStop(0, rgb(tod.sky.zenith));
        grad.addColorStop(1, rgb(tod.sky.horizon));
        sCtx.fillStyle = grad;
        sCtx.fillRect(0, 0, w, h);
      }

      function drawHorizonGlow(w, h, tod) {
        if (tod.glowIntensity <= 0) return;
        // Glow near sun/moon at horizon
        let glowX;
        if (tod.sunVisible) {
          glowX = w * (0.15 + 0.7 * tod.sunProgress);
        } else {
          glowX = w * 0.5;
        }
        const glowY = h * GROUND_Y;
        const radius = Math.min(w, h) * 0.4;
        const glow = sCtx.createRadialGradient(glowX, glowY, 0, glowX, glowY, radius);
        glow.addColorStop(0, `rgba(255, 180, 80, ${tod.glowIntensity * 0.5})`);
        glow.addColorStop(0.4, `rgba(255, 120, 50, ${tod.glowIntensity * 0.25})`);
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        sCtx.fillStyle = glow;
        sCtx.fillRect(0, 0, w, h);
      }

      function drawStars(w, h, tod, time) {
        if (tod.starVisibility <= 0.01) return;
        for (const star of stars) {
          const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinklePhase);
          const alpha = star.brightness * twinkle * tod.starVisibility;
          if (alpha < 0.05) continue;
          const sx = star.nx * w;
          const sy = star.ny * h;
          const sz = star.size;
          sCtx.fillStyle = `rgba(220, 225, 255, ${alpha})`;
          sCtx.fillRect(sx - sz * 0.5, sy - sz * 0.5, sz, sz);
        }
      }

      function drawSun(w, h, tod) {
        if (!tod.sunVisible) return;
        const p = tod.sunProgress;
        const sx = w * (0.15 + 0.7 * p);
        const sy = h * GROUND_Y - Math.sin(p * Math.PI) * (h * 0.5);

        // Large glow
        const glowR = 80;
        const glow = sCtx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
        glow.addColorStop(0, 'rgba(255, 240, 180, 0.6)');
        glow.addColorStop(0.3, 'rgba(255, 200, 100, 0.3)');
        glow.addColorStop(0.7, 'rgba(255, 160, 60, 0.1)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        sCtx.fillStyle = glow;
        sCtx.fillRect(sx - glowR, sy - glowR, glowR * 2, glowR * 2);

        // Sun disc
        sCtx.fillStyle = 'rgba(255, 245, 200, 0.95)';
        sCtx.beginPath();
        sCtx.arc(sx, sy, 18, 0, Math.PI * 2);
        sCtx.fill();
      }

      function drawMoon(w, h, tod) {
        if (!tod.moonVisible) return;
        const p = tod.moonProgress;
        const mx = w * (0.2 + 0.6 * p);
        const my = h * GROUND_Y - Math.sin(p * Math.PI) * (h * 0.4);

        // Glow
        const glowR = 60;
        const glow = sCtx.createRadialGradient(mx, my, 0, mx, my, glowR);
        glow.addColorStop(0, 'rgba(180, 200, 240, 0.4)');
        glow.addColorStop(0.4, 'rgba(150, 180, 230, 0.15)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        sCtx.fillStyle = glow;
        sCtx.fillRect(mx - glowR, my - glowR, glowR * 2, glowR * 2);

        // Moon disc
        sCtx.fillStyle = 'rgba(200, 220, 255, 0.85)';
        sCtx.beginPath();
        sCtx.arc(mx, my, 14, 0, Math.PI * 2);
        sCtx.fill();

        // Crescent shadow
        sCtx.fillStyle = rgb(tod.sky.zenith);
        sCtx.beginPath();
        sCtx.arc(mx + 6, my - 3, 12, 0, Math.PI * 2);
        sCtx.fill();
      }

      function drawClouds(w, h, tod, windSpeed, dt) {
        const cloudAlpha = tod.skyBrightness > 0.5 ? 0.6 : 0.3 + tod.skyBrightness * 0.4;

        for (let i = clouds.length - 1; i >= 0; i--) {
          const c = clouds[i];
          c.x += (c.baseSpeed + windSpeed * 0.5) * dt;

          // Respawn if off right edge
          if (c.x - c.width > w + 50) {
            clouds[i] = spawnCloud(false);
            continue;
          }

          sCtx.fillStyle = rgb(tod.cloudColor, cloudAlpha);
          for (const b of c.blobs) {
            sCtx.beginPath();
            sCtx.ellipse(c.x + b.ox, c.y + b.oy, b.rx, b.ry, 0, 0, Math.PI * 2);
            sCtx.fill();
          }
        }
      }

      function drawMountainRange(w, h, range, tod) {
        const color = lerpColor(range.nightColor, range.dayColor, tod.skyBrightness);
        sCtx.fillStyle = rgb(color);
        sCtx.beginPath();
        const groundPx = h * GROUND_Y;

        for (let sx = 0; sx <= w; sx += 3) {
          const worldX = cameraX * range.parallax + sx;
          const mh = mountainHeight(worldX, range);
          const py = groundPx - mh * h;
          if (sx === 0) sCtx.moveTo(sx, py);
          else sCtx.lineTo(sx, py);
        }
        sCtx.lineTo(w, groundPx);
        sCtx.lineTo(0, groundPx);
        sCtx.closePath();
        sCtx.fill();
      }

      function drawBirds(w, h, tod, windSpeed, time, dt) {
        // Only spawn during daytime
        if (cycleTime >= 0.12 && cycleTime <= 0.50) {
          birdTimer -= dt;
          if (birdTimer <= 0 && flocks.length < 3) {
            flocks.push(spawnFlock());
            birdTimer = 15 + Math.random() * 15;
          }
        }

        const birdAlpha = clamp(tod.skyBrightness * 2, 0, 0.8);
        if (birdAlpha < 0.05) {
          flocks.length = 0;
          return;
        }

        sCtx.strokeStyle = `rgba(20, 20, 30, ${birdAlpha})`;
        sCtx.lineWidth = 1.5;

        for (let i = flocks.length - 1; i >= 0; i--) {
          const f = flocks[i];
          f.x += (f.speed + windSpeed * 0.3) * dt;

          if (f.x > w + 100) {
            flocks.splice(i, 1);
            continue;
          }

          const wingAngle = 0.3 + 0.25 * Math.sin(time * 5 + f.wingPhase);

          for (const b of f.birds) {
            const bx = f.x + b.ox;
            const by = f.y + b.oy;
            const wingLen = 4;

            sCtx.beginPath();
            sCtx.moveTo(bx - wingLen, by - wingLen * wingAngle);
            sCtx.lineTo(bx, by);
            sCtx.lineTo(bx + wingLen, by - wingLen * wingAngle);
            sCtx.stroke();
          }
        }
      }

      function drawWindParticles(w, h, tod) {
        if (windParticles.length === 0) return;
        const alpha = Math.min(tod.skyBrightness + 0.15, 0.4);
        sCtx.strokeStyle = `rgba(200, 210, 230, ${alpha})`;
        sCtx.lineWidth = 0.8;

        for (const p of windParticles) {
          const vis = p.life / p.maxLife;
          sCtx.globalAlpha = vis * 0.5;
          sCtx.beginPath();
          sCtx.moveTo(p.x, p.y);
          sCtx.lineTo(p.x + p.len, p.y);
          sCtx.stroke();
        }
        sCtx.globalAlpha = 1;
      }

      function drawGround(w, h, tod) {
        const groundTop = h * GROUND_Y;
        const grad = sCtx.createLinearGradient(0, groundTop, 0, h);
        grad.addColorStop(0, rgb(tod.terrainColor));
        const darker = tod.terrainColor.map(c => c * 0.6);
        grad.addColorStop(1, rgb(darker));
        sCtx.fillStyle = grad;
        sCtx.fillRect(0, groundTop, w, h - groundTop);
      }

      function drawTree(x, groundY, tree, tod) {
        const { height, width, tiers } = tree;
        const trunkW = width * 0.15;
        const trunkH = height * 0.25;

        // Colors
        const canopyDay = [22, 75, 16];
        const canopyNight = [8, 18, 8];
        const trunkDay = [58, 37, 16];
        const trunkNight = [20, 14, 8];
        const canopyColor = lerpColor(canopyNight, canopyDay, tod.skyBrightness);
        const trunkColor = lerpColor(trunkNight, trunkDay, tod.skyBrightness);

        // Trunk
        sCtx.fillStyle = rgb(trunkColor);
        sCtx.fillRect(x - trunkW / 2, groundY - trunkH, trunkW, trunkH);

        // Canopy tiers (triangles stacked, each smaller going up)
        sCtx.fillStyle = rgb(canopyColor);
        const tierH = (height - trunkH) / tiers;
        for (let t = 0; t < tiers; t++) {
          const tierBottom = groundY - trunkH - t * tierH * 0.7;
          const tierTop = tierBottom - tierH;
          const tierW = width * (1 - t * 0.2);

          sCtx.beginPath();
          sCtx.moveTo(x, tierTop);
          sCtx.lineTo(x - tierW / 2, tierBottom);
          sCtx.lineTo(x + tierW / 2, tierBottom);
          sCtx.closePath();
          sCtx.fill();
        }
      }

      function drawBush(x, groundY, bush, tod) {
        const bushDay = [30, 90, 22];
        const bushNight = [10, 24, 10];
        const color = lerpColor(bushNight, bushDay, tod.skyBrightness);
        sCtx.fillStyle = rgb(color);

        // Two overlapping circles
        sCtx.beginPath();
        sCtx.arc(x - bush.width * 0.15, groundY - bush.height * 0.5, bush.height * 0.5, 0, Math.PI * 2);
        sCtx.fill();
        sCtx.beginPath();
        sCtx.arc(x + bush.width * 0.15, groundY - bush.height * 0.45, bush.height * 0.45, 0, Math.PI * 2);
        sCtx.fill();
      }

      function drawVegetation(w, h, tod) {
        const groundY = h * GROUND_Y;
        const startChunk = Math.floor((cameraX - 200) / CHUNK_SIZE);
        const endChunk = Math.floor((cameraX + w + 200) / CHUNK_SIZE);

        for (let ci = startChunk; ci <= endChunk; ci++) {
          const chunk = getChunk(ci);
          const chunkWorldX = ci * CHUNK_SIZE;

          for (const bush of chunk.bushes) {
            const screenX = (chunkWorldX + bush.ox) - cameraX;
            if (screenX < -50 || screenX > w + 50) continue;
            drawBush(screenX, groundY, bush, tod);
          }
          for (const tree of chunk.trees) {
            const screenX = (chunkWorldX + tree.ox) - cameraX;
            if (screenX < -60 || screenX > w + 60) continue;
            drawTree(screenX, groundY, tree, tod);
          }
        }

        // Prune distant chunks
        for (const [key] of chunkCache) {
          if (key < startChunk - 10) chunkCache.delete(key);
        }
      }

      // ─── Main Draw ────────────────────────────────────────
      let lastTime = 0;

      function drawSource(time) {
        const t = time * 0.001;
        const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.05) : 0.016;
        lastTime = time;

        const w = source.width;
        const h = source.height;

        // Advance systems
        cycleTime = (cycleTime + dt / CYCLE_DURATION) % 1;
        cameraX += CAMERA_SPEED * dt;
        const windSpeed = updateWind(dt);
        const tod = getTimeOfDay(cycleTime);

        // Draw back to front
        drawSky(w, h, tod);
        drawHorizonGlow(w, h, tod);
        drawStars(w, h, tod, t);
        drawSun(w, h, tod);
        drawMoon(w, h, tod);
        drawClouds(w, h, tod, windSpeed, dt);
        drawMountainRange(w, h, MOUNTAIN_RANGES[0], tod);
        drawMountainRange(w, h, MOUNTAIN_RANGES[1], tod);
        drawBirds(w, h, tod, windSpeed, t, dt);
        drawWindParticles(w, h, tod);
        drawMountainRange(w, h, MOUNTAIN_RANGES[2], tod);
        drawGround(w, h, tod);
        drawVegetation(w, h, tod);
      }

      // ─── ASCII-ify with Layers ────────────────────────────
      const ascii = new AsciiIfy(source, {
        background: '#0a0a12',
        sourceOpacity: 0,
        speed: 1,
      });

      // Layer 1: Landscape structure — broad gradients, sky & mountains
      ascii.addLayer({
        source,
        fontSize: 18,
        charset: 'blocks',
        colorScheme: 'ocean',
        blendMode: 'replace',
        opacity: 1,
      });

      // Layer 2: Detail — trees, birds, stars, cloud edges
      ascii.addLayer({
        source,
        fontSize: 8,
        charset: 'density',
        colorScheme: 'mono',
        blendMode: 'add',
        opacity: 0.65,
      });

      // Layer 3: Atmospheric texture — haze, shimmer
      ascii.addLayer({
        source,
        fontSize: 12,
        charset: 'braille',
        colorScheme: 'vapor',
        pattern: 'waves',
        patternMix: 0.25,
        blendMode: 'add',
        opacity: 0.2,
      });

      // ─── Controls ─────────────────────────────────────────
      document.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') ascii.togglePanel();
        if (e.key === 'e' || e.key === 'E') ascii.set('enabled', !ascii.get('enabled'));
      });

      // ─── Main Loop ────────────────────────────────────────
      function loop(time) {
        drawSource(time);
        ascii.render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
