<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Landscape</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, clamp, smoothstep, mulberry32, lerpColor, rgb } from './utils.js';

      // ─── Time System ──────────────────────────────────────
      const CYCLE_DURATION = 120;
      let cycleTime = 0.18; // start at morning

      // Sky color palettes: [zenith, horizon]
      const SKY_NIGHT    = { zenith: [10, 10, 26],  horizon: [16, 16, 42]  };
      const SKY_PREDAWN  = { zenith: [10, 10, 26],  horizon: [42, 21, 32]  };
      const SKY_DAWN     = { zenith: [26, 32, 64],  horizon: [255, 136, 68] };
      const SKY_DAY      = { zenith: [51, 136, 204], horizon: [136, 187, 221] };
      const SKY_DUSK     = { zenith: [42, 32, 80],  horizon: [238, 85, 51]  };
      const SKY_TWILIGHT = { zenith: [21, 21, 48],  horizon: [51, 34, 85]  };

      function getTimeOfDay(t) {
        let skyBrightness, starVisibility, sunProgress, moonProgress;
        let sky, glowIntensity;

        // Sun visible 0.08–0.55, moon visible 0.63–0.95
        sunProgress = clamp((t - 0.08) / (0.55 - 0.08), 0, 1);
        moonProgress = clamp((t - 0.63) / (0.95 - 0.63), 0, 1);
        const sunVisible = t >= 0.08 && t <= 0.55;
        const moonVisible = t >= 0.63 && t <= 0.95;

        // Sky palette blending
        if (t < 0.08) {
          // Night → pre-dawn
          const p = t / 0.08;
          sky = { zenith: lerpColor(SKY_NIGHT.zenith, SKY_PREDAWN.zenith, p),
                  horizon: lerpColor(SKY_NIGHT.horizon, SKY_PREDAWN.horizon, p) };
          skyBrightness = lerp(0, 0.05, p);
          starVisibility = lerp(1, 0.8, p);
          glowIntensity = 0;
        } else if (t < 0.18) {
          // Dawn
          const p = (t - 0.08) / 0.1;
          sky = { zenith: lerpColor(SKY_PREDAWN.zenith, SKY_DAY.zenith, p),
                  horizon: lerpColor(SKY_DAWN.horizon, SKY_DAY.horizon, p) };
          skyBrightness = lerp(0.05, 0.8, p);
          starVisibility = lerp(0.8, 0, smoothstep(0, 0.6, p));
          glowIntensity = Math.sin(p * Math.PI) * 0.6;
        } else if (t < 0.45) {
          // Full day
          sky = SKY_DAY;
          skyBrightness = 1;
          starVisibility = 0;
          glowIntensity = 0;
        } else if (t < 0.55) {
          // Dusk
          const p = (t - 0.45) / 0.1;
          sky = { zenith: lerpColor(SKY_DAY.zenith, SKY_DUSK.zenith, p),
                  horizon: lerpColor(SKY_DAY.horizon, SKY_DUSK.horizon, p) };
          skyBrightness = lerp(1, 0.15, p);
          starVisibility = smoothstep(0.4, 1, p);
          glowIntensity = Math.sin(p * Math.PI) * 0.5;
        } else if (t < 0.63) {
          // Twilight
          const p = (t - 0.55) / 0.08;
          sky = { zenith: lerpColor(SKY_DUSK.zenith, SKY_TWILIGHT.zenith, p),
                  horizon: lerpColor(SKY_DUSK.horizon, SKY_TWILIGHT.horizon, p) };
          skyBrightness = lerp(0.15, 0.02, p);
          starVisibility = lerp(0.7, 1, p);
          glowIntensity = lerp(0.2, 0, p);
        } else if (t < 0.95) {
          // Night
          const p = (t - 0.63) / 0.32;
          sky = { zenith: lerpColor(SKY_TWILIGHT.zenith, SKY_NIGHT.zenith, Math.min(p * 2, 1)),
                  horizon: lerpColor(SKY_TWILIGHT.horizon, SKY_NIGHT.horizon, Math.min(p * 2, 1)) };
          skyBrightness = 0.02;
          starVisibility = 1;
          glowIntensity = 0;
        } else {
          // Pre-dawn
          const p = (t - 0.95) / 0.05;
          sky = { zenith: lerpColor(SKY_NIGHT.zenith, SKY_PREDAWN.zenith, p),
                  horizon: lerpColor(SKY_NIGHT.horizon, SKY_PREDAWN.horizon, p) };
          skyBrightness = lerp(0.02, 0.05, p);
          starVisibility = lerp(1, 0.8, p);
          glowIntensity = p * 0.2;
        }

        // Terrain & cloud colors derived from sky brightness
        const terrainDay = [42, 74, 26];
        const terrainNight = [10, 21, 8];
        const terrainColor = lerpColor(terrainNight, terrainDay, skyBrightness);

        const cloudDay = [255, 255, 255];
        const cloudDawn = [255, 190, 130];
        const cloudNight = [40, 45, 65];
        let cloudColor;
        if (t >= 0.08 && t < 0.18) {
          cloudColor = lerpColor(cloudDawn, cloudDay, (t - 0.08) / 0.1);
        } else if (t >= 0.45 && t < 0.55) {
          cloudColor = lerpColor(cloudDay, cloudDawn, (t - 0.45) / 0.1);
        } else if (skyBrightness > 0.5) {
          cloudColor = cloudDay;
        } else {
          cloudColor = lerpColor(cloudNight, cloudDay, skyBrightness * 2);
        }

        return {
          sky, skyBrightness, starVisibility, glowIntensity,
          sunProgress, moonProgress, sunVisible, moonVisible,
          terrainColor, cloudColor,
        };
      }

      // ─── Star System ──────────────────────────────────────
      const NUM_STARS = 150;
      const stars = [];
      for (let i = 0; i < NUM_STARS; i++) {
        stars.push({
          nx: Math.random(),
          ny: Math.random() * 0.55,
          brightness: 0.3 + Math.random() * 0.7,
          twinkleSpeed: 0.5 + Math.random() * 3,
          twinklePhase: Math.random() * Math.PI * 2,
          size: 0.5 + Math.random() * 1.5,
        });
      }

      // ─── Cloud System ─────────────────────────────────────
      const clouds = [];

      function spawnCloud(randomX) {
        const rng = mulberry32(Math.random() * 999999 | 0);
        const numBlobs = 3 + (rng() * 4 | 0);
        const cw = 60 + rng() * 120;
        const ch = 20 + rng() * 30;
        const blobs = [];
        for (let i = 0; i < numBlobs; i++) {
          blobs.push({
            ox: (rng() - 0.5) * cw * 0.7,
            oy: (rng() - 0.5) * ch * 0.4,
            rx: 20 + rng() * (cw * 0.35),
            ry: 10 + rng() * (ch * 0.4),
          });
        }
        return {
          x: randomX ? Math.random() * (app.canvas.width + 200) - 100 : -cw,
          y: 30 + Math.random() * (app.canvas.height * 0.32),
          baseSpeed: 10 + Math.random() * 20,
          width: cw,
          height: ch,
          blobs,
        };
      }

      // ─── Wind System ──────────────────────────────────────
      let baseWind = 10;
      let gustStrength = 0;
      let gustTimer = 5 + Math.random() * 10;
      let gustPhase = 'idle'; // idle, ramp, hold, decay
      let gustPhaseTimer = 0;
      const windParticles = [];

      function updateWind(dt) {
        if (gustPhase === 'idle') {
          gustTimer -= dt;
          if (gustTimer <= 0) {
            gustPhase = 'ramp';
            gustPhaseTimer = 1;
            gustStrength = 20 + Math.random() * 30;
          }
        } else if (gustPhase === 'ramp') {
          gustPhaseTimer -= dt;
          if (gustPhaseTimer <= 0) {
            gustPhase = 'hold';
            gustPhaseTimer = 2 + Math.random() * 2;
          }
        } else if (gustPhase === 'hold') {
          gustPhaseTimer -= dt;
          if (gustPhaseTimer <= 0) {
            gustPhase = 'decay';
            gustPhaseTimer = 2;
          }
        } else if (gustPhase === 'decay') {
          gustPhaseTimer -= dt;
          if (gustPhaseTimer <= 0) {
            gustPhase = 'idle';
            gustTimer = 8 + Math.random() * 7;
            gustStrength = 0;
          }
        }

        // Current wind speed
        let currentGust = 0;
        if (gustPhase === 'ramp') currentGust = gustStrength * (1 - gustPhaseTimer);
        else if (gustPhase === 'hold') currentGust = gustStrength;
        else if (gustPhase === 'decay') currentGust = gustStrength * (gustPhaseTimer / 2);

        const windSpeed = baseWind + currentGust;

        // Spawn wind particles during gusts
        if (currentGust > 10 && windParticles.length < 40) {
          windParticles.push({
            x: -10,
            y: 50 + Math.random() * (app.canvas.height * 0.7),
            len: 8 + Math.random() * 20,
            speed: windSpeed * (1.5 + Math.random()),
            life: 0.5 + Math.random() * 1,
            maxLife: 1.5,
          });
        }

        // Update particles (swap-and-pop)
        let len = windParticles.length;
        for (let i = len - 1; i >= 0; i--) {
          const p = windParticles[i];
          p.x += p.speed * dt;
          p.life -= dt;
          if (p.life <= 0 || p.x > app.canvas.width + 50) {
            windParticles[i] = windParticles[len - 1]; len--;
          }
        }
        windParticles.length = len;

        return windSpeed;
      }

      // ─── Bird System ──────────────────────────────────────
      const flocks = [];
      let birdTimer = 5;

      function spawnFlock() {
        const count = 3 + (Math.random() * 5 | 0);
        const birds = [];
        for (let i = 0; i < count; i++) {
          // V-formation offsets
          const side = i % 2 === 0 ? 1 : -1;
          const row = Math.ceil(i / 2);
          birds.push({
            ox: -row * 12,
            oy: side * row * 8,
          });
        }
        return {
          x: -40,
          y: 40 + Math.random() * (app.canvas.height * 0.3),
          speed: 40 + Math.random() * 40,
          wingPhase: Math.random() * Math.PI * 2,
          birds,
        };
      }

      // ─── Mountain System ──────────────────────────────────
      const MOUNTAIN_RANGES = [
        { parallax: 0.05, dayColor: [85, 102, 119], nightColor: [21, 21, 37], baseHeight: 0.35, amp: 0.08, baseFreq: 0.0008, octaves: 2, seed: 42 },
        { parallax: 0.15, dayColor: [68, 85, 102],  nightColor: [16, 16, 32], baseHeight: 0.38, amp: 0.1,  baseFreq: 0.001,  octaves: 3, seed: 137 },
        { parallax: 0.3,  dayColor: [51, 68, 85],   nightColor: [10, 10, 24], baseHeight: 0.42, amp: 0.12, baseFreq: 0.0015, octaves: 4, seed: 271 },
      ];

      function mountainHeight(worldX, range) {
        let h = 0;
        for (let o = 0; o < range.octaves; o++) {
          const freq = range.baseFreq * Math.pow(2, o);
          const amp = range.amp * Math.pow(0.5, o);
          h += Math.sin(worldX * freq + range.seed * 17.3) * amp;
          h += Math.cos(worldX * freq * 0.7 + range.seed * 31.1) * amp * 0.5;
        }
        return range.baseHeight + h;
      }

      // ─── Terrain & Vegetation ─────────────────────────────
      const CAMERA_SPEED = 30;
      let cameraX = 0;
      const CHUNK_SIZE = 200;
      const chunkCache = new Map();
      const GROUND_Y = 0.82; // ground starts at 82% of screen height

      function generateChunk(index) {
        const rng = mulberry32(index * 73856093);
        const numTrees = 2 + (rng() * 4 | 0);
        const numBushes = 3 + (rng() * 4 | 0);
        const numFlowers = 3 + (rng() * 6 | 0);
        const numRocks = rng() < 0.6 ? 1 + (rng() * 2 | 0) : 0;
        const trees = [];
        const bushes = [];
        const flowers = [];
        const rocks = [];

        const FLOWER_COLORS = [[220,50,50],[240,200,40],[180,80,200],[240,240,240]];

        for (let i = 0; i < numTrees; i++) {
          const r = rng();
          let type;
          if (r < 0.4) type = 'pine';
          else if (r < 0.8) type = 'oak';
          else type = 'birch';

          const tree = {
            ox: rng() * CHUNK_SIZE,
            height: 100 + rng() * 80,
            width: 50 + rng() * 50,
            type,
            swayPhase: rng() * Math.PI * 2,
            swayAmount: 0.008 + rng() * 0.015,
          };

          if (type === 'pine') {
            tree.tiers = 2 + (rng() * 4 | 0);
          } else if (type === 'oak') {
            const numBlobs = 4 + (rng() * 3 | 0);
            tree.crownBlobs = [];
            for (let j = 0; j < numBlobs; j++) {
              tree.crownBlobs.push({
                ox: (rng() - 0.5) * tree.width * 0.7,
                oy: (rng() - 0.5) * tree.height * 0.3,
                r: tree.width * (0.2 + rng() * 0.15),
                greenOff: (rng() - 0.5) * 20,
              });
            }
          } else {
            const numLeafClusters = 6 + (rng() * 4 | 0);
            tree.leafClusters = [];
            for (let j = 0; j < numLeafClusters; j++) {
              tree.leafClusters.push({
                ox: (rng() - 0.5) * tree.width * 0.6,
                oy: -rng() * tree.height * 0.6,
                r: 5 + rng() * 8,
                greenOff: (rng() - 0.5) * 15,
              });
            }
          }
          trees.push(tree);
        }

        for (let i = 0; i < numBushes; i++) {
          const numBlobs = 3 + (rng() * 3 | 0);
          const bw = 28 + rng() * 30;
          const bh = 18 + rng() * 24;
          const blobs = [];
          for (let j = 0; j < numBlobs; j++) {
            blobs.push({
              ox: (rng() - 0.5) * bw * 0.6,
              oy: (rng() - 0.3) * bh * 0.4,
              r: bh * (0.3 + rng() * 0.2),
              greenOff: (rng() - 0.5) * 10,
            });
          }
          bushes.push({
            ox: rng() * CHUNK_SIZE,
            height: bh,
            width: bw,
            blobs,
            swayPhase: rng() * Math.PI * 2,
          });
        }

        for (let i = 0; i < numFlowers; i++) {
          flowers.push({
            ox: rng() * CHUNK_SIZE,
            color: FLOWER_COLORS[rng() * 4 | 0],
            size: 3 + rng() * 3,
          });
        }

        for (let i = 0; i < numRocks; i++) {
          rocks.push({
            ox: rng() * CHUNK_SIZE,
            width: 8 + rng() * 14,
            height: 5 + rng() * 8,
          });
        }

        return { trees, bushes, flowers, rocks };
      }

      function getChunk(index) {
        if (!chunkCache.has(index)) {
          chunkCache.set(index, generateChunk(index));
        }
        return chunkCache.get(index);
      }

      // ─── Drawing Functions ────────────────────────────────
      function drawSky(ctx, w, h, tod) {
        const grad = ctx.createLinearGradient(0, 0, 0, h * 0.7);
        grad.addColorStop(0, rgb(tod.sky.zenith));
        grad.addColorStop(1, rgb(tod.sky.horizon));
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      function drawHorizonGlow(ctx, w, h, tod) {
        if (tod.glowIntensity <= 0) return;
        // Glow near sun/moon at horizon
        let glowX;
        if (tod.sunVisible) {
          glowX = w * (0.15 + 0.7 * tod.sunProgress);
        } else {
          glowX = w * 0.5;
        }
        const glowY = h * GROUND_Y;
        const radius = Math.min(w, h) * 0.4;
        const glow = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, radius);
        glow.addColorStop(0, `rgba(255, 180, 80, ${tod.glowIntensity * 0.5})`);
        glow.addColorStop(0.4, `rgba(255, 120, 50, ${tod.glowIntensity * 0.25})`);
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
      }

      function drawStars(ctx, w, h, tod, time) {
        if (tod.starVisibility <= 0.01) return;
        for (const star of stars) {
          const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinklePhase);
          const alpha = star.brightness * twinkle * tod.starVisibility;
          if (alpha < 0.05) continue;
          const sx = star.nx * w;
          const sy = star.ny * h;
          const sz = star.size;
          ctx.fillStyle = `rgba(220, 225, 255, ${alpha})`;
          ctx.fillRect(sx - sz * 0.5, sy - sz * 0.5, sz, sz);
        }
      }

      function drawSun(ctx, w, h, tod) {
        if (!tod.sunVisible) return;
        const p = tod.sunProgress;
        const sx = w * (0.15 + 0.7 * p);
        const sy = h * GROUND_Y - Math.sin(p * Math.PI) * (h * 0.5);

        // Large glow
        const glowR = 80;
        const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
        glow.addColorStop(0, 'rgba(255, 240, 180, 0.6)');
        glow.addColorStop(0.3, 'rgba(255, 200, 100, 0.3)');
        glow.addColorStop(0.7, 'rgba(255, 160, 60, 0.1)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(sx - glowR, sy - glowR, glowR * 2, glowR * 2);

        // Sun disc
        ctx.fillStyle = 'rgba(255, 245, 200, 0.95)';
        ctx.beginPath();
        ctx.arc(sx, sy, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawMoon(ctx, w, h, tod) {
        if (!tod.moonVisible) return;
        const p = tod.moonProgress;
        const mx = w * (0.2 + 0.6 * p);
        const my = h * GROUND_Y - Math.sin(p * Math.PI) * (h * 0.4);

        // Glow
        const glowR = 60;
        const glow = ctx.createRadialGradient(mx, my, 0, mx, my, glowR);
        glow.addColorStop(0, 'rgba(180, 200, 240, 0.4)');
        glow.addColorStop(0.4, 'rgba(150, 180, 230, 0.15)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(mx - glowR, my - glowR, glowR * 2, glowR * 2);

        // Moon disc
        ctx.fillStyle = 'rgba(200, 220, 255, 0.85)';
        ctx.beginPath();
        ctx.arc(mx, my, 14, 0, Math.PI * 2);
        ctx.fill();

        // Crescent shadow
        ctx.fillStyle = rgb(tod.sky.zenith);
        ctx.beginPath();
        ctx.arc(mx + 6, my - 3, 12, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawClouds(ctx, w, h, tod, windSpeed, dt) {
        const cloudAlpha = tod.skyBrightness > 0.5 ? 0.6 : 0.3 + tod.skyBrightness * 0.4;

        for (let i = clouds.length - 1; i >= 0; i--) {
          const c = clouds[i];
          c.x += (c.baseSpeed + windSpeed * 0.5) * dt;

          // Respawn if off right edge
          if (c.x - c.width > w + 50) {
            clouds[i] = spawnCloud(false);
            continue;
          }

          ctx.fillStyle = rgb(tod.cloudColor, cloudAlpha);
          for (const b of c.blobs) {
            ctx.beginPath();
            ctx.ellipse(c.x + b.ox, c.y + b.oy, b.rx, b.ry, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawMountainRange(ctx, w, h, range, tod) {
        const color = lerpColor(range.nightColor, range.dayColor, tod.skyBrightness);
        ctx.fillStyle = rgb(color);
        ctx.beginPath();
        const groundPx = h * GROUND_Y;

        for (let sx = 0; sx <= w; sx += 3) {
          const worldX = cameraX * range.parallax + sx;
          const mh = mountainHeight(worldX, range);
          const py = groundPx - mh * h;
          if (sx === 0) ctx.moveTo(sx, py);
          else ctx.lineTo(sx, py);
        }
        ctx.lineTo(w, groundPx);
        ctx.lineTo(0, groundPx);
        ctx.closePath();
        ctx.fill();
      }

      function drawBirds(ctx, w, h, tod, windSpeed, time, dt) {
        // Only spawn during daytime
        if (cycleTime >= 0.12 && cycleTime <= 0.50) {
          birdTimer -= dt;
          if (birdTimer <= 0 && flocks.length < 3) {
            flocks.push(spawnFlock());
            birdTimer = 15 + Math.random() * 15;
          }
        }

        const birdAlpha = clamp(tod.skyBrightness * 2, 0, 0.8);
        if (birdAlpha < 0.05) {
          flocks.length = 0;
          return;
        }

        ctx.strokeStyle = `rgba(20, 20, 30, ${birdAlpha})`;
        ctx.lineWidth = 1.5;

        let len = flocks.length;
        for (let i = len - 1; i >= 0; i--) {
          const f = flocks[i];
          f.x += (f.speed + windSpeed * 0.3) * dt;

          if (f.x > w + 100) {
            flocks[i] = flocks[len - 1]; len--;
            continue;
          }

          const wingAngle = 0.3 + 0.25 * Math.sin(time * 5 + f.wingPhase);

          for (const b of f.birds) {
            const bx = f.x + b.ox;
            const by = f.y + b.oy;
            const wingLen = 4;

            ctx.beginPath();
            ctx.moveTo(bx - wingLen, by - wingLen * wingAngle);
            ctx.lineTo(bx, by);
            ctx.lineTo(bx + wingLen, by - wingLen * wingAngle);
            ctx.stroke();
          }
        }
        flocks.length = len;
      }

      function drawWindParticles(ctx, w, h, tod) {
        if (windParticles.length === 0) return;
        const alpha = Math.min(tod.skyBrightness + 0.15, 0.4);
        ctx.strokeStyle = `rgba(200, 210, 230, ${alpha})`;
        ctx.lineWidth = 0.8;

        for (const p of windParticles) {
          const vis = p.life / p.maxLife;
          ctx.globalAlpha = vis * 0.5;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.len, p.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      function groundYAt(worldX, h) {
        return h * GROUND_Y + Math.sin(worldX * 0.02) * 4 + Math.sin(worldX * 0.007) * 6;
      }

      function drawGround(ctx, w, h, tod) {
        const darker = tod.terrainColor.map(c => c * 0.6);

        // Undulating ground fill
        ctx.beginPath();
        for (let sx = 0; sx <= w; sx += 3) {
          const gy = groundYAt(cameraX + sx, h);
          if (sx === 0) ctx.moveTo(sx, gy);
          else ctx.lineTo(sx, gy);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, h * GROUND_Y - 10, 0, h);
        grad.addColorStop(0, rgb(tod.terrainColor));
        grad.addColorStop(1, rgb(darker));
        ctx.fillStyle = grad;
        ctx.fill();

        // Grass blades along the top edge
        const grassColor = [
          Math.min(255, tod.terrainColor[0] + 5),
          Math.min(255, tod.terrainColor[1] + 18),
          Math.min(255, tod.terrainColor[2] + 3),
        ];
        ctx.strokeStyle = rgb(grassColor);
        ctx.lineWidth = 1;
        for (let sx = 0; sx < w; sx += 4) {
          const worldX = cameraX + sx;
          const seed = (worldX * 0.25) | 0;
          // Simple hash for deterministic skip/height
          const h1 = ((seed * 2654435761) >>> 0) / 4294967296;
          if (h1 < 0.35) continue; // skip some for variation
          const gy = groundYAt(worldX, h);
          const bladeH = 4 + h1 * 10;
          const lean = (h1 - 0.5) * 0.4;
          ctx.beginPath();
          ctx.moveTo(sx, gy);
          ctx.lineTo(sx + lean * bladeH, gy - bladeH);
          ctx.stroke();
        }
      }

      function drawGroundDetails(ctx, w, h, tod) {
        const startChunk = Math.floor((cameraX - 100) / CHUNK_SIZE);
        const endChunk = Math.floor((cameraX + w + 100) / CHUNK_SIZE);

        for (let ci = startChunk; ci <= endChunk; ci++) {
          const chunk = getChunk(ci);
          const chunkWorldX = ci * CHUNK_SIZE;

          // Rocks
          for (const rock of chunk.rocks) {
            const screenX = (chunkWorldX + rock.ox) - cameraX;
            if (screenX < -30 || screenX > w + 30) continue;
            const gy = groundYAt(chunkWorldX + rock.ox, h);
            const rockDay = [120, 115, 105];
            const rockNight = [35, 33, 30];
            const rc = lerpColor(rockNight, rockDay, tod.skyBrightness);
            const rcDark = lerpColor(rc, [0, 0, 0], 0.2);
            ctx.fillStyle = rgb(rcDark);
            ctx.beginPath();
            ctx.ellipse(screenX, gy - rock.height * 0.3, rock.width * 0.5, rock.height * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = rgb(rc);
            ctx.beginPath();
            ctx.ellipse(screenX - rock.width * 0.05, gy - rock.height * 0.4, rock.width * 0.45, rock.height * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          // Flowers (fade at night)
          if (tod.skyBrightness > 0.15) {
            const fa = clamp((tod.skyBrightness - 0.15) * 2, 0, 0.9);
            for (const flower of chunk.flowers) {
              const screenX = (chunkWorldX + flower.ox) - cameraX;
              if (screenX < -10 || screenX > w + 10) continue;
              const gy = groundYAt(chunkWorldX + flower.ox, h);
              ctx.fillStyle = rgb(flower.color, fa);
              // Tiny cross/star
              const s = flower.size;
              ctx.fillRect(screenX - s / 2, gy - s - 1, s, 1.5);
              ctx.fillRect(screenX - 0.75, gy - s - s / 2, 1.5, s);
              // Stem
              ctx.strokeStyle = rgb(tod.terrainColor, fa);
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(screenX, gy);
              ctx.lineTo(screenX, gy - s);
              ctx.stroke();
            }
          }
        }
      }

      // Shared tree colors
      const CANOPY_DAY = [22, 75, 16];
      const CANOPY_NIGHT = [8, 18, 8];
      const TRUNK_DAY = [58, 37, 16];
      const TRUNK_NIGHT = [20, 14, 8];

      function drawTree(ctx, x, groundY, tree, tod) {
        if (tree.type === 'oak') drawOak(ctx, x, groundY, tree, tod);
        else if (tree.type === 'birch') drawBirch(ctx, x, groundY, tree, tod);
        else drawPine(ctx, x, groundY, tree, tod);
      }

      function drawPine(ctx, x, groundY, tree, tod) {
        const { height, width, tiers } = tree;
        const trunkW = width * 0.12;
        const trunkH = height * 0.28;
        const canopyColor = lerpColor(CANOPY_NIGHT, CANOPY_DAY, tod.skyBrightness);
        const shadowColor = lerpColor(canopyColor, [0, 0, 0], 0.3);
        const trunkColor = lerpColor(TRUNK_NIGHT, TRUNK_DAY, tod.skyBrightness);
        const barkDark = lerpColor(trunkColor, [0, 0, 0], 0.3);

        // Tapered trunk
        const baseW = trunkW * 1.3;
        ctx.fillStyle = rgb(trunkColor);
        ctx.beginPath();
        ctx.moveTo(x - baseW / 2, groundY);
        ctx.lineTo(x - trunkW / 2, groundY - trunkH);
        ctx.lineTo(x + trunkW / 2, groundY - trunkH);
        ctx.lineTo(x + baseW / 2, groundY);
        ctx.closePath();
        ctx.fill();

        // Bark lines
        ctx.strokeStyle = rgb(barkDark);
        ctx.lineWidth = 1;
        for (let b = 0; b < 3; b++) {
          const by = groundY - trunkH * (0.2 + b * 0.3);
          const bw = trunkW * 0.4;
          ctx.beginPath();
          ctx.moveTo(x - bw, by);
          ctx.lineTo(x + bw, by);
          ctx.stroke();
        }

        // Branch stubs
        ctx.strokeStyle = rgb(trunkColor);
        ctx.lineWidth = 2;
        const tierH = (height - trunkH) / tiers;
        for (let t = 0; t < Math.min(tiers - 1, 2); t++) {
          const by = groundY - trunkH - t * tierH * 0.7 - 2;
          const side = t % 2 === 0 ? -1 : 1;
          ctx.beginPath();
          ctx.moveTo(x, by);
          ctx.lineTo(x + side * trunkW * 1.8, by + 4);
          ctx.stroke();
        }

        // Canopy tiers — split-shaded
        for (let t = 0; t < tiers; t++) {
          const tierBottom = groundY - trunkH - t * tierH * 0.7;
          const tierTop = tierBottom - tierH;
          const tierW = width * (1 - t * 0.15);

          // Shadow side (left)
          ctx.fillStyle = rgb(shadowColor);
          ctx.beginPath();
          ctx.moveTo(x, tierTop);
          ctx.lineTo(x - tierW / 2, tierBottom);
          ctx.lineTo(x, tierBottom);
          ctx.closePath();
          ctx.fill();

          // Lit side (right)
          ctx.fillStyle = rgb(canopyColor);
          ctx.beginPath();
          ctx.moveTo(x, tierTop);
          ctx.lineTo(x, tierBottom);
          ctx.lineTo(x + tierW / 2, tierBottom);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawOak(ctx, x, groundY, tree, tod) {
        const { height, width, crownBlobs } = tree;
        const trunkW = width * 0.14;
        const trunkH = height * 0.4;
        const canopyColor = lerpColor(CANOPY_NIGHT, CANOPY_DAY, tod.skyBrightness);
        const trunkColor = lerpColor(TRUNK_NIGHT, TRUNK_DAY, tod.skyBrightness);
        const crownCenterY = groundY - trunkH - height * 0.2;

        // Trunk with Y-fork
        ctx.fillStyle = rgb(trunkColor);
        ctx.beginPath();
        ctx.moveTo(x - trunkW * 0.7, groundY);
        ctx.lineTo(x - trunkW / 2, groundY - trunkH * 0.7);
        ctx.lineTo(x - trunkW * 1.2, groundY - trunkH);
        ctx.lineTo(x - trunkW * 0.3, groundY - trunkH * 0.85);
        ctx.lineTo(x, groundY - trunkH);
        ctx.lineTo(x + trunkW * 0.3, groundY - trunkH * 0.85);
        ctx.lineTo(x + trunkW * 1.2, groundY - trunkH);
        ctx.lineTo(x + trunkW / 2, groundY - trunkH * 0.7);
        ctx.lineTo(x + trunkW * 0.7, groundY);
        ctx.closePath();
        ctx.fill();

        // Crown blobs
        for (const blob of crownBlobs) {
          const gc = [
            clamp(canopyColor[0] + blob.greenOff * 0.3, 0, 255),
            clamp(canopyColor[1] + blob.greenOff, 0, 255),
            clamp(canopyColor[2] + blob.greenOff * 0.2, 0, 255),
          ];
          ctx.fillStyle = rgb(gc);
          ctx.beginPath();
          ctx.arc(x + blob.ox, crownCenterY + blob.oy, blob.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Sun highlight
        if (tod.skyBrightness > 0.2) {
          const hl = lerpColor(canopyColor, [140, 200, 80], 0.35 * tod.skyBrightness);
          ctx.fillStyle = rgb(hl, 0.6);
          ctx.beginPath();
          ctx.arc(x + width * 0.15, crownCenterY - height * 0.08, width * 0.18, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawBirch(ctx, x, groundY, tree, tod) {
        const { height, width, leafClusters } = tree;
        const trunkW = width * 0.07;
        const trunkH = height * 0.5;
        const canopyColor = lerpColor(CANOPY_NIGHT, CANOPY_DAY, tod.skyBrightness);
        const barkColor = lerpColor([60, 60, 55], [200, 195, 185], tod.skyBrightness);
        const barkMark = lerpColor([30, 30, 28], [80, 75, 70], tod.skyBrightness);

        // Slim trunk
        ctx.fillStyle = rgb(barkColor);
        ctx.fillRect(x - trunkW / 2, groundY - trunkH, trunkW, trunkH);

        // Birch bark marks
        ctx.fillStyle = rgb(barkMark);
        for (let m = 0; m < 5; m++) {
          const my = groundY - trunkH * (0.1 + m * 0.18);
          ctx.fillRect(x - trunkW * 0.4, my, trunkW * 0.5, 1.5);
        }

        // Leaf clusters — sparse scattered circles
        for (const lc of leafClusters) {
          const gc = [
            clamp(canopyColor[0] + lc.greenOff * 0.2, 0, 255),
            clamp(canopyColor[1] + lc.greenOff, 0, 255),
            clamp(canopyColor[2] + lc.greenOff * 0.3, 0, 255),
          ];
          ctx.fillStyle = rgb(gc, 0.8);
          ctx.beginPath();
          ctx.arc(x + lc.ox, groundY - trunkH + lc.oy, lc.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawBush(ctx, x, groundY, bush, tod) {
        const bushDay = [30, 90, 22];
        const bushNight = [10, 24, 10];
        const baseColor = lerpColor(bushNight, bushDay, tod.skyBrightness);

        // Multi-blob bush
        for (const blob of bush.blobs) {
          const gc = [
            clamp(baseColor[0] + blob.greenOff * 0.3, 0, 255),
            clamp(baseColor[1] + blob.greenOff, 0, 255),
            clamp(baseColor[2] + blob.greenOff * 0.2, 0, 255),
          ];
          ctx.fillStyle = rgb(gc);
          ctx.beginPath();
          ctx.arc(x + blob.ox, groundY - bush.height * 0.4 + blob.oy, blob.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Highlight blob on top
        if (tod.skyBrightness > 0.2) {
          const hl = lerpColor(baseColor, [120, 200, 80], 0.2 * tod.skyBrightness);
          ctx.fillStyle = rgb(hl, 0.5);
          ctx.beginPath();
          ctx.arc(x, groundY - bush.height * 0.6, bush.height * 0.22, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawVegetation(ctx, w, h, tod, time, windSpeed) {
        const startChunk = Math.floor((cameraX - 200) / CHUNK_SIZE);
        const endChunk = Math.floor((cameraX + w + 200) / CHUNK_SIZE);

        for (let ci = startChunk; ci <= endChunk; ci++) {
          const chunk = getChunk(ci);
          const chunkWorldX = ci * CHUNK_SIZE;

          for (const bush of chunk.bushes) {
            const screenX = (chunkWorldX + bush.ox) - cameraX;
            if (screenX < -60 || screenX > w + 60) continue;
            const gy = groundYAt(chunkWorldX + bush.ox, h);
            const swayBase = Math.sin(time * 2.5 + bush.swayPhase) * 0.008;
            const swayWind = baseWind * 0.15 + Math.max(0, windSpeed - baseWind) * 0.6;
            const sway = swayBase * swayWind;
            ctx.save();
            ctx.translate(screenX, gy);
            ctx.rotate(sway);
            ctx.translate(-screenX, -gy);
            drawBush(ctx, screenX, gy, bush, tod);
            ctx.restore();
          }
          for (const tree of chunk.trees) {
            const screenX = (chunkWorldX + tree.ox) - cameraX;
            if (screenX < -120 || screenX > w + 120) continue;
            const gy = groundYAt(chunkWorldX + tree.ox, h);
            const swayWind = baseWind * 0.15 + Math.max(0, windSpeed - baseWind) * 0.6;
            const sway = Math.sin(time * 1.5 + tree.swayPhase) * tree.swayAmount * swayWind;
            ctx.save();
            ctx.translate(screenX, gy);
            ctx.rotate(sway);
            ctx.translate(-screenX, -gy);
            drawTree(ctx, screenX, gy, tree, tod);
            ctx.restore();
          }
        }

        // Prune distant chunks
        for (const [key] of chunkCache) {
          if (key < startChunk - 10) chunkCache.delete(key);
        }
      }

      // ─── Atmospheric Effects ──────────────────────────────
      const fireflies = [];
      const fallingLeaves = [];
      let fireflyTimer = 0;
      let leafTimer = 0;

      function updateAndDrawFireflies(ctx, w, h, tod, time, dt) {
        // Only active at night/twilight
        if (tod.skyBrightness >= 0.15) {
          fireflies.length = 0;
          return;
        }

        // Spawn
        fireflyTimer -= dt;
        if (fireflyTimer <= 0 && fireflies.length < 25) {
          fireflyTimer = 0.4 + Math.random() * 0.3;
          const gy = groundYAt(cameraX + Math.random() * w, h);
          fireflies.push({
            worldX: cameraX + Math.random() * w,
            y: gy - 10 - Math.random() * 60,
            phase: Math.random() * Math.PI * 2,
            speed: 0.8 + Math.random() * 1.5,
            brightness: 0.5 + Math.random() * 0.5,
            life: 3 + Math.random() * 5,
            maxLife: 8,
          });
        }

        // Update & draw
        let len = fireflies.length;
        for (let i = len - 1; i >= 0; i--) {
          const f = fireflies[i];
          f.life -= dt;
          f.worldX += Math.cos(time * f.speed + f.phase) * 0.3;
          f.y += Math.sin(time * f.speed * 0.7 + f.phase) * 0.2;

          if (f.life <= 0) {
            fireflies[i] = fireflies[len - 1]; len--;
            continue;
          }

          const sx = f.worldX - cameraX;
          if (sx < -20 || sx > w + 20) continue;

          const fadeIn = clamp(1 - f.life / f.maxLife, 0, 1) * 3;
          const fadeOut = clamp(f.life, 0, 1);
          const pulse = 0.3 + 0.7 * Math.pow(Math.sin(time * 3 + f.phase), 2);
          const alpha = Math.min(fadeIn, fadeOut) * f.brightness * pulse;

          const glowR = 5;
          const glow = ctx.createRadialGradient(sx, f.y, 0, sx, f.y, glowR);
          glow.addColorStop(0, `rgba(180, 220, 60, ${alpha})`);
          glow.addColorStop(0.5, `rgba(180, 220, 60, ${alpha * 0.4})`);
          glow.addColorStop(1, 'rgba(180, 220, 60, 0)');
          ctx.fillStyle = glow;
          ctx.fillRect(sx - glowR, f.y - glowR, glowR * 2, glowR * 2);
        }
        fireflies.length = len;
      }

      function drawGroundFog(ctx, w, h, tod, time) {
        // Active at dawn and dusk
        let fogAlpha = 0;
        if (cycleTime >= 0.06 && cycleTime < 0.22) {
          fogAlpha = Math.sin((cycleTime - 0.06) / 0.16 * Math.PI) * 0.12;
        } else if (cycleTime >= 0.43 && cycleTime < 0.62) {
          fogAlpha = Math.sin((cycleTime - 0.43) / 0.19 * Math.PI) * 0.1;
        }
        if (fogAlpha < 0.01) return;

        ctx.fillStyle = `rgba(200, 210, 225, ${fogAlpha})`;
        for (let i = 0; i < 4; i++) {
          const fx = ((i * 320 + time * 8) % (w + 500)) - 250;
          const fy = h * GROUND_Y - 8 + Math.sin(i * 2.3) * 6;
          ctx.beginPath();
          ctx.ellipse(fx, fy, 180 + i * 40, 18 + i * 5, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function updateAndDrawLeaves(ctx, w, h, tod, time, dt, windSpeed) {
        if (tod.skyBrightness < 0.3) {
          fallingLeaves.length = 0;
          return;
        }

        // Spawn
        leafTimer -= dt;
        if (leafTimer <= 0 && fallingLeaves.length < 15) {
          leafTimer = 2 + Math.random() * 2;
          const gy = groundYAt(cameraX + Math.random() * w, h);
          fallingLeaves.push({
            worldX: cameraX + Math.random() * w,
            y: gy - 80 - Math.random() * 60,
            vy: 0,
            phase: Math.random() * Math.PI * 2,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: 2 + Math.random() * 3,
            size: 3 + Math.random() * 3,
            color: Math.random() < 0.7 ? [80, 140, 30] : [180, 100, 20],
          });
        }

        // Update & draw
        let len = fallingLeaves.length;
        for (let i = len - 1; i >= 0; i--) {
          const l = fallingLeaves[i];
          l.vy += 15 * dt;
          l.y += l.vy * dt;
          l.worldX += (windSpeed * 0.3 + Math.sin(time * 2 + l.phase) * 20) * dt;
          l.rot += l.rotSpeed * dt;

          const gy = groundYAt(l.worldX, h);
          if (l.y > gy + 5) {
            fallingLeaves[i] = fallingLeaves[len - 1]; len--;
            continue;
          }

          const sx = l.worldX - cameraX;
          if (sx < -20 || sx > w + 20) continue;

          ctx.save();
          ctx.translate(sx, l.y);
          ctx.rotate(l.rot);
          ctx.fillStyle = rgb(l.color, 0.8);
          ctx.beginPath();
          ctx.ellipse(0, 0, l.size, l.size * 0.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        fallingLeaves.length = len;
      }

      // ─── createApp ─────────────────────────────────────────
      const app = createApp({
        asciiConfig: {
          background: '#0a0a12',
          sourceOpacity: 0,
          speed: 1,
        },
        layers: [
          // Layer 1: Landscape structure — broad gradients, sky & mountains
          {
            fontSize: 18,
            charset: 'blocks',
            colorScheme: 'ocean',
            blendMode: 'replace',
            opacity: 1,
          },
          // Layer 2: Detail — trees, birds, stars, cloud edges
          {
            fontSize: 8,
            charset: 'density',
            colorScheme: 'mono',
            blendMode: 'add',
            opacity: 0.65,
          },
          // Layer 3: Atmospheric texture — haze, shimmer
          {
            fontSize: 12,
            charset: 'braille',
            colorScheme: 'vapor',
            pattern: 'waves',
            patternMix: 0.25,
            blendMode: 'add',
            opacity: 0.2,
          },
        ],
        draw(ctx, { time, dt, width, height }) {
          const t = time * 0.001;
          const w = width;
          const h = height;

          // Advance systems
          cycleTime = (cycleTime + dt / CYCLE_DURATION) % 1;
          cameraX += CAMERA_SPEED * dt;
          const windSpeed = updateWind(dt);
          const tod = getTimeOfDay(cycleTime);

          // Draw back to front
          drawSky(ctx, w, h, tod);
          drawHorizonGlow(ctx, w, h, tod);
          drawStars(ctx, w, h, tod, t);
          drawSun(ctx, w, h, tod);
          drawMoon(ctx, w, h, tod);
          drawClouds(ctx, w, h, tod, windSpeed, dt);
          drawMountainRange(ctx, w, h, MOUNTAIN_RANGES[0], tod);
          drawMountainRange(ctx, w, h, MOUNTAIN_RANGES[1], tod);
          drawBirds(ctx, w, h, tod, windSpeed, t, dt);
          drawWindParticles(ctx, w, h, tod);
          drawMountainRange(ctx, w, h, MOUNTAIN_RANGES[2], tod);
          drawGround(ctx, w, h, tod);
          drawGroundDetails(ctx, w, h, tod);
          drawGroundFog(ctx, w, h, tod, t);
          drawVegetation(ctx, w, h, tod, t, windSpeed);
          updateAndDrawLeaves(ctx, w, h, tod, t, dt, windSpeed);
          updateAndDrawFireflies(ctx, w, h, tod, t, dt);
        },
      });

      // Initialize clouds spread across the sky
      for (let i = 0; i < 6; i++) clouds.push(spawnCloud(true));
    </script>
  </body>
</html>
