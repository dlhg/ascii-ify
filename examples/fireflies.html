<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii-ify — Fireflies</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      .container { position: relative; width: 100%; height: 100%; }
      #source { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="source"></canvas>
    </div>
    <script type="module">
      import { createApp } from './boilerplate.js';
      import { lerp, clamp, mulberry32, dist } from './utils.js';

      // --- Seeded random ---
      const rng = mulberry32(42);
      function rand(lo = 0, hi = 1) { return lerp(lo, hi, rng()); }

      // --- Scene data (rebuilt on resize) ---
      let trees = [];
      let grassBlades = [];
      let stars = [];
      let moonX, moonY, moonR;
      let clearingCx, clearingCy, clearingRx, clearingRy;

      // --- Fireflies ---
      const NUM_FIREFLIES = 50;
      const fireflies = [];
      const COUPLING = 1.8;        // Kuramoto coupling strength
      const NEIGHBOR_DIST = 0.18;  // fraction of screen diagonal

      function initFireflies(w, h) {
        clearingCx = w * 0.5;
        clearingCy = h * 0.52;
        clearingRx = w * 0.28;
        clearingRy = h * 0.28;

        fireflies.length = 0;
        for (let i = 0; i < NUM_FIREFLIES; i++) {
          const angle = rng() * Math.PI * 2;
          const rx = rng() * 0.85;
          const ry = rng() * 0.85;
          fireflies.push({
            x: clearingCx + Math.cos(angle) * clearingRx * rx,
            y: clearingCy + Math.sin(angle) * clearingRy * ry,
            vx: (rng() - 0.5) * 12,
            vy: (rng() - 0.5) * 8,
            phase: rng() * Math.PI * 2,
            naturalFreq: lerp(0.8, 1.4, rng()),   // radians/sec
            driftTimer: rng() * 3,
            size: lerp(2.5, 5, rng()),
          });
        }
      }

      // --- Scene generation ---
      function buildScene(w, h) {
        // Stars (visible through canopy gaps)
        stars = [];
        for (let i = 0; i < 60; i++) {
          stars.push({
            x: rng() * w,
            y: rng() * h * 0.45,
            r: lerp(0.5, 1.8, rng()),
            twinklePhase: rng() * Math.PI * 2,
            twinkleSpeed: lerp(1.5, 4, rng()),
            brightness: lerp(0.3, 0.9, rng()),
          });
        }

        // Moon
        moonR = Math.min(w, h) * 0.03;
        moonX = w * lerp(0.2, 0.4, rng());
        moonY = h * lerp(0.08, 0.18, rng());

        // Trees
        trees = [];
        const treePositions = [
          { xFrac: 0.02, side: 'left' },
          { xFrac: 0.08, side: 'left' },
          { xFrac: 0.16, side: 'left' },
          { xFrac: 0.88, side: 'right' },
          { xFrac: 0.94, side: 'right' },
          { xFrac: 0.98, side: 'right' },
          { xFrac: 0.35, side: 'mid' },
          { xFrac: 0.65, side: 'mid' },
        ];
        for (const tp of treePositions) {
          const tx = tp.xFrac * w;
          const trunkW = lerp(w * 0.015, w * 0.03, rng());
          const trunkH = lerp(h * 0.45, h * 0.7, rng());
          const canopyW = lerp(trunkW * 4, trunkW * 7, rng());
          const canopyH = lerp(trunkH * 0.4, trunkH * 0.6, rng());
          const baseY = h;
          trees.push({ x: tx, baseY, trunkW, trunkH, canopyW, canopyH, side: tp.side });
        }

        // Grass blades
        grassBlades = [];
        const numBlades = Math.floor(w / 4);
        for (let i = 0; i < numBlades; i++) {
          grassBlades.push({
            x: (i / numBlades) * w + (rng() - 0.5) * 6,
            height: lerp(h * 0.04, h * 0.1, rng()),
            width: lerp(1.5, 3, rng()),
            phase: rng() * Math.PI * 2,
            swaySpeed: lerp(0.8, 1.6, rng()),
            swayAmount: lerp(3, 10, rng()),
          });
        }

        initFireflies(w, h);
      }

      // --- Breeze ---
      let breezeStrength = 0;
      let breezeTarget = 0;
      let breezeTimer = 0;

      // --- Drawing functions ---

      function drawSky(ctx, w, h, time) {
        // Dark blue-purple twilight gradient
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#060818');
        grad.addColorStop(0.3, '#0c1028');
        grad.addColorStop(0.55, '#121535');
        grad.addColorStop(0.8, '#0e1225');
        grad.addColorStop(1, '#080c18');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      function drawStars(ctx, time) {
        for (const s of stars) {
          const twinkle = 0.5 + 0.5 * Math.sin(time * 0.001 * s.twinkleSpeed + s.twinklePhase);
          const alpha = s.brightness * twinkle;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200, 210, 255, ${alpha})`;
          ctx.fill();
        }
      }

      function drawMoon(ctx, time) {
        // Crescent moon: draw full circle then overlay a slightly offset circle
        const glow = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 4);
        glow.addColorStop(0, 'rgba(200, 210, 240, 0.12)');
        glow.addColorStop(0.5, 'rgba(150, 170, 220, 0.04)');
        glow.addColorStop(1, 'rgba(100, 120, 180, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(moonX - moonR * 5, moonY - moonR * 5, moonR * 10, moonR * 10);

        ctx.beginPath();
        ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(220, 225, 240, 0.85)';
        ctx.fill();

        // Subtract a circle to create crescent
        ctx.beginPath();
        ctx.arc(moonX + moonR * 0.6, moonY - moonR * 0.2, moonR * 0.85, 0, Math.PI * 2);
        ctx.fillStyle = '#060818';
        ctx.fill();
      }

      function drawTree(ctx, tree, w, h) {
        const { x, baseY, trunkW, trunkH, canopyW, canopyH } = tree;
        const topY = baseY - trunkH;

        // Trunk
        ctx.fillStyle = '#0a0e14';
        ctx.beginPath();
        ctx.moveTo(x - trunkW * 0.5, baseY);
        ctx.lineTo(x - trunkW * 0.7, topY + canopyH * 0.4);
        ctx.lineTo(x + trunkW * 0.7, topY + canopyH * 0.4);
        ctx.lineTo(x + trunkW * 0.5, baseY);
        ctx.closePath();
        ctx.fill();

        // Canopy — multiple overlapping ellipses for organic shape
        const canopyCx = x;
        const canopyCy = topY + canopyH * 0.2;
        ctx.fillStyle = '#080c14';
        for (let i = 0; i < 5; i++) {
          const ox = (i - 2) * canopyW * 0.18;
          const oy = Math.abs(i - 2) * canopyH * 0.08;
          const rx = canopyW * lerp(0.3, 0.5, Math.abs(i - 2) < 2 ? 0.7 : 0.4);
          const ry = canopyH * lerp(0.35, 0.5, 0.5);
          ctx.beginPath();
          ctx.ellipse(canopyCx + ox, canopyCy + oy, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawCanopyOverlay(ctx, w, h) {
        // Dense leaf masses along the top of the screen
        ctx.fillStyle = '#060a12';
        // Left canopy mass
        ctx.beginPath();
        ctx.ellipse(w * 0.0, h * 0.0, w * 0.35, h * 0.18, 0.2, 0, Math.PI * 2);
        ctx.fill();
        // Right canopy mass
        ctx.beginPath();
        ctx.ellipse(w * 1.0, h * 0.0, w * 0.35, h * 0.18, -0.2, 0, Math.PI * 2);
        ctx.fill();
        // Center-top canopy (sparser, with gaps)
        ctx.beginPath();
        ctx.ellipse(w * 0.5, -h * 0.05, w * 0.22, h * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawGrass(ctx, w, h, time) {
        const grassBaseY = h * 0.92;
        // Ground fill
        const groundGrad = ctx.createLinearGradient(0, grassBaseY, 0, h);
        groundGrad.addColorStop(0, '#060a10');
        groundGrad.addColorStop(1, '#040810');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, grassBaseY, w, h - grassBaseY);

        // Individual grass blades
        ctx.lineCap = 'round';
        for (const blade of grassBlades) {
          const sway = Math.sin(time * 0.001 * blade.swaySpeed + blade.phase) * blade.swayAmount * (0.3 + breezeStrength * 0.7);
          const tipX = blade.x + sway;
          const tipY = h - blade.height;
          const midSway = sway * 0.4;

          ctx.beginPath();
          ctx.moveTo(blade.x, h);
          ctx.quadraticCurveTo(blade.x + midSway, h - blade.height * 0.5, tipX, tipY);
          ctx.strokeStyle = `rgba(8, 18, 12, ${lerp(0.6, 0.95, blade.height / (h * 0.1))})`;
          ctx.lineWidth = blade.width;
          ctx.stroke();

          // Slightly lighter edge on some blades
          ctx.beginPath();
          ctx.moveTo(blade.x, h);
          ctx.quadraticCurveTo(blade.x + midSway, h - blade.height * 0.5, tipX, tipY);
          ctx.strokeStyle = `rgba(15, 35, 20, 0.15)`;
          ctx.lineWidth = blade.width * 0.5;
          ctx.stroke();
        }
      }

      function updateFireflies(dt, w, h, time) {
        const diagSq = w * w + h * h;
        const neighborDist = Math.sqrt(diagSq) * NEIGHBOR_DIST;

        // Update breeze
        breezeTimer -= dt;
        if (breezeTimer <= 0) {
          breezeTarget = rng() < 0.3 ? lerp(0.5, 1, rng()) : 0;
          breezeTimer = lerp(2, 6, rng());
        }
        breezeStrength = lerp(breezeStrength, breezeTarget, dt * 1.5);

        for (let i = 0; i < fireflies.length; i++) {
          const f = fireflies[i];

          // --- Kuramoto phase coupling ---
          let phaseInfluence = 0;
          let neighborCount = 0;
          for (let j = 0; j < fireflies.length; j++) {
            if (i === j) continue;
            const other = fireflies[j];
            const d = dist(f.x, f.y, other.x, other.y);
            if (d < neighborDist) {
              phaseInfluence += Math.sin(other.phase - f.phase);
              neighborCount++;
            }
          }
          if (neighborCount > 0) {
            phaseInfluence /= neighborCount;
          }

          f.phase += (f.naturalFreq + COUPLING * phaseInfluence) * dt;
          // Keep phase in [0, 2pi]
          if (f.phase > Math.PI * 2) f.phase -= Math.PI * 2;
          if (f.phase < 0) f.phase += Math.PI * 2;

          // --- Drift movement ---
          f.driftTimer -= dt;
          if (f.driftTimer <= 0) {
            // New drift direction, biased toward clearing center
            const toCenterX = (clearingCx - f.x) * 0.02;
            const toCenterY = (clearingCy - f.y) * 0.02;
            f.vx = (rng() - 0.5) * 20 + toCenterX * 10;
            f.vy = (rng() - 0.5) * 14 + toCenterY * 10;
            f.driftTimer = lerp(1.5, 4, rng());
          }

          // Add breeze influence
          f.x += (f.vx + breezeStrength * 15) * dt;
          f.y += f.vy * dt;

          // Soft boundary — push back toward clearing if too far
          const dx = (f.x - clearingCx) / clearingRx;
          const dy = (f.y - clearingCy) / clearingRy;
          const edgeDist = dx * dx + dy * dy;
          if (edgeDist > 1) {
            const push = (edgeDist - 1) * 50;
            f.x -= dx * push * dt;
            f.y -= dy * push * dt;
          }

          // Keep on screen
          f.x = clamp(f.x, w * 0.1, w * 0.9);
          f.y = clamp(f.y, h * 0.15, h * 0.88);
        }
      }

      function drawFireflies(ctx, w, h, time) {
        for (const f of fireflies) {
          // Glow intensity based on phase
          // Firefly glows when phase is near 0 (wrapping around 2pi)
          // Use a narrow peak around phase = 0
          const phaseMod = f.phase;
          // cos-based glow: bright when phase near 0
          const rawGlow = Math.cos(phaseMod);
          // Only glow when rawGlow > threshold (top ~30% of cycle)
          const glowThreshold = 0.3;
          const glow = rawGlow > glowThreshold
            ? (rawGlow - glowThreshold) / (1 - glowThreshold)
            : 0;

          const intensity = glow * glow; // sharper falloff

          if (intensity < 0.01) continue; // skip dim fireflies

          const r = f.size * (1 + intensity * 2);

          // Outer glow
          const outerR = r * 6;
          const outerGrad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, outerR);
          outerGrad.addColorStop(0, `rgba(180, 255, 80, ${intensity * 0.25})`);
          outerGrad.addColorStop(0.3, `rgba(150, 230, 60, ${intensity * 0.1})`);
          outerGrad.addColorStop(0.7, `rgba(100, 180, 40, ${intensity * 0.03})`);
          outerGrad.addColorStop(1, 'rgba(80, 140, 30, 0)');
          ctx.fillStyle = outerGrad;
          ctx.fillRect(f.x - outerR, f.y - outerR, outerR * 2, outerR * 2);

          // Inner bright core
          const coreGrad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
          coreGrad.addColorStop(0, `rgba(230, 255, 180, ${intensity * 0.95})`);
          coreGrad.addColorStop(0.4, `rgba(180, 255, 80, ${intensity * 0.7})`);
          coreGrad.addColorStop(1, `rgba(140, 220, 50, 0)`);
          ctx.beginPath();
          ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
          ctx.fillStyle = coreGrad;
          ctx.fill();
        }
      }

      // --- Ambient ground glow (reflected firefly light) ---
      function drawAmbientGlow(ctx, w, h) {
        // Faint green-ish glow near ground from accumulated firefly light
        let totalLight = 0;
        for (const f of fireflies) {
          const rawGlow = Math.cos(f.phase);
          if (rawGlow > 0.3) totalLight += (rawGlow - 0.3) / 0.7;
        }
        const avg = totalLight / fireflies.length;
        if (avg > 0.01) {
          const grad = ctx.createLinearGradient(0, h * 0.75, 0, h);
          grad.addColorStop(0, `rgba(80, 140, 40, 0)`);
          grad.addColorStop(1, `rgba(80, 140, 40, ${avg * 0.04})`);
          ctx.fillStyle = grad;
          ctx.fillRect(0, h * 0.75, w, h * 0.25);
        }
      }

      // --- Main app ---
      createApp({
        asciiConfig: {
          fontSize: 7,
          charset: 'density',
          colorScheme: 'neon',
          background: '#030812',
          sourceOpacity: 0,
        },
        layers: [
          { fontSize: 14, charset: 'minimal', colorScheme: 'mono', blendMode: 'add', opacity: 0.06 },
          { fontSize: 5, charset: 'braille', colorScheme: 'acid', blendMode: 'add', opacity: 0.15 },
        ],
        onResize(ctx, w, h) {
          buildScene(w, h);
        },
        draw(ctx, { time, dt, width, height }) {
          // Background sky
          drawSky(ctx, width, height, time);

          // Stars (behind everything)
          drawStars(ctx, time);

          // Moon
          drawMoon(ctx, time);

          // Canopy overlay at top
          drawCanopyOverlay(ctx, width, height);

          // Trees
          for (const tree of trees) {
            drawTree(ctx, tree, width, height);
          }

          // Ambient ground glow from fireflies
          drawAmbientGlow(ctx, width, height);

          // Grass
          drawGrass(ctx, width, height, time);

          // Update and draw fireflies
          updateFireflies(dt, width, height, time);
          drawFireflies(ctx, width, height, time);
        },
      });
    </script>
  </body>
</html>
