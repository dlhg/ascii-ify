<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ascii-ify perf bench</title>
  <style>
    body { margin: 0; background: #000; }
    #wrap { position: relative; width: 1200px; height: 700px; }
    canvas { display: block; }
  </style>
</head>
<body>
<div id="wrap"><canvas id="src" width="1200" height="700"></canvas></div>
<script type="module">
const qs = new URLSearchParams(location.search);
const scenario = qs.get('scenario') || 'multilayer3d';
const libUrl = qs.get('lib') || '/src/index.js';
const { AsciiIfy } = await import(libUrl);

const src = document.getElementById('src');
const sctx = src.getContext('2d');

function drawSource(t) {
  const w = src.width;
  const h = src.height;
  sctx.fillStyle = '#101018';
  sctx.fillRect(0, 0, w, h);

  const grad = sctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, `hsl(${(t * 35) % 360} 80% 42%)`);
  grad.addColorStop(1, `hsl(${(t * 35 + 160) % 360} 80% 55%)`);
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 12; i++) {
    const x = w / 2 + Math.sin(t * 0.7 + i * 2.1) * w * 0.38;
    const y = h / 2 + Math.cos(t * 0.9 + i * 1.7) * h * 0.38;
    const r = 100 + Math.sin(t + i) * 45;
    const g = sctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `hsl(${(i * 47 + t * 40) % 360} 90% 60%)`);
    g.addColorStop(1, 'transparent');
    sctx.fillStyle = g;
    sctx.beginPath();
    sctx.arc(x, y, r, 0, Math.PI * 2);
    sctx.fill();
  }
}

function baseConfig(extra = {}) {
  return {
    enabled: true,
    fontSize: 8,
    density: 1,
    charset: 'density',
    colorScheme: 'rainbow',
    background: '#08080c',
    sourceOpacity: 0,
    fade: 0,
    speed: 2,
    ...extra,
  };
}

function setupScenario() {
  if (scenario === 'edge2d') {
    return new AsciiIfy(src, baseConfig({
      fontSize: 6,
      colorScheme: 'mono',
      edgeDetect: true,
      edgeCharset: 'box-heavy',
      edgeThreshold: 0.08,
    }));
  }

  if (scenario === 'same-grid-layers') {
    const az = new AsciiIfy(src, baseConfig({ fontSize: 8, colorScheme: 'rainbow' }));
    const layers = [
      { fontSize: 8, charset: 'density', colorScheme: 'rainbow', blendMode: 'replace', opacity: 0.8 },
      { fontSize: 8, charset: 'blocks', colorScheme: 'vapor', blendMode: 'add', opacity: 0.35 },
      { fontSize: 8, charset: 'braille', colorScheme: 'ocean', blendMode: 'add', opacity: 0.25 },
      { fontSize: 8, charset: 'density', colorScheme: 'fire', blendMode: 'add', opacity: 0.2 },
    ];
    for (const layer of layers) az.addLayer(layer);
    az.removeLayer(az.layers[0]);
    return az;
  }

  if (scenario === 'edge-layer') {
    const az = new AsciiIfy(src, baseConfig({ fontSize: 8, colorScheme: 'source' }));
    az.addLayer({ fontSize: 8, charset: 'density', colorScheme: 'source', blendMode: 'replace', opacity: 1 });
    az.addLayer({ fontSize: 10, charset: 'blocks', colorScheme: 'mono', edgeDetect: true, edgeCharset: 'box-heavy', edgeThreshold: 0.08, blendMode: 'add', opacity: 0.35 });
    az.removeLayer(az.layers[0]);
    return az;
  }

  const az = new AsciiIfy(src, baseConfig({
    fontSize: 12,
    renderMode: '3d',
    depthScale: -250,
    perspective: 1570,
    rotationX: -0.45,
    rotationY: 0,
    rotationZ: 0.04,
    cameraZ: 430,
    depthOpacity: 0.44,
    depthSmoothing: 0.5,
  }));
  const layers = [
    { fontSize: 4, density: 1, charset: 'density', colorScheme: 'source', blendMode: 'replace', opacity: 1 },
    { fontSize: 14, density: 1, charset: 'density', colorScheme: 'rainbow', blendMode: 'replace', opacity: 1 },
    { fontSize: 8, density: 1, charset: 'braille', colorScheme: 'vapor', blendMode: 'add', opacity: 0.4 },
  ];
  for (const layer of layers) az.addLayer(layer);
  az.removeLayer(az.layers[0]);
  return az;
}

drawSource(0);
requestAnimationFrame(function loop(now) {
  drawSource(now / 1000);
  requestAnimationFrame(loop);
});

const az = setupScenario();
window.__az = az;
window.__frames = 0;
window.__samples = [];
az.on('render', () => {
  window.__frames++;
  window.__samples.push(performance.now());
  if (window.__samples.length > 240) window.__samples.shift();
});
az.start();
window.__benchReady = true;
</script>
</body>
</html>
