<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCII Visuals · Live</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <iframe id="scene-frame" title="ASCII scene"></iframe>
  <header>
    <div class="brand">ASCII VISUALS <span>LIVE</span><small id="scene-count"></small><small id="build-version" role="status"></small></div>
    <div id="status" role="status">Connecting to your device…</div>
  </header>
  <footer id="controls">
    <label>Scene <select id="scene" aria-label="Scene"></select></label>
    <button id="mappings">Audio mappings</button>
    <button id="appearance">Appearance</button>
    <button id="scene-look">Scene look</button>
    <div class="meters" aria-label="Audio levels"><label>LEVEL <meter id="rms" min="0" max="1" value="0"></meter></label><label>LOW <meter id="bass" min="0" max="1" value="0"></meter></label><label>MID <meter id="mid" min="0" max="1" value="0"></meter></label><label>HIGH <meter id="high" min="0" max="1" value="0"></meter></label></div>
    <button id="fullscreen">Fullscreen</button>
    <button id="hide">Hide controls</button>
  </footer>
  <aside id="mapping-panel" aria-label="Audio mappings">
    <div class="panel-heading"><div><h1>Audio mappings</h1><p id="mapping-title"></p></div><button id="close-mappings" aria-label="Close mappings">×</button></div>
    <fieldset id="mapping-fields" disabled>
      <div class="mapping-master">
        <label><input id="react-enabled" type="checkbox" checked /> Audio control on</label>
        <label class="field">Intensity <input id="intensity" type="range" min="0" max="4" step="0.05" value="1" /><output id="intensity-value">1.00×</output></label>
        <p>Choose what each signal moves. Negative amounts reverse the response.</p>
      </div>
      <div class="mapping-actions"><span id="mapping-total"></span><button id="add-mapping">+ Add mapping</button></div>
      <div id="routes"></div>
      <div class="mapping-actions"><button id="clear-mappings">Clear mappings</button><button id="reset-mappings">Reset scene</button></div>
    </fieldset>
    <div class="mapping-files"><button id="export-mappings">Export mappings</button><label class="file-button">Import mappings<input id="import-mappings" type="file" accept=".json,application/json" /></label></div>
    <p id="mapping-note" role="status"></p>
  </aside>
  <div id="hint">Press H to show controls</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
