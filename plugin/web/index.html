<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCII Visuals · Live</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="source" aria-hidden="true"></canvas>
  <header>
    <div class="brand">ASCII VISUALS <span>LIVE</span></div>
    <div id="status" role="status">Connecting to your device…</div>
  </header>
  <footer id="controls">
    <label>Scene <select id="scene"><option value="orb">Pulse</option><option value="rings">Orbit</option><option value="bars">Spectrum</option></select></label>
    <label>Intensity <input id="intensity" type="range" min="0.25" max="4" step="0.05" value="1.5" /></label>
    <div class="meters" aria-label="Audio levels"><label>LOW <meter id="bass" min="0" max="1" value="0"></meter></label><label>MID <meter id="mid" min="0" max="1" value="0"></meter></label><label>HIGH <meter id="high" min="0" max="1" value="0"></meter></label></div>
    <button id="fullscreen">Fullscreen</button>
    <button id="hide">Hide controls</button>
  </footer>
  <div id="hint">Press H to show controls</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
